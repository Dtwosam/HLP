[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hlp"
version = "0.1.0"
description = "HYPE mainnet market recorder and research system"
requires-python = ">=3.11"
dependencies = [
  "websockets>=15.0,<16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
hlp-record = "hlp.recorder:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hlp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
