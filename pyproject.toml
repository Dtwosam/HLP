[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hlp"
version = "0.1.0"
description = "Robinhood Chain memecoin comeback research and signal system"
requires-python = ">=3.12"
dependencies = [
  "eth-utils>=5.1,<6",
  "eth-hash[pycryptodome]>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
hlp = "hlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
