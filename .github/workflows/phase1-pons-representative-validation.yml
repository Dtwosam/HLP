name: phase1-pons-representative-validation

on:
  workflow_dispatch:
    inputs:
      sample_run_id:
        description: "Successful representative sample freeze run"
        required: true
        type: string
      v1_eligibility_run_id:
        description: "Successful V1 lifecycle eligibility run"
        required: true
        type: string
      v2_eligibility_run_id:
        description: "Successful V2 lifecycle eligibility run"
        required: true
        type: string
      transfer_run_id:
        description: "Successful representative transfer/holder run"
        required: true
        type: string
      market_path_run_id:
        description: "Successful representative market-path freeze run"
        required: true
        type: string
      dex_crosscheck_run_id:
        description: "Successful representative DEX cross-check run"
        required: true
        type: string
  workflow_call:
    inputs:
      sample_run_id:
        required: true
        type: string
      v1_eligibility_run_id:
        required: true
        type: string
      v2_eligibility_run_id:
        required: true
        type: string
      transfer_run_id:
        required: true
        type: string
      market_path_run_id:
        required: true
        type: string
      dex_crosscheck_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-representative-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: v1
          run-id: ${{ inputs.v1_eligibility_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: v2
          run-id: ${{ inputs.v2_eligibility_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-transfers-full
          path: transfers
          run-id: ${{ inputs.transfer_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-market-paths
          path: market-paths
          run-id: ${{ inputs.market_path_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-dex-crosscheck
          path: dex
          run-id: ${{ inputs.dex_crosscheck_run_id }}
          github-token: ${{ github.token }}
      - name: Build fail-closed representative validation bundle
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          from hlp.data.pons_representative_validation import (
              build_representative_validation_rows,
              summarize_representative_validation,
          )
          from hlp.data.snapshot import write_jsonl_snapshot

          def read_jsonl(path):
              return [
                  json.loads(line)
                  for line in Path(path).read_text().splitlines()
                  if line.strip()
              ]

          transfer_summary = json.loads(
              Path(
                  "transfers/pons-representative-transfers-summary.json"
              ).read_text()
          )
          holder_validation = json.loads(
              Path(
                  "transfers/pons-representative-holder-validation.json"
              ).read_text()
          )
          if int(transfer_summary["sample_tokens"]) != 10:
              raise SystemExit(
                  "representative transfer evidence does not cover 10 tokens"
              )
          if int(transfer_summary["first_transfer_mint_tokens"]) != 10:
              raise SystemExit(
                  "representative transfer evidence does not prove 10 mints"
              )
          if int(holder_validation["tokens"]) != 10:
              raise SystemExit(
                  "representative holder validation does not cover 10 tokens"
              )

          rows = build_representative_validation_rows(
              read_jsonl("sample/pons-representative-sample.jsonl"),
              v1_lifecycle_rows=read_jsonl(
                  "v1/pons-v1-lifecycle-eligibility.jsonl"
              ),
              v2_lifecycle_rows=read_jsonl(
                  "v2/pons-v2-lifecycle-eligibility.jsonl"
              ),
              holder_summary_rows=read_jsonl(
                  "transfers/pons-representative-holder-summary.jsonl"
              ),
              dex_crosscheck_rows=read_jsonl(
                  "dex/pons-representative-dex-crosscheck.jsonl"
              ),
              market_path_summary_rows=read_jsonl(
                  "market-paths/"
                  "pons-representative-market-path-summary.jsonl"
              ),
          )
          summary = summarize_representative_validation(rows)
          if summary["tokens"] != 10 or summary["complete_tokens"] != 10:
              raise SystemExit(
                  "representative validation must contain exactly 10 "
                  "complete tokens"
              )

          snapshot = write_jsonl_snapshot(
              rows,
              output=Path(
                  "artifacts/pons-representative-validation.jsonl"
              ),
              provenance={
                  "source": "phase1_representative_evidence_join",
                  "chain_id": 4663,
                  "snapshot_head_block": 54_486_035,
                  "sample_run_id": int("${{ inputs.sample_run_id }}"),
                  "v1_eligibility_run_id": int(
                      "${{ inputs.v1_eligibility_run_id }}"
                  ),
                  "v2_eligibility_run_id": int(
                      "${{ inputs.v2_eligibility_run_id }}"
                  ),
                  "transfer_run_id": int(
                      "${{ inputs.transfer_run_id }}"
                  ),
                  "market_path_run_id": int(
                      "${{ inputs.market_path_run_id }}"
                  ),
                  "dex_crosscheck_run_id": int(
                      "${{ inputs.dex_crosscheck_run_id }}"
                  ),
              },
          )
          summary["validation_sha256"] = snapshot["sha256"]
          summary["snapshot_head_block"] = 54_486_035
          Path(
              "artifacts/pons-representative-validation-summary.json"
          ).write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-validation
          path: artifacts/
          if-no-files-found: error
