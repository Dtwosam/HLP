name: phase1-pons-weth-usdg-anchor-recover-tail-one-shot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-weth-usdg-anchor-recover-tail-one-shot
  cancel-in-progress: false

env:
  PRESERVED_RUN_ID: '33912536839'
  FIRST_PONS_LAUNCH: '8621658'
  RECOVERY_START: '48752988'
  SNAPSHOT_HEAD: '54486035'
  WETH: '0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73'
  USDG: '0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168'
  ANCHOR_POOL: '0x52e65b17fb6e5ba00ed806f37afcd2daa50271ca'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: bounds
        name: Compute recovery shard bounds
        run: |
          python - <<'PY'
          import os
          start = int(os.environ["RECOVERY_START"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          i = int(os.environ["SHARD_INDEX"])
          n = int(os.environ["SHARD_COUNT"])
          span = head - start + 1
          lo = start + (span * i) // n
          hi = start + (span * (i + 1)) // n - 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"lo={lo}\nhi={hi}\n")
          print({"shard": i, "from_block": lo, "to_block": hi})
          PY
      - name: Acquire missing anchor tail
        env:
          FROM_BLOCK: ${{ steps.bounds.outputs.lo }}
          TO_BLOCK: ${{ steps.bounds.outputs.hi }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          printf -v SHARD "%02d" "$SHARD_INDEX"
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v1-price-path \
            --token "$WETH" --quote-token "$USDG" --pool "$ANCHOR_POOL" \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --out "artifacts/anchor-recovery-${SHARD}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-anchor-recovery-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error

  merge:
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-anchor-*
          path: preserved
          merge-multiple: true
          run-id: ${{ env.PRESERVED_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-anchor-recovery-*
          path: recovered
          merge-multiple: true
      - name: Stream-merge preserved prefix and recovered tail
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.config import SOLIDRPC_AUTH_RPC_URL, SOLIDRPC_PUBLIC_RPC_URL
          from hlp.data.reconstruct import event_order, v3_quote_price_at_block
          from hlp.data.rpc import RpcClient
          from hlp.data.snapshot import write_jsonl_snapshot

          START = int(os.environ["FIRST_PONS_LAUNCH"])
          HEAD = int(os.environ["SNAPSHOT_HEAD"])
          files = (
              list(Path("preserved").glob("anchor-shard-*.jsonl"))
              + list(Path("recovered").glob("anchor-recovery-*.jsonl"))
          )
          assert len(files) == 22, [p.name for p in files]

          entries = []
          for path in files:
              manifest = json.loads(
                  path.with_suffix(path.suffix + ".manifest.json").read_text()
              )
              prov = manifest["provenance"]
              entries.append((
                  int(prov["from_block"]),
                  int(prov["to_block"]),
                  path,
                  manifest,
              ))
          entries.sort(key=lambda item: item[0])

          previous_hi = None
          manifests = []
          expected_records = 0
          for lo, hi, path, manifest in entries:
              if previous_hi is None:
                  assert lo == START, lo
              else:
                  assert lo == previous_hi + 1, (previous_hi, lo, path.name)
              previous_hi = hi
              expected_records += int(manifest["records"])
              manifests.append({
                  "file": path.name,
                  "sha256": manifest["sha256"],
                  "records": int(manifest["records"]),
                  "from_block": lo,
                  "to_block": hi,
              })
          assert previous_hi == HEAD, (previous_hi, HEAD)

          stats = {"records": 0, "first": None, "last": None}

          def rows():
              prior = None
              for _, _, path, manifest in entries:
                  local = 0
                  with path.open() as handle:
                      for line in handle:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          order = event_order(row)
                          if prior is not None:
                              assert prior < order, (prior, order, path.name)
                          prior = order
                          if stats["first"] is None:
                              stats["first"] = row
                          stats["last"] = row
                          stats["records"] += 1
                          local += 1
                          yield row
                  assert local == int(manifest["records"]), (
                      path.name, local, manifest["records"]
                  )

          tape = write_jsonl_snapshot(
              rows(),
              output=Path("artifacts/pons-weth-usdg-anchor-full.jsonl"),
              provenance={
                  "source": "preserved_prefix_plus_recovered_anchor_tail",
                  "chain_id": 4663,
                  "snapshot_head_block": HEAD,
                  "first_pons_launch_block": START,
                  "preserved_run_id": int(os.environ["PRESERVED_RUN_ID"]),
                  "recovery_start_block": int(os.environ["RECOVERY_START"]),
                  "weth": os.environ["WETH"].lower(),
                  "usdg": os.environ["USDG"].lower(),
                  "pool": os.environ["ANCHOR_POOL"].lower(),
                  "shards": manifests,
              },
          )
          assert stats["records"] == expected_records

          key = os.environ.get("ROBINHOOD_ARCHIVE_RPC_API_KEY")
          url = os.environ.get("ROBINHOOD_ARCHIVE_RPC_URL")
          if not url:
              url = SOLIDRPC_AUTH_RPC_URL if key else SOLIDRPC_PUBLIC_RPC_URL
          rpc = RpcClient(
              url,
              timeout=30,
              attempts=5,
              min_interval_seconds=0.1,
              extra_headers={"X-API-Key": key} if key else None,
          )
          rpc.assert_robinhood()
          initial = v3_quote_price_at_block(
              rpc,
              token=os.environ["WETH"],
              quote_token=os.environ["USDG"],
              pool=os.environ["ANCHOR_POOL"],
              block=START - 1,
          )
          assert initial > 0
          initial_state = {
              "block_number": START - 1,
              "weth_usd": str(initial),
              "pricing_semantics": "WETH per USDG pool spot; USDG nominal USD 1",
              "pool": os.environ["ANCHOR_POOL"].lower(),
          }
          Path("artifacts/pons-weth-usdg-anchor-initial.json").write_text(
              json.dumps(initial_state, indent=2, sort_keys=True) + "\n"
          )
          summary = {
              "snapshot_head_block": HEAD,
              "state_block": START - 1,
              "initial_weth_usd": str(initial),
              "anchor_price_events": stats["records"],
              "first_event": stats["first"],
              "last_event": stats["last"],
              "tape_sha256": tape["sha256"],
              "state_rpc_requests": rpc.requests_made,
              "preserved_files": 14,
              "recovery_files": 8,
          }
          Path("artifacts/pons-weth-usdg-anchor-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-weth-usdg-anchor-full
          path: artifacts/
          if-no-files-found: error
