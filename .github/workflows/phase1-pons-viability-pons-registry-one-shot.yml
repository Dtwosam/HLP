name: phase1-pons-viability-pons-registry-one-shot
# validation-generation: 3
run-name: phase1 viability pons_registry ${{ github.sha }}

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/workflows/phase1-pons-viability-pons-registry-one-shot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-viability-pons-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    if: ${{ contains(github.event.head_commit.message, 'launch viability pons_registry') }}
    uses: ./.github/workflows/phase1-pons-viability-guarded-route.yml
    with:
      route: "pons_registry"
      sequence_id: ${{ github.sha }}
    secrets: inherit
