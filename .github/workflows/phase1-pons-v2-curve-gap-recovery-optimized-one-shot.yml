name: phase1-pons-v2-curve-gap-recovery-optimized-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/workflows/phase1-pons-v2-curve-gap-recovery-optimized-one-shot.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cancel-prior:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: "33935705953"
    steps:
      - name: Cancel prior V2 curve gap recovery if still active
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .status)"
          echo "run ${RUN_ID} status: ${status}"
          if [ "${status}" != "completed" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel"
          fi

  recover:
    needs: cancel-prior
    uses: ./.github/workflows/phase1-pons-v2-curve-recover-gaps.yml
    with:
      v2_registry_run_id: "33912235341"
      preserved_run_id: "33912593934"
      partial_recovery_run_id: "33925648297"
      prior_gap_run_id: "33935705953"
      max_gap_blocks: "50000"
    secrets: inherit
