name: phase1-pons-representative-dex-crosscheck

on:
  workflow_dispatch:
    inputs:
      sample_run_id:
        description: "Successful phase1-pons-representative-sample-freeze run"
        required: true
        type: string
      v1_eligibility_run_id:
        description: "V1 lifecycle run used by the representative sample"
        required: true
        type: string
      v2_eligibility_run_id:
        description: "V2 lifecycle run used by the representative sample"
        required: true
        type: string
      priced_path_run_id:
        description: "Successful representative priced-path replay run"
        required: true
        type: string
      quote_audit_run_id:
        description: "Frozen full-Pons quote audit run"
        required: true
        default: "33923299711"
        type: string
      registry_run_id:
        description: "Canonical full Pons registry run"
        required: true
        default: "33911022718"
        type: string
      transition_run_id:
        description: "Canonical V2 transition run"
        required: true
        default: "33912452330"
        type: string
  workflow_call:
    inputs:
      sample_run_id:
        required: true
        type: string
      v1_eligibility_run_id:
        required: true
        type: string
      v2_eligibility_run_id:
        required: true
        type: string
      priced_path_run_id:
        required: true
        type: string
      quote_audit_run_id:
        required: true
        default: "33923299711"
        type: string
      registry_run_id:
        required: true
        default: "33911022718"
        type: string
      transition_run_id:
        required: true
        default: "33912452330"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-representative-dex-crosscheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_sample
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before retry
        if: ${{ steps.download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - id: retry_download_sample
        name: Retry representative sample artifact download
        if: ${{ steps.download_sample.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before final retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - name: Final representative sample artifact download retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - id: download_v1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: v1
          run-id: ${{ inputs.v1_eligibility_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 lifecycle download before retry
        if: ${{ steps.download_v1.outcome == 'failure' }}
        run: rm -rf v1
      - id: retry_download_v1
        name: Retry V1 lifecycle artifact download
        if: ${{ steps.download_v1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: v1
          run-id: ${{ inputs.v1_eligibility_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 lifecycle download before final retry
        if: ${{ steps.retry_download_v1.outcome == 'failure' }}
        run: rm -rf v1
      - name: Final V1 lifecycle artifact download retry
        if: ${{ steps.retry_download_v1.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: v1
          run-id: ${{ inputs.v1_eligibility_run_id }}
          github-token: ${{ github.token }}
      - id: download_v2
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: v2
          run-id: ${{ inputs.v2_eligibility_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V2 lifecycle download before retry
        if: ${{ steps.download_v2.outcome == 'failure' }}
        run: rm -rf v2
      - id: retry_download_v2
        name: Retry V2 lifecycle artifact download
        if: ${{ steps.download_v2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: v2
          run-id: ${{ inputs.v2_eligibility_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V2 lifecycle download before final retry
        if: ${{ steps.retry_download_v2.outcome == 'failure' }}
        run: rm -rf v2
      - name: Final V2 lifecycle artifact download retry
        if: ${{ steps.retry_download_v2.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: v2
          run-id: ${{ inputs.v2_eligibility_run_id }}
          github-token: ${{ github.token }}
      - id: download_priced_paths
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-priced-paths
          path: priced-paths
          run-id: ${{ inputs.priced_path_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative priced paths download before retry
        if: ${{ steps.download_priced_paths.outcome == 'failure' }}
        run: rm -rf priced-paths
      - id: retry_download_priced_paths
        name: Retry representative priced paths artifact download
        if: ${{ steps.download_priced_paths.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-priced-paths
          path: priced-paths
          run-id: ${{ inputs.priced_path_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative priced paths download before final retry
        if: ${{ steps.retry_download_priced_paths.outcome == 'failure' }}
        run: rm -rf priced-paths
      - name: Final representative priced paths artifact download retry
        if: ${{ steps.retry_download_priced_paths.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-priced-paths
          path: priced-paths
          run-id: ${{ inputs.priced_path_run_id }}
          github-token: ${{ github.token }}
      - id: download_quotes
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-quote-audit-current
          path: quotes
          run-id: ${{ inputs.quote_audit_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial quote registry download before retry
        if: ${{ steps.download_quotes.outcome == 'failure' }}
        run: rm -rf quotes
      - id: retry_download_quotes
        name: Retry quote registry artifact download
        if: ${{ steps.download_quotes.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-quote-audit-current
          path: quotes
          run-id: ${{ inputs.quote_audit_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial quote registry download before final retry
        if: ${{ steps.retry_download_quotes.outcome == 'failure' }}
        run: rm -rf quotes
      - name: Final quote registry artifact download retry
        if: ${{ steps.retry_download_quotes.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-quote-audit-current
          path: quotes
          run-id: ${{ inputs.quote_audit_run_id }}
          github-token: ${{ github.token }}
      - id: download_registry
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.registry_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 registry download before retry
        if: ${{ steps.download_registry.outcome == 'failure' }}
        run: rm -rf registry
      - id: retry_download_registry
        name: Retry V1 registry artifact download
        if: ${{ steps.download_registry.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.registry_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 registry download before final retry
        if: ${{ steps.retry_download_registry.outcome == 'failure' }}
        run: rm -rf registry
      - name: Final V1 registry artifact download retry
        if: ${{ steps.retry_download_registry.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.registry_run_id }}
          github-token: ${{ github.token }}
      - id: download_transition
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-transition-full
          path: transition
          run-id: ${{ inputs.transition_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V2 transition download before retry
        if: ${{ steps.download_transition.outcome == 'failure' }}
        run: rm -rf transition
      - id: retry_download_transition
        name: Retry V2 transition artifact download
        if: ${{ steps.download_transition.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-transition-full
          path: transition
          run-id: ${{ inputs.transition_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V2 transition download before final retry
        if: ${{ steps.retry_download_transition.outcome == 'failure' }}
        run: rm -rf transition
      - name: Final V2 transition artifact download retry
        if: ${{ steps.retry_download_transition.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-transition-full
          path: transition
          run-id: ${{ inputs.transition_run_id }}
          github-token: ${{ github.token }}
      - name: Reconcile representative pool identity and swap prices
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          from hlp.config import DEFAULT_RPC_URL
          from hlp.data.geckoterminal import (
              GECKOTERMINAL_API_VERSION,
              GeckoTerminalClient,
          )
          from hlp.data.pons_crosscheck import (
              build_representative_pool_targets,
              reconcile_external_pool,
              reconcile_price_against_ohlcv,
              swap_execution_quote_per_token,
          )
          from hlp.data.pons_representative_identity import (
              require_representative_sample_identity,
          )
          from hlp.data.pons_representative_prices import (
              select_representative_dex_price_checkpoints,
          )
          from hlp.data.pons_time import fetch_block_timestamp_rows
          from hlp.data.rpc import RpcClient
          from hlp.data.snapshot import write_jsonl_snapshot

          def read_jsonl(path):
              return [
                  json.loads(line)
                  for line in Path(path).read_text().splitlines()
                  if line.strip()
              ]

          sample_path = Path(
              "sample/pons-representative-sample.jsonl"
          )
          sample = read_jsonl(sample_path)
          if len(sample) != 10:
              raise SystemExit(
                  "representative DEX cross-check requires exactly 10 "
                  f"sample tokens, got {len(sample)}"
              )

          sample_summary = json.loads(
              Path(
                  "sample/pons-representative-sample-summary.json"
              ).read_text()
          )
          sample_identity = require_representative_sample_identity(
              sample_path,
              sample_summary,
          )
          expected_v1_run = int("${{ inputs.v1_eligibility_run_id }}")
          expected_v2_run = int("${{ inputs.v2_eligibility_run_id }}")
          if int(sample_summary["v1_eligibility_run_id"]) != expected_v1_run:
              raise SystemExit(
                  "representative sample V1 lifecycle run does not match "
                  "DEX cross-check input"
              )
          if int(sample_summary["v2_eligibility_run_id"]) != expected_v2_run:
              raise SystemExit(
                  "representative sample V2 lifecycle run does not match "
                  "DEX cross-check input"
              )

          registry = read_jsonl(
              "registry/pons-full-launch-registry.jsonl"
          )
          registrations = read_jsonl(
              "transition/pons-v2-registrations-full.jsonl"
          )
          # Keep lifecycle artifacts in the workflow inputs so the sample's
          # frozen V1/V2 provenance remains verified above. Detailed DEX price
          # checkpoints come from the exact per-event representative replay.
          v1_tokens = {
              row["token"].lower()
              for row in read_jsonl(
                  "v1/pons-v1-lifecycle-eligibility.jsonl"
              )
          }
          v2_tokens = {
              row["token"].lower()
              for row in read_jsonl(
                  "v2/pons-v2-lifecycle-eligibility.jsonl"
              )
          }
          for row in sample:
              token = row["token"].lower()
              expected = v1_tokens if row["pons_version"] == "v1" else v2_tokens
              if token not in expected:
                  raise SystemExit(
                      f"representative lifecycle missing for {token}"
                  )

          priced_manifest = json.loads(
              Path(
                  "priced-paths/"
                  "pons-representative-priced-paths.jsonl.manifest.json"
              ).read_text()
          )
          priced_provenance = priced_manifest.get("provenance") or {}
          if int(priced_provenance.get("chain_id", -1)) != 4663:
              raise SystemExit(
                  "representative priced-path chain mismatch"
              )
          if int(
              priced_provenance.get("snapshot_head_block", -1)
          ) != 54_486_035:
              raise SystemExit(
                  "representative priced-path snapshot mismatch"
              )
          for field in ("sample_sha256", "token_set_sha256"):
              if priced_provenance.get(field) != sample_identity[field]:
                  raise SystemExit(
                      "representative DEX priced-path sample identity "
                      f"mismatch: {field}"
                  )
          if int(
              priced_provenance.get("sample_run_id", -1)
          ) != int("${{ inputs.sample_run_id }}"):
              raise SystemExit(
                  "representative priced-path sample run mismatch"
              )

          quote_manifest = json.loads(
              Path(
                  "quotes/pons-quote-registry.jsonl.manifest.json"
              ).read_text()
          )
          quote_provenance = quote_manifest.get("provenance") or {}
          if (
              int(quote_manifest.get("records", -1)) != 57
              or str(quote_manifest.get("sha256") or "")
              != (
                  "c822fe8d66f6b24ee496ccd20203cc81023e113ba0f66fa4188a5"
                  "be49dd346dc"
              )
              or int(quote_provenance.get("chain_id", -1)) != 4663
          ):
              raise SystemExit(
                  "representative DEX quote registry identity changed"
              )
          quote_decimals = {
              str(row["quote_token"]).lower(): int(row["quote_decimals"])
              for row in read_jsonl("quotes/pons-quote-registry.jsonl")
              if row.get("quote_decimals") is not None
          }

          targets = build_representative_pool_targets(
              sample,
              registry,
              registrations,
          )
          for target in targets:
              quote = str(target["quote_token"]).lower()
              decimals = quote_decimals.get(quote)
              if decimals is None:
                  raise SystemExit(
                      "representative DEX quote decimals missing for "
                      f"{quote}"
                  )
              target["quote_decimals"] = decimals
          priced_rows = read_jsonl(
              "priced-paths/pons-representative-priced-paths.jsonl"
          )
          checkpoints = select_representative_dex_price_checkpoints(
              priced_rows,
              sample,
          )

          checkpoint_blocks = sorted({
              int(checkpoint["block_number"])
              for values in checkpoints.values()
              for checkpoint in values
          })
          timestamp_by_block = {}
          block_rpc_requests = 0
          block_rpc_response_bytes = 0
          block_rpc_route = None
          if checkpoint_blocks:
              rpc = RpcClient(
                  DEFAULT_RPC_URL,
                  route_label="robinhood_public",
              )
              rpc.assert_robinhood()
              timestamp_rows = fetch_block_timestamp_rows(
                  rpc,
                  checkpoint_blocks,
                  batch_size=10,
              )
              timestamp_by_block = {
                  int(row["block_number"]): int(row["block_timestamp"])
                  for row in timestamp_rows
              }
              block_rpc_requests = rpc.requests_made
              block_rpc_response_bytes = rpc.response_bytes_received
              block_rpc_route = rpc.route_label

          client = GeckoTerminalClient()
          logical_gecko_requests = sum(
              1 + len(checkpoints[target["token"]])
              for target in targets
              if target.get("pool_identifier") is not None
          )
          if logical_gecko_requests > 40:
              raise SystemExit(
                  "representative DEX logical request budget exceeded: "
                  f"{logical_gecko_requests} > 40"
              )
          max_gecko_attempts = logical_gecko_requests * client.attempts

          rows = []
          for target in targets:
              token = target["token"]
              token_checkpoints = checkpoints[token]
              pool_identifier = target.get("pool_identifier")
              if pool_identifier is None:
                  row = reconcile_external_pool(target, {})
                  row.update({
                      "price_crosscheck_scope": "not_applicable",
                      "canonical_price_phase": None,
                      "canonical_block_number": None,
                      "canonical_market_cap_proxy_usd": None,
                      "canonical_price_usd": None,
                      "canonical_timestamp": None,
                      "price_match": None,
                      "price_crosscheck_status": "not_applicable",
                      "price_checkpoints": [],
                  })
                  rows.append(row)
                  continue

              external = client.pool(pool_identifier)
              row = reconcile_external_pool(target, external)

              if not token_checkpoints:
                  row.update({
                      "price_crosscheck_scope": "no_swap_checkpoint",
                      "canonical_price_phase": (
                          "v3_swap"
                          if target["pons_version"] == "v1"
                          else "v4_swap"
                      ),
                      "canonical_block_number": None,
                      "canonical_market_cap_proxy_usd": None,
                      "canonical_price_usd": None,
                      "canonical_timestamp": None,
                      "price_match": None,
                      "price_crosscheck_status": "no_swap_checkpoint",
                      "price_checkpoints": [],
                  })
                  rows.append(row)
                  continue

              reconciled = []
              for checkpoint in token_checkpoints:
                  block_number = int(checkpoint["block_number"])
                  timestamp = timestamp_by_block[block_number]
                  execution_quote_per_token = (
                      swap_execution_quote_per_token(
                          amount0_raw=int(checkpoint["amount0"]),
                          amount1_raw=int(checkpoint["amount1"]),
                          token_is_token0=(
                              int(token, 16)
                              < int(target["quote_token"], 16)
                          ),
                          token_decimals=int(target["token_decimals"]),
                          quote_decimals=int(target["quote_decimals"]),
                      )
                  )
                  candles = client.ohlcv(
                      pool_identifier,
                      timeframe="hour",
                      aggregate=1,
                      before_timestamp=timestamp + 3600,
                      limit=3,
                      currency="token",
                      token=token,
                  )
                  price = reconcile_price_against_ohlcv(
                      canonical_price_usd=execution_quote_per_token,
                      canonical_timestamp=timestamp,
                      candles=candles,
                      candle_seconds=3600,
                  )
                  reconciled.append({
                      "checkpoint_roles": checkpoint["checkpoint_roles"],
                      "canonical_price_phase": checkpoint["price_path_phase"],
                      "canonical_event_type": checkpoint["event_type"],
                      "canonical_block_number": block_number,
                      "canonical_transaction_index": (
                          checkpoint.get("transaction_index")
                      ),
                      "canonical_log_index": int(checkpoint["log_index"]),
                      "canonical_timestamp": timestamp,
                      "canonical_market_cap_proxy_usd": (
                          checkpoint.get("market_cap_proxy_usd")
                      ),
                      "canonical_price_usd": checkpoint["token_price_usd"],
                      "canonical_execution_quote_per_token": str(
                          execution_quote_per_token
                      ),
                      "canonical_price_semantics": (
                          "swap_execution_quote_per_token"
                      ),
                      "price_match": price["price_match"],
                      "price_crosscheck_status": price["status"],
                      "independent_candle_timestamp": (
                          price.get("candle_timestamp")
                      ),
                      "independent_candle_low_quote_per_token": (
                          price.get("candle_low_usd")
                      ),
                      "independent_candle_high_quote_per_token": (
                          price.get("candle_high_usd")
                      ),
                      "outside_candle_bps": price.get("outside_candle_bps"),
                  })

              max_checkpoint = next(
                  checkpoint
                  for checkpoint in reconciled
                  if "max" in checkpoint["checkpoint_roles"]
              )
              all_matched = all(
                  checkpoint["price_match"] is True
                  for checkpoint in reconciled
              )
              failure_statuses = [
                  checkpoint["price_crosscheck_status"]
                  for checkpoint in reconciled
                  if checkpoint["price_match"] is not True
              ]
              row.update({
                  "price_crosscheck_scope": "canonical_dex_swap",
                  "canonical_price_phase": (
                      max_checkpoint["canonical_price_phase"]
                  ),
                  "canonical_block_number": (
                      max_checkpoint["canonical_block_number"]
                  ),
                  "canonical_market_cap_proxy_usd": (
                      max_checkpoint["canonical_market_cap_proxy_usd"]
                  ),
                  "canonical_price_usd": (
                      max_checkpoint["canonical_price_usd"]
                  ),
                  "canonical_execution_quote_per_token": (
                      max_checkpoint[
                          "canonical_execution_quote_per_token"
                      ]
                  ),
                  "canonical_price_semantics": (
                      "swap_execution_quote_per_token"
                  ),
                  "canonical_timestamp": (
                      max_checkpoint["canonical_timestamp"]
                  ),
                  "price_match": all_matched,
                  "price_crosscheck_status": (
                      "matched"
                      if all_matched
                      else failure_statuses[0]
                  ),
                  "price_checkpoints": reconciled,
              })
              rows.append(row)

          mismatches = [
              row for row in rows
              if row.get("external_match") is False
          ]
          targeted = [
              row for row in rows
              if row.get("external_match") is not None
          ]
          price_targeted = [
              row for row in rows
              if row.get("price_crosscheck_scope") == "canonical_dex_swap"
          ]
          price_failures = [
              row for row in price_targeted
              if row.get("price_match") is not True
          ]
          observed_price_checkpoints = sum(
              checkpoint.get("price_match") is not None
              for row in price_targeted
              for checkpoint in (row.get("price_checkpoints") or [])
          )
          if not targeted:
              raise SystemExit(
                  "representative sample has no canonical DEX pools to "
                  "cross-check"
              )
          if not price_targeted:
              raise SystemExit(
                  "representative sample has no canonical DEX swap "
                  "checkpoints to cross-check"
              )
          if observed_price_checkpoints == 0:
              raise SystemExit(
                  "independent DEX historical price evidence is absent for "
                  "all representative swap checkpoints"
              )
          if mismatches:
              raise SystemExit(
                  "independent DEX pool reconciliation failed for "
                  f"{len(mismatches)} representative tokens: "
                  f"{[row['token'] for row in mismatches]}"
              )
          if price_failures:
              disagreement_details = []
              for disagreed in price_failures:
                  for checkpoint in (
                      disagreed.get("price_checkpoints") or []
                  ):
                      if checkpoint.get("price_match") is True:
                          continue
                      disagreement_details.append({
                          "token": disagreed["token"],
                          "pons_version": disagreed["pons_version"],
                          "pool_identifier": disagreed.get(
                              "pool_identifier"
                          ),
                          "quote_token": disagreed.get("quote_token"),
                          "external_base_token": disagreed.get(
                              "external_base_token"
                          ),
                          "external_quote_token": disagreed.get(
                              "external_quote_token"
                          ),
