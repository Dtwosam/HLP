          if client.requests_made > max_gecko_attempts:
              raise SystemExit(
                  "representative DEX HTTP attempt budget exceeded: "
                  f"{client.requests_made} > {max_gecko_attempts}"
              )

          snapshot = write_jsonl_snapshot(
              rows,
              output=Path(
