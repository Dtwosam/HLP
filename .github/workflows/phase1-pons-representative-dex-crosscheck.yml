              "targeted_canonical_dex_pools": len(targeted),
              "matched_canonical_dex_pools": sum(
                  row.get("external_match") is True for row in rows
              ),
              "targeted_swap_price_tokens": len(price_targeted),
              "matched_swap_price_tokens": sum(
                  row.get("price_match") is True for row in price_targeted
              ),
              "targeted_swap_price_checkpoints": sum(
