name: phase2-research-materialize-composite

on:
  workflow_dispatch:
    inputs:
      rehydration_plan_run_id:
        description: Exact phase2-research-rehydration-plan run ID
        required: true
        type: string
      expected_plan_artifact_digest:
        description: Exact rehydration-plan artifact digest (sha256:...)
        required: true
        type: string
      expected_plan_sha256:
        description: Exact SHA-256 of phase2-research-rehydration-plan.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact frozen-universe artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      component_id:
        description: flap, trench_today, or pools_trade_lbp
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-research-composite-${{ inputs.component_id }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAN_RUN_ID: ${{ inputs.rehydration_plan_run_id }}
  EXPECTED_PLAN_ARTIFACT_DIGEST: ${{ inputs.expected_plan_artifact_digest }}
  EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  COMPONENT_ID: ${{ inputs.component_id }}

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Verify and download plan plus frozen universe
        run: |
          mkdir -p inputs/plan inputs/universe
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          specs = [
              (
                  "plan",
                  int(os.environ["PLAN_RUN_ID"]),
                  "phase2-research-rehydration-plan",
                  os.environ["EXPECTED_PLAN_ARTIFACT_DIGEST"].lower(),
                  Path("inputs/plan"),
              ),
              (
                  "universe",
                  int(os.environ["UNIVERSE_RUN_ID"]),
                  "phase2-universe-freeze",
                  os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"].lower(),
                  Path("inputs/universe"),
              ),
          ]

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{os.environ['GITHUB_REPOSITORY']}/"
                          f"actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1

          for label, run_id, name, expected, destination in specs:
              if run_id <= 0:
                  raise SystemExit(f"{label} run id is invalid")
              matches = [
                  row for row in list_artifacts(run_id)
                  if row.get("name") == name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected one artifact; "
                      f"found {len(matches)}"
                  )
              artifact = matches[0]
              if artifact.get("expired"):
                  raise SystemExit(f"{label} artifact is expired")
              actual = str(artifact.get("digest") or "").lower()
              if actual != expected:
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected}"
                  )
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--name", name,
                  "--dir", str(destination),
              ])
          PY

      - id: materialize
        name: Materialize composite research component
        run: |
          mkdir -p artifacts inputs/coverage inputs/origins
          python - <<'PY'
          import fnmatch
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from hlp.config import normalize_address
          from hlp.data.phase2_research_materialization import (
              materialize_sharded_jsonl_research_subset,
              normalize_flat_sharded_research_manifest,
              rebuild_report_sharded_research_manifest,
          )
          from hlp.data.phase2_research_rehydration import (
              build_phase2_research_rehydration_plan,
              build_phase2_research_rehydration_seed,
          )
          from hlp.data.phase2_research_source_layouts import (
              build_phase2_research_source_layouts,
              validate_phase2_research_source_layouts,
          )
          from hlp.data.phase2_sources import (
              build_phase2_source_inventory,
          )

          component_id = os.environ["COMPONENT_ID"]
          allowed = {"flap", "trench_today", "pools_trade_lbp"}
          if component_id not in allowed:
              raise SystemExit(
                  f"{component_id}: not a supported composite component"
              )

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical_sha(payload):
              raw = (
                  json.dumps(
                      payload,
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  + "\n"
              ).encode()
              return hashlib.sha256(raw).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{os.environ['GITHUB_REPOSITORY']}/"
                          f"actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1

          def verify_artifact(run_id, name, expected_digest=None):
              matches = [
                  row for row in list_artifacts(run_id)
                  if row.get("name") == name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{component_id}: expected one {name} artifact; "
                      f"found {len(matches)}"
                  )
              artifact = matches[0]
              if artifact.get("expired"):
                  raise SystemExit(
                      f"{component_id}: artifact expired: {name}"
                  )
              actual = str(artifact.get("digest") or "").lower()
              if expected_digest is not None and actual != str(
                  expected_digest
              ).lower():
                  raise SystemExit(
                      f"{component_id}: artifact digest drift: {name}"
                  )
              return actual

          def download_named(run_id, name, destination):
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--name", name,
                  "--dir", str(destination),
              ])

          def download_patterns(run_id, patterns, destination):
              matches = {}
              for artifact in list_artifacts(run_id):
                  name = str(artifact.get("name") or "")
                  if any(
                      fnmatch.fnmatch(name, pattern)
                      for pattern in patterns
                  ):
                      if artifact.get("expired"):
                          raise SystemExit(
                              f"{component_id}: shard artifact expired: {name}"
                          )
                      matches[name] = artifact
              if not matches:
                  raise SystemExit(
                      f"{component_id}: no shard artifacts matched "
                      f"{patterns}"
                  )
              for name in sorted(matches):
                  download_named(run_id, name, destination / name)
              return sorted(matches)

          plan_root = Path("inputs/plan")
          universe_root = Path("inputs/universe")
          plan_path = (
              plan_root / "phase2-research-rehydration-plan.json"
          )
          actual_plan_sha = sha256_path(plan_path)
          if actual_plan_sha != os.environ[
              "EXPECTED_PLAN_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("rehydration plan SHA drift")
          plan = json.loads(plan_path.read_text())
          seed = json.loads(
              (
                  plan_root
                  / "phase2-research-rehydration-seed.json"
              ).read_text()
          )
          if build_phase2_research_rehydration_plan(
              seed,
              plan["launchpad_bindings"],
              plan["direct_binding"],
          ) != plan:
              raise SystemExit("rehydration plan content drift")

          handoff_path = (
              universe_root / "phase2-universe-freeze-handoff.json"
          )
          if sha256_path(handoff_path) != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("frozen-universe handoff SHA drift")
          handoff = json.loads(handoff_path.read_text())
          summary = json.loads(
              (
                  universe_root / "phase2-universe-summary.json"
              ).read_text()
          )
          provenance = json.loads(
              (
                  universe_root / "phase2-universe-provenance.json"
              ).read_text()
          )
          universe_path = (
              universe_root / "phase2-eligible-universe.jsonl"
          )
          universe_sha = sha256_path(universe_path)
          if universe_sha != plan["eligible_universe_sha256"]:
              raise SystemExit("composite universe SHA disagrees with plan")
          if build_phase2_research_rehydration_seed(
              summary,
              provenance,
              handoff,
              source_inventory=build_phase2_source_inventory(),
              universe_sha256=universe_sha,
          ) != seed:
              raise SystemExit(
                  "composite frozen-universe seed disagrees with plan"
              )

          layouts = build_phase2_research_source_layouts()
          validate_phase2_research_source_layouts(
              layouts,
              build_phase2_source_inventory(),
          )
          layout = layouts[component_id]
          if layout["strategy"] != "composite":
              raise SystemExit(
                  f"{component_id}: layout is not composite"
              )
          binding = dict(plan["launchpad_bindings"][component_id])
          binding_sha = canonical_sha(binding)

          coverage_run_id = int(binding["coverage_run_id"])
          coverage_name = str(binding["coverage_artifact_name"])
          verify_artifact(
              coverage_run_id,
              coverage_name,
              binding["coverage_artifact_digest"],
          )
          coverage_root = Path("inputs/coverage")
          download_named(
              coverage_run_id,
              coverage_name,
              coverage_root,
          )
          coverage_report_path = (
              coverage_root / binding["coverage_report_path"]
          )
          if sha256_path(coverage_report_path) != binding[
              "coverage_report_sha256"
          ]:
              raise SystemExit(
                  f"{component_id}: coverage report SHA drift"
              )
          coverage = json.loads(coverage_report_path.read_text())
          if str(coverage.get("source_id") or "") != component_id:
              raise SystemExit(
                  f"{component_id}: coverage source drift"
              )

          source_provenance_path = (
              coverage_root / layout["source_provenance_path"]
          )
          source_provenance = json.loads(
              source_provenance_path.read_text()
          )
          source_provenance_sha = canonical_sha(source_provenance)
          if source_provenance_sha != binding[
              "coverage_provenance_sha256"
          ]:
              raise SystemExit(
                  f"{component_id}: source provenance SHA drift"
              )
          if str(coverage.get("provenance_sha256") or "").lower() != (
              source_provenance_sha
          ):
              raise SystemExit(
                  f"{component_id}: coverage/source provenance drift"
              )

          source_ids = set(binding["source_ids"])
          eligible_tokens = set()
          with universe_path.open() as handle:
              for line in handle:
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if source_ids & {
                      str(value)
                      for value in row.get("source_ids", [])
                  }:
                      eligible_tokens.add(
                          normalize_address(str(row["token"]))
                      )

          segment_reports = {}
          union_tokens = set()
          origin_digests = {}
          for segment in layout["segments"]:
              segment_id = segment["segment_id"]
              logical_sha = coverage[segment["logical_sha_field"]]
              origin = segment["artifact_origin"]
              if origin == "coverage_run":
                  run_id = coverage_run_id
                  origin_root = coverage_root
                  origin_digests[segment_id] = binding[
                      "coverage_artifact_digest"
                  ]
              elif origin == "source_provenance_run":
                  run_id = int(
                      source_provenance[
                          segment["provenance_run_field"]
                      ]
                  )
                  if run_id <= 0:
                      raise SystemExit(
                          f"{segment_id}: provenance run id is invalid"
                      )
                  name = segment["artifact_name"]
                  digest_field = segment.get(
                      "provenance_artifact_digest_field"
                  )
                  expected_digest = (
                      None
                      if digest_field is None
                      else source_provenance[digest_field]
                  )
                  actual_digest = verify_artifact(
                      run_id,
                      name,
                      expected_digest,
                  )
                  origin_digests[segment_id] = actual_digest
                  origin_root = (
                      Path("inputs/origins")
                      / segment_id
                      / "coverage"
                  )
                  download_named(run_id, name, origin_root)
              else:
                  raise SystemExit(
                      f"{segment_id}: unsupported artifact origin {origin}"
                  )

              shard_root = (
                  Path("inputs/origins")
                  / segment_id
                  / "shards"
              )
              download_patterns(
                  run_id,
                  list(segment["shard_artifact_patterns"]),
                  shard_root,
              )

              storage_mode = segment["storage_mode"]
              normalized_manifest = (
                  Path("inputs/origins")
                  / segment_id
                  / "normalized.manifest.json"
              )
              if storage_mode == "sharded_artifacts":
                  aggregate_manifest = (
                      origin_root
                      / segment["aggregate_manifest_path"]
                  )
              elif storage_mode == "shard_report_rebuild":
                  aggregate_name = segment.get(
                      "aggregate_manifest_path"
                  )
                  if aggregate_name:
                      aggregate_manifest = normalized_manifest
                      normalize_flat_sharded_research_manifest(
                          component_id=segment_id,
                          flat_manifest_path=(
                              origin_root / aggregate_name
                          ),
                          output_manifest_path=aggregate_manifest,
                          path_name=f"{segment_id}.jsonl",
                          expected_logical_sha256=logical_sha,
                      )
                  else:
                      aggregate_manifest = normalized_manifest
                      rebuild_report_sharded_research_manifest(
                          component_id=segment_id,
                          root=shard_root,
                          point_pattern=segment["point_file_pattern"],
                          report_template=segment["report_template"],
                          report_records_field=segment[
                              "report_records_field"
                          ],
                          expected_logical_sha256=logical_sha,
                          output_manifest_path=aggregate_manifest,
                          path_name=f"{segment_id}.jsonl",
                      )
              else:
                  raise SystemExit(
                      f"{segment_id}: unsupported composite storage mode "
                      f"{storage_mode}"
                  )

              output = Path(
                  f"artifacts/phase2-research-{segment_id}.jsonl"
              )
              report = materialize_sharded_jsonl_research_subset(
                  component_id=segment_id,
                  root=shard_root,
                  aggregate_manifest_path=aggregate_manifest,
                  eligible_tokens=eligible_tokens,
                  expected_logical_sha256=logical_sha,
                  output=output,
                  source_binding_sha256=binding_sha,
              )
              observed = set()
              with output.open() as handle:
                  for line in handle:
                      if line.strip():
                          observed.add(
                              normalize_address(
                                  str(json.loads(line)["token"])
                              )
                          )
              if not observed.issubset(eligible_tokens):
                  raise SystemExit(
                      f"{segment_id}: materialized token set escaped "
                      "frozen-universe membership"
                  )
              union_tokens.update(observed)
              segment_reports[segment_id] = {
                  **report,
                  "observed_eligible_tokens": len(observed),
                  "origin_run_id": run_id,
                  "origin_artifact_digest": origin_digests[
                      segment_id
                  ],
              }

          if union_tokens != eligible_tokens:
              missing = sorted(eligible_tokens - union_tokens)
              extra = sorted(union_tokens - eligible_tokens)
              raise SystemExit(
                  f"{component_id}: composite token coverage mismatch: "
                  f"missing={missing[:20]} extra={extra[:20]}"
              )

          final_report = {
              "version": "phase2-research-composite-materialization-v1",
              "component_id": component_id,
              "strategy": "composite",
              "source_ids": sorted(source_ids),
              "source_binding_sha256": binding_sha,
              "coverage_provenance_sha256": source_provenance_sha,
              "eligible_universe_sha256": universe_sha,
              "rehydration_plan_sha256": actual_plan_sha,
              "expected_eligible_tokens": len(eligible_tokens),
              "observed_eligible_tokens": len(union_tokens),
              "eligible_token_coverage_complete": True,
              "segment_reports": segment_reports,
              "research_component_ready": True,
              "dump_threshold_frozen": False,
              "outcome_labels_computed": False,
          }
          report_path = Path(
              "artifacts/phase2-research-component-report.json"
          )
          report_text = (
              json.dumps(final_report, indent=2, sort_keys=True)
              + "\n"
          )
          report_path.write_text(report_text)
          report_sha = hashlib.sha256(
              report_text.encode()
          ).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"report_sha256={report_sha}\n")
              handle.write(
                  f"eligible_tokens={len(union_tokens)}\n"
              )
          print(json.dumps(final_report, sort_keys=True))
          PY

      - name: Upload composite research component
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-materialized-${{ inputs.component_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish composite component identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          REPORT_SHA256: ${{ steps.materialize.outputs.report_sha256 }}
          ELIGIBLE_TOKENS: ${{ steps.materialize.outputs.eligible_tokens }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${REPORT_SHA256}"
          {
            echo "## Phase-2 composite research component"
            echo
            echo "- component_id: ${COMPONENT_ID}"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase2-research-materialized-${COMPONENT_ID}"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- report_sha256: ${REPORT_SHA256}"
            echo "- eligible_tokens: ${ELIGIBLE_TOKENS}"
            echo "- research_component_ready: true"
            echo "- dump_threshold_frozen: false"
            echo "- outcome_labels_computed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
