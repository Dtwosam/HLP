name: phase1-network-smoke

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/phase1-network-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robinhood-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Verify Robinhood mainnet and Pons factories
        run: hlp network-smoke
      - name: Locate Pons V1 creation through Blockscout
        run: hlp contract-creation 0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB
      - name: Locate Pons V2 creation through Blockscout
        run: hlp contract-creation 0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e
