name: phase1-network-smoke

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  robinhood-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Verify Robinhood mainnet and Pons factories
        run: hlp network-smoke
