name: phase1-network-smoke

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/phase1-network-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robinhood-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Verify Robinhood mainnet and Pons factories
        run: hlp network-smoke
      - name: Diagnose hoodexplorer IPv4 reachability
        run: |
          curl -4 --fail --silent --show-error --max-time 10 \
            'https://www.hoodexplorer.org/api?module=proxy&action=eth_blockNumber&params=[]'
          echo
      - name: Verify keyless archive/index access through hoodexplorer
        run: hlp --timeout 10 --attempts 1 hood-smoke
