name: oracle-handoff-test-repair

on:
  push:
    branches:
      - oracle-checkpoint-handoff

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'repair recovered completion liveness oracle checkpoint') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oracle-checkpoint-handoff
          fetch-depth: 0
      - name: Patch recovered-completion liveness checkpoint only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_workflow_liveness.py')
          text = path.read_text()
          start = text.index('def test_recovered_completion_chain_is_terminal_gated_and_resumable():')
          end = text.find('\ndef ', start + 1)
          if end < 0:
              end = len(text)
          section = text[start:end]
          old = '"33_974_681_334"'
          new = '"34_765_335_793"'
          assert section.count(old) == 1
          section = section.replace(old, new, 1)
          updated = text[:start] + section + text[end:]
          assert updated.count(old) == text.count(old) - 1
          assert updated.count(new) == text.count(new) + 1
          path.write_text(updated)
          PY
          git diff --check
          git diff -- tests/test_workflow_liveness.py
      - name: Commit exact liveness expectation repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_workflow_liveness.py
          git commit -m 'repair recovered completion liveness oracle checkpoint'
          git push origin HEAD:oracle-checkpoint-handoff
