name: phase2-dump-geometry-launch

on:
  workflow_dispatch:
    inputs:
      price_path_completion_run_id:
        description: Exact successful phase2-research-price-path-completion workflow_dispatch run ID
        required: true
        type: string
      expected_price_path_completion_artifact_digest:
        description: Exact price-path completion artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: phase2-dump-geometry-launch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      COMPLETION_RUN_ID: ${{ inputs.price_path_completion_run_id }}
      EXPECTED_COMPLETION_DIGEST: ${{ inputs.expected_price_path_completion_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: launch
        name: Dispatch outcome-blind dump geometry
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import base64
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.phase2_dispatch_readiness import (
              workflow_dispatch_interface_sha256,
          )
          from hlp.data.phase2_dump_geometry_dispatch import (
              validate_phase2_dump_geometry_launch_receipt,
          )
          from hlp.data.phase2_research_price_path_dispatch import (
              validate_phase2_research_price_path_completion_receipt,
          )

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip().lower()

          def api(args, payload=None):
              raw = subprocess.check_output(
                  ["gh", "api", "-H", "Accept: application/vnd.github+json", *args],
                  input=(
                      json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
                      if payload is not None else None
                  ),
              )
              return json.loads(raw) if raw.strip() else None

          def run(run_id, workflow):
              row = api([f"/repos/{repo}/actions/runs/{run_id}"])
              if (
                  row.get("path") != f".github/workflows/{workflow}"
                  or row.get("event") != "workflow_dispatch"
                  or row.get("head_branch") != branch
                  or str(row.get("head_sha") or "").lower() != head
              ):
                  raise SystemExit(f"run {run_id} identity drift")
              return row

          def artifact(run_id, name):
              rows = api([
                  f"/repos/{repo}/actions/runs/{run_id}/artifacts?name={name}"
              ]).get("artifacts", [])
              rows = [x for x in rows if x.get("name") == name and not x.get("expired")]
              if len(rows) != 1:
                  raise SystemExit(f"{name} artifact cardinality drift")
              return rows[0]

          completion_run = int(os.environ["COMPLETION_RUN_ID"])
          workflow = "phase2-research-price-path-completion.yml"
          row = run(completion_run, workflow)
          if row.get("status") != "completed" or row.get("conclusion") != "success":
              raise SystemExit("price-path completion is not successful")
          name = "phase2-research-price-path-completion"
          art = artifact(completion_run, name)
          actual = str(art.get("digest") or "").lower()
          if actual != os.environ["EXPECTED_COMPLETION_DIGEST"].lower():
              raise SystemExit("price-path completion digest drift")
          root = Path("upstream/completion")
          if root.exists():
              shutil.rmtree(root)
          root.mkdir(parents=True)
          subprocess.check_call([
              "gh", "run", "download", str(completion_run),
              "--repo", repo, "--name", name, "--dir", str(root),
          ])
          completion = validate_phase2_research_price_path_completion_receipt(
              json.loads(
                  (root / "phase2-research-price-path-completion-receipt.json").read_text()
              )
          )
          if completion["execution_head_sha"] != head:
              raise SystemExit("price-path completion HEAD drift")

          target_workflow = "phase2-dump-geometry-research.yml"
          metadata = api([f"/repos/{repo}"])
          default_branch = str(metadata.get("default_branch") or "")
          local = workflow_dispatch_interface_sha256(
              Path(".github/workflows", target_workflow).read_text()
          )
          payload = api([
              f"/repos/{repo}/contents/.github/workflows/{target_workflow}?ref={default_branch}"
          ])
          remote = workflow_dispatch_interface_sha256(
              base64.b64decode(
                  str(payload.get("content") or "").replace("\n", "")
              ).decode()
          )
          if local != remote:
              raise SystemExit("default-branch dump-geometry interface drift")

          response = api(
              [
                  "--method", "POST",
                  f"/repos/{repo}/actions/workflows/{target_workflow}/dispatches",
                  "--input", "-",
              ],
              {"ref": branch, "inputs": completion["geometry_inputs"]},
          )
          target = int((response or {}).get("workflow_run_id", 0))
          if target <= 0:
              raise SystemExit("dump-geometry dispatch lacks run ID")
          run(target, target_workflow)

          receipt = {
              "version": "phase2-dump-geometry-launch-receipt-v1",
              "dump_geometry_control_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "price_path_completion_run_id": completion_run,
              "price_path_completion_artifact_digest": actual,
              "dump_geometry_run_id": target,
              "execution_branch": branch,
              "execution_head_sha": head,
              "canonical_ledger_commit_sha": completion["canonical_ledger_commit_sha"],
              "price_path_run_id": completion["price_path_run_id"],
              "price_path_artifact_digest": completion["price_path_artifact_digest"],
              "price_path_handoff_sha256": completion["price_path_handoff_sha256"],
              "universe_run_id": completion["universe_run_id"],
              "universe_artifact_digest": completion["universe_artifact_digest"],
              "universe_handoff_sha256": completion["universe_handoff_sha256"],
              "target_runs_created": 1,
              "target_run_waited_for_completion": False,
              "candidate_selected": False,
              "dump_threshold_frozen": False,
              "phase2_dump_detector_frozen": False,
              "outcome_labels_computed": False,
              "workflow_dispatch_performed": True,
          }
          receipt = validate_phase2_dump_geometry_launch_receipt(receipt)
          Path("artifacts/phase2-dump-geometry-launch-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"target_run_id={target}\n")
          PY
      - name: Upload dump-geometry launch receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dump-geometry-launch
          path: artifacts/phase2-dump-geometry-launch-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish dump-geometry launch summary
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          TARGET_RUN_ID: ${{ steps.launch.outputs.target_run_id }}
        run: |
          {
            echo "## Phase-2 dump geometry launch"
            echo "- launch_run_id: ${GITHUB_RUN_ID}"
            echo "- launch_artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- dump_geometry_run_id: ${TARGET_RUN_ID}"
            echo "- candidate_selected: false"
            echo "- dump_threshold_frozen: false"
          } >> "${GITHUB_STEP_SUMMARY}"
