name: phase1-pons-unpriced-v3-route-audit-one-shot
# Head-discover V3 pools; prove causal state; USDG first, WETH fallback.

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-pons-unpriced-v3-route-audit-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-unpriced-v3-route-audit-one-shot
  cancel-in-progress: true

env:
  QUOTE_AUDIT_RUN_ID: '33919929691'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-quote-audit-current
          path: quotes
          run-id: ${{ env.QUOTE_AUDIT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Audit direct causal V3 routes before first Pons use
        run: |
          mkdir -p artifacts
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-pons-unpriced-quote-v3-routes \
            --quote-registry quotes/pons-quote-registry.jsonl \
            --out artifacts/pons-unpriced-v3-route-audit.jsonl
      - name: Write compact coverage report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              json.loads(line)
              for line in Path(
                  "artifacts/pons-unpriced-v3-route-audit.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          report = {
              "quote_assets": len(rows),
              "launches": sum(int(row["launches"]) for row in rows),
              "v3_causal_ready_assets": sum(
                  bool(row["v3_causal_ready"]) for row in rows
              ),
              "v3_causal_ready_launches": sum(
                  int(row["launches"])
                  for row in rows
                  if row["v3_causal_ready"]
              ),
              "direct_usdg_ready_assets": sum(
                  bool(row["direct_usdg_ready"]) for row in rows
              ),
              "direct_weth_ready_assets": sum(
                  bool(row["direct_weth_ready"]) for row in rows
              ),
              "unresolved": [
                  {
                      "symbol": row["symbol"],
                      "quote_token": row["quote_token"],
                      "first_launch_block": row["first_launch_block"],
                      "launches": row["launches"],
                  }
                  for row in rows
                  if not row["v3_causal_ready"]
              ],
              "ready": [
                  {
                      "symbol": row["symbol"],
                      "quote_token": row["quote_token"],
                      "first_launch_block": row["first_launch_block"],
                      "launches": row["launches"],
                      "direct_usdg_ready": row["direct_usdg_ready"],
                      "direct_weth_ready": row["direct_weth_ready"],
                      "ready_candidates": row["v3_ready_candidates"],
                  }
                  for row in rows
                  if row["v3_causal_ready"]
              ],
          }
          Path("artifacts/pons-unpriced-v3-route-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-unpriced-v3-route-audit
          path: artifacts/
          if-no-files-found: error
