name: phase1-pons-repaired-pricing-promote

on:
  workflow_call:
    inputs:
      v1_v3_run_id:
        required: true
        type: string
      v2_v4_run_id:
        required: true
        type: string
      v3_fallback_run_id:
        required: true
        type: string
      repaired_v2_lifecycle_run_id:
        required: true
        type: string
      repaired_v4_fallback_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-repaired-pricing-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Verify exact repaired pricing source runs and artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V1_V3_RUN_ID: ${{ inputs.v1_v3_run_id }}
          V2_V4_RUN_ID: ${{ inputs.v2_v4_run_id }}
          V3_FALLBACK_RUN_ID: ${{ inputs.v3_fallback_run_id }}
          REPAIRED_V2_LIFECYCLE_RUN_ID: ${{ inputs.repaired_v2_lifecycle_run_id }}
          REPAIRED_V4_FALLBACK_RUN_ID: ${{ inputs.repaired_v4_fallback_run_id }}
        run: |
          python - <<'PY'
          import json
          import os

          from hlp.data.github_actions import fetch_github_actions_json

          observed = {
              "v1_v3_run_id": int(os.environ["V1_V3_RUN_ID"]),
              "v2_v4_run_id": int(os.environ["V2_V4_RUN_ID"]),
              "v3_fallback_run_id": int(os.environ["V3_FALLBACK_RUN_ID"]),
              "repaired_v2_lifecycle_run_id": int(
                  os.environ["REPAIRED_V2_LIFECYCLE_RUN_ID"]
              ),
              "repaired_v4_fallback_run_id": int(
                  os.environ["REPAIRED_V4_FALLBACK_RUN_ID"]
              ),
          }
          expected = {
              "v1_v3_run_id": 34_228_430_753,
              "v2_v4_run_id": 34_471_480_180,
              "v3_fallback_run_id": 34_480_161_440,
              "repaired_v2_lifecycle_run_id": 34_900_105_493,
              "repaired_v4_fallback_run_id": 34_894_335_995,
          }
          if observed != expected:
              raise SystemExit(
                  "repaired pricing promotion source IDs changed: "
                  f"expected={expected} observed={observed}"
              )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def get(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=30,
              )

          run_contracts = {
              34_480_161_440: {
                  "path": (
                      ".github/workflows/"
                      "phase1-pons-recovered-completion-one-shot.yml"
                  ),
                  "branch": "phase1/data-acquisition-spike",
                  "head_sha": "db374769984c621d4f2f22aad27e0686f218164a",
                  "conclusion": "success",
              },
              34_900_105_493: {
                  "path": ".github/workflows/tests.yml",
                  "branch": "phase1/v4-causal-history-fix",
                  "head_sha": "279d8016b1f62aef01167650be3cc70e0ca72f6c",
                  "conclusion": "success",
              },
              34_894_335_995: {
                  "path": ".github/workflows/tests.yml",
                  "branch": "phase1/v4-causal-history-fix",
                  "head_sha": "09c788e6321b958d1fb78f00e3330605e86435e9",
                  "conclusion": "failure",
              },
          }
          for run_id, contract in run_contracts.items():
              run = get(f"/repos/{repo}/actions/runs/{run_id}")
              actual_path = str(run.get("path") or "").split("@", 1)[0]
              if run.get("status") != "completed":
                  raise SystemExit(
                      f"repaired pricing source run is not terminal: {run_id}"
                  )
              if run.get("conclusion") != contract["conclusion"]:
                  raise SystemExit(
                      "repaired pricing source conclusion changed: "
                      f"run={run_id} actual={run.get('conclusion')}"
                  )
              if actual_path != contract["path"]:
                  raise SystemExit(
                      "repaired pricing source workflow changed: "
                      f"run={run_id} actual={actual_path}"
                  )
              if run.get("head_branch") != contract["branch"]:
                  raise SystemExit(
                      f"repaired pricing source branch changed: run={run_id}"
                  )
              if run.get("head_sha") != contract["head_sha"]:
                  raise SystemExit(
                      f"repaired pricing source head changed: run={run_id}"
                  )

          artifact_contracts = {
              (34_480_161_440, "phase1-pons-v1-lifecycle-eligibility"): {
                  "id": 10_154_428_836,
                  "digest": (
                      "sha256:4666e7af82a2d115e467ed9ad94c4f33"
                      "af7d346b0e5d9ada44b9f992d4e35d61"
                  ),
              },
              (34_480_161_440, "phase1-pons-v3-quote-fallback-full"): {
                  "id": 10_186_898_865,
                  "digest": (
                      "sha256:de8e0a180472fb4e235e001d46e10a33"
                      "c7112af07a94bc526e72edc9dda22e4d"
                  ),
              },
              (34_900_105_493, "phase1-pons-v2-lifecycle-eligibility"): {
                  "id": 10_370_673_267,
                  "digest": (
                      "sha256:70e0ca266efe03a1f47dbe0abd8dce86"
                      "7b3edbf0242f75091461dedd308fd0db"
                  ),
              },
              (34_894_335_995, "phase1-pons-v4-quote-fallback-full"): {
                  "id": 10_368_788_172,
                  "digest": (
                      "sha256:2198e48522662ece0cea43d8e1c10b0e"
                      "dfa29f99978284ec4f127bf298a9c271"
                  ),
              },
              (34_894_335_995, "phase1-pons-quote-fallback-full"): {
                  "id": 10_368_454_044,
                  "digest": (
                      "sha256:6dad788708830fb161859ee6b9952267"
                      "bb93a7b2ff37d7289c18753fa04d345d"
                  ),
              },
          }

          rows_by_run = {}
          for run_id, _ in artifact_contracts:
              if run_id in rows_by_run:
                  continue
              rows = []
              page = 1
              while True:
                  payload = get(
                      f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                      f"?per_page=100&page={page}"
                  )
                  batch = list(payload.get("artifacts") or [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
                  if page > 20:
                      raise SystemExit(
                          f"artifact pagination exceeded 2000 for run {run_id}"
                      )
              rows_by_run[run_id] = rows

          for (run_id, name), contract in artifact_contracts.items():
              matches = [
                  row
                  for row in rows_by_run[run_id]
                  if str(row.get("name") or "") == name
                  and not row.get("expired")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "repaired pricing source artifact identity is ambiguous: "
                      f"run={run_id} artifact={name} count={len(matches)}"
                  )
              artifact = matches[0]
              if int(artifact.get("id", 0)) != contract["id"]:
                  raise SystemExit(
                      "repaired pricing source artifact ID changed: "
                      f"run={run_id} artifact={name}"
                  )
              if str(artifact.get("digest") or "") != contract["digest"]:
                  raise SystemExit(
                      "repaired pricing source artifact digest changed: "
                      f"run={run_id} artifact={name}"
                  )

          print(json.dumps({
              "source_runs": observed,
              "verified_artifacts": len(artifact_contracts),
              "mode": "artifact_only_repaired_pricing_promotion",
          }, sort_keys=True))
          PY

      - name: Download canonical V1 lifecycle evidence
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: source/v1-lifecycle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.v3_fallback_run_id }}
      - name: Download canonical V3 fallback evidence
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v3-quote-fallback-full
          path: source/v3-fallback
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.v3_fallback_run_id }}
      - name: Download repaired V2 lifecycle evidence
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: source/v2-lifecycle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repaired_v2_lifecycle_run_id }}
      - name: Download repaired V4 fallback evidence
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v4-quote-fallback-full
          path: source/v4-fallback
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repaired_v4_fallback_run_id }}
      - name: Download repaired generic fallback evidence
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-quote-fallback-full
          path: source/generic-fallback
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repaired_v4_fallback_run_id }}

      - name: Verify repaired causal pricing contents
        env:
          V1_V3_RUN_ID: ${{ inputs.v1_v3_run_id }}
          V2_V4_RUN_ID: ${{ inputs.v2_v4_run_id }}
          V3_FALLBACK_RUN_ID: ${{ inputs.v3_fallback_run_id }}
          REPAIRED_V4_FALLBACK_RUN_ID: ${{ inputs.repaired_v4_fallback_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("source")
          v1_v3_run_id = int(os.environ["V1_V3_RUN_ID"])
          v2_v4_run_id = int(os.environ["V2_V4_RUN_ID"])
          v3_fallback_run_id = int(os.environ["V3_FALLBACK_RUN_ID"])
          repaired_v4_run_id = int(os.environ["REPAIRED_V4_FALLBACK_RUN_ID"])

          def load(path):
              return json.loads(path.read_text())

          def require_subset(actual, expected, label):
              mismatches = {
                  key: {"expected": value, "observed": actual.get(key)}
                  for key, value in expected.items()
                  if actual.get(key) != value
              }
              if mismatches:
                  raise SystemExit(
                      f"{label} changed: {json.dumps(mismatches, sort_keys=True)}"
                  )

          v1_manifest = load(
              root
              / "v1-lifecycle"
              / "pons-v1-lifecycle-eligibility.jsonl.manifest.json"
          )
          require_subset(
              v1_manifest,
              {
                  "path": "pons-v1-lifecycle-eligibility.jsonl",
                  "records": 268_688,
                  "sha256": (
                      "74a43a5401d88d299070b21414e7d2ef"
                      "aaa90c8469596d2207ef41a9456ede31"
                  ),
              },
              "V1 lifecycle manifest",
          )
          require_subset(
              dict(v1_manifest.get("provenance") or {}),
              {
                  "chain_id": 4663,
                  "snapshot_head_block": 54_486_035,
                  "v1_v3_run_id": v1_v3_run_id,
              },
              "V1 lifecycle provenance",
          )
          require_subset(
              load(root / "v1-lifecycle" / "pons-v1-eligibility-summary.json"),
              {
                  "registry_tokens": 268_688,
                  "eligible_tokens": 5_161,
                  "eligibility_unknown_tokens": 0,
                  "tokens_without_priced_points": 0,
                  "tokens_with_partial_pricing": 0,
                  "snapshot_head_block": 54_486_035,
              },
              "V1 eligibility summary",
          )

          v2_manifest = load(
              root
              / "v2-lifecycle"
              / "pons-v2-lifecycle-eligibility.jsonl.manifest.json"
          )
          require_subset(
              v2_manifest,
              {
                  "path": "pons-v2-lifecycle-eligibility.jsonl",
                  "records": 225_951,
                  "sha256": (
                      "2e880af79350530d4c30cda8d10778fe"
                      "e8156c284ccb523cae226f1a886cc566"
                  ),
              },
              "V2 lifecycle manifest",
          )
          require_subset(
              dict(v2_manifest.get("provenance") or {}),
              {
                  "chain_id": 4663,
                  "snapshot_head_block": 54_486_035,
                  "v4_run_id": v2_v4_run_id,
                  "fallback_run_id": repaired_v4_run_id,
              },
              "V2 lifecycle provenance",
          )
          require_subset(
              load(root / "v2-lifecycle" / "pons-v2-eligibility-summary.json"),
              {
                  "registry_tokens": 225_951,
                  "eligible_tokens": 1_811,
                  "eligibility_unknown_tokens": 0,
                  "tokens_without_priced_points": 0,
                  "tokens_with_partial_pricing": 0,
                  "snapshot_head_block": 54_486_035,
              },
              "V2 eligibility summary",
          )
          v2_inputs = load(
              root
              / "v2-lifecycle"
              / "pons-v2-input-manifest-validation.json"
          )
          require_subset(
              v2_inputs,
              {
                  "chain_id": 4663,
                  "snapshot_head_block": 54_486_035,
                  "fallback_v3_run_id": v3_fallback_run_id,
                  "fallback_v4_run_id": repaired_v4_run_id,
              },
              "V2 input manifest validation",
          )
          ownership = dict(v2_inputs.get("fallback_ownership") or {})
          expected_ownership = {
              "owned_quote_assets": 30,
              "v3_routes": 25,
              "v4_routes": 5,
              "v4_causal_initial_assets": 5,
              "v3_v4_overlap_assets": 0,
          }
          require_subset(
              ownership,
              expected_ownership,
              "V2 fallback ownership",
          )

          v3_initial = load(
              root
              / "v3-fallback"
              / "pons-v3-quote-fallback-initial.jsonl.manifest.json"
          )
          v3_updates = load(
              root
              / "v3-fallback"
              / "pons-v3-quote-fallback-updates.jsonl.manifest.json"
          )
          require_subset(
              v3_initial,
              {
                  "records": 25,
                  "sha256": (
                      "e23bfe5f2d9a676221f5b6edebcb4318"
                      "2a3657de726d973d57ca1a7b6a8f69f4"
                  ),
              },
              "V3 fallback initial manifest",
          )
          require_subset(
              v3_updates,
              {
                  "records": 797_392,
                  "sha256": (
                      "1390e445e66746a3adfd5b285d8e5508"
                      "e3900fb21139ee4df75d007a81afbc46"
                  ),
              },
              "V3 fallback update manifest",
          )

          v4_initial = load(
              root
              / "v4-fallback"
              / "pons-v4-quote-fallback-initial.jsonl.manifest.json"
          )
          v4_updates = load(
              root
              / "v4-fallback"
              / "pons-v4-quote-fallback-updates.jsonl.manifest.json"
          )
          require_subset(
              v4_initial,
              {
                  "records": 5,
                  "sha256": (
                      "1ba263cbfc149459fa7234f268c1807d2"
                      "11e066943717ac8ee3017cce2eddfb1"
                  ),
              },
              "V4 fallback initial manifest",
          )
          require_subset(
              v4_updates,
              {
                  "records": 9_413,
                  "sha256": (
                      "db127f50496e2aa9f26744ed2641eb6e"
                      "0a4638cdd514e3e1379a3cca9560ab46"
                  ),
              },
              "V4 fallback update manifest",
          )
          v4_routes = load(
              root / "v4-fallback" / "pons-v4-quote-route-selection-summary.json"
          )
          require_subset(
              v4_routes,
              {
                  "selected_routes": 5,
                  "causal_initial_routes": 5,
                  "residual_quote_assets": 5,
                  "unresolved_assets": 0,
                  "v3_run_id": v3_fallback_run_id,
              },
              "V4 causal route selection",
          )

          generic_summary = load(
              root / "generic-fallback" / "pons-quote-fallback-summary.json"
          )
          expected_generic = {
              "initial_state_assets": 30,
              "owned_quote_assets": 30,
              "ownership_mode": "25_effective_v3_5_v4_all_causal",
              "skhy_owner": "v4",
              "skhy_v3_superseded_by_causal_v4": True,
              "snapshot_head_block": 54_486_035,
              "update_assets": 30,
              "updates": 806_561,
              "v3_routes": 25,
              "v4_routes": 5,
              "v4_causal_initial_assets": 5,
              "v3_v4_overlap_assets": 0,
              "v3_run_id": v3_fallback_run_id,
              "v4_run_id": repaired_v4_run_id,
          }
          require_subset(
              generic_summary,
              expected_generic,
              "generic fallback summary",
          )
          generic_initial = load(
              root
              / "generic-fallback"
              / "pons-quote-fallback-initial.jsonl.manifest.json"
          )
          generic_updates = load(
              root
              / "generic-fallback"
              / "pons-quote-fallback-updates.jsonl.manifest.json"
          )
          require_subset(
              generic_initial,
              {
                  "records": 30,
                  "sha256": (
                      "484bca9d3c9d4bd7b33abcd444e2a509"
                      "51c789fbd74a5e2972eb2463160b076b"
                  ),
              },
              "generic fallback initial manifest",
          )
          require_subset(
              generic_updates,
              {
                  "records": 806_561,
                  "sha256": (
                      "c1c15a17d58b2d48d550659055aea531"
                      "0b7d3e4a1bc06d7ef5248a848648e1f5"
                  ),
              },
              "generic fallback update manifest",
          )

          print(json.dumps({
              "eligibility_unknown_tokens": 0,
              "owned_quote_assets": 30,
              "v3_routes": 25,
              "v4_routes": 5,
              "v4_causal_initial_assets": 5,
              "v3_v4_overlap_assets": 0,
              "updates": 806_561,
              "validation": "pass",
          }, sort_keys=True))
          PY

      - name: Promote canonical V1 lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: source/v1-lifecycle/
          if-no-files-found: error
          overwrite: true
      - name: Promote repaired V2 lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: source/v2-lifecycle/
          if-no-files-found: error
          overwrite: true
      - name: Promote canonical V3 fallback evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v3-quote-fallback-full
          path: source/v3-fallback/
          if-no-files-found: error
          overwrite: true
      - name: Promote repaired V4 fallback evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v4-quote-fallback-full
          path: source/v4-fallback/
          if-no-files-found: error
          overwrite: true
      - name: Promote repaired generic fallback evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-quote-fallback-full
          path: source/generic-fallback/
          if-no-files-found: error
          overwrite: true
