name: phase1-pons-representative-call-probe
# target: sample

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/workflows/phase1-pons-representative-call-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, 'never launch representative call probe') }}
    uses: ./.github/workflows/phase1-pons-representative-sample-freeze.yml
    with:
      v1_eligibility_run_id: "33982556591"
      v2_eligibility_run_id: "33982556591"
      runner_smoke_run_id: "33920762592"
    secrets: inherit
