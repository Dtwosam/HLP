name: phase1-pons-representative-call-probe
# target: market-paths

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/workflows/phase1-pons-representative-call-probe.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, 'never launch representative call probe') }}
    uses: ./.github/workflows/phase1-pons-representative-market-paths.yml
    with:
      sample_run_id: "33982556591"
      registry_run_id: "33911022718"
      v1_v3_run_id: "33982556591"
      v2_curve_run_id: "33936232604"
      transition_run_id: "33912452330"
      v2_v4_run_id: "33982556591"
    secrets: inherit
