name: phase2-dump-geometry-research

on:
  workflow_dispatch:
    inputs:
      price_path_run_id:
        description: Exact phase2-research-price-path run ID
        required: true
        type: string
      expected_price_path_artifact_digest:
        description: Exact phase2-research-price-path artifact digest (sha256:...)
        required: true
        type: string
      expected_price_path_handoff_sha256:
        description: Exact SHA-256 of phase2-research-price-path-handoff.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact frozen-universe artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-dump-geometry-research-${{ github.ref }}
  cancel-in-progress: false

env:
  PRICE_PATH_RUN_ID: ${{ inputs.price_path_run_id }}
  EXPECTED_PRICE_PATH_ARTIFACT_DIGEST: ${{ inputs.expected_price_path_artifact_digest }}
  EXPECTED_PRICE_PATH_HANDOFF_SHA256: ${{ inputs.expected_price_path_handoff_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: geometry
        name: Build streaming drawdown geometry
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase2_dump_research import (
              build_phase2_dump_geometry_handoff,
              materialize_phase2_dump_geometry,
          )
          from hlp.data.phase2_research_paths import (
              build_phase2_research_price_path_handoff,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repo,
                  "--name",
                  name,
                  "--dir",
                  str(destination),
              ])
              return selected

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          price_root = Path("inputs/price-path")
          universe_root = Path("inputs/universe")
          download_named(
              int(os.environ["PRICE_PATH_RUN_ID"]),
              "phase2-research-price-path",
              price_root,
              "research price path",
              os.environ["EXPECTED_PRICE_PATH_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "frozen universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )

          path_data = find_unique(
              price_root,
              "phase2-research-price-path.jsonl",
          )
          path_manifest_path = find_unique(
              price_root,
              "phase2-research-price-path.jsonl.manifest.json",
          )
          path_manifest = json.loads(
              path_manifest_path.read_text()
          )
          path_report_path = find_unique(
              price_root,
              "phase2-research-price-path-report.json",
          )
          path_report = json.loads(path_report_path.read_text())
          path_report_sha = sha256_path(path_report_path)
          path_handoff_path = find_unique(
              price_root,
              "phase2-research-price-path-handoff.json",
          )
          path_handoff_sha = sha256_path(path_handoff_path)
          if path_handoff_sha != os.environ[
              "EXPECTED_PRICE_PATH_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("research price-path handoff SHA drift")
          path_handoff = json.loads(path_handoff_path.read_text())
          rebuilt_handoff = build_phase2_research_price_path_handoff(
              path_report,
              report_sha256=path_report_sha,
              materialization_bundle_sha256=path_report[
                  "materialization_bundle_sha256"
              ],
              materialization_handoff_sha256=path_report[
                  "materialization_handoff_sha256"
              ],
          )
          if rebuilt_handoff != path_handoff:
              raise SystemExit(
                  "research price-path handoff content drift"
              )
          if path_manifest.get("sha256") != path_handoff[
              "normalized_price_path_sha256"
          ]:
              raise SystemExit(
                  "normalized price-path manifest SHA drift"
              )
          if int(path_manifest.get("records", -1)) != int(
              path_handoff["price_points"]
          ):
              raise SystemExit(
                  "normalized price-path record count drift"
              )
          if path_handoff.get("research_price_path_ready") is not True:
              raise SystemExit("research price path is not ready")
          if path_handoff.get("phase2_dump_detector_frozen") is not False:
              raise SystemExit(
                  "dump geometry cannot consume a frozen detector"
              )
          if path_handoff.get("outcome_labels_computed") is not False:
              raise SystemExit(
                  "dump geometry cannot consume outcome labels"
              )

          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          if sha256_path(universe_handoff_path) != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("frozen-universe handoff SHA drift")
          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_sha = sha256_path(universe_path)
          if universe_sha != path_handoff["universe_sha256"]:
              raise SystemExit(
                  "dump geometry universe SHA disagrees with price path"
              )
          universe_summary = json.loads(
              find_unique(
                  universe_root,
                  "phase2-universe-summary.json",
              ).read_text()
          )
          universe_rows = [
              json.loads(line)
              for line in universe_path.read_text().splitlines()
              if line.strip()
          ]

          geometry_path = Path(
              "artifacts/phase2-dump-geometry.jsonl"
          )
          manifest, summary = materialize_phase2_dump_geometry(
              universe_rows,
              iter_validated_jsonl(
                  path_data,
                  path_manifest_path,
              ),
              universe_summary=universe_summary,
              universe_sha256=universe_sha,
              price_path_provenance_sha256=path_handoff_sha,
              normalized_price_path_sha256=path_manifest["sha256"],
              output=geometry_path,
          )
          summary.update({
              "price_path_run_id": int(
                  os.environ["PRICE_PATH_RUN_ID"]
              ),
              "price_path_handoff_sha256": path_handoff_sha,
              "price_path_report_sha256": path_report_sha,
          })
          summary_path = Path(
              "artifacts/phase2-dump-geometry-summary.json"
          )
          summary_text = (
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_path.write_text(summary_text)
          summary_sha = hashlib.sha256(
              summary_text.encode()
          ).hexdigest()

          handoff = build_phase2_dump_geometry_handoff(
              summary,
              geometry_summary_sha256=summary_sha,
              price_path_handoff_sha256=path_handoff_sha,
          )
          handoff_path = Path(
              "artifacts/phase2-dump-geometry-handoff.json"
          )
          handoff_text = (
              json.dumps(handoff, indent=2, sort_keys=True) + "\n"
          )
          handoff_path.write_text(handoff_text)
          handoff_sha = hashlib.sha256(
              handoff_text.encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"geometry_sha256={manifest['sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(f"handoff_sha256={handoff_sha}\n")
              handle.write(
                  f"price_points={manifest['records']}\n"
              )
          print(json.dumps({
              "geometry_sha256": manifest["sha256"],
              "geometry_summary_sha256": summary_sha,
              "geometry_handoff_sha256": handoff_sha,
              "tokens": summary["tokens"],
              "price_points": summary["price_points"],
              "uses_price_path_only": True,
              "candidate_selected": False,
              "dump_threshold_frozen": False,
              "phase2_dump_detector_frozen": False,
              "outcome_labels_computed": False,
          }, sort_keys=True))
          PY

      - name: Upload dump geometry research
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dump-geometry-research
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact dump geometry handoff
        id: handoff_upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dump-geometry-handoff
          path: |
            artifacts/phase2-dump-geometry.jsonl.manifest.json
            artifacts/phase2-dump-geometry-summary.json
            artifacts/phase2-dump-geometry-handoff.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish dump-geometry identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_DIGEST: ${{ steps.handoff_upload.outputs.artifact-digest }}
          GEOMETRY_SHA256: ${{ steps.geometry.outputs.geometry_sha256 }}
          SUMMARY_SHA256: ${{ steps.geometry.outputs.summary_sha256 }}
          HANDOFF_SHA256: ${{ steps.geometry.outputs.handoff_sha256 }}
          PRICE_POINTS: ${{ steps.geometry.outputs.price_points }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${HANDOFF_ARTIFACT_DIGEST}"
          {
            echo "## Phase-2 dump geometry research"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase2-dump-geometry-research"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- handoff_artifact_name: phase2-dump-geometry-handoff"
            echo "- handoff_artifact_digest: ${HANDOFF_ARTIFACT_DIGEST}"
            echo "- geometry_sha256: ${GEOMETRY_SHA256}"
            echo "- summary_sha256: ${SUMMARY_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- price_points: ${PRICE_POINTS}"
            echo "- uses_price_path_only: true"
            echo "- candidate_selected: false"
            echo "- dump_threshold_frozen: false"
            echo "- phase2_dump_detector_frozen: false"
            echo "- outcome_labels_computed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
