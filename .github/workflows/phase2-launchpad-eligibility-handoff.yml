name: phase2-launchpad-eligibility-handoff

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Complete launchpad source
        required: true
        type: choice
        options:
          - pons_v1
          - pons_v2
          - pools_fun
          - pools_trade_instant
          - pools_trade_lbp
          - doppler
          - flap
          - trench_today
          - hood_fun_current
          - hood_fun_previous
          - noxa
      coverage_run_id:
        description: Exact run containing the complete source coverage report
        required: true
        type: string
      coverage_artifact_name:
        description: Exact source coverage artifact name
        required: true
        type: string
      expected_coverage_artifact_digest:
        description: Exact coverage artifact digest (sha256:...)
        required: true
        type: string
      coverage_report_path:
        description: Relative coverage report JSON path
        required: true
        type: string
      expected_coverage_report_sha256:
        description: Exact SHA-256 of the coverage report
        required: true
        type: string
      eligibility_run_id:
        description: Exact run containing the full per-token source summary
        required: true
        type: string
      eligibility_artifact_name:
        description: Exact eligibility/source-summary artifact name
        required: true
        type: string
      expected_eligibility_artifact_digest:
        description: Exact source-summary artifact digest (sha256:...)
        required: true
        type: string
      eligibility_summary_path:
        description: Relative full per-token summary JSONL path
        required: true
        type: string
      expected_eligibility_summary_sha256:
        description: Exact SHA-256 of the full token summary JSONL
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ID: ${{ inputs.source_id }}
      COVERAGE_RUN_ID: ${{ inputs.coverage_run_id }}
      COVERAGE_ARTIFACT_NAME: ${{ inputs.coverage_artifact_name }}
      EXPECTED_COVERAGE_ARTIFACT_DIGEST: ${{ inputs.expected_coverage_artifact_digest }}
      COVERAGE_REPORT_PATH: ${{ inputs.coverage_report_path }}
      EXPECTED_COVERAGE_REPORT_SHA256: ${{ inputs.expected_coverage_report_sha256 }}
      ELIGIBILITY_RUN_ID: ${{ inputs.eligibility_run_id }}
      ELIGIBILITY_ARTIFACT_NAME: ${{ inputs.eligibility_artifact_name }}
      EXPECTED_ELIGIBILITY_ARTIFACT_DIGEST: ${{ inputs.expected_eligibility_artifact_digest }}
      ELIGIBILITY_SUMMARY_PATH: ${{ inputs.eligibility_summary_path }}
      EXPECTED_ELIGIBILITY_SUMMARY_SHA256: ${{ inputs.expected_eligibility_summary_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Verify exact upstream artifacts
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          specs = [
              (
                  "coverage",
                  int(os.environ["COVERAGE_RUN_ID"]),
                  os.environ["COVERAGE_ARTIFACT_NAME"],
                  os.environ["EXPECTED_COVERAGE_ARTIFACT_DIGEST"],
              ),
              (
                  "eligibility",
                  int(os.environ["ELIGIBILITY_RUN_ID"]),
                  os.environ["ELIGIBILITY_ARTIFACT_NAME"],
                  os.environ["EXPECTED_ELIGIBILITY_ARTIFACT_DIGEST"],
              ),
          ]
          for label, run_id, name, expected in specs:
              raw = subprocess.check_output([
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/"
                      f"actions/runs/{run_id}/artifacts?name={name}"
                  ),
              ])
              payload = json.loads(raw)
              matches = [
                  row
                  for row in payload.get("artifacts", [])
                  if row.get("name") == name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one artifact; "
                      f"found {len(matches)}"
                  )
              artifact = matches[0]
              if artifact.get("expired"):
                  raise SystemExit(f"{label}: artifact is expired")
              actual = str(artifact.get("digest") or "").lower()
              expected = expected.lower()
              if not expected.startswith("sha256:"):
                  raise SystemExit(
                      f"{label}: expected digest must use sha256:<hex>"
                  )
              if actual != expected:
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected}"
                  )
          PY

      - name: Download exact upstream artifacts
        run: |
          mkdir -p inputs/coverage inputs/eligibility
          gh run download "${COVERAGE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${COVERAGE_ARTIFACT_NAME}" \
            --dir inputs/coverage
          gh run download "${ELIGIBILITY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ELIGIBILITY_ARTIFACT_NAME}" \
            --dir inputs/eligibility

      - id: normalize
        name: Normalize complete launchpad eligibility
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.data.phase2_eligibility import (
              build_launchpad_eligibility_handoff,
          )
          from hlp.data.phase2_sources import (
              build_phase2_source_inventory,
          )
          from hlp.data.snapshot import write_jsonl_snapshot

          def exact_path(root_name, env_name, sha_env, label):
              root = Path(root_name).resolve()
              relative = Path(os.environ[env_name])
              if relative.is_absolute():
                  raise SystemExit(f"{label} path must be relative")
              path = (root / relative).resolve()
              if root not in path.parents:
                  raise SystemExit(f"{label} path escapes artifact root")
              if not path.is_file():
                  raise SystemExit(
                      f"{label} file not found: {relative.as_posix()}"
                  )
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = os.environ[sha_env].lower().removeprefix(
                  "sha256:"
              )
              if actual != expected:
                  raise SystemExit(
                      f"{label} SHA drift: {actual} != {expected}"
                  )
              return path, actual

          coverage_path, coverage_sha = exact_path(
              "inputs/coverage",
              "COVERAGE_REPORT_PATH",
              "EXPECTED_COVERAGE_REPORT_SHA256",
              "coverage report",
          )
          eligibility_path, eligibility_sha = exact_path(
              "inputs/eligibility",
              "ELIGIBILITY_SUMMARY_PATH",
              "EXPECTED_ELIGIBILITY_SUMMARY_SHA256",
              "eligibility summary",
          )
          coverage = json.loads(coverage_path.read_text())
          raw_rows = [
              json.loads(line)
              for line in eligibility_path.read_text().splitlines()
              if line.strip()
          ]

          provenance_payload = {
              "version": "phase2-launchpad-eligibility-provenance-v1",
              "chain_id": 4663,
              "source_id": os.environ["SOURCE_ID"],
              "coverage_run_id": int(
                  os.environ["COVERAGE_RUN_ID"]
              ),
              "coverage_artifact_name": os.environ[
                  "COVERAGE_ARTIFACT_NAME"
              ],
              "coverage_artifact_digest": os.environ[
                  "EXPECTED_COVERAGE_ARTIFACT_DIGEST"
              ].lower(),
              "coverage_report_path": os.environ[
                  "COVERAGE_REPORT_PATH"
              ],
              "coverage_report_sha256": coverage_sha,
              "eligibility_run_id": int(
                  os.environ["ELIGIBILITY_RUN_ID"]
              ),
              "eligibility_artifact_name": os.environ[
                  "ELIGIBILITY_ARTIFACT_NAME"
              ],
              "eligibility_artifact_digest": os.environ[
                  "EXPECTED_ELIGIBILITY_ARTIFACT_DIGEST"
              ].lower(),
              "eligibility_summary_path": os.environ[
                  "ELIGIBILITY_SUMMARY_PATH"
              ],
              "eligibility_summary_sha256": eligibility_sha,
          }
          provenance_bytes = (
              json.dumps(
                  provenance_payload,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n"
          ).encode()
          provenance_sha = hashlib.sha256(
              provenance_bytes
          ).hexdigest()

          rows, summary = build_launchpad_eligibility_handoff(
              os.environ["SOURCE_ID"],
              raw_rows,
              coverage,
              source_inventory=build_phase2_source_inventory(),
              provenance_sha256=provenance_sha,
          )
          manifest = write_jsonl_snapshot(
              rows,
              output=Path(
                  "artifacts/phase2-source-eligibility.jsonl"
              ),
              provenance={
                  **provenance_payload,
                  "provenance_sha256": provenance_sha,
                  "canonical_price_series": True,
              },
          )
          summary = {
              **summary,
              "coverage_report_sha256": coverage_sha,
              "raw_eligibility_summary_sha256": eligibility_sha,
              "eligibility_provenance_sha256": provenance_sha,
              "normalized_eligibility_sha256": manifest["sha256"],
          }
          Path(
              "artifacts/phase2-source-eligibility-provenance.json"
          ).write_bytes(provenance_bytes)
          summary_text = (
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_path = Path(
              "artifacts/phase2-source-eligibility-summary.json"
          )
          summary_path.write_text(summary_text)
          summary_sha = hashlib.sha256(
              summary_text.encode("utf-8")
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"eligibility_sha256={manifest['sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload normalized launchpad eligibility
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-launchpad-eligibility-${{ inputs.source_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish universe-source handoff
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ELIGIBILITY_SHA256: ${{ steps.normalize.outputs.eligibility_sha256 }}
          SUMMARY_SHA256: ${{ steps.normalize.outputs.summary_sha256 }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${ELIGIBILITY_SHA256}"
          test -n "${SUMMARY_SHA256}"
          {
            echo "## ${SOURCE_ID} universe-source eligibility"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase2-launchpad-eligibility-${SOURCE_ID}"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- eligibility_sha256: ${ELIGIBILITY_SHA256}"
            echo "- summary_sha256: ${SUMMARY_SHA256}"
            echo "- canonical_price_series: true"
            echo "- phase2_universe_source_ready: true"
            echo "- phase2_universe_frozen: false"
          } >> "${GITHUB_STEP_SUMMARY}"
