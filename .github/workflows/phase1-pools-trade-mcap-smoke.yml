name: phase1-pools-trade-mcap-smoke

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-pools-trade-mcap-smoke.yml'
      - 'src/hlp/data/pools_trade_registry.py'
      - 'src/hlp/data/pools_trade_v4.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pools-trade-mcap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Build instant-launch registry
        run: |
          mkdir -p artifacts
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-pools-trade-registry-window \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --out artifacts/pools-trade-registry.jsonl
      - name: Acquire matching V4 lifecycle
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-pools-trade-v4-tape \
            --registry artifacts/pools-trade-registry.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --initialize-out artifacts/pools-trade-initializes.jsonl \
            --swap-out artifacts/pools-trade-swaps.jsonl
      - name: Price instant V4 launches
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-pools-trade-market-cap-window \
            --registry artifacts/pools-trade-registry.jsonl \
            --initializes artifacts/pools-trade-initializes.jsonl \
            --swaps artifacts/pools-trade-swaps.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --out artifacts/pools-trade-market-caps.jsonl \
            --summary-out artifacts/pools-trade-summary.jsonl
      - name: Validate cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read(name):
              return [
                  json.loads(x)
                  for x in Path("artifacts", name).read_text().splitlines()
                  if x.strip()
              ]

          registry = read("pools-trade-registry.jsonl")
          initializes = read("pools-trade-initializes.jsonl")
          swaps = read("pools-trade-swaps.jsonl")
          summary = read("pools-trade-summary.jsonl")
          winners = [row for row in summary if row["crossed_100k"]]

          assert len(registry) == 397, len(registry)
          assert len({row["pool_id"] for row in initializes}) == 397
          assert all(row["priced_points"] > 0 for row in summary)

          print(json.dumps({
              "instant_launches": len(registry),
              "initialized_pools": len({row["pool_id"] for row in initializes}),
              "pools_with_swaps": len({row["pool_id"] for row in swaps}),
              "matched_swaps": len(swaps),
              "tokens_with_price_points": len(summary),
              "tokens_crossed_100k": len(winners),
              "winner_examples": winners[:20],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pools-trade-mcap
          path: artifacts/
          if-no-files-found: error
