name: phase1-pons-viability-weth-usdg-anchor-one-shot
run-name: phase1 viability weth_usdg_anchor ${{ github.sha }}

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/workflows/phase1-pons-viability-weth-usdg-anchor-one-shot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-viability-weth-usdg-anchor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    if: ${{ contains(github.event.head_commit.message, 'launch viability weth_usdg_anchor') }}
    uses: ./.github/workflows/phase1-pons-viability-guarded-route.yml
    with:
      route: "weth_usdg_anchor"
      sequence_id: ${{ github.sha }}
    secrets: inherit
