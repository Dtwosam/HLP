name: phase4-simple-models

on:
  workflow_dispatch:
    inputs:
      chronological_split_bundle_json:
        description: JSON with run_id, artifact_digest, validation_artifact_digest, handoff_sha256 for the frozen Phase-4 split
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase4-simple-models-${{ github.ref }}
  cancel-in-progress: false

env:
  CHRONOLOGICAL_SPLIT_BUNDLE_JSON: ${{ inputs.chronological_split_bundle_json }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: models
        name: Fit transparent baselines and evaluate unseen validation
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import select_equivalent_artifact_retry
          from hlp.data.phase3_feature_registry import validate_phase3_feature_registry
          from hlp.data.phase4_chronological_split import build_phase4_chronological_split_handoff
          from hlp.data.phase4_simple_models import (
              build_phase4_simple_model_handoff,
              build_phase4_simple_model_report,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def digest(value, label):
              text = str(value or "").lower()
              if not text.startswith("sha256:") or len(text) != 71:
                  raise SystemExit(f"{label} artifact digest is invalid")
              try:
                  int(text.split(":", 1)[1], 16)
              except ValueError as exc:
                  raise SystemExit(
                      f"{label} artifact digest is not hexadecimal"
                  ) from exc
              return text

          def handoff_sha(value, label):
              text = str(value or "").lower().removeprefix("sha256:")
              if len(text) != 64:
                  raise SystemExit(f"{label} handoff SHA is invalid")
              try:
                  int(text, 16)
              except ValueError as exc:
                  raise SystemExit(
                      f"{label} handoff SHA is not hexadecimal"
                  ) from exc
              return text

          try:
              descriptor = json.loads(
                  os.environ["CHRONOLOGICAL_SPLIT_BUNDLE_JSON"]
              )
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit(
                  "Phase-4 split bundle descriptor is invalid JSON"
              ) from exc
          if not isinstance(descriptor, dict):
              raise SystemExit(
                  "Phase-4 split bundle descriptor must be an object"
              )
          try:
              run_id = int(descriptor["run_id"])
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(
                  "Phase-4 split bundle run_id is invalid"
              ) from exc
          discovery_digest = digest(
              descriptor.get("artifact_digest"),
              "Phase-4 discovery split",
          )
          validation_digest = digest(
              descriptor.get("validation_artifact_digest"),
              "Phase-4 validation slice",
          )
          expected_handoff_sha = handoff_sha(
              descriptor.get("handoff_sha256"),
              "Phase-4 chronological split",
          )

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      f"/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}",
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(name, destination, expected_digest, label):
              matches = [
                  row for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != expected_digest:
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path for path in Path(root).rglob(name) if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; "
                      f"found {len(matches)}"
                  )
              return matches[0]

          discovery_root = Path("inputs/discovery")
          validation_root = Path("inputs/validation")
          download_named(
              "phase4-chronological-split",
              discovery_root,
              discovery_digest,
              "Phase-4 discovery split",
          )
          download_named(
              "phase4-validation-slice",
              validation_root,
              validation_digest,
              "Phase-4 validation slice",
          )

          if list(discovery_root.rglob("phase4-validation.jsonl")):
              raise SystemExit(
                  "Phase-4 simple-model discovery artifact exposes validation rows"
              )
          if list(discovery_root.rglob("phase4-final-test.jsonl")):
              raise SystemExit(
                  "Phase-4 simple-model discovery artifact exposes final-test rows"
              )
          if list(validation_root.rglob("phase4-final-test.jsonl")):
              raise SystemExit(
                  "Phase-4 simple-model validation artifact exposes final-test rows"
              )

          discovery_path = find_unique(
              discovery_root,
              "phase4-discovery-train.jsonl",
          )
          discovery_manifest_path = find_unique(
              discovery_root,
              "phase4-discovery-train.jsonl.manifest.json",
          )
          discovery_manifest = json.loads(
              discovery_manifest_path.read_text()
          )
          validation_path = find_unique(
              validation_root,
              "phase4-validation.jsonl",
          )
          validation_manifest_path = find_unique(
              validation_root,
              "phase4-validation.jsonl.manifest.json",
          )
          validation_manifest = json.loads(
              validation_manifest_path.read_text()
          )

          summary_path = find_unique(
              discovery_root,
              "phase4-chronological-split-summary.json",
          )
          summary = json.loads(summary_path.read_text())
          summary_sha = sha256_path(summary_path)
          split_handoff_path = find_unique(
              discovery_root,
              "phase4-chronological-split-handoff.json",
          )
          split_handoff_sha = sha256_path(split_handoff_path)
          if split_handoff_sha != expected_handoff_sha:
              raise SystemExit(
                  "Phase-4 chronological-split handoff SHA drift"
              )
          split_handoff = json.loads(split_handoff_path.read_text())

          registry_path = find_unique(
              discovery_root,
              "phase4-feature-registry.json",
          )
          registry_file_sha = sha256_path(registry_path)
          registry = json.loads(registry_path.read_text())
          if not isinstance(registry, list):
              raise SystemExit(
                  "Phase-4 feature registry is not a JSON list"
              )
          registry_report = validate_phase3_feature_registry(registry)
          if registry_file_sha != split_handoff[
              "feature_registry_file_sha256"
          ]:
              raise SystemExit("Phase-4 registry-file SHA drift")
          if registry_report["registry_sha256"] != split_handoff[
              "feature_registry_sha256"
          ]:
              raise SystemExit("Phase-4 registry definition drift")

          rebuilt_split = build_phase4_chronological_split_handoff(
              summary,
              split_summary_sha256=summary_sha,
              discovery_entry_handoff_sha256=summary[
                  "discovery_entry_handoff_sha256"
              ],
              feature_registry_file_sha256=registry_file_sha,
          )
          if rebuilt_split != split_handoff:
              raise SystemExit(
                  "Phase-4 chronological-split handoff content drift"
              )
          if discovery_manifest.get("sha256") != split_handoff[
              "discovery_split_rows_sha256"
          ]:
              raise SystemExit(
                  "Phase-4 discovery-slice manifest SHA drift"
              )
          if validation_manifest.get("sha256") != split_handoff[
              "validation_split_rows_sha256"
          ]:
              raise SystemExit(
                  "Phase-4 validation-slice manifest SHA drift"
              )

          report = build_phase4_simple_model_report(
              iter_validated_jsonl(
                  discovery_path,
                  discovery_manifest_path,
              ),
              iter_validated_jsonl(
                  validation_path,
                  validation_manifest_path,
              ),
              registry,
              chronological_split_handoff=split_handoff,
              discovery_rows_sha256=discovery_manifest["sha256"],
              validation_rows_sha256=validation_manifest["sha256"],
          )
          report.update({
              "chronological_split_run_id": run_id,
              "chronological_split_handoff_sha256": split_handoff_sha,
              "feature_registry_file_sha256": registry_file_sha,
              "validation_artifact_digest": validation_digest,
          })
          report_path = Path(
              "artifacts/phase4-simple-model-report.json"
          )
          report_text = (
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          report_path.write_text(report_text)
          report_sha = hashlib.sha256(
              report_text.encode()
          ).hexdigest()

          output_handoff = build_phase4_simple_model_handoff(
              report,
              report_sha256=report_sha,
              chronological_split_handoff_sha256=split_handoff_sha,
              feature_registry_file_sha256=registry_file_sha,
          )
          output_handoff_path = Path(
              "artifacts/phase4-simple-model-handoff.json"
          )
          output_handoff_text = (
              json.dumps(
                  output_handoff,
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )
          output_handoff_path.write_text(output_handoff_text)
          output_handoff_sha = hashlib.sha256(
              output_handoff_text.encode()
          ).hexdigest()

          shutil.copyfile(
              registry_path,
              Path("artifacts/phase4-feature-registry.json"),
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"report_sha256={report_sha}\n")
              handle.write(
                  f"handoff_sha256={output_handoff_sha}\n"
              )
              handle.write(
                  f"discovery={report['discovery_rows']}\n"
              )
              handle.write(
                  f"validation={report['validation_rows']}\n"
              )
          print(json.dumps({
              "discovery_rows": report["discovery_rows"],
              "validation_rows": report["validation_rows"],
              "eligible_features": report["eligible_features"],
              "predictor_count": report["predictor_count"],
              "preprocessing_fit_on_discovery_only": True,
              "models_fit_on_discovery_only": True,
              "validation_rows_consumed": True,
              "final_test_rows_consumed": False,
              "transparent_simple_models_examined": True,
              "production_model_selected": False,
              "signal_threshold_selected": False,
              "signal_promoted": False,
              "phase4_discovery_checkpoint_claimed": False,
          }, sort_keys=True))
          PY

      - name: Upload Phase-4 simple-model diagnostics
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase4-simple-models
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish Phase-4 simple-model identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          REPORT_SHA256: ${{ steps.models.outputs.report_sha256 }}
          HANDOFF_SHA256: ${{ steps.models.outputs.handoff_sha256 }}
          DISCOVERY: ${{ steps.models.outputs.discovery }}
          VALIDATION: ${{ steps.models.outputs.validation }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          {
            echo "## Phase-4 transparent simple models"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase4-simple-models"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- report_sha256: ${REPORT_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- discovery_rows: ${DISCOVERY}"
            echo "- validation_rows: ${VALIDATION}"
            echo "- preprocessing_fit_on_discovery_only: true"
            echo "- models_fit_on_discovery_only: true"
            echo "- validation_rows_consumed: true"
            echo "- final_test_rows_consumed: false"
            echo "- transparent_simple_models_examined: true"
            echo "- production_model_selected: false"
            echo "- signal_threshold_selected: false"
            echo "- signal_promoted: false"
            echo "- phase4_discovery_checkpoint_claimed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
