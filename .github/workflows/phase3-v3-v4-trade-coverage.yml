name: phase3-v3-v4-trade-coverage

on:
  workflow_dispatch:
    inputs:
      feature_entry_run_id:
        description: Exact phase3-feature-entry run ID
        required: true
        type: string
      expected_feature_entry_artifact_digest:
        description: Exact phase3-feature-entry artifact digest (sha256:...)
        required: true
        type: string
      expected_feature_entry_handoff_sha256:
        description: Exact SHA-256 of phase3-feature-entry-handoff.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact phase2-universe-freeze artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      source_evidence_json:
        description: JSON with exact Phase-2 research and source-coverage run/digest/report identities
        required: true
        type: string
      source_id:
        description: Source-specific V3/V4 trade surface
        required: true
        type: choice
        options:
          - pools_fun
          - noxa
          - doppler
          - pools_trade_instant

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-v3-v4-trade-coverage-${{ inputs.source_id }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FEATURE_ENTRY_RUN_ID: ${{ inputs.feature_entry_run_id }}
  EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST: ${{ inputs.expected_feature_entry_artifact_digest }}
  EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256: ${{ inputs.expected_feature_entry_handoff_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  SOURCE_EVIDENCE_JSON: ${{ inputs.source_evidence_json }}
  SOURCE_ID: ${{ inputs.source_id }}
  SHARD_COUNT: '128'

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.setup.outputs.matrix }}
      swap_run_id: ${{ steps.setup.outputs.swap_run_id }}
      dex_version: ${{ steps.setup.outputs.dex_version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: setup
        name: Bind accepted Phase-2 source evidence to exact shared swap tape
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_feature_entry import (
              build_phase3_feature_entry_handoff,
          )
          from hlp.data.sharded_tape import (
              iter_validated_jsonl,
              validate_shard_block_coverage,
          )
          from hlp.data.snapshot import write_jsonl_snapshot

          repo = os.environ["GITHUB_REPOSITORY"]
          source_id = os.environ["SOURCE_ID"]
          specs = {
              "pools_fun": {
                  "dex_version": "v3",
                  "coverage_artifact": "phase2-pools-fun-source-coverage",
                  "coverage_report": "pools-fun-source-coverage-report.json",
                  "source_provenance": "pools-fun-source-provenance.json",
                  "swap_run_field": "v3_swap_run_id",
              },
              "noxa": {
                  "dex_version": "v3",
                  "coverage_artifact": "phase2-noxa-source-coverage",
                  "coverage_report": "noxa-source-coverage-report.json",
                  "source_provenance": "noxa-source-provenance.json",
                  "swap_run_field": "v3_swap_run_id",
              },
              "doppler": {
                  "dex_version": "v4",
                  "coverage_artifact": "phase2-doppler-source-coverage",
                  "coverage_report": "doppler-source-coverage-report.json",
                  "source_provenance": "doppler-source-provenance.json",
                  "swap_run_field": "v4_swap_run_id",
              },
              "pools_trade_instant": {
                  "dex_version": "v4",
                  "coverage_artifact": (
                      "phase2-pools-trade-instant-source-coverage"
                  ),
                  "coverage_report": (
                      "pools-trade-instant-source-coverage-report.json"
                  ),
                  "source_provenance": (
                      "pools-trade-instant-source-provenance.json"
                  ),
                  "swap_run_field": "v4_swap_run_id",
              },
          }
          spec = specs.get(source_id)
          if spec is None:
              raise SystemExit(
                  f"unsupported Phase-3 V3/V4 source: {source_id}"
              )
          dex_version = spec["dex_version"]

          try:
              evidence = json.loads(os.environ["SOURCE_EVIDENCE_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  "source_evidence_json is invalid JSON"
              ) from exc
          if not isinstance(evidence, dict):
              raise SystemExit(
                  "source_evidence_json must be an object"
              )
          required = (
              "research_run_id",
              "research_artifact_digest",
              "research_report_sha256",
              "coverage_run_id",
              "coverage_artifact_digest",
              "coverage_report_sha256",
          )
          missing = [
              field for field in required
              if evidence.get(field) in {None, ""}
          ]
          if missing:
              raise SystemExit(
                  f"source_evidence_json lacks fields: {missing}"
              )

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest=None):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if expected_digest is not None and actual != str(
                  expected_digest
              ).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(destination),
              ])
              return selected

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; "
                      f"found {len(matches)}"
                  )
              return matches[0]

          entry_root = Path("inputs/entry")
          universe_root = Path("inputs/universe")
          research_root = Path("inputs/research")
          coverage_root = Path("inputs/coverage")
          raw_manifest_root = Path("inputs/raw-manifest")

          download_named(
              int(os.environ["FEATURE_ENTRY_RUN_ID"]),
              "phase3-feature-entry",
              entry_root,
              "Phase-3 feature entry",
              os.environ["EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "Phase-2 frozen universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )
          download_named(
              int(evidence["research_run_id"]),
              f"phase2-research-materialized-{source_id}",
              research_root,
              f"{source_id} accepted research component",
              evidence["research_artifact_digest"],
          )
          download_named(
              int(evidence["coverage_run_id"]),
              spec["coverage_artifact"],
              coverage_root,
              f"{source_id} Phase-2 source coverage",
              evidence["coverage_artifact_digest"],
          )

          entry_summary_path = find_unique(
              entry_root,
              "phase3-feature-entry-summary.json",
          )
          entry_summary = json.loads(entry_summary_path.read_text())
          entry_handoff_path = find_unique(
              entry_root,
              "phase3-feature-entry-handoff.json",
          )
          entry_handoff_sha = sha256_path(entry_handoff_path)
          if entry_handoff_sha != os.environ[
              "EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-3 feature-entry handoff SHA drift")
          entry_handoff = json.loads(entry_handoff_path.read_text())
          if build_phase3_feature_entry_handoff(
              entry_summary,
              entry_summary_sha256=sha256_path(entry_summary_path),
              phase2_dataset_handoff_sha256=entry_summary[
                  "phase2_dataset_handoff_sha256"
              ],
              detector_freeze_handoff_sha256=entry_summary[
                  "detector_freeze_handoff_sha256"
              ],
          ) != entry_handoff:
              raise SystemExit(
                  "Phase-3 feature-entry handoff content drift"
              )

          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_manifest_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl.manifest.json",
          )
          universe_manifest = json.loads(
              universe_manifest_path.read_text()
          )
          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          universe_handoff_sha = sha256_path(universe_handoff_path)
          if universe_handoff_sha != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 universe handoff SHA drift")
          universe_handoff = json.loads(
              universe_handoff_path.read_text()
          )
          if universe_handoff.get("phase2_universe_frozen") is not True:
              raise SystemExit("Phase-2 universe is not frozen")
          if universe_handoff.get(
              "phase2_universe_coverage_complete"
          ) is not True:
              raise SystemExit("Phase-2 universe coverage incomplete")
          if universe_manifest.get("sha256") != universe_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit("Phase-2 universe manifest SHA drift")
          if entry_handoff["eligible_universe_sha256"] != (
              universe_manifest["sha256"]
          ):
              raise SystemExit(
                  "Phase-3 entry/universe SHA linkage drift"
              )
          snapshot = int(entry_handoff["snapshot_head_block"])
          if snapshot != int(universe_handoff["snapshot_head_block"]):
              raise SystemExit(
                  "Phase-3 entry/universe snapshot drift"
              )

          research_report_path = find_unique(
              research_root,
              "phase2-research-component-report.json",
          )
          if sha256_path(research_report_path) != str(
              evidence["research_report_sha256"]
          ).lower().removeprefix("sha256:"):
              raise SystemExit(
                  f"{source_id} research report SHA drift"
              )
          research_report = json.loads(
              research_report_path.read_text()
          )
          if research_report.get("version") != (
              "phase2-research-materialization-v1"
          ):
              raise SystemExit(
                  f"{source_id} research report version drift"
              )
          if research_report.get("component_id") != source_id:
              raise SystemExit(
                  f"{source_id} research component drift"
              )
          if research_report.get("source_ids") != [source_id]:
              raise SystemExit(
                  f"{source_id} research source membership drift"
              )
          if research_report.get("eligible_universe_sha256") != (
              universe_manifest["sha256"]
          ):
              raise SystemExit(
                  f"{source_id} research/universe SHA drift"
              )
          for flag in (
              "full_input_validated",
              "research_price_path_materialized",
              "eligible_token_coverage_complete",
              "research_component_ready",
          ):
              if research_report.get(flag) is not True:
                  raise SystemExit(
                      f"{source_id} research report lacks {flag}"
                  )
          if research_report.get("outcome_labels_computed") is not False:
              raise SystemExit(
                  f"{source_id} research report consumed outcomes"
              )

          research_path = find_unique(
              research_root,
              f"phase2-research-{source_id}.jsonl",
          )
          research_manifest_path = find_unique(
              research_root,
              f"phase2-research-{source_id}.jsonl.manifest.json",
          )
          research_manifest = json.loads(
              research_manifest_path.read_text()
          )
          if research_manifest.get("sha256") != research_report[
              "materialized_sha256"
          ]:
              raise SystemExit(
                  f"{source_id} research manifest SHA drift"
              )
          if int(research_manifest.get("records", -1)) != int(
              research_report["materialized_records"]
          ):
              raise SystemExit(
                  f"{source_id} research record count drift"
              )

          coverage_report_path = find_unique(
              coverage_root,
              spec["coverage_report"],
          )
          if sha256_path(coverage_report_path) != str(
              evidence["coverage_report_sha256"]
          ).lower().removeprefix("sha256:"):
              raise SystemExit(
                  f"{source_id} Phase-2 coverage report SHA drift"
              )
          coverage_report = json.loads(
              coverage_report_path.read_text()
          )
          if coverage_report.get("source_id") != source_id:
              raise SystemExit(
                  f"{source_id} Phase-2 coverage source drift"
              )
          if coverage_report.get("coverage_status") != "complete":
              raise SystemExit(
                  f"{source_id} Phase-2 coverage is incomplete"
              )
          if coverage_report.get("continuous") is not True:
              raise SystemExit(
                  f"{source_id} Phase-2 coverage is not continuous"
              )
          if coverage_report.get("missing_ranges") != []:
              raise SystemExit(
                  f"{source_id} Phase-2 coverage has missing ranges"
              )
          if int(coverage_report["last_block"]) != snapshot:
              raise SystemExit(
                  f"{source_id} Phase-2 coverage snapshot drift"
              )

          provenance_path = find_unique(
              coverage_root,
              spec["source_provenance"],
          )
          provenance_sha = sha256_path(provenance_path)
          if provenance_sha != coverage_report["provenance_sha256"]:
              raise SystemExit(
                  f"{source_id} Phase-2 provenance SHA drift"
              )
          source_provenance = json.loads(
              provenance_path.read_text()
          )
          swap_run_id = int(
              source_provenance[spec["swap_run_field"]]
          )
          if swap_run_id <= 0:
              raise SystemExit(
                  f"{source_id} shared swap run id is invalid"
              )

          eligible_tokens = sorted({
              str(row["token"]).lower()
              for row in iter_validated_jsonl(
                  universe_path,
                  universe_manifest_path,
              )
              if source_id in set(row.get("source_ids") or [])
          })
          if not eligible_tokens:
              raise SystemExit(
                  f"{source_id} frozen source membership is empty"
              )
          if len(eligible_tokens) != int(
              research_report["expected_eligible_tokens"]
          ):
              raise SystemExit(
                  f"{source_id} eligible-token count drift"
              )

          key_field = "pool" if dex_version == "v3" else "pool_id"
          markets = {}
          observed_tokens = set()
          for row in iter_validated_jsonl(
              research_path,
              research_manifest_path,
          ):
              token = str(row["token"]).lower()
              if token not in set(eligible_tokens):
                  raise SystemExit(
                      f"{source_id} research row outside frozen membership"
                  )
              key = str(row.get(key_field) or "").lower()
              quote = str(row.get("quote_token") or "").lower()
              if not key or not quote:
                  raise SystemExit(
                      f"{source_id} research row lacks market identity"
                  )
              candidate = {
                  "source_id": source_id,
                  "token": token,
                  "quote_token": quote,
                  key_field: key,
              }
              prior = markets.get(key)
              if prior is not None and prior != candidate:
                  raise SystemExit(
                      f"{source_id} market identity drift: {key}"
                  )
              markets[key] = candidate
              observed_tokens.add(token)
          if observed_tokens != set(eligible_tokens):
              raise SystemExit(
                  f"{source_id} market registry token coverage drift"
              )
          tokens_by_market = [row["token"] for row in markets.values()]
          if len(set(tokens_by_market)) != len(eligible_tokens):
              raise SystemExit(
                  f"{source_id} expected one market per eligible token"
              )

          market_manifest = write_jsonl_snapshot(
              sorted(
                  markets.values(),
                  key=lambda row: (
                      row["token"],
                      row[key_field],
                  ),
              ),
              output=Path(
                  f"artifacts/phase3-{source_id}-market-registry.jsonl"
              ),
              provenance={
                  "version": "phase3-v3-v4-trade-coverage-setup-v1",
                  "source_id": source_id,
                  "eligible_universe_sha256": universe_manifest["sha256"],
                  "phase2_registry_sha256": coverage_report[
                      "registry_sha256"
                  ],
                  "research_rows_sha256": research_manifest["sha256"],
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )

          manifest_name = (
              f"phase2-direct-{dex_version}-swap-manifest"
          )
          raw_manifest_artifact = download_named(
              swap_run_id,
              manifest_name,
              raw_manifest_root,
              f"shared {dex_version.upper()} swap manifest",
          )
          aggregate_name = (
              f"direct-{dex_version}-swap-sharded.manifest.json"
          )
          aggregate_path = find_unique(
              raw_manifest_root,
              aggregate_name,
          )
          aggregate = json.loads(aggregate_path.read_text())
          raw_summary_path = find_unique(
              raw_manifest_root,
              f"direct-{dex_version}-swap-summary.json",
          )
          raw_summary = json.loads(raw_summary_path.read_text())
          if raw_summary.get("continuous_event_scan") is not True:
              raise SystemExit(
                  f"shared {dex_version.upper()} swap scan incomplete"
              )
          if raw_summary.get("missing_ranges") != []:
              raise SystemExit(
                  f"shared {dex_version.upper()} swap scan has gaps"
              )
          if int(raw_summary["snapshot_head_block"]) != snapshot:
              raise SystemExit(
                  f"shared {dex_version.upper()} swap snapshot drift"
              )
          if aggregate.get("sha256") != raw_summary["swap_sha256"]:
              raise SystemExit(
                  f"shared {dex_version.upper()} swap aggregate SHA drift"
              )
          raw_provenance = aggregate.get("provenance") or {}
          shards = validate_shard_block_coverage(
              list(raw_provenance.get("shards") or []),
              start_block=int(raw_provenance["from_block"]),
              end_block=int(raw_provenance["to_block"]),
          )
          if len(shards) != int(os.environ["SHARD_COUNT"]):
              raise SystemExit(
                  f"shared {dex_version.upper()} shard count drift"
              )

          raw_artifacts = {
              str(row.get("name") or ""): row
              for row in list_artifacts(swap_run_id)
              if not row.get("expired")
          }
          artifact_prefix = f"phase2-direct-{dex_version}-swap-"
          artifact_evidence = {}
          for index in range(int(os.environ["SHARD_COUNT"])):
              name = artifact_prefix + str(index)
              artifact = raw_artifacts.get(name)
              if artifact is None:
                  raise SystemExit(
                      f"missing shared swap artifact: {name}"
                  )
              digest = str(artifact.get("digest") or "").lower()
              if not digest.startswith("sha256:") or len(digest) != 71:
                  raise SystemExit(
                      f"shared swap artifact digest invalid: {name}"
                  )
              artifact_evidence[str(index)] = {
                  "artifact_name": name,
                  "artifact_digest": digest,
              }

          setup = {
              "version": "phase3-v3-v4-trade-coverage-setup-v1",
              "source_id": source_id,
              "dex_version": dex_version,
              "snapshot_head_block": snapshot,
              "eligible_universe_sha256": universe_manifest["sha256"],
              "eligible_tokens": len(eligible_tokens),
              "market_registry_sha256": market_manifest["sha256"],
              "phase2_registry_sha256": coverage_report[
                  "registry_sha256"
              ],
              "phase2_coverage_provenance_sha256": provenance_sha,
              "phase2_research_rows_sha256": research_manifest["sha256"],
              "phase2_research_report_sha256": sha256_path(
                  research_report_path
              ),
              "swap_run_id": swap_run_id,
              "swap_manifest_artifact_digest": str(
                  raw_manifest_artifact.get("digest") or ""
              ).lower(),
              "shared_swap_sha256": aggregate["sha256"],
              "shared_swap_from_block": int(
                  raw_provenance["from_block"]
              ),
              "shared_swap_to_block": int(
                  raw_provenance["to_block"]
              ),
              "shards": shards,
              "raw_artifacts": artifact_evidence,
              "wallet_identity_kind": "transaction_from",
              "historical_event_scan_complete": True,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
          }
          Path(
              "artifacts/phase3-v3-v4-trade-coverage-setup.json"
          ).write_text(
              json.dumps(setup, indent=2, sort_keys=True) + "\n"
          )
          Path(
              "artifacts/phase2-source-coverage-report.json"
          ).write_bytes(coverage_report_path.read_bytes())
          Path(
              "artifacts/phase2-source-provenance.json"
          ).write_bytes(provenance_path.read_bytes())
          Path(
              "artifacts/phase2-research-component-report.json"
          ).write_bytes(research_report_path.read_bytes())
          Path(
              "artifacts/shared-swap-sharded.manifest.json"
          ).write_bytes(aggregate_path.read_bytes())
          Path(
              "artifacts/shared-swap-summary.json"
          ).write_bytes(raw_summary_path.read_bytes())

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "matrix="
                  + json.dumps(
                      list(range(int(os.environ["SHARD_COUNT"])))
                  )
                  + "\n"
              )
              handle.write(f"swap_run_id={swap_run_id}\n")
              handle.write(f"dex_version={dex_version}\n")
          print(json.dumps({
              "source_id": source_id,
              "dex_version": dex_version,
              "eligible_tokens": len(eligible_tokens),
              "markets": market_manifest["records"],
              "swap_run_id": swap_run_id,
              "shared_swap_sha256": aggregate["sha256"],
              "historical_event_scan_complete": True,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.source_id }}-trade-coverage-setup
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  shard:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHARD_INDEX: ${{ matrix.shard }}
      SWAP_RUN_ID: ${{ needs.setup.outputs.swap_run_id }}
      DEX_VERSION: ${{ needs.setup.outputs.dex_version }}
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase3-${{ inputs.source_id }}-trade-coverage-setup
          path: inputs/setup
      - name: Download exact shared swap shard
        run: |
          set -euo pipefail
          mkdir -p inputs/raw
          ARTIFACT="phase2-direct-${DEX_VERSION}-swap-${SHARD_INDEX}"
          gh run download "${SWAP_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT}" \
            --dir inputs/raw
      - name: Filter source swaps, fetch tx identities and adapt
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.config import (
              SOLIDRPC_AUTH_RPC_URL,
              SOLIDRPC_PUBLIC_RPC_URL,
          )
          from hlp.data.phase3_trade_adapters import (
              adapt_v3_swaps_to_phase3,
              adapt_v4_swaps_to_phase3,
          )
          from hlp.data.rpc import RpcClient
          from hlp.data.sharded_tape import iter_validated_jsonl
          from hlp.data.snapshot import write_jsonl_snapshot
          from hlp.data.transaction_identity import (
              fetch_transaction_identity_rows,
          )

          source_id = os.environ["SOURCE_ID"]
          index = int(os.environ["SHARD_INDEX"])
          dex_version = os.environ["DEX_VERSION"]
          setup_root = Path("inputs/setup")
          setup = json.loads(
              (
                  setup_root
                  / "phase3-v3-v4-trade-coverage-setup.json"
              ).read_text()
          )
          if setup["source_id"] != source_id:
              raise SystemExit("trade setup source drift")
          if setup["dex_version"] != dex_version:
              raise SystemExit("trade setup DEX version drift")
          if int(setup["swap_run_id"]) != int(
              os.environ["SWAP_RUN_ID"]
          ):
              raise SystemExit("trade setup swap run drift")

          evidence = setup["raw_artifacts"][str(index)]
          expected_artifact = (
              f"phase2-direct-{dex_version}-swap-{index}"
          )
          if evidence["artifact_name"] != expected_artifact:
              raise SystemExit("shared swap artifact identity drift")

          suffix = f"{index:03d}"
          raw_path = Path(
              f"inputs/raw/direct-{dex_version}-swap-{suffix}.jsonl"
          )
          raw_manifest_path = raw_path.with_suffix(
              raw_path.suffix + ".manifest.json"
          )
          if not raw_path.is_file() or not raw_manifest_path.is_file():
              raise SystemExit(
                  f"shared swap shard files missing: {suffix}"
              )
          raw_manifest = json.loads(raw_manifest_path.read_text())
          raw_sha = hashlib.sha256(raw_path.read_bytes()).hexdigest()
          if raw_sha != raw_manifest["sha256"]:
              raise SystemExit(
                  f"shared swap shard SHA drift: {suffix}"
              )

          shard_spec = setup["shards"][index]
          provenance = raw_manifest.get("provenance") or {}
          if int(provenance["from_block"]) != int(
              shard_spec["from_block"]
          ) or int(provenance["to_block"]) != int(
              shard_spec["to_block"]
          ):
              raise SystemExit(
                  f"shared swap shard range drift: {suffix}"
              )
          if raw_sha != shard_spec["sha256"]:
              raise SystemExit(
                  f"shared swap aggregate shard SHA drift: {suffix}"
              )

          market_path = (
              setup_root
              / f"phase3-{source_id}-market-registry.jsonl"
          )
          market_manifest_path = market_path.with_suffix(
              market_path.suffix + ".manifest.json"
          )
          market_rows = list(
              iter_validated_jsonl(
                  market_path,
                  market_manifest_path,
              )
          )
          key_field = "pool" if dex_version == "v3" else "pool_id"
          markets = {
              str(row[key_field]).lower()
              for row in market_rows
          }
          filtered = [
              row
              for row in iter_validated_jsonl(
                  raw_path,
                  raw_manifest_path,
              )
              if str(row.get(key_field) or "").lower() in markets
          ]

          filtered_path = Path(
              f"artifacts/phase3-{source_id}-raw-{suffix}.jsonl"
          )
          filtered_manifest = write_jsonl_snapshot(
              filtered,
              output=filtered_path,
              provenance={
                  "version": "phase3-v3-v4-trade-shard-v1",
                  "source_id": source_id,
                  "dex_version": dex_version,
                  "from_block": int(shard_spec["from_block"]),
                  "to_block": int(shard_spec["to_block"]),
                  "shared_swap_shard_sha256": raw_sha,
                  "market_registry_sha256": setup[
                      "market_registry_sha256"
                  ],
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )

          key = os.environ.get("ROBINHOOD_ARCHIVE_RPC_API_KEY")
          if key:
              rpc = RpcClient(
                  SOLIDRPC_AUTH_RPC_URL,
                  timeout=30,
                  attempts=5,
                  min_interval_seconds=0.1,
                  extra_headers={"X-API-Key": key},
                  route_label="solidrpc_authenticated_free",
              )
          else:
              rpc = RpcClient(
                  SOLIDRPC_PUBLIC_RPC_URL,
                  timeout=30,
                  attempts=5,
                  min_interval_seconds=0.1,
                  route_label="solidrpc_keyless_public",
              )
          rpc.assert_robinhood()
          identities = fetch_transaction_identity_rows(
              rpc,
              [
                  str(row["transaction_hash"]).lower()
                  for row in filtered
              ],
              batch_size=100,
              min_batch_size=1,
          )
          identity_path = Path(
              f"artifacts/phase3-{source_id}-identity-{suffix}.jsonl"
          )
          identity_manifest = write_jsonl_snapshot(
              identities,
              output=identity_path,
              provenance={
                  "version": "phase3-v3-v4-trade-shard-v1",
                  "source_id": source_id,
                  "wallet_identity_kind": "transaction_from",
                  "from_block": int(shard_spec["from_block"]),
                  "to_block": int(shard_spec["to_block"]),
                  "raw_trade_rows_sha256": filtered_manifest["sha256"],
                  "rpc_route": rpc.route_label,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )

          if dex_version == "v3":
              canonical = adapt_v3_swaps_to_phase3(
                  filtered,
                  market_rows,
                  identities,
                  source_id=source_id,
              )
          else:
              canonical = adapt_v4_swaps_to_phase3(
                  filtered,
                  market_rows,
                  identities,
                  source_id=source_id,
              )
          canonical_path = Path(
              f"artifacts/phase3-{source_id}-canonical-{suffix}.jsonl"
          )
          canonical_manifest = write_jsonl_snapshot(
              canonical,
              output=canonical_path,
              provenance={
                  "version": "phase3-v3-v4-trade-shard-v1",
                  "source_id": source_id,
                  "dex_version": dex_version,
                  "from_block": int(shard_spec["from_block"]),
                  "to_block": int(shard_spec["to_block"]),
                  "raw_trade_rows_sha256": filtered_manifest["sha256"],
                  "wallet_identity_sha256": identity_manifest["sha256"],
                  "wallet_identity_kind": "transaction_from",
                  "canonical_trade_adapter_complete": True,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )
          if int(canonical_manifest["records"]) != int(
              filtered_manifest["records"]
          ):
              raise SystemExit(
                  f"{source_id} shard adapter row count drift: {suffix}"
              )

          report = {
              "version": "phase3-v3-v4-trade-shard-v1",
              "source_id": source_id,
              "dex_version": dex_version,
              "shard_index": index,
              "from_block": int(shard_spec["from_block"]),
              "to_block": int(shard_spec["to_block"]),
              "shared_swap_shard_sha256": raw_sha,
              "raw_trade_rows": int(filtered_manifest["records"]),
              "raw_trade_rows_sha256": filtered_manifest["sha256"],
              "wallet_identity_rows": int(
                  identity_manifest["records"]
              ),
              "wallet_identity_sha256": identity_manifest["sha256"],
              "canonical_trade_rows": int(
                  canonical_manifest["records"]
              ),
              "canonical_trade_rows_sha256": (
                  canonical_manifest["sha256"]
              ),
              "wallet_identity_kind": "transaction_from",
              "rpc_route": rpc.route_label,
              "rpc_requests": rpc.requests_made,
              "historical_event_scan_complete": True,
              "wallet_identity_complete": True,
              "canonical_trade_adapter_complete": True,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
          }
          Path(
              f"artifacts/phase3-{source_id}-report-{suffix}.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.source_id }}-trade-shard-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: [setup, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase3-${{ inputs.source_id }}-trade-coverage-setup
          path: inputs/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: phase3-${{ inputs.source_id }}-trade-shard-*
          path: inputs/shards
          merge-multiple: true
      - id: merge
        name: Merge complete V3/V4 source trade coverage
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.data.phase3_trade_tape import (
              build_phase3_trade_source_coverage,
          )
          from hlp.data.sharded_tape import (
              iter_validated_jsonl,
              validate_shard_block_coverage,
          )
          from hlp.data.snapshot import write_jsonl_snapshot

          source_id = os.environ["SOURCE_ID"]
          setup_root = Path("inputs/setup")
          shard_root = Path("inputs/shards")
          setup = json.loads(
              (
                  setup_root
                  / "phase3-v3-v4-trade-coverage-setup.json"
              ).read_text()
          )
          if setup["source_id"] != source_id:
              raise SystemExit("merged trade setup source drift")
          dex_version = setup["dex_version"]
          count = int(os.environ["SHARD_COUNT"])

          raw_digest = hashlib.sha256()
          identity_digest = hashlib.sha256()
          raw_rows = 0
          identity_rows = 0
          canonical_rows = 0
          coverage_ranges = []

          canonical_paths = []
          for index in range(count):
              suffix = f"{index:03d}"
              report_path = shard_root / (
                  f"phase3-{source_id}-report-{suffix}.json"
              )
              raw_path = shard_root / (
                  f"phase3-{source_id}-raw-{suffix}.jsonl"
              )
              identity_path = shard_root / (
                  f"phase3-{source_id}-identity-{suffix}.jsonl"
              )
              canonical_path = shard_root / (
                  f"phase3-{source_id}-canonical-{suffix}.jsonl"
              )
              for path in (
                  report_path,
                  raw_path,
                  identity_path,
                  canonical_path,
              ):
                  if not path.is_file():
                      raise SystemExit(
                          f"missing {source_id} shard file: {path.name}"
                      )
              report = json.loads(report_path.read_text())
              if report.get("source_id") != source_id:
                  raise SystemExit(
                      f"{source_id} shard source drift: {suffix}"
                  )
              if int(report["shard_index"]) != index:
                  raise SystemExit(
                      f"{source_id} shard index drift: {suffix}"
                  )
              if report.get("wallet_identity_kind") != (
                  "transaction_from"
              ):
                  raise SystemExit(
                      f"{source_id} shard identity kind drift: {suffix}"
                  )
              for flag in (
                  "historical_event_scan_complete",
                  "wallet_identity_complete",
                  "canonical_trade_adapter_complete",
              ):
                  if report.get(flag) is not True:
                      raise SystemExit(
                          f"{source_id} shard lacks {flag}: {suffix}"
                      )
              if report.get("outcome_rows_consumed") is not False:
                  raise SystemExit(
                      f"{source_id} shard consumed outcomes: {suffix}"
                  )
              if report.get("future_state_allowed") is not False:
                  raise SystemExit(
                      f"{source_id} shard allows future state: {suffix}"
                  )

              raw_manifest = json.loads(
                  raw_path.with_suffix(
                      raw_path.suffix + ".manifest.json"
                  ).read_text()
              )
              identity_manifest = json.loads(
                  identity_path.with_suffix(
                      identity_path.suffix + ".manifest.json"
                  ).read_text()
              )
              canonical_manifest = json.loads(
                  canonical_path.with_suffix(
                      canonical_path.suffix + ".manifest.json"
                  ).read_text()
              )
              raw_blob = raw_path.read_bytes()
              identity_blob = identity_path.read_bytes()
              if hashlib.sha256(raw_blob).hexdigest() != (
                  raw_manifest["sha256"]
              ):
                  raise SystemExit(
                      f"{source_id} raw shard SHA drift: {suffix}"
                  )
              if hashlib.sha256(identity_blob).hexdigest() != (
                  identity_manifest["sha256"]
              ):
                  raise SystemExit(
                      f"{source_id} identity shard SHA drift: {suffix}"
                  )
              if canonical_manifest["sha256"] != report[
                  "canonical_trade_rows_sha256"
              ]:
                  raise SystemExit(
                      f"{source_id} canonical shard SHA drift: {suffix}"
                  )
              raw_digest.update(raw_blob)
              identity_digest.update(identity_blob)
              raw_rows += int(raw_manifest["records"])
              identity_rows += int(identity_manifest["records"])
              canonical_rows += int(canonical_manifest["records"])
              coverage_ranges.append({
                  "from_block": int(report["from_block"]),
                  "to_block": int(report["to_block"]),
                  "file": canonical_path.name,
                  "records": int(canonical_manifest["records"]),
                  "sha256": canonical_manifest["sha256"],
              })
              canonical_paths.append(canonical_path)

          validate_shard_block_coverage(
              coverage_ranges,
              start_block=int(setup["shared_swap_from_block"]),
              end_block=int(setup["shared_swap_to_block"]),
          )
          if raw_rows != canonical_rows:
              raise SystemExit(
                  f"{source_id} raw/canonical row count drift"
              )

          def canonical_stream():
              for path in canonical_paths:
                  manifest_path = path.with_suffix(
                      path.suffix + ".manifest.json"
                  )
                  yield from iter_validated_jsonl(
                      path,
                      manifest_path,
                  )

          canonical_output = Path(
              f"artifacts/phase3-{source_id}-canonical-trades.jsonl"
          )
          canonical_manifest = write_jsonl_snapshot(
              canonical_stream(),
              output=canonical_output,
              provenance={
                  "version": "phase3-v3-v4-trade-coverage-v1",
                  "source_id": source_id,
                  "dex_version": dex_version,
                  "eligible_universe_sha256": setup[
                      "eligible_universe_sha256"
                  ],
                  "phase2_registry_sha256": setup[
                      "phase2_registry_sha256"
                  ],
                  "shared_swap_sha256": setup[
                      "shared_swap_sha256"
                  ],
                  "raw_trade_tape_sha256": raw_digest.hexdigest(),
                  "wallet_identity_sha256": (
                      identity_digest.hexdigest()
                  ),
                  "wallet_identity_kind": "transaction_from",
                  "historical_event_scan_complete": True,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )
          if int(canonical_manifest["records"]) != canonical_rows:
              raise SystemExit(
                  f"{source_id} merged canonical row count drift"
              )

          market_path = (
              setup_root
              / f"phase3-{source_id}-market-registry.jsonl"
          )
          market_manifest_path = market_path.with_suffix(
              market_path.suffix + ".manifest.json"
          )
          market_rows = list(
              iter_validated_jsonl(
                  market_path,
                  market_manifest_path,
              )
          )
          eligible_tokens = sorted({
              str(row["token"]).lower()
              for row in market_rows
          })
          coverage = build_phase3_trade_source_coverage(
              source_id,
              iter_validated_jsonl(
                  canonical_output,
                  canonical_output.with_suffix(
                      canonical_output.suffix + ".manifest.json"
                  ),
              ),
              eligible_tokens=eligible_tokens,
              snapshot_head_block=int(
                  setup["snapshot_head_block"]
              ),
              market_registry_sha256=setup[
                  "phase2_registry_sha256"
              ],
              raw_trade_tape_sha256=raw_digest.hexdigest(),
              raw_trade_rows=raw_rows,
              wallet_identity_sha256=identity_digest.hexdigest(),
              wallet_identity_kind="transaction_from",
              historical_event_scan_complete=True,
              wallet_identity_complete=True,
              canonical_trade_adapter_complete=True,
          )
          if coverage["canonical_trade_rows_sha256"] != (
              canonical_manifest["sha256"]
          ):
              raise SystemExit(
                  f"{source_id} merged coverage canonical SHA drift"
              )

          coverage_output = Path(
              f"artifacts/phase3-{source_id}-trade-coverage.jsonl"
          )
          coverage_manifest = write_jsonl_snapshot(
              [coverage],
              output=coverage_output,
              provenance={
                  "version": "phase3-v3-v4-trade-coverage-v1",
                  "source_id": source_id,
                  "eligible_universe_sha256": setup[
                      "eligible_universe_sha256"
                  ],
                  "phase2_coverage_provenance_sha256": setup[
                      "phase2_coverage_provenance_sha256"
                  ],
                  "phase2_research_rows_sha256": setup[
                      "phase2_research_rows_sha256"
                  ],
                  "shared_swap_sha256": setup[
                      "shared_swap_sha256"
                  ],
                  "trade_coverage_complete": True,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )

          for name in (
              f"phase3-{source_id}-market-registry.jsonl",
              f"phase3-{source_id}-market-registry.jsonl.manifest.json",
              "phase2-source-coverage-report.json",
              "phase2-source-provenance.json",
              "phase2-research-component-report.json",
              "shared-swap-sharded.manifest.json",
              "shared-swap-summary.json",
          ):
              src = setup_root / name
              if src.is_file():
                  (Path("artifacts") / name).write_bytes(
                      src.read_bytes()
                  )

          summary = {
              "version": "phase3-v3-v4-trade-coverage-v1",
              "source_id": source_id,
              "dex_version": dex_version,
              "snapshot_head_block": int(
                  setup["snapshot_head_block"]
              ),
              "eligible_universe_sha256": setup[
                  "eligible_universe_sha256"
              ],
              "eligible_tokens": len(eligible_tokens),
              "market_registry_sha256": setup[
                  "phase2_registry_sha256"
              ],
              "phase3_market_map_sha256": setup[
                  "market_registry_sha256"
              ],
              "shared_swap_run_id": int(setup["swap_run_id"]),
              "shared_swap_sha256": setup["shared_swap_sha256"],
              "raw_trade_rows": raw_rows,
              "raw_trade_tape_sha256": raw_digest.hexdigest(),
              "wallet_identity_rows": identity_rows,
              "wallet_identity_sha256": identity_digest.hexdigest(),
              "wallet_identity_kind": "transaction_from",
              "canonical_trade_rows": int(
                  canonical_manifest["records"]
              ),
              "canonical_trade_rows_sha256": (
                  canonical_manifest["sha256"]
              ),
              "source_coverage_rows_sha256": (
                  coverage_manifest["sha256"]
              ),
              "historical_event_scan_complete": True,
              "wallet_identity_complete": True,
              "canonical_trade_adapter_complete": True,
              "trade_coverage_complete": True,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
              "phase3_v3_v4_trade_coverage_ready": True,
          }
          summary_path = Path(
              f"artifacts/phase3-{source_id}-trade-coverage-summary.json"
          )
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_sha = hashlib.sha256(
              summary_path.read_bytes()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"canonical_trade_rows_sha256="
                  f"{canonical_manifest['sha256']}\n"
              )
              handle.write(
                  f"coverage_rows_sha256={coverage_manifest['sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(
                  f"eligible_tokens={len(eligible_tokens)}\n"
              )
              handle.write(
                  f"canonical_trade_rows="
                  f"{canonical_manifest['records']}\n"
              )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload source Phase-3 trade coverage
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.source_id }}-trade-coverage
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish V3/V4 source trade identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CANONICAL_SHA: ${{ steps.merge.outputs.canonical_trade_rows_sha256 }}
          COVERAGE_SHA: ${{ steps.merge.outputs.coverage_rows_sha256 }}
          SUMMARY_SHA: ${{ steps.merge.outputs.summary_sha256 }}
          TOKENS: ${{ steps.merge.outputs.eligible_tokens }}
          ROWS: ${{ steps.merge.outputs.canonical_trade_rows }}
        run: |
          set -euo pipefail
          {
            echo "## Phase-3 ${SOURCE_ID} V3/V4 trade coverage"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase3-${SOURCE_ID}-trade-coverage"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- canonical_file: phase3-${SOURCE_ID}-canonical-trades.jsonl"
            echo "- coverage_file: phase3-${SOURCE_ID}-trade-coverage.jsonl"
            echo "- canonical_trade_rows_sha256: ${CANONICAL_SHA}"
            echo "- source_coverage_rows_sha256: ${COVERAGE_SHA}"
            echo "- summary_sha256: ${SUMMARY_SHA}"
            echo "- eligible_tokens: ${TOKENS}"
            echo "- canonical_trade_rows: ${ROWS}"
            echo "- wallet_identity_kind: transaction_from"
            echo "- historical_event_scan_complete: true"
            echo "- wallet_identity_complete: true"
            echo "- canonical_trade_adapter_complete: true"
            echo "- trade_coverage_complete: true"
            echo "- outcome_rows_consumed: false"
            echo "- future_state_allowed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
