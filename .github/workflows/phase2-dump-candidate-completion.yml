name: phase2-dump-candidate-completion

on:
  workflow_dispatch:
    inputs:
      launch_run_id:
        description: Exact successful phase2-dump-candidate-launch workflow_dispatch run ID
        required: true
        type: string
      expected_launch_artifact_digest:
        description: Exact candidate launch artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-dump-candidate-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      LAUNCH_RUN_ID: ${{ inputs.launch_run_id }}
      EXPECTED_LAUNCH_DIGEST: ${{ inputs.expected_launch_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: complete
        name: Verify candidate research and publish diagnostics inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess,time
          from pathlib import Path
          from hlp.data.phase2_dump_candidate_dispatch import (
              validate_phase2_dump_candidate_launch_receipt,
              validate_phase2_dump_candidate_completion_receipt,
          )
          from hlp.data.phase2_dump_research import (
              PHASE2_DUMP_CANDIDATE_HANDOFF_VERSION,
              build_phase2_dump_candidate_handoff,
          )
          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(path): return json.loads(subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",f"/repos/{repo}/{path}"]))
          def identity(row,workflow,run_id):
              if row.get("path")!=f".github/workflows/{workflow}" or row.get("event")!="workflow_dispatch" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head: raise SystemExit(f"run {run_id} identity drift")
          def wait(run_id,workflow):
              deadline=time.monotonic()+6300
              while True:
                  row=api(f"actions/runs/{run_id}"); identity(row,workflow,run_id)
                  if row.get("status")=="completed":
                      if row.get("conclusion")!="success": raise SystemExit(f"run {run_id} failed: {row.get('conclusion')}")
                      return
                  if time.monotonic()>=deadline: raise SystemExit(f"run {run_id} timed out")
                  time.sleep(15)
          def artifact(run_id,name):
              rows=api(f"actions/runs/{run_id}/artifacts?name={name}").get("artifacts",[])
              rows=[x for x in rows if x.get("name")==name and not x.get("expired")]
              if len(rows)!=1: raise SystemExit(f"{name} artifact cardinality drift")
              return rows[0]
          def download(run_id,name,dest):
              root=Path(dest)
              if root.exists(): shutil.rmtree(root)
              root.mkdir(parents=True)
              subprocess.check_call(["gh","run","download",str(run_id),"--repo",repo,"--name",name,"--dir",str(root)])
              return root
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          launch_run=int(os.environ["LAUNCH_RUN_ID"]); lr=api(f"actions/runs/{launch_run}")
          identity(lr,"phase2-dump-candidate-launch.yml",launch_run)
          if lr.get("status")!="completed" or lr.get("conclusion")!="success": raise SystemExit("candidate launch is not successful")
          lname="phase2-dump-candidate-launch"; la=artifact(launch_run,lname)
          actual_launch=str(la.get("digest") or "").lower()
          if actual_launch!=os.environ["EXPECTED_LAUNCH_DIGEST"].lower(): raise SystemExit("candidate launch digest drift")
          lroot=download(launch_run,lname,"upstream/launch")
          launch=validate_phase2_dump_candidate_launch_receipt(json.loads((lroot/"phase2-dump-candidate-launch-receipt.json").read_text()))
          target=launch["candidate_research_run_id"]; wait(target,"phase2-dump-candidate-research.yml")
          full_name="phase2-dump-candidate-research"; handoff_name="phase2-dump-candidate-research-handoff"
          full_art=artifact(target,full_name); handoff_art=artifact(target,handoff_name)
          root=download(target,full_name,"upstream/candidate"); hroot=download(target,handoff_name,"upstream/candidate-handoff")
          summary_path=root/"phase2-dump-candidate-research-summary.json"
          manifest_path=root/"phase2-dump-candidate-research.jsonl.manifest.json"
          handoff_path=hroot/"phase2-dump-candidate-research-handoff.json"
          summary=json.loads(summary_path.read_text()); manifest=json.loads(manifest_path.read_text()); handoff=json.loads(handoff_path.read_text())
          summary_sha=sha(summary_path); handoff_sha=sha(handoff_path)
          if handoff.get("version")!=PHASE2_DUMP_CANDIDATE_HANDOFF_VERSION: raise SystemExit("candidate handoff version drift")
          rebuilt=build_phase2_dump_candidate_handoff(summary,research_summary_sha256=summary_sha,geometry_handoff_sha256=launch["geometry_handoff_sha256"])
          if rebuilt!=handoff: raise SystemExit("candidate handoff semantic drift")
          if str(manifest.get("sha256") or "").lower()!=handoff["candidate_rows_sha256"]: raise SystemExit("candidate rows SHA drift")
          if handoff["candidate_specs_sha256"]!=launch["candidate_specs_sha256"]: raise SystemExit("candidate specs lineage drift")
          count=len(summary.get("candidate_specs") or [])
          receipt={
              "version":"phase2-dump-candidate-completion-receipt-v1",
              "candidate_completion_control_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "candidate_launch_run_id":launch_run,
              "candidate_launch_artifact_digest":actual_launch,
              "candidate_research_run_id":target,
              "candidate_research_artifact_digest":str(full_art.get("digest") or "").lower(),
              "candidate_research_handoff_artifact_digest":str(handoff_art.get("digest") or "").lower(),
              "candidate_research_handoff_sha256":handoff_sha,
              "execution_branch":branch,
              "execution_head_sha":head,
              "canonical_ledger_commit_sha":launch["canonical_ledger_commit_sha"],
              "geometry_run_id":launch["geometry_run_id"],
              "geometry_artifact_digest":launch["geometry_artifact_digest"],
              "geometry_handoff_sha256":launch["geometry_handoff_sha256"],
              "price_path_run_id":launch["price_path_run_id"],
              "price_path_artifact_digest":launch["price_path_artifact_digest"],
              "price_path_handoff_sha256":launch["price_path_handoff_sha256"],
              "candidate_specs_sha256":handoff["candidate_specs_sha256"],
              "candidate_rows_sha256":handoff["candidate_rows_sha256"],
              "candidate_summary_sha256":handoff["research_summary_sha256"],
              "candidate_count":count,
              "tokens":int(handoff["tokens"]),
              "candidate_rows":int(handoff["candidate_rows"]),
              "diagnostics_inputs":{
                  "candidate_research_run_id":str(target),
                  "expected_candidate_artifact_digest":str(full_art.get("digest") or "").lower(),
                  "expected_candidate_handoff_sha256":handoff_sha,
              },
              "target_run_completed":True,
              "target_run_successful":True,
              "uses_price_path_only":True,
              "point_in_time_confirmation":True,
              "candidate_selected":False,
              "dump_threshold_frozen":False,
              "phase2_dump_detector_frozen":False,
              "outcome_labels_computed":False,
              "workflow_dispatch_performed":False,
          }
          receipt=validate_phase2_dump_candidate_completion_receipt(receipt)
          Path("artifacts/phase2-dump-candidate-completion-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as h:
              for k,v in receipt["diagnostics_inputs"].items(): h.write(f"{k}={v}\n")
          PY
      - name: Upload candidate completion receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dump-candidate-completion
          path: artifacts/phase2-dump-candidate-completion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish diagnostics dispatch inputs
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_RUN: ${{ steps.complete.outputs.candidate_research_run_id }}
          CANDIDATE_DIGEST: ${{ steps.complete.outputs.expected_candidate_artifact_digest }}
          CANDIDATE_HANDOFF: ${{ steps.complete.outputs.expected_candidate_handoff_sha256 }}
        run: |
          {
            echo "## Phase-2 dump candidate completion"
            echo "- completion_run_id: ${GITHUB_RUN_ID}"
            echo "- completion_artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- candidate_research_run_id: ${CANDIDATE_RUN}"
            echo "- expected_candidate_artifact_digest: ${CANDIDATE_DIGEST}"
            echo "- expected_candidate_handoff_sha256: ${CANDIDATE_HANDOFF}"
            echo "- candidate_selected: false"
            echo "- dump_threshold_frozen: false"
          } >> "${GITHUB_STEP_SUMMARY}"
