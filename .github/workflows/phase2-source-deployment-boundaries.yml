name: phase2-source-deployment-boundaries

on:
  workflow_dispatch:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase2-source-deployment-boundaries.yml'
      - 'src/hlp/data/phase2_sources.py'

permissions:
  contents: read

concurrency:
  group: phase2-source-deployment-boundaries-${{ github.ref }}
  cancel-in-progress: true

env:
  SNAPSHOT_HEAD: '54486035'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Freeze conservative source deployment boundaries
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.config import (
              SOLIDRPC_AUTH_RPC_URL,
              SOLIDRPC_PUBLIC_RPC_URL,
          )
          from hlp.data.phase2_sources import (
              build_phase2_source_inventory,
          )
          from hlp.data.rpc import RpcClient

          key = os.environ.get("ROBINHOOD_ARCHIVE_RPC_API_KEY")
          url = os.environ.get("ROBINHOOD_ARCHIVE_RPC_URL")
          if not url:
              url = SOLIDRPC_AUTH_RPC_URL if key else SOLIDRPC_PUBLIC_RPC_URL
          rpc = RpcClient(
              url,
              timeout=30,
              attempts=5,
              min_interval_seconds=0.1,
              extra_headers={"X-API-Key": key} if key else None,
          )
          rpc.assert_robinhood()
          head = int(os.environ["SNAPSHOT_HEAD"])

          rows = []
          for source in build_phase2_source_inventory():
              source_id = source["source_id"]
              if source_id in {"pons_v1", "pons_v2"}:
                  continue
              if source["source_kind"] == "direct_dex":
                  contracts = list(source["trading_contracts"])
                  basis = "trading_contract_deployment"
              else:
                  contracts = list(source["launch_contracts"])
                  basis = "launch_contract_deployment"
              if not contracts:
                  raise SystemExit(
                      f"{source_id} has no boundary contracts"
                  )

              contract_rows = []
              for address in contracts:
                  first = rpc.find_first_code_block(
                      address,
                      low=0,
                      high=head,
                  )
                  code = rpc.get_code(address, first)
                  if code in {"0x", "0x0", ""}:
                      raise SystemExit(
                          f"{source_id} has no code at discovered block"
                      )
                  if first > 0:
                      prior = rpc.get_code(address, first - 1)
                      if prior not in {"0x", "0x0", ""}:
                          raise SystemExit(
                              f"{source_id} code exists before discovered block"
                          )
                  contract_rows.append({
                      "address": address.lower(),
                      "first_code_block": first,
                      "code_bytes": (
                          len(code.removeprefix("0x")) // 2
                      ),
                      "code_sha256": hashlib.sha256(
                          bytes.fromhex(code.removeprefix("0x"))
                      ).hexdigest(),
                  })

              required_start = min(
                  row["first_code_block"]
                  for row in contract_rows
              )
              rows.append({
                  "source_id": source_id,
                  "source_kind": source["source_kind"],
                  "source_readiness": source["readiness"],
                  "boundary_basis": basis,
                  "required_start_block": required_start,
                  "contracts": contract_rows,
              })

          rows.sort(key=lambda row: row["source_id"])
          report = {
              "version": "phase2-source-deployment-boundaries-v1",
              "chain_id": 4663,
              "snapshot_head_block": head,
              "sources": rows,
              "source_count": len(rows),
              "rpc_requests": rpc.requests_made,
              "rpc_route": (
                  "solidrpc_authenticated_free"
                  if key else "solidrpc_keyless_public"
              ),
          }
          Path(
              "artifacts/phase2-source-deployment-boundaries.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "source_count": len(rows),
              "boundaries": {
                  row["source_id"]: row["required_start_block"]
                  for row in rows
              },
              "rpc_requests": rpc.requests_made,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-source-deployment-boundaries
          path: artifacts/
          if-no-files-found: error
