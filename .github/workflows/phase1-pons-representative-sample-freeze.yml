name: phase1-pons-representative-sample-freeze

on:
  workflow_dispatch:
    inputs:
      v1_eligibility_run_id:
        description: "Successful phase1-pons-v1-lifecycle-eligibility run"
        required: true
        type: string
      v2_eligibility_run_id:
        description: "Successful phase1-pons-v2-lifecycle-eligibility run"
        required: true
        type: string
      runner_smoke_run_id:
        description: "Successful Phase 1 research smoke with measured comeback runners"
        required: true
        default: "33920762592"
        type: string
  workflow_call:
    inputs:
      v1_eligibility_run_id:
        required: true
        type: string
      v2_eligibility_run_id:
        required: true
        type: string
      runner_smoke_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-representative-sample-freeze-${{ github.ref }}
  cancel-in-progress: true

env:
  SNAPSHOT_HEAD: '54486035'

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_v1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: v1
          run-id: ${{ inputs.v1_eligibility_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 lifecycle download before retry
        if: ${{ steps.download_v1.outcome == 'failure' }}
        run: rm -rf v1
      - id: retry_download_v1
        name: Retry V1 lifecycle artifact download
        if: ${{ steps.download_v1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: v1
          run-id: ${{ inputs.v1_eligibility_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 lifecycle download before final retry
        if: ${{ steps.retry_download_v1.outcome == 'failure' }}
        run: rm -rf v1
      - name: Final V1 lifecycle artifact download retry
        if: ${{ steps.retry_download_v1.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-lifecycle-eligibility
          path: v1
          run-id: ${{ inputs.v1_eligibility_run_id }}
          github-token: ${{ github.token }}
      - id: download_v2
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: v2
          run-id: ${{ inputs.v2_eligibility_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V2 lifecycle download before retry
        if: ${{ steps.download_v2.outcome == 'failure' }}
        run: rm -rf v2
      - id: retry_download_v2
        name: Retry V2 lifecycle artifact download
        if: ${{ steps.download_v2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: v2
          run-id: ${{ inputs.v2_eligibility_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V2 lifecycle download before final retry
        if: ${{ steps.retry_download_v2.outcome == 'failure' }}
        run: rm -rf v2
      - name: Final V2 lifecycle artifact download retry
        if: ${{ steps.retry_download_v2.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-lifecycle-eligibility
          path: v2
          run-id: ${{ inputs.v2_eligibility_run_id }}
          github-token: ${{ github.token }}
      - id: download_smoke
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-research-smoke
          path: smoke
          run-id: ${{ inputs.runner_smoke_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial runner-smoke download before retry
        if: ${{ steps.download_smoke.outcome == 'failure' }}
        run: rm -rf smoke
      - id: retry_download_smoke
        name: Retry runner-smoke artifact download
        if: ${{ steps.download_smoke.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-research-smoke
          path: smoke
          run-id: ${{ inputs.runner_smoke_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial runner-smoke download before final retry
        if: ${{ steps.retry_download_smoke.outcome == 'failure' }}
        run: rm -rf smoke
      - name: Final runner-smoke artifact download retry
        if: ${{ steps.retry_download_smoke.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-research-smoke
          path: smoke
          run-id: ${{ inputs.runner_smoke_run_id }}
          github-token: ${{ github.token }}
      - name: Prove frozen five-runner smoke evidence
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from collections import Counter
          from decimal import Decimal
          from pathlib import Path

          expected = {
              "pons-universe.jsonl.manifest.json": {
                  "records": 249,
                  "sha256": (
                      "4861b2af1d549eb41c53341a07f6de71dce4d9486b769543c1376beab9c19ab9"
                  ),
              },
              "pons-outcomes.jsonl.manifest.json": {
                  "records": 17_761,
                  "sha256": (
                      "6fb40693b77d7434d4e579a2225fed2c65061841a5ea9d0ba56f785071fc6ef2"
                  ),
              },
          }
          for name, spec in expected.items():
              manifest = json.loads(Path("smoke", name).read_text())
              if int(manifest["records"]) != spec["records"]:
                  raise SystemExit(
                      f"frozen runner smoke record count changed: {name}"
                  )
              if manifest["sha256"] != spec["sha256"]:
                  raise SystemExit(
                      f"frozen runner smoke SHA changed: {name}"
                  )

          universe = [
              json.loads(line)
              for line in Path(
                  "smoke/pons-universe.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          outcomes = [
              json.loads(line)
              for line in Path(
                  "smoke/pons-outcomes.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          runners = [
              row for row in universe if bool(row["reached_100k"])
          ]
          if len(runners) != 5:
              raise SystemExit(
                  f"frozen runner smoke must contain exactly five eligible "
                  f"tokens, got {len(runners)}"
              )
          versions = Counter(row["pons_version"] for row in runners)
          if versions != {"v1": 4, "v2": 1}:
              raise SystemExit(
                  "frozen runner smoke generation mix changed: "
                  f"{dict(versions)}"
              )

          runner_tokens = {row["token"].lower() for row in runners}
          max_multiple = {}
          for row in outcomes:
              token = row["token"].lower()
              if token not in runner_tokens:
                  continue
              value = row.get("max_future_multiple")
              if value is None:
                  continue
              multiple = Decimal(value)
              prior = max_multiple.get(token)
              if prior is None or multiple > prior:
                  max_multiple[token] = multiple

          not_recovered = sorted(
              token for token in runner_tokens
              if max_multiple.get(token, Decimal(0)) < Decimal("5")
          )
          if not_recovered:
              raise SystemExit(
                  "frozen runner smoke lost >=5x recovery evidence: "
                  f"{not_recovered}"
              )

          report = {
              "runner_smoke_run_id": int(
                  "${{ inputs.runner_smoke_run_id }}"
              ),
              "runner_smoke_universe_sha256": expected[
                  "pons-universe.jsonl.manifest.json"
              ]["sha256"],
              "runner_smoke_outcomes_sha256": expected[
                  "pons-outcomes.jsonl.manifest.json"
              ]["sha256"],
              "runner_tokens": sorted(runner_tokens),
              "runner_versions": dict(sorted(versions.items())),
              "runner_max_future_multiple": {
                  token: str(max_multiple[token])
                  for token in sorted(runner_tokens)
              },
          }
          Path("artifacts/pons-runner-evidence.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Validate full lifecycle inputs and freeze 5 plus 5 cohort
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          HEAD = int(os.environ["SNAPSHOT_HEAD"])
          for path, records in (
              (
                  Path(
                      "v1/pons-v1-lifecycle-eligibility.jsonl.manifest.json"
                  ),
                  268_688,
              ),
              (
                  Path(
                      "v2/pons-v2-lifecycle-eligibility.jsonl.manifest.json"
                  ),
                  225_951,
              ),
          ):
              manifest = json.loads(path.read_text())
              provenance = manifest.get("provenance") or {}
              if int(provenance.get("chain_id", -1)) != 4663:
                  raise SystemExit(
                      f"representative lifecycle chain mismatch: {path}"
                  )
              if int(
                  provenance.get("snapshot_head_block", -1)
              ) != HEAD:
                  raise SystemExit(
                      f"representative lifecycle snapshot mismatch: {path}"
                  )
              if int(manifest["records"]) != records:
                  raise SystemExit(
                      f"representative lifecycle record mismatch: {path}"
                  )
          PY

          hlp pons-representative-sample \
            --v1-lifecycle v1/pons-v1-lifecycle-eligibility.jsonl \
            --v2-lifecycle v2/pons-v2-lifecycle-eligibility.jsonl \
            --outcomes smoke/pons-outcomes.jsonl \
            --runners 5 --failures 5 \
            --out artifacts/pons-representative-sample.jsonl
      - name: Validate representative sample acceptance shape
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from hlp.data.pons_representative_identity import (
              representative_sample_identity,
          )

          rows = [
              json.loads(line)
              for line in Path(
                  "artifacts/pons-representative-sample.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          groups = Counter(row["sample_group"] for row in rows)
          versions = Counter(row["pons_version"] for row in rows)
          runner_evidence = json.loads(
              Path("artifacts/pons-runner-evidence.json").read_text()
          )
          expected_runner_tokens = {
              token.lower()
              for token in runner_evidence["runner_tokens"]
          }
          sample_runner_tokens = {
              row["token"].lower()
              for row in rows
              if row["sample_group"] == "runner"
          }
          if sample_runner_tokens != expected_runner_tokens:
              raise SystemExit(
                  "representative runner cohort drifted from frozen smoke "
                  f"evidence: expected={sorted(expected_runner_tokens)} "
                  f"actual={sorted(sample_runner_tokens)}"
              )
          failure_tokens = sorted(
              row["token"].lower()
              for row in rows
              if row["sample_group"] == "failure"
          )
          if len(rows) != 10 or groups != {"runner": 5, "failure": 5}:
              raise SystemExit(
                  "representative sample must freeze exactly five runners "
                  f"and five failures: rows={len(rows)} groups={dict(groups)}"
              )
          if set(versions) != {"v1", "v2"}:
              raise SystemExit(
                  "representative sample must contain both Pons generations"
              )
          sample_path = Path(
              "artifacts/pons-representative-sample.jsonl"
          )
          identity = representative_sample_identity(sample_path)

          v1_eligibility_run_id = int(
              "${{ inputs.v1_eligibility_run_id }}"
          )
          v2_eligibility_run_id = int(
              "${{ inputs.v2_eligibility_run_id }}"
          )
          v1_manifest = json.loads(
              Path(
                  "v1/pons-v1-lifecycle-eligibility.jsonl.manifest.json"
              ).read_text()
          )
          v2_manifest = json.loads(
              Path(
                  "v2/pons-v2-lifecycle-eligibility.jsonl.manifest.json"
              ).read_text()
          )

          def venue_run_id(manifest, field, lifecycle_run_id):
              provenance = manifest.get("provenance") or {}
              value = provenance.get(field)
              if value is None:
                  if lifecycle_run_id != 33_982_556_591:
                      raise SystemExit(
                          "representative sample lifecycle venue "
                          f"provenance missing: {field} "
                          f"run={lifecycle_run_id}"
                      )
                  return lifecycle_run_id
              run_id = int(value)
              if run_id <= 0:
                  raise SystemExit(
                      "representative sample lifecycle venue run "
                      f"is invalid: {field}={run_id}"
                  )
              return run_id

          v1_v3_run_id = venue_run_id(
              v1_manifest,
              "v1_v3_run_id",
              v1_eligibility_run_id,
          )
          v2_v4_run_id = venue_run_id(
              v2_manifest,
              "v4_run_id",
              v2_eligibility_run_id,
          )

          Path(
              "artifacts/pons-representative-sample-identity.json"
          ).write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n"
          )
          report = {
              "snapshot_head_block": 54_486_035,
              "tokens": len(rows),
              "sample_sha256": identity["sample_sha256"],
              "token_set_sha256": identity["token_set_sha256"],
              "groups": dict(sorted(groups.items())),
              "versions": dict(sorted(versions.items())),
              "runner_tokens": sorted(sample_runner_tokens),
              "failure_tokens": failure_tokens,
              "runner_smoke_universe_sha256": runner_evidence[
                  "runner_smoke_universe_sha256"
              ],
              "runner_smoke_outcomes_sha256": runner_evidence[
                  "runner_smoke_outcomes_sha256"
              ],
              "earliest_launch_block": min(
                  int(row["launch_block"]) for row in rows
              ),
              "latest_launch_block": max(
                  int(row["launch_block"]) for row in rows
              ),
              "v1_eligibility_run_id": v1_eligibility_run_id,
              "v2_eligibility_run_id": v2_eligibility_run_id,
              "validated_v1_v3_run_id": v1_v3_run_id,
              "validated_v2_v4_run_id": v2_v4_run_id,
              "runner_smoke_run_id": int(
                  "${{ inputs.runner_smoke_run_id }}"
              ),
          }
          Path(
              "artifacts/pons-representative-sample-summary.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - id: upload_output
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_output
        name: Retry representative sample artifact upload
        if: ${{ steps.upload_output.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Final representative sample artifact upload retry
        if: ${{ steps.retry_upload_output.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: artifacts/
          if-no-files-found: error
          overwrite: true
