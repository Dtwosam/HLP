name: phase2-dump-candidate-launch

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Exact successful phase2-dump-candidate-plan workflow_dispatch run ID
        required: true
        type: string
      expected_plan_artifact_digest:
        description: Exact candidate plan artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: phase2-dump-candidate-launch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: launch
        name: Dispatch explicit candidate research grid
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import base64,json,os,shutil,subprocess
          from pathlib import Path
          from hlp.data.phase2_dispatch_readiness import workflow_dispatch_interface_sha256
          from hlp.data.phase2_dump_candidate_dispatch import (
              validate_phase2_dump_candidate_dispatch_plan,
              validate_phase2_dump_candidate_launch_receipt,
          )
          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(args,payload=None):
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",*args],input=(json.dumps(payload,sort_keys=True,separators=(",",":")).encode() if payload is not None else None))
              return json.loads(raw) if raw.strip() else None
          plan_run=int(os.environ["PLAN_RUN_ID"]); row=api([f"/repos/{repo}/actions/runs/{plan_run}"])
          if row.get("path")!=".github/workflows/phase2-dump-candidate-plan.yml" or row.get("event")!="workflow_dispatch" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head or row.get("status")!="completed" or row.get("conclusion")!="success":
              raise SystemExit("candidate plan identity/status drift")
          name="phase2-dump-candidate-plan"
          arts=[x for x in api([f"/repos/{repo}/actions/runs/{plan_run}/artifacts?name={name}"]).get("artifacts",[]) if x.get("name")==name and not x.get("expired")]
          if len(arts)!=1: raise SystemExit("candidate plan artifact cardinality drift")
          actual=str(arts[0].get("digest") or "").lower()
          if actual!=os.environ["EXPECTED_PLAN_DIGEST"].lower(): raise SystemExit("candidate plan digest drift")
          root=Path("upstream/candidate-plan")
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          subprocess.check_call(["gh","run","download",str(plan_run),"--repo",repo,"--name",name,"--dir",str(root)])
          plan=validate_phase2_dump_candidate_dispatch_plan(json.loads((root/"phase2-dump-candidate-plan.json").read_text()))
          workflow="phase2-dump-candidate-research.yml"
          metadata=api([f"/repos/{repo}"]); default_branch=str(metadata.get("default_branch") or "")
          local=workflow_dispatch_interface_sha256(Path(".github/workflows",workflow).read_text())
          payload=api([f"/repos/{repo}/contents/.github/workflows/{workflow}?ref={default_branch}"])
          remote=workflow_dispatch_interface_sha256(base64.b64decode(str(payload.get("content") or "").replace("\n","")).decode())
          if local!=remote: raise SystemExit("default-branch candidate-research interface drift")
          response=api(["--method","POST",f"/repos/{repo}/actions/workflows/{workflow}/dispatches","--input","-"],{"ref":branch,"inputs":plan["inputs"]})
          target=int((response or {}).get("workflow_run_id",0))
          if target<=0: raise SystemExit("candidate research dispatch lacks run ID")
          target_row=api([f"/repos/{repo}/actions/runs/{target}"])
          if target_row.get("path")!=f".github/workflows/{workflow}" or target_row.get("head_branch")!=branch or str(target_row.get("head_sha") or "").lower()!=head: raise SystemExit("candidate target identity drift")
          receipt={
              "version":"phase2-dump-candidate-launch-receipt-v1",
              "candidate_control_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "candidate_plan_run_id":plan_run,
              "candidate_plan_artifact_digest":actual,
              "candidate_research_run_id":target,
              "execution_branch":branch,
              "execution_head_sha":head,
              "canonical_ledger_commit_sha":plan["canonical_ledger_commit_sha"],
              "candidate_specs_sha256":plan["candidate_specs_sha256"],
              "geometry_run_id":plan["geometry_run_id"],
              "geometry_artifact_digest":plan["geometry_artifact_digest"],
              "geometry_handoff_sha256":plan["geometry_handoff_sha256"],
              "price_path_run_id":plan["price_path_run_id"],
              "price_path_artifact_digest":plan["price_path_artifact_digest"],
              "price_path_handoff_sha256":plan["price_path_handoff_sha256"],
              "candidate_count":plan["candidate_count"],
              "target_runs_created":1,
              "target_run_waited_for_completion":False,
              "candidate_selected":False,
              "dump_threshold_frozen":False,
              "phase2_dump_detector_frozen":False,
              "outcome_labels_computed":False,
              "workflow_dispatch_performed":True,
          }
          receipt=validate_phase2_dump_candidate_launch_receipt(receipt)
          Path("artifacts/phase2-dump-candidate-launch-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as h: h.write(f"target_run_id={target}\n")
          PY
      - name: Upload candidate launch receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dump-candidate-launch
          path: artifacts/phase2-dump-candidate-launch-receipt.json
          if-no-files-found: error
          retention-days: 90
