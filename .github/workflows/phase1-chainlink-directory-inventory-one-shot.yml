name: phase1-chainlink-directory-inventory-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-chainlink-directory-inventory-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-chainlink-directory-inventory-one-shot
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Inventory exact Robinhood records in official Chainlink directory
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          from hlp.data.chainlink_directory import ChainlinkDirectoryClient

          client = ChainlinkDirectoryClient(timeout=30, attempts=5)
          page = client.fetch_text()
          marker = '"heartbeat":[0,'
          positions = []
          cursor = 0
          while True:
              pos = page.find(marker, cursor)
              if pos < 0:
                  break
              positions.append(pos)
              cursor = pos + len(marker)

          rows = []
          for i, start in enumerate(positions):
              end = positions[i + 1] if i + 1 < len(positions) else len(page)
              segment = page[start:end]
              blockchain = client._field(segment, "blockchainName")
              if blockchain != "Robinhood":
                  continue
              row = {
                  "name": client._field(segment, "name"),
                  "path": client._field(segment, "path"),
                  "proxy_address": client._field(segment, "proxyAddress"),
                  "secondary_proxy_address": client._field(
                      segment, "secondaryProxyAddress"
                  ),
                  "heartbeat_seconds": client._int_field(segment, "heartbeat"),
                  "blockchain_name": blockchain,
              }
              if row["name"] and row["proxy_address"]:
                  rows.append(row)

          unique = {
              (
                  row["name"],
                  row["path"],
                  row["proxy_address"],
                  row["secondary_proxy_address"],
                  row["heartbeat_seconds"],
              ): row
              for row in rows
          }
          rows = sorted(
              unique.values(),
              key=lambda row: (row["name"], row["proxy_address"]),
          )
          report = {
              "records": len(rows),
              "directory_sha256": client.last_sha256,
              "directory_requests": client.requests_made,
              "feeds": rows,
          }
          Path("artifacts/chainlink-robinhood-directory.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-chainlink-robinhood-directory
          path: artifacts/
          if-no-files-found: error
