name: phase1-pons-representative-market-path-replay-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/phase1-pons-representative-market-path-replay.json

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-representative-market-path-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ startsWith(github.event.head_commit.message, 'launch representative market-path replay generation ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sample_run_id: ${{ steps.validate.outputs.sample_run_id }}
      registry_run_id: ${{ steps.validate.outputs.registry_run_id }}
      v1_v3_run_id: ${{ steps.validate.outputs.v1_v3_run_id }}
      v2_curve_run_id: ${{ steps.validate.outputs.v2_curve_run_id }}
      transition_run_id: ${{ steps.validate.outputs.transition_run_id }}
      v2_v4_run_id: ${{ steps.validate.outputs.v2_v4_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: validate
        name: Validate artifact-only replay launch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAUNCH_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          from hlp.data.github_actions import fetch_github_actions_json

          config_path = (
              ".github/"
              "phase1-pons-representative-market-path-replay.json"
          )
          config = json.loads(Path(config_path).read_text())
          expected_keys = {
              "generation",
              "sample_run_id",
              "registry_run_id",
              "v1_v3_run_id",
              "v2_curve_run_id",
              "transition_run_id",
              "v2_v4_run_id",
          }
          if set(config) != expected_keys:
              raise SystemExit(
                  "representative market-path replay config schema changed: "
                  f"{sorted(config)}"
              )

          if os.environ["BRANCH"] != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "representative market-path replay branch changed"
              )

          raw_message = str(os.environ["LAUNCH_MESSAGE"])
          message = raw_message.splitlines()[0]
          if raw_message != message:
              raise SystemExit(
                  "representative market-path replay message must be one line"
              )
          launch = re.fullmatch(
              r"launch representative market-path replay generation (\d+)",
              message,
          )
          if launch is None:
              raise SystemExit(
                  "representative market-path replay requires exact generation"
              )
          requested_generation = int(launch.group(1))

          before_sha = str(os.environ["BEFORE_SHA"] or "")
          current_sha = str(os.environ["CURRENT_SHA"] or "")
          if not re.fullmatch(r"[0-9a-f]{40}", before_sha):
              raise SystemExit("market-path replay before SHA is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", current_sha):
              raise SystemExit("market-path replay current SHA is invalid")

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def get(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=30,
              )

          commit = get(f"/repos/{repo}/commits/{current_sha}")
          parents = list(commit.get("parents") or [])
          if (
              len(parents) != 1
              or str(parents[0].get("sha") or "") != before_sha
          ):
              raise SystemExit(
                  "market-path replay launch must be a direct single-parent "
                  "commit"
              )
          files = list(commit.get("files") or [])
          if (
              len(files) != 1
              or str(files[0].get("filename") or "") != config_path
              or str(files[0].get("status") or "") != "modified"
          ):
              raise SystemExit(
                  "market-path replay launch must modify exactly its config"
              )

          encoded_path = urllib.parse.quote(config_path, safe="/")
          encoded_ref = urllib.parse.quote(before_sha, safe="")
          prior_payload = get(
              f"/repos/{repo}/contents/{encoded_path}?ref={encoded_ref}"
          )
          if prior_payload.get("encoding") != "base64":
              raise SystemExit(
                  "market-path replay prior config encoding changed"
              )
          prior = json.loads(
              base64.b64decode(prior_payload.get("content") or "")
          )
          if set(prior) != expected_keys:
              raise SystemExit(
                  "market-path replay prior config schema changed"
              )

          generation = int(config["generation"])
          prior_generation = int(prior["generation"])
          if generation <= 0:
              raise SystemExit("market-path replay config is not armed")
          if requested_generation != generation:
              raise SystemExit(
                  "market-path replay launch/config generation mismatch"
              )
          if generation != prior_generation + 1:
              raise SystemExit(
                  "market-path replay generation must increment by one"
              )

          frozen_keys = expected_keys - {"generation"}
          changed_inputs = sorted(
              key
              for key in frozen_keys
              if config[key] != prior[key]
          )
          if changed_inputs:
              raise SystemExit(
                  "market-path replay frozen inputs changed at launch: "
                  + ", ".join(changed_inputs)
              )

          run_ids = {
              key: int(config[key])
              for key in frozen_keys
          }
          if min(run_ids.values()) <= 0:
              raise SystemExit(
                  "market-path replay run IDs must all be positive"
              )

          expected = {
              "sample_run_id": 35_518_892_463,
              "registry_run_id": 33_911_022_718,
              "v1_v3_run_id": 34_228_430_753,
              "v2_curve_run_id": 33_936_232_604,
              "transition_run_id": 33_912_452_330,
              "v2_v4_run_id": 34_471_480_180,
          }
          if run_ids != expected:
              raise SystemExit(
                  "market-path replay frozen run IDs changed: "
                  f"{run_ids}"
              )

          artifact = "phase1-pons-representative-sample"
          matches = []
          page = 1
          while True:
              payload = get(
                  f"/repos/{repo}/actions/runs/"
                  f"{run_ids['sample_run_id']}/artifacts"
                  f"?per_page=100&page={page}"
              )
              rows = list(payload.get("artifacts") or [])
              matches.extend(
                  row
                  for row in rows
                  if not row.get("expired")
                  and str(row.get("name") or "") == artifact
              )
              if len(rows) < 100:
                  break
              page += 1
              if page > 10:
                  raise SystemExit(
                      "market-path replay sample artifact pagination "
                      "exceeded 1000"
                  )
          if len(matches) != 1:
              raise SystemExit(
                  "market-path replay sample artifact is missing or "
                  "ambiguous"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in sorted(run_ids.items()):
                  output.write(f"{key}={value}\n")

          print(json.dumps({
              "generation": generation,
              "sample_artifact_id": int(matches[0]["id"]),
              **run_ids,
              "replay": "artifact_only",
          }, sort_keys=True))
          PY

  replay:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    uses: ./.github/workflows/phase1-pons-representative-market-paths.yml
    with:
      sample_run_id: ${{ needs.preflight.outputs.sample_run_id }}
      registry_run_id: ${{ needs.preflight.outputs.registry_run_id }}
      v1_v3_run_id: ${{ needs.preflight.outputs.v1_v3_run_id }}
      v2_curve_run_id: ${{ needs.preflight.outputs.v2_curve_run_id }}
      transition_run_id: ${{ needs.preflight.outputs.transition_run_id }}
      v2_v4_run_id: ${{ needs.preflight.outputs.v2_v4_run_id }}
