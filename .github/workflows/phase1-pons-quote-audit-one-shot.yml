name: phase1-pons-quote-audit-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-pons-quote-audit-one-shot.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-quote-audit-one-shot
  cancel-in-progress: true

env:
  SOURCE_REGISTRY_RUN_ID: '33911022718'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ env.SOURCE_REGISTRY_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Classify all Pons quote assets on current code
        run: |
          mkdir -p artifacts
          hlp --timeout 30 --attempts 5 \
            pons-quote-audit \
            --registry registry/pons-full-launch-registry.jsonl \
            --out artifacts/pons-quote-registry.jsonl
      - name: Check causal Chainlink state for supported stock quotes
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-pons-quote-causality \
            --quote-registry artifacts/pons-quote-registry.jsonl \
            --out artifacts/pons-quote-causality.jsonl
      - name: Build completeness report without hiding blockers
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          quotes = [
              json.loads(line)
              for line in Path("artifacts/pons-quote-registry.jsonl").read_text().splitlines()
              if line.strip()
          ]
          causality = [
              json.loads(line)
              for line in Path("artifacts/pons-quote-causality.jsonl").read_text().splitlines()
              if line.strip()
          ]
          statuses = Counter(row["pricing_status"] for row in quotes)
          launches = Counter()
          for row in quotes:
              launches[row["pricing_status"]] += int(row["launches"])

          blockers = [
              row for row in quotes
              if row["pricing_status"] in {
                  "unsupported_quote",
                  "missing_chainlink_feed",
              }
          ]
          bad_causality = [
              row for row in causality if not bool(row["causal_ready"])
          ]
          report = {
              "registry_run_id": 33911022718,
              "quote_assets": len(quotes),
              "status_counts": dict(sorted(statuses.items())),
              "launches_by_status": dict(sorted(launches.items())),
              "blocking_quote_assets": [
                  {
                      "quote_token": row["quote_token"],
                      "symbol": row["symbol"],
                      "status": row["pricing_status"],
                      "launches": row["launches"],
                      "first_launch_block": row["first_launch_block"],
                      "versions": row["versions"],
                  }
                  for row in blockers
              ],
              "blocking_stock_feeds": [
                  {
                      "quote_token": row["quote_token"],
                      "symbol": row["symbol"],
                      "first_launch_block": row["first_launch_block"],
                      "error": row["error"],
                  }
                  for row in bad_causality
              ],
              "complete_for_100k_eligibility": (
                  not blockers and not bad_causality
              ),
          }
          Path("artifacts/pons-quote-completeness.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-pons-full-quote-audit-current
          path: artifacts/
          if-no-files-found: error
