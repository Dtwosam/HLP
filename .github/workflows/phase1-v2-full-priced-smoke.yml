name: phase1-v2-full-priced-smoke

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-v2-full-priced-smoke.yml'
      - 'src/hlp/data/oracle_registry.py'
      - 'src/hlp/data/oracles.py'
      - 'src/hlp/data/quote_usd.py'
      - 'src/hlp/data/v2_curve.py'
      - 'src/hlp/data/v4.py'
      - 'src/hlp/cli.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-priced:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Build V2 launch registry
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-v2-registry-window \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 50 \
            --out artifacts/v2-registry.jsonl
      - name: Build shared Stock Token oracle tape
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-v2-stock-oracle-window \
            --registry artifacts/v2-registry.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --feed-out artifacts/stock-feed-registry.jsonl \
            --state-out artifacts/stock-oracle-state.jsonl \
            --out artifacts/stock-oracle-updates.jsonl
      - name: Build shared curve tape
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-v2-curve-tape \
            --registry artifacts/v2-registry.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --out artifacts/v2-curve-events.jsonl
      - name: Replay fully-priced curve
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-v2-curve-market-cap-window \
            --registry artifacts/v2-registry.jsonl \
            --curve-events artifacts/v2-curve-events.jsonl \
            --oracle-state artifacts/stock-oracle-state.jsonl \
            --oracle-events artifacts/stock-oracle-updates.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --out artifacts/v2-curve-market-caps.jsonl \
            --summary-out artifacts/v2-curve-summary.jsonl
      - name: Acquire V2 graduations and registrations
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-v2-graduation-tape \
            --registry artifacts/v2-registry.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --out artifacts/v2-graduations.jsonl
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-v2-registration-tape \
            --registry artifacts/v2-registry.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --out artifacts/v2-registrations.jsonl
      - name: Acquire V4 swaps
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-v2-v4-tape \
            --registrations artifacts/v2-registrations.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --out artifacts/v2-v4-swaps.jsonl
      - name: Reconstruct fully-priced lifecycle
        run: |
          hlp --timeout 30 --attempts 5 --min-interval 0.6 \
            rpc-v2-v4-market-cap-window \
            --registry artifacts/v2-registry.jsonl \
            --curve-points artifacts/v2-curve-market-caps.jsonl \
            --graduations artifacts/v2-graduations.jsonl \
            --registrations artifacts/v2-registrations.jsonl \
            --v4-swaps artifacts/v2-v4-swaps.jsonl \
            --oracle-state artifacts/stock-oracle-state.jsonl \
            --oracle-events artifacts/stock-oracle-updates.jsonl \
            --from-block 30000000 --to-block 30099999 \
            --chunk-size 2000 --min-chunk-size 25 \
            --seed-out artifacts/v2-seed-points.jsonl \
            --out artifacts/v2-v4-market-caps.jsonl \
            --transition-out artifacts/v2-transition.jsonl \
            --summary-out artifacts/v2-lifecycle-summary.jsonl
      - name: Validate complete pricing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read(name):
              return [
                  json.loads(line)
                  for line in (Path("artifacts") / name).read_text().splitlines()
                  if line.strip()
              ]

          registry = read("v2-registry.jsonl")
          feeds = read("stock-feed-registry.jsonl")
          states = read("stock-oracle-state.jsonl")
          updates = read("stock-oracle-updates.jsonl")
          curve = read("v2-curve-summary.jsonl")
          lifecycle = read("v2-lifecycle-summary.jsonl")
          transitions = read("v2-transition.jsonl")

          assert len(registry) == 83
          assert len(feeds) == 7, len(feeds)
          assert len(states) == 7, len(states)
          assert len(curve) == 83
          assert len(lifecycle) == 83
          assert all(row["priced_points"] > 0 for row in curve), [
              row["token"] for row in curve if row["priced_points"] == 0
          ]
          assert all(row["priced_points"] > 0 for row in lifecycle)
          print(json.dumps({
              "launches": len(registry),
              "stock_feeds": len(feeds),
              "stock_oracle_updates": len(updates),
              "curve_tokens_priced": sum(r["priced_points"] > 0 for r in curve),
              "curve_crossed_100k": sum(bool(r["crossed_100k"]) for r in curve),
              "lifecycle_tokens_priced": sum(r["priced_points"] > 0 for r in lifecycle),
              "lifecycle_crossed_100k": sum(bool(r["crossed_100k"]) for r in lifecycle),
              "transition_count": len(transitions),
              "symbols": sorted(r["symbol"] for r in feeds),
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-v2-full-priced
          path: artifacts/
          if-no-files-found: error
