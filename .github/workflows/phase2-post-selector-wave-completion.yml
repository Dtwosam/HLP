name: phase2-post-selector-wave-completion

on:
  workflow_dispatch:
    inputs:
      post_selector_wave_launch_run_id:
        description: Exact successful phase2-post-selector-wave-launch workflow_dispatch run ID
        required: true
        type: string
      expected_wave_artifact_digest:
        description: Exact post-selector wave artifact digest (sha256:...)
        required: true
        type: string
      confirm_completion_refresh:
        description: Explicitly verify both targets and create the direct-coverage planner
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: phase2-post-selector-wave-completion-${{ github.ref }}
  cancel-in-progress: false

env:
  POST_SELECTOR_WAVE_LAUNCH_RUN_ID: ${{ inputs.post_selector_wave_launch_run_id }}
  EXPECTED_WAVE_ARTIFACT_DIGEST: ${{ inputs.expected_wave_artifact_digest }}
  CONFIRM_COMPLETION_REFRESH: ${{ inputs.confirm_completion_refresh }}

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Require explicit completion refresh approval
        run: |
          set -euo pipefail
          if [ "${CONFIRM_COMPLETION_REFRESH}" != "true" ]; then
            echo "post-selector completion requires confirm_completion_refresh=true" >&2
            exit 1
          fi

      - id: complete
        name: Verify two targets and build direct-coverage planner
        run: |
          mkdir -p artifacts upstream
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import time
          from pathlib import Path

          from hlp.data.phase2_post_fanout import (
              PHASE2_AFTER_SELECTOR_AUTO_NODE_IDS,
              validate_phase2_post_selector_wave_completion,
              validate_phase2_post_selector_wave_launch_receipt,
          )
          from hlp.data.phase2_selector_approval import (
              validate_phase2_selector_approved_freeze_receipt,
          )

          API_VERSION = "2026-03-10"
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          current_head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip().lower()

          def gh_json(args, *, payload=None):
              command = [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  f"X-GitHub-Api-Version: {API_VERSION}",
                  *args,
              ]
              raw = subprocess.check_output(
                  command,
                  input=(
                      json.dumps(
                          payload,
                          sort_keys=True,
                          separators=(",", ":"),
                      ).encode()
                      if payload is not None
                      else None
                  ),
              )
              if not raw.strip():
                  return None
              return json.loads(raw)

          def get_run(run_id):
              return gh_json([f"/repos/{repo}/actions/runs/{run_id}"])

          def assert_run_identity(run, *, workflow, run_id):
              expected_path = f".github/workflows/{workflow}"
              if run.get("path") != expected_path:
                  raise SystemExit(f"run {run_id} workflow identity drift")
              if run.get("event") != "workflow_dispatch":
                  raise SystemExit(f"run {run_id} is not workflow_dispatch")
              if run.get("head_branch") != branch:
                  raise SystemExit(f"run {run_id} branch identity drift")
              if str(run.get("head_sha") or "").lower() != current_head:
                  raise SystemExit(f"run {run_id} HEAD identity drift")

          def wait_run(run_id, *, workflow, timeout_seconds=900):
              deadline = time.monotonic() + timeout_seconds
              while True:
                  run = get_run(run_id)
                  assert_run_identity(
                      run,
                      workflow=workflow,
                      run_id=run_id,
                  )
                  if str(run.get("status") or "") == "completed":
                      conclusion = str(run.get("conclusion") or "")
                      if conclusion != "success":
                          raise SystemExit(
                              f"run {run_id} failed with {conclusion!r}"
                          )
                      return run
                  if time.monotonic() >= deadline:
                      raise SystemExit(
                          f"run {run_id} did not finish before timeout"
                      )
                  time.sleep(5)

          def artifact_row(run_id, name):
              payload = gh_json([
                  (
                      f"/repos/{repo}/actions/runs/{run_id}/"
                      f"artifacts?name={name}"
                  ),
              ])
              matches = [
                  row
                  for row in (payload or {}).get("artifacts", [])
                  if row.get("name") == name
                  and not row.get("expired")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"run {run_id} expected one live {name} artifact; "
                      f"found {len(matches)}"
                  )
              return matches[0]

          def download_artifact(run_id, name, destination):
              path = Path(destination)
              if path.exists():
                  shutil.rmtree(path)
              path.mkdir(parents=True)
              subprocess.check_call([
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repo,
                  "--name",
                  name,
                  "--dir",
                  str(path),
              ])
              return path

          def dispatch(workflow, inputs):
              response = gh_json(
                  [
                      "--method",
                      "POST",
                      (
                          f"/repos/{repo}/actions/workflows/"
                          f"{workflow}/dispatches"
                      ),
                      "--input",
                      "-",
                  ],
                  payload={"ref": branch, "inputs": inputs},
              )
              if not isinstance(response, dict):
                  raise SystemExit(
                      f"dispatch of {workflow} returned no run details"
                  )
              try:
                  run_id = int(response["workflow_run_id"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"dispatch of {workflow} lacks workflow_run_id"
                  ) from exc
              if run_id <= 0:
                  raise SystemExit(
                      f"dispatch of {workflow} returned invalid run ID"
                  )
              return run_id

          try:
              launch_run_id = int(
                  os.environ["POST_SELECTOR_WAVE_LAUNCH_RUN_ID"]
              )
          except (TypeError, ValueError) as exc:
              raise SystemExit(
                  "post_selector_wave_launch_run_id is invalid"
              ) from exc
          if launch_run_id <= 0:
              raise SystemExit(
                  "post_selector_wave_launch_run_id must be positive"
              )
          expected_digest = str(
              os.environ["EXPECTED_WAVE_ARTIFACT_DIGEST"]
          ).lower()
          if (
              not expected_digest.startswith("sha256:")
              or len(expected_digest) != 71
          ):
              raise SystemExit(
                  "expected_wave_artifact_digest must be "
                  "sha256:<64 hex chars>"
              )

          ledger_sha = hashlib.sha256(
              Path(".github/phase2-source-coverage.json").read_bytes()
          ).hexdigest()

          launch_workflow = "phase2-post-selector-wave-launch.yml"
          launch_run = get_run(launch_run_id)
          assert_run_identity(
              launch_run,
              workflow=launch_workflow,
              run_id=launch_run_id,
          )
          if launch_run.get("status") != "completed":
              raise SystemExit("post-selector wave run is not completed")
          if launch_run.get("conclusion") != "success":
              raise SystemExit("post-selector wave run did not succeed")
          launch_artifact = artifact_row(
              launch_run_id,
              "phase2-post-selector-wave-launch",
          )
          actual_digest = str(
              launch_artifact.get("digest") or ""
          ).lower()
          if actual_digest != expected_digest:
              raise SystemExit(
                  "post-selector wave artifact digest drift"
              )
          launch_dir = download_artifact(
              launch_run_id,
              "phase2-post-selector-wave-launch",
              "upstream/post-selector-wave",
          )
          launch_path = (
              launch_dir
              / "phase2-post-selector-wave-launch-receipt.json"
          )
          try:
              launch_receipt = validate_phase2_post_selector_wave_launch_receipt(
                  json.loads(launch_path.read_text())
              )
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc
          if launch_receipt["post_selector_control_run_id"] != launch_run_id:
              raise SystemExit(
                  "post-selector receipt/control run identity drift"
              )
          if launch_receipt["execution_branch"] != branch:
              raise SystemExit("post-selector receipt branch drift")
          if launch_receipt["execution_head_sha"] != current_head:
              raise SystemExit("post-selector receipt HEAD drift")
          if launch_receipt[
              "canonical_coverage_ledger_sha256"
          ] != ledger_sha:
              raise SystemExit("post-selector receipt ledger SHA drift")

          workflow_by_node = {
              "shared:direct_source_population": (
                  "phase2-direct-source-population-handoff.yml"
              ),
              "coverage:trench_today": (
                  "phase2-trench-source-coverage.yml"
              ),
          }
          for node_id in PHASE2_AFTER_SELECTOR_AUTO_NODE_IDS:
              target_run_id = launch_receipt["target_run_ids"][node_id]
              run = get_run(target_run_id)
              assert_run_identity(
                  run,
                  workflow=workflow_by_node[node_id],
                  run_id=target_run_id,
              )
              if run.get("status") != "completed":
                  raise SystemExit(
                      f"post-selector target not completed: "
                      f"{node_id} -> {target_run_id}"
                  )
              if run.get("conclusion") != "success":
                  raise SystemExit(
                      f"post-selector target failed: {node_id} -> "
                      f"{target_run_id}: {run.get('conclusion')!r}"
                  )

          freeze_run_id = int(
              launch_receipt["approved_freeze_run_id"]
          )
          freeze_digest = str(
              launch_receipt["approved_freeze_artifact_digest"]
          )
          freeze_run = get_run(freeze_run_id)
          assert_run_identity(
              freeze_run,
              workflow="phase2-direct-selector-approved-freeze.yml",
              run_id=freeze_run_id,
          )
          if freeze_run.get("status") != "completed":
              raise SystemExit(
                  "approved selector freeze run is not completed"
              )
          if freeze_run.get("conclusion") != "success":
              raise SystemExit(
                  "approved selector freeze run did not succeed"
              )
          freeze_artifact = artifact_row(
              freeze_run_id,
              "phase2-direct-selector-approved-freeze",
          )
          if str(
              freeze_artifact.get("digest") or ""
          ).lower() != freeze_digest:
              raise SystemExit(
                  "approved selector freeze artifact digest drift"
              )
          freeze_dir = download_artifact(
              freeze_run_id,
              "phase2-direct-selector-approved-freeze",
              "upstream/approved-selector-freeze",
          )
          freeze_path = (
              freeze_dir
              / "phase2-direct-selector-approved-freeze-receipt.json"
          )
          try:
              freeze_receipt = (
                  validate_phase2_selector_approved_freeze_receipt(
                      json.loads(freeze_path.read_text())
                  )
              )
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc
          if freeze_receipt[
              "approved_freeze_control_run_id"
          ] != freeze_run_id:
              raise SystemExit(
                  "approved freeze receipt/control identity drift"
              )
          if freeze_receipt["selector_run_id"] != launch_receipt[
              "selector_run_id"
          ]:
              raise SystemExit(
                  "post-selector launch selector-run linkage drift"
              )

          all_control_ids = sorted(
              list(
                  freeze_receipt[
                      "node_dispatch_control_run_ids_consumed"
                  ]
              )
              + list(
                  launch_receipt[
                      "node_dispatch_control_run_ids"
                  ].values()
              )
          )
          if (
              len(all_control_ids) != 37
              or len(set(all_control_ids)) != 37
          ):
              raise SystemExit(
                  "post-selector completion requires exactly 37 unique "
                  "dispatcher control runs"
              )

          planner_workflow = "phase2-coverage-execution-plan.yml"
          planner_run_id = dispatch(
              planner_workflow,
              {
                  "completed_node_runs_json": json.dumps(
                      {
                          "shared:direct_selector_freeze": int(
                              freeze_receipt["selector_run_id"]
                          )
                      },
                      separators=(",", ":"),
                  ),
                  "node_dispatch_run_ids_json": json.dumps(
                      all_control_ids,
                      separators=(",", ":"),
                  ),
              },
          )
          wait_run(
              planner_run_id,
              workflow=planner_workflow,
          )
          planner_artifact = artifact_row(
              planner_run_id,
              "phase2-coverage-execution-plan",
          )
          planner_digest = str(
              planner_artifact.get("digest") or ""
          ).lower()
          planner_dir = download_artifact(
              planner_run_id,
              "phase2-coverage-execution-plan",
              "upstream/direct-coverage-planner",
          )
          execution_plan = json.loads(
              (
                  planner_dir
                  / "phase2-coverage-execution-plan.json"
              ).read_text()
          )
          verified_receipts = json.loads(
              (
                  planner_dir
                  / "phase2-execution-run-receipts.json"
              ).read_text()
          )
          dispatch_plan = json.loads(
              (
                  planner_dir
                  / "phase2-dispatch-input-plan.json"
              ).read_text()
          )
          if execution_plan.get("planner_head_sha") != current_head:
              raise SystemExit(
                  "direct-coverage planner HEAD linkage drift"
              )
          if execution_plan.get(
              "canonical_coverage_ledger_sha256"
          ) != ledger_sha:
              raise SystemExit(
                  "direct-coverage planner canonical-ledger SHA drift"
              )
          try:
              completion = validate_phase2_post_selector_wave_completion(
                  execution_plan,
                  verified_receipts,
                  dispatch_plan,
              )
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc

          receipt = {
              "version": "phase2-post-selector-wave-completion-receipt-v1",
              "post_selector_completion_control_run_id": int(
                  os.environ["GITHUB_RUN_ID"]
              ),
              "execution_branch": branch,
              "execution_head_sha": current_head,
              "canonical_coverage_ledger_sha256": ledger_sha,
              "post_selector_wave_launch_run_id": launch_run_id,
              "post_selector_wave_artifact_digest": actual_digest,
              "approved_freeze_run_id": freeze_run_id,
              "selector_run_id": freeze_receipt["selector_run_id"],
              "verified_target_run_ids": launch_receipt[
                  "target_run_ids"
              ],
              "node_dispatch_control_run_ids_consumed": all_control_ids,
              "planner_run_id": planner_run_id,
              "planner_artifact_digest": planner_digest,
              "auto_node_ids": completion["auto_node_ids"],
              "manual_promotion_node_ids": completion[
                  "manual_promotion_node_ids"
              ],
              "pools_fun_promotion_held_for_operator": True,
              "post_selector_targets_completed_successfully": True,
              "planner_refreshed": True,
              "selector_approval_performed": True,
              "selector_freeze_completed": True,
              "coverage_promotion_performed": False,
              "canonical_coverage_ledger_mutated": False,
              "canonical_ledger_write_authorized": False,
          }
          Path(
              "artifacts/phase2-post-selector-wave-completion-receipt.json"
          ).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"planner_run_id={planner_run_id}\n")
              handle.write(f"planner_digest={planner_digest}\n")
              handle.write(
                  "auto_node_ids_json="
                  + json.dumps(
                      completion["auto_node_ids"],
                      separators=(",", ":"),
                  )
                  + "\n"
              )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload post-selector completion receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-post-selector-wave-completion
          path: artifacts/phase2-post-selector-wave-completion-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct-coverage boundary
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PLANNER_RUN_ID: ${{ steps.complete.outputs.planner_run_id }}
          PLANNER_DIGEST: ${{ steps.complete.outputs.planner_digest }}
          AUTO_NODE_IDS_JSON: ${{ steps.complete.outputs.auto_node_ids_json }}
        run: |
          {
            echo "## Phase-2 post-selector wave completion"
            echo
            echo "- completion_control_run_id: ${GITHUB_RUN_ID}"
            echo "- completion_artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- post_selector_targets_completed_successfully: true"
            echo "- planner_run_id: ${PLANNER_RUN_ID}"
            echo "- planner_artifact_digest: ${PLANNER_DIGEST}"
            echo "- auto_node_ids: ${AUTO_NODE_IDS_JSON}"
            echo "- pools_fun_promotion_held_for_operator: true"
            echo "- selector_approval_performed: true"
            echo "- selector_freeze_completed: true"
            echo "- coverage_promotion_performed: false"
            echo "- canonical_coverage_ledger_mutated: false"
          } >> "${GITHUB_STEP_SUMMARY}"
