name: phase1-solidrpc-public-smoke

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-solidrpc-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robinhood-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Verify SolidRPC keyless Robinhood route
        run: |
          hlp             --rpc-url https://rpc.solidrpc.io/public/evm/4663             --timeout 30 --attempts 3             network-smoke
      - name: Probe old Pons V1 state
        run: |
          python - <<'PY'
          from hlp.data.rpc import RpcClient
          from hlp.config import PONS_V1_FACTORY

          rpc = RpcClient(
              "https://rpc.solidrpc.io/public/evm/4663",
              timeout=30,
              attempts=3,
          )
          # 30M is materially behind the current >54M head and therefore tests
          # historical-state availability rather than a near-head cache.
          block = 30_000_000
          code = rpc.get_code(PONS_V1_FACTORY, block)
          print({"block": block, "code_bytes": len(code.removeprefix("0x")) // 2})
      - name: Verify maximum documented public log page
        run: |
          python - <<'PY'
          from hlp.data.rpc import RpcClient
          from hlp.config import PONS_V1_FACTORY
          from hlp.protocols.pons import V1_TOKEN_LAUNCHED_TOPIC

          rpc = RpcClient(
              "https://rpc.solidrpc.io/public/evm/4663",
              timeout=30,
              attempts=3,
          )
          rows = rpc.get_logs(
              30_000_000,
              30_001_999,
              address=PONS_V1_FACTORY,
              topics=[V1_TOKEN_LAUNCHED_TOPIC],
          )
          print({"range": 2000, "logs": len(rows), "requests": rpc.requests_made})
          PY
