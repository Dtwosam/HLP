name: phase1-dispatch-permission-probe-target
run-name: phase1 dispatch probe sequence=${{ inputs.sequence_id }}

on:
  workflow_dispatch:
    inputs:
      sequence_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "dispatch probe ${{ inputs.sequence_id }}"
