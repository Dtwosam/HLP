name: phase2-bootstrap-workflow-compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase2-*.yml'
      - 'src/hlp/data/phase2_bootstrap_readiness.py'
      - 'src/hlp/data/phase2_dispatch_readiness.py'
      - 'src/hlp/data/phase2_coverage_execution.py'
      - 'tests/test_phase2_bootstrap_readiness.py'
  pull_request:
    paths:
      - '.github/workflows/phase2-*.yml'
      - 'src/hlp/data/phase2_bootstrap_readiness.py'
      - 'src/hlp/data/phase2_dispatch_readiness.py'
      - 'src/hlp/data/phase2_coverage_execution.py'
      - 'tests/test_phase2_bootstrap_readiness.py'

permissions:
  contents: read

concurrency:
  group: phase2-bootstrap-workflow-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOTSTRAP_BRANCH: phase2/workflow-dispatch-bootstrap

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: compatibility
        name: Compare bootstrap workflow surface with working branch
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          from hlp.data.phase2_bootstrap_readiness import (
              evaluate_phase2_bootstrap_readiness,
          )
          from hlp.data.phase2_dispatch_readiness import (
              required_phase2_manual_workflows,
          )

          repo = os.environ["GITHUB_REPOSITORY"]
          bootstrap_branch = os.environ["BOOTSTRAP_BRANCH"]
          required = required_phase2_manual_workflows()
          bootstrap_meta = json.loads(
              subprocess.check_output([
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  f"/repos/{repo}/commits/{bootstrap_branch}",
              ])
          )
          bootstrap_head_sha = str(
              bootstrap_meta.get("sha") or ""
          ).lower()
          if len(bootstrap_head_sha) != 40:
              raise SystemExit(
                  "bootstrap branch HEAD SHA is unavailable"
              )

          expected = {}
          for name in required:
              path = Path(".github/workflows", name)
              if not path.is_file():
                  raise SystemExit(
                      f"working branch lacks required workflow: {name}"
                  )
              expected[name] = path.read_text()

          directory = json.loads(
              subprocess.check_output([
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  (
                      f"/repos/{repo}/contents/.github/workflows"
                      f"?ref={bootstrap_branch}"
                  ),
              ])
          )
          if not isinstance(directory, list):
              raise SystemExit(
                  "bootstrap workflow directory response is invalid"
              )
          bootstrap_phase2_names = sorted(
              str(row.get("name") or "")
              for row in directory
              if isinstance(row, dict)
              and str(row.get("name") or "").startswith("phase2-")
              and str(row.get("name") or "").endswith(".yml")
          )

          bootstrap = {}
          for name in bootstrap_phase2_names:
              payload = json.loads(
                  subprocess.check_output([
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/contents/.github/workflows/"
                          f"{name}?ref={bootstrap_branch}"
                      ),
                  ])
              )
              if payload.get("encoding") != "base64":
                  raise SystemExit(
                      f"bootstrap workflow encoding drift: {name}"
                  )
              bootstrap[name] = base64.b64decode(
                  str(payload.get("content") or "").replace("\n", "")
              ).decode("utf-8")

          report = evaluate_phase2_bootstrap_readiness(
              expected,
              bootstrap,
          )
          report["bootstrap_head_sha"] = bootstrap_head_sha
          report["working_branch"] = os.environ["GITHUB_REF_NAME"]
          report["working_head_sha"] = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip().lower()

          output = Path(
              "artifacts/phase2-bootstrap-workflow-compatibility.json"
          )
          output.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "ready="
                  + str(
                      report["bootstrap_dispatch_surface_ready"]
                  ).lower()
                  + "\n"
              )
              handle.write(
                  f"required={report['required_workflows']}\n"
              )
              handle.write(
                  f"present={report['present_required_workflows']}\n"
              )
              handle.write(
                  "allowed_variants="
                  f"{report['exact_or_allowed_variant_workflows']}\n"
              )
              handle.write(
                  f"bootstrap_head={bootstrap_head_sha}\n"
              )
              handle.write(
                  "mismatches="
                  + str(
                      len(report["content_mismatch_workflow_names"])
                      + len(
                          report[
                              "dispatch_interface_mismatch_workflow_names"
                          ]
                      )
                  )
                  + "\n"
              )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Upload bootstrap compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-bootstrap-workflow-compatibility
          path: artifacts/phase2-bootstrap-workflow-compatibility.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish bootstrap compatibility summary
        if: always()
        env:
          READY: ${{ steps.compatibility.outputs.ready }}
          REQUIRED: ${{ steps.compatibility.outputs.required }}
          PRESENT: ${{ steps.compatibility.outputs.present }}
          ALLOWED_VARIANTS: ${{ steps.compatibility.outputs.allowed_variants }}
          BOOTSTRAP_HEAD: ${{ steps.compatibility.outputs.bootstrap_head }}
          MISMATCHES: ${{ steps.compatibility.outputs.mismatches }}
        run: |
          {
            echo "## Phase-2 bootstrap workflow compatibility"
            echo
            echo "- bootstrap_branch: ${BOOTSTRAP_BRANCH}"
            echo "- bootstrap_head_sha: ${BOOTSTRAP_HEAD}"
            echo "- required_workflows: ${REQUIRED}"
            echo "- present_required_workflows: ${PRESENT}"
            echo "- exact_or_allowed_variant_workflows: ${ALLOWED_VARIANTS}"
            echo "- content_or_interface_mismatches: ${MISMATCHES}"
            echo "- bootstrap_dispatch_surface_ready: ${READY}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce bootstrap compatibility
        if: steps.compatibility.outputs.ready != 'true'
        run: |
          echo "Phase-2 bootstrap workflow surface is stale or incompatible" >&2
          exit 1
