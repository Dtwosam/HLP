name: phase1-noxa-history-smoke

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-noxa-history-smoke.yml'
      - 'src/hlp/protocols/noxa.py'
      - 'src/hlp/protocols/noxa_state.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noxa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Verify early NOXA history against V3
        run: |
          python - <<'PY'
          import json
          import os

          from hlp.config import (
              NOXA_LAUNCH_FACTORY,
              ROBINHOOD_WETH,
              SOLIDRPC_PUBLIC_RPC_URL,
              UNISWAP_V3_FACTORY,
          )
          from hlp.data.rpc import RpcClient
          from hlp.protocols.noxa import TOKEN_LAUNCHED_TOPIC, decode_noxa_launch
          from hlp.protocols.noxa_state import read_noxa_launch_config
          from hlp.protocols.uniswap import (
              V3_POOL_CREATED_TOPIC,
              decode_v3_pool_created,
          )

          rpc = RpcClient(
              os.environ.get("ROBINHOOD_ARCHIVE_RPC_URL", SOLIDRPC_PUBLIC_RPC_URL),
              timeout=30,
              attempts=5,
              min_interval_seconds=0.6,
              extra_headers=(
                  {"X-API-Key": os.environ["ROBINHOOD_ARCHIVE_RPC_API_KEY"]}
                  if os.environ.get("ROBINHOOD_ARCHIVE_RPC_API_KEY")
                  else None
              ),
          )
          rpc.assert_robinhood()
          first_code = rpc.find_first_code_block(
              NOXA_LAUNCH_FACTORY,
              low=0,
              high=200_000,
          )
          from_block = first_code
          to_block = first_code + 99_999

          launch_logs = list(
              rpc.iter_logs_chunked(
                  from_block,
                  to_block,
                  address=NOXA_LAUNCH_FACTORY,
                  topics=[TOKEN_LAUNCHED_TOPIC],
                  chunk_size=2000,
                  min_chunk_size=25,
              )
          )
          launches = [decode_noxa_launch(row) for row in launch_logs]
          assert launches, (first_code, from_block, to_block)

          config_ids = sorted({row.launch_config_id for row in launches})
          configs_start = {
              config_id: read_noxa_launch_config(
                  rpc, config_id, block=launches[0].block_number
              )
              for config_id in config_ids
          }
          configs_end = {
              config_id: read_noxa_launch_config(
                  rpc, config_id, block=launches[-1].block_number
              )
              for config_id in config_ids
          }
          for config_id in config_ids:
              start = configs_start[config_id]
              end = configs_end[config_id]
              assert start.pair_token == end.pair_token
              assert start.supply == end.supply
              assert start.dex_id == end.dex_id
              assert start.supply == 1_000_000_000 * 10**18
              assert start.pair_token == ROBINHOOD_WETH.lower()

          pool_logs = list(
              rpc.iter_logs_chunked(
                  from_block,
                  to_block,
                  address=UNISWAP_V3_FACTORY,
                  topics=[V3_POOL_CREATED_TOPIC],
                  chunk_size=2000,
                  min_chunk_size=25,
              )
          )
          pools = {
              row.pool: row
              for row in map(decode_v3_pool_created, pool_logs)
          }
          launch_pools = {row.pool for row in launches}
          missing = sorted(launch_pools - set(pools))
          assert not missing, missing[:10]

          print(json.dumps({
              "first_code_block": first_code,
              "from_block": from_block,
              "to_block": to_block,
              "launches": len(launches),
              "first_launch_block": launches[0].block_number,
              "last_launch_block": launches[-1].block_number,
              "config_ids": config_ids,
              "pair_tokens": sorted({row.pair_token for row in launches}),
              "dex_factories": sorted({row.dex_factory for row in launches}),
              "noxa_pools": len(launch_pools),
              "all_v3_pools_in_window": len(pools),
              "missing_v3_pool_creations": len(missing),
              "requests_made": rpc.requests_made,
          }, sort_keys=True))
          PY
