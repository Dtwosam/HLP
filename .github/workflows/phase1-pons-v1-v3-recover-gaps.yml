    needs: plan
    if: ${{ needs.plan.outputs.gap_count_1 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_1) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_registry
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 registry download before retry
        if: ${{ steps.download_registry.outcome == 'failure' }}
        run: rm -rf registry
      - id: retry_download_registry
        name: Retry frozen V1 registry artifact download
        if: ${{ steps.download_registry.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 registry download before final retry
        if: ${{ steps.retry_download_registry.outcome == 'failure' }}
        run: rm -rf registry
      - name: Final frozen V1 registry artifact download retry
        if: ${{ steps.retry_download_registry.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact missing V1 V3 interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          GAP_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v3-pons-tape \
            --registry registry/pons-full-launch-registry.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --global-topic-scan \
            --out "artifacts/v1-v3-events-gap-${GAP_ID}.jsonl"
      - id: upload_gap
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-v3-gap-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_gap
        name: Retry gap artifact upload
        if: ${{ steps.upload_gap.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
