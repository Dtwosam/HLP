name: phase1-pons-v1-v3-recover-gaps

on:
  workflow_dispatch:
    inputs:
      source_registry_run_id:
        description: "Run containing phase1-pons-full-registry-recovered"
        required: true
        default: "33911022718"
        type: string
      partial_run_id:
        description: "Interrupted phase1-pons-v1-v3-full run with successful shard artifacts"
        required: true
        type: string
      prior_gap_run_id:
        description: "Optional earlier V1 V3 gap-recovery run whose successful gaps must be reused"
        required: false
        default: ""
        type: string
      max_gap_blocks:
        description: "Maximum blocks per retry job"
        required: true
        default: "50000"
        type: string
  workflow_call:
    inputs:
      source_registry_run_id:
        required: true
        type: string
      partial_run_id:
        required: true
        type: string
      prior_gap_run_id:
        required: false
        default: ""
        type: string
      max_gap_blocks:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-v1-v3-recover-gaps-${{ github.ref }}
  cancel-in-progress: false

env:
  FIRST_V1_LAUNCH: '8621658'
  SNAPSHOT_HEAD: '54486035'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix_1: ${{ steps.plan.outputs.matrix_1 }}
      matrix_2: ${{ steps.plan.outputs.matrix_2 }}
      matrix_3: ${{ steps.plan.outputs.matrix_3 }}
      matrix_4: ${{ steps.plan.outputs.matrix_4 }}
      gap_count: ${{ steps.plan.outputs.gap_count }}
      gap_count_1: ${{ steps.plan.outputs.gap_count_1 }}
      gap_count_2: ${{ steps.plan.outputs.gap_count_2 }}
      gap_count_3: ${{ steps.plan.outputs.gap_count_3 }}
      gap_count_4: ${{ steps.plan.outputs.gap_count_4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Refuse frozen-parent recovery while source is active
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARTIAL_RUN_ID: ${{ inputs.partial_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          partial_run_id = int(os.environ["PARTIAL_RUN_ID"])
          if partial_run_id != 33_982_556_591:
              raise SystemExit(0)

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          request = urllib.request.Request(
              api + f"/repos/{repo}/actions/runs/{partial_run_id}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          if run.get("status") != "completed":
              raise SystemExit(
                  "frozen parent recovery is blocked while source is active"
              )
          if str(run.get("path") or "").split("@", 1)[0] != (
              ".github/workflows/"
              "phase1-pons-full-eligibility-acquisition-one-shot.yml"
          ):
              raise SystemExit(
                  "frozen parent recovery source workflow path changed"
              )
          if run.get("head_branch") != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "frozen parent recovery source branch changed"
              )
          if str(run.get("head_sha") or "") != (
              "c53b3a63156976a5873752c332fa7578011249b0"
          ):
              raise SystemExit(
                  "frozen parent recovery source launch commit changed"
              )
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-v1-v3-*
          path: partial
          merge-multiple: true
          run-id: ${{ inputs.partial_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prior_gap_run_id != '' }}
        with:
          pattern: phase1-pons-v1-v3-gap-*
          path: prior-gaps
          merge-multiple: true
          run-id: ${{ inputs.prior_gap_run_id }}
          github-token: ${{ github.token }}
      - id: plan
        name: Derive only missing V1 V3 ranges
        env:
          MAX_GAP_BLOCKS: ${{ inputs.max_gap_blocks }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.data.ranges import plan_missing_subranges

          start = int(os.environ["FIRST_V1_LAUNCH"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          max_blocks = int(os.environ["MAX_GAP_BLOCKS"])
          if not 1 <= max_blocks <= 100_000:
              raise SystemExit(
                  "max_gap_blocks must be between 1 and 100000"
              )

          manifests = (
              sorted(
                  Path("partial").glob(
                      "v1-v3-events-shard-*.jsonl.manifest.json"
                  )
              )
              + sorted(
                  Path("prior-gaps").glob(
                      "v1-v3-events-gap-*.jsonl.manifest.json"
                  )
              )
          )
          if not manifests:
              raise SystemExit(
                  "recovery sources have no successful V1 V3 artifacts"
              )

          covered = []
          sources = []
          for path in manifests:
              manifest = json.loads(path.read_text())
              prov = manifest["provenance"]
              lo = int(prov["from_block"])
              hi = int(prov["to_block"])
              covered.append((lo, hi))
              sources.append({
                  "source": path.parent.name,
                  "manifest": path.name,
                  "from_block": lo,
                  "to_block": hi,
                  "records": int(manifest["records"]),
                  "sha256": manifest["sha256"],
              })

          gaps = plan_missing_subranges(
              start,
              head,
              covered,
              max_blocks=max_blocks,
          )
          if len(gaps) > 960:
              raise SystemExit(
                  "V1 V3 gap plan exceeds four serialized 240-job waves"
              )
          include = [
              {
                  "id": f"{index:03d}",
                  "from_block": lo,
                  "to_block": hi,
              }
              for index, (lo, hi) in enumerate(gaps)
          ]
          wave_1 = include[:240]
          wave_2 = include[240:480]
          wave_3 = include[480:720]
          wave_4 = include[720:]
          report = {
              "first_v1_launch": start,
              "snapshot_head": head,
              "max_gap_blocks": max_blocks,
              "successful_sources": sources,
              "gap_jobs": include,
              "gap_job_count": len(include),
              "gap_wave_job_counts": [
                  len(wave_1),
                  len(wave_2),
                  len(wave_3),
                  len(wave_4),
              ],
              "gap_blocks": sum(
                  row["to_block"] - row["from_block"] + 1
                  for row in include
              ),
          }
          Path("artifacts/v1-v3-gap-plan.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "matrix_1="
                  + json.dumps({"include": wave_1}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(
                  "matrix_2="
                  + json.dumps({"include": wave_2}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(
                  "matrix_3="
                  + json.dumps({"include": wave_3}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(
                  "matrix_4="
                  + json.dumps({"include": wave_4}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"gap_count={len(include)}\n")
              handle.write(f"gap_count_1={len(wave_1)}\n")
              handle.write(f"gap_count_2={len(wave_2)}\n")
              handle.write(f"gap_count_3={len(wave_3)}\n")
              handle.write(f"gap_count_4={len(wave_4)}\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-v3-gap-plan
          path: artifacts/
          if-no-files-found: error

  recover_1:
    needs: plan
    if: ${{ needs.plan.outputs.gap_count_1 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_1) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact missing V1 V3 interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          GAP_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v3-pons-tape \
            --registry registry/pons-full-launch-registry.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --global-topic-scan \
            --out "artifacts/v1-v3-events-gap-${GAP_ID}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-v3-gap-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error

  recover_2:
    needs: [plan, recover_1]
    if: ${{ always() && needs.plan.result == 'success' && (needs.recover_1.result == 'success' || needs.recover_1.result == 'skipped') && needs.plan.outputs.gap_count_2 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_2) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact missing V1 V3 interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          GAP_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v3-pons-tape \
            --registry registry/pons-full-launch-registry.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --global-topic-scan \
            --out "artifacts/v1-v3-events-gap-${GAP_ID}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-v3-gap-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error

  recover_3:
    needs: [plan, recover_2]
    if: ${{ always() && needs.plan.result == 'success' && (needs.recover_2.result == 'success' || needs.recover_2.result == 'skipped') && needs.plan.outputs.gap_count_3 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_3) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact missing V1 V3 interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          GAP_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v3-pons-tape \
            --registry registry/pons-full-launch-registry.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --global-topic-scan \
            --out "artifacts/v1-v3-events-gap-${GAP_ID}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-v3-gap-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error

  recover_4:
    needs: [plan, recover_3]
    if: ${{ always() && needs.plan.result == 'success' && (needs.recover_3.result == 'success' || needs.recover_3.result == 'skipped') && needs.plan.outputs.gap_count_4 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_4) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact missing V1 V3 interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          GAP_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v3-pons-tape \
            --registry registry/pons-full-launch-registry.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --global-topic-scan \
            --out "artifacts/v1-v3-events-gap-${GAP_ID}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-v3-gap-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error

  merge:
    needs: [plan, recover_1, recover_2, recover_3, recover_4]
    if: ${{ always() && needs.plan.result == 'success' && (needs.recover_1.result == 'success' || needs.recover_1.result == 'skipped') && (needs.recover_2.result == 'success' || needs.recover_2.result == 'skipped') && (needs.recover_3.result == 'success' || needs.recover_3.result == 'skipped') && (needs.recover_4.result == 'success' || needs.recover_4.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-v1-v3-*
          path: partial
          merge-multiple: true
          run-id: ${{ inputs.partial_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prior_gap_run_id != '' }}
        with:
          pattern: phase1-pons-v1-v3-gap-*
          path: prior-gaps
          merge-multiple: true
          run-id: ${{ inputs.prior_gap_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.gap_count != '0' }}
        with:
          pattern: phase1-pons-v1-v3-gap-*
          path: gaps
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v1-v3-gap-plan
          path: plan
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Merge recovered V1 V3 event tape
        run: |
          mkdir -p artifacts
          cp plan/v1-v3-gap-plan.json artifacts/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.data.reconstruct import event_order
          from hlp.data.sharded_tape import (
              canonical_jsonl_bytes,
              write_virtual_jsonl_manifest,
          )

          START = int(os.environ["FIRST_V1_LAUNCH"])
          HEAD = int(os.environ["SNAPSHOT_HEAD"])

          registry = [
              json.loads(line)
              for line in Path(
                  "registry/pons-full-launch-registry.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          v1 = [row for row in registry if row.get("version") == "v1"]
          launch_by_pool = {
              row["pool"].lower(): int(row["block_number"])
              for row in v1
          }
          assert len(launch_by_pool) == len(v1), (
              len(launch_by_pool), len(v1)
          )

          files = (
              list(Path("partial").glob("v1-v3-events-shard-*.jsonl"))
              + list(Path("prior-gaps").glob("v1-v3-events-gap-*.jsonl"))
              + list(Path("gaps").glob("v1-v3-events-gap-*.jsonl"))
          )
          if not files:
              raise SystemExit("no V1 V3 artifacts available for final merge")

          entries = []
          for path in files:
              manifest = json.loads(
                  path.with_suffix(path.suffix + ".manifest.json").read_text()
              )
              prov = manifest["provenance"]
              entries.append((
                  int(prov["from_block"]),
                  int(prov["to_block"]),
                  path,
                  manifest,
              ))
          entries.sort(key=lambda item: item[0])

          previous_hi = None
          expected_records = 0
          manifests = []
          for lo, hi, path, manifest in entries:
              if previous_hi is None:
                  assert lo == START, (lo, START, path.name)
              else:
                  assert lo == previous_hi + 1, (
                      previous_hi, lo, path.name
                  )
              previous_hi = hi
              expected_records += int(manifest["records"])
              manifests.append({
                  "source": path.parent.name,
                  "file": path.name,
                  "sha256": manifest["sha256"],
                  "records": int(manifest["records"]),
                  "from_block": lo,
                  "to_block": hi,
              })
          assert previous_hi == HEAD, (previous_hi, HEAD)

          initialized = set()
          matched = set()
          counts = {
              "records": 0,
              "v3_initialize": 0,
              "v3_swap": 0,
          }

          def rows():
              prior = None
              for _, _, path, manifest in entries:
                  local = 0
                  with path.open() as handle:
                      for line in handle:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          order = event_order(row)
                          if prior is not None:
                              assert prior < order, (prior, order, path.name)
                          prior = order
                          pool = row["pool"].lower()
                          assert pool in launch_by_pool, pool
                          assert int(row["block_number"]) >= launch_by_pool[pool]
                          kind = row["event_type"]
                          assert kind in {"v3_initialize", "v3_swap"}, kind
                          if kind == "v3_initialize":
                              initialized.add(pool)
                          matched.add(pool)
                          counts[kind] += 1
                          counts["records"] += 1
                          local += 1
                          yield row
                  assert local == int(manifest["records"]), (
                      path.name, local, manifest["records"]
                  )

          digest = hashlib.sha256()
          for row in rows():
              digest.update(canonical_jsonl_bytes(row))
          snapshot = write_virtual_jsonl_manifest(
              manifest_path=Path(
                  "artifacts/pons-v1-v3-full.jsonl.manifest.json"
              ),
              path_name="pons-v1-v3-full.jsonl",
              records=counts["records"],
              sha256=digest.hexdigest(),
              provenance={
                  "source": "manifest_gap_aware_v1_v3_recovery",
                  "chain_id": 4663,
                  "snapshot_head_block": HEAD,
                  "source_registry_run_id": int(
                      "${{ inputs.source_registry_run_id }}"
                  ),
                  "partial_run_id": int("${{ inputs.partial_run_id }}"),
                  "prior_gap_run_id": (
                      int("${{ inputs.prior_gap_run_id }}")
                      if "${{ inputs.prior_gap_run_id }}"
                      else None
                  ),
                  "storage_mode": "sharded_artifacts",
                  "filter_semantics": (
                      "global V3 Initialize/Swap topic scan followed by "
                      "frozen Pons V1 pool membership"
                  ),
                  "shards": manifests,
              },
          )
          assert counts["records"] == expected_records
          missing = sorted(set(launch_by_pool) - initialized)
          assert not missing, (
              "Pons V1 pools missing V3 Initialize",
              missing[:20],
              len(missing),
          )
          summary = {
              "snapshot_head_block": HEAD,
              "v1_registry_tokens": len(v1),
              "registered_pools": len(launch_by_pool),
              "matched_pools": len(matched),
              "v3_initializes": counts["v3_initialize"],
              "v3_swaps": counts["v3_swap"],
              "records": counts["records"],
              "missing_initialize_pools": 0,
              "tape_sha256": snapshot["sha256"],
              "source_files": len(entries),
          }
          Path("artifacts/pons-v1-v3-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-v3-full
          path: artifacts/
          if-no-files-found: error
