    if: ${{ always() && needs.plan.result == 'success' && (needs.recover_1.result == 'success' || needs.recover_1.result == 'skipped') && (needs.recover_2.result == 'success' || needs.recover_2.result == 'skipped') && (needs.recover_3.result == 'success' || needs.recover_3.result == 'skipped') && (needs.recover_4.result == 'success' || needs.recover_4.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Download every original V1/V3 shard artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARTIAL_RUN_ID: ${{ inputs.partial_run_id }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import urllib.request
          import zipfile
          from pathlib import Path

          from hlp.data.github_actions import (
              fetch_github_actions_artifact_zip,
          )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          run_id = int(os.environ["PARTIAL_RUN_ID"])
          name_pattern = re.compile(r"^phase1-pons-v1-v3-(\d+)$")

          from hlp.data.github_actions import (
              fetch_github_actions_json,
          )

          def request(path, *, decode_json=True):
              payload = fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=60,
              )
              if not decode_json:
                  raise SystemExit(
                      "raw metadata reads are not supported here"
                  )
              return payload

          selected = []
          page = 1
          while True:
              payload = request(
                  f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                  f"?per_page=100&page={page}"
              )
              rows = list(payload.get("artifacts") or [])
              for row in rows:
                  match = name_pattern.fullmatch(str(row.get("name") or ""))
                  if match and not row.get("expired"):
                      selected.append((int(match.group(1)), row))
              if len(rows) < 100:
                  break
              page += 1
              if page > 20:
                  raise SystemExit(
                      "V1/V3 source artifact pagination exceeded 2000"
                  )

          selected.sort(key=lambda item: item[0])
          indexes = [index for index, _ in selected]
          if not selected:
              raise SystemExit(
                  "V1/V3 source has no original shard artifacts"
              )
          if len(indexes) != len(set(indexes)):
              raise SystemExit(
                  "V1/V3 source contains duplicate shard artifact indexes"
              )

          target = Path("partial")
          target.mkdir(parents=True, exist_ok=True)
          extracted = 0
          for index, artifact in selected:
              blob = fetch_github_actions_artifact_zip(
                  api
                  + f"/repos/{repo}/actions/artifacts/"
                  + f"{int(artifact['id'])}/zip",
                  token,
              )
              with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                  for member in archive.infolist():
                      if member.is_dir():
                          continue
                      name = Path(member.filename).name
                      if not name:
                          continue
                      destination = target / name
                      if destination.exists():
                          raise SystemExit(
                              "duplicate V1/V3 shard file while downloading "
                              f"artifact index {index}: {name}"
                          )
                      destination.write_bytes(archive.read(member))
                      extracted += 1

          print(json.dumps({
              "source_run_id": run_id,
              "source_artifact_pages": page,
              "original_shard_artifacts": len(selected),
              "first_shard_index": indexes[0],
              "last_shard_index": indexes[-1],
              "extracted_files": extracted,
          }, sort_keys=True))
          PY
      - name: Download recursive paginated V1/V3 gap artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARTIAL_RUN_ID: ${{ inputs.partial_run_id }}
          PRIOR_GAP_RUN_ID: ${{ inputs.prior_gap_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_GAP_COUNT: ${{ needs.plan.outputs.gap_count }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import urllib.request
          import zipfile
          from pathlib import Path

          from hlp.data.github_actions import (
              fetch_github_actions_artifact_zip,
              select_equivalent_artifact_retry,
          )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          partial_run_id = int(os.environ["PARTIAL_RUN_ID"])
          prior_run_id = int(os.environ["PRIOR_GAP_RUN_ID"] or 0)
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          current_gap_count = int(os.environ["CURRENT_GAP_COUNT"])
          plan_artifact = "phase1-pons-v1-v3-gap-plan"
          plan_name = "v1-v3-gap-plan.json"
          expected_start = 8_621_658
          expected_head = 54_486_035
          gap_pattern = re.compile(
              r"^phase1-pons-v1-v3-gap-(\d+)$"
          )

          from hlp.data.github_actions import (
              fetch_github_actions_json,
          )

          def request(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=60,
              )

          def artifact_rows(run_id):
              output = []
              page = 1
              while True:
                  payload = request(
                      f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                      f"?per_page=100&page={page}"
                  )
                  rows = list(payload.get("artifacts") or [])
                  output.extend(
                      row for row in rows if not row.get("expired")
                  )
                  if len(rows) < 100:
                      break
                  page += 1
                  if page > 20:
                      raise SystemExit(
                          "V1/V3 merge gap artifact pagination "
                          "exceeded 2000"
                      )
              return output, page

          def successful_repair_gap_ids(run_id):
              pattern = re.compile(
                  r"(?:^| / )recover_[1-4] \((\d{3}),"
              )
              successful = set()
              page = 1
              while True:
                  payload = request(
                      f"/repos/{repo}/actions/runs/{run_id}/jobs"
                      f"?per_page=100&page={page}"
                  )
                  rows = list(payload.get("jobs") or [])
                  for row in rows:
                      match = pattern.search(str(row.get("name") or ""))
                      if (
                          match is not None
                          and str(row.get("conclusion") or "") == "success"
                      ):
                          successful.add(match.group(1))
                  if len(rows) < 100:
                      break
                  page += 1
                  if page > 10:
                      raise SystemExit(
                          "V1/V3 merge prior gap job pagination "
                          "exceeded 1000"
                      )
              return successful

          def artifact_zip(artifact):
              return fetch_github_actions_artifact_zip(
                  api
                  + f"/repos/{repo}/actions/artifacts/"
                  + f"{int(artifact['id'])}/zip",
                  token,
              )

          def gap_rows(rows, run_id):
              grouped = {}
              for row in rows:
                  match = gap_pattern.fullmatch(
                      str(row.get("name") or "")
                  )
                  if match:
                      grouped.setdefault(
                          match.group(1),
                          [],
                      ).append(row)

              selected = []
              for gap_id, candidates in grouped.items():
                  try:
                      artifact = select_equivalent_artifact_retry(
                          candidates,
                          label=(
                              "V1/V3 merge gap artifact "
                              f"run={run_id} gap={gap_id}"
                          ),
                      )
                  except ValueError as exc:
                      raise SystemExit(
                          "V1/V3 merge duplicate retry artifacts "
                          "are not equivalent: "
                          f"run={run_id} gap={gap_id}: {exc}"
                      ) from exc
                  selected.append((gap_id, artifact))
              selected.sort(key=lambda item: int(item[0]))
              return selected

          def extract_rows(selected, target, run_id, planned):
              target.mkdir(parents=True, exist_ok=True)
              extracted = 0
              for gap_id, artifact in selected:
                  if gap_id not in planned:
                      raise SystemExit(
                          "V1/V3 merge gap artifact is not bound "
                          f"by its plan: run={run_id} gap={gap_id}"
                      )
                  expected_bounds = tuple(planned[gap_id])
                  blob = artifact_zip(artifact)
                  with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                      manifest_members = [
                          member
                          for member in archive.infolist()
                          if not member.is_dir()
                          and Path(member.filename).name.endswith(
                              ".jsonl.manifest.json"
                          )
                      ]
                      if len(manifest_members) != 1:
                          raise SystemExit(
                              "V1/V3 merge gap manifest identity "
                              f"is ambiguous: run={run_id} gap={gap_id}"
                          )
                      manifest = json.loads(
                          archive.read(manifest_members[0])
                      )
                      provenance = manifest.get("provenance") or {}
                      observed_bounds = (
                          int(provenance.get("from_block", -1)),
                          int(provenance.get("to_block", -1)),
                      )
                      if observed_bounds != expected_bounds:
                          raise SystemExit(
                              "V1/V3 merge gap manifest range "
                              "does not match plan: "
                              f"run={run_id} gap={gap_id} "
                              f"observed={observed_bounds} "
                              f"expected={expected_bounds}"
                          )
                      if str(provenance.get("source") or "") != "evm_json_rpc":
                          raise SystemExit(
                              "V1/V3 merge gap source changed: "
                              f"run={run_id} gap={gap_id}"
                          )
                      if int(provenance.get("chain_id", -1)) != 4663:
                          raise SystemExit(
                              "V1/V3 merge gap chain changed: "
                              f"run={run_id} gap={gap_id}"
                          )
                      if str(provenance.get("protocol") or "") != (
                          "uniswap_v3_shared_price_tape"
                      ):
                          raise SystemExit(
                              "V1/V3 merge gap protocol changed: "
                              f"run={run_id} gap={gap_id}"
                          )
                      if str(provenance.get("registry") or "") != (
                          "pons-full-launch-registry.jsonl"
                      ):
                          raise SystemExit(
                              "V1/V3 merge gap frozen input changed: "
                              f"run={run_id} gap={gap_id}"
                          )
                      if str(
                          provenance.get("pool_filter_mode") or ""
                      ) != "global_topic_then_registry":
                          raise SystemExit(
                              "V1/V3 merge gap filter mode changed: "
                              f"run={run_id} gap={gap_id}"
                          )
                      for member in archive.infolist():
                          if member.is_dir():
                              continue
                          name = Path(member.filename).name
                          if not name:
                              continue
                          destination = target / name
                          if destination.exists():
                              raise SystemExit(
                                  "duplicate V1/V3 gap file while "
                                  "downloading paginated artifacts: "
                                  f"run={run_id} gap={gap_id} file={name}"
                              )
                          destination.write_bytes(
                              archive.read(member)
                          )
                          extracted += 1
              return extracted

          prior_total = 0
          prior_ignored_non_success = 0
          prior_generations = 0
          seen_runs = set()
          cursor = prior_run_id
          while cursor:
              if cursor in seen_runs:
                  raise SystemExit(
                      "V1/V3 merge prior gap lineage contains a cycle"
                  )
              seen_runs.add(cursor)
              prior_generations += 1
              if prior_generations > 20:
                  raise SystemExit(
                      "V1/V3 merge prior gap lineage exceeds 20 generations"
                  )

              rows, pages = artifact_rows(cursor)
              successful_gap_ids = successful_repair_gap_ids(cursor)
              plan_rows = [
                  row
                  for row in rows
                  if str(row.get("name") or "") == plan_artifact
              ]
              try:
                  plan_row = select_equivalent_artifact_retry(
                      plan_rows,
                      label=(
                          "V1/V3 merge prior gap plan artifact "
                          f"run={cursor}"
                      ),
                  )
              except ValueError as exc:
                  raise SystemExit(
                      "V1/V3 merge prior plan retry artifacts are not "
                      "equivalent: "
                      f"run={cursor}: {exc}"
                  ) from exc
              payload = artifact_zip(plan_row)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  names = [
                      name
                      for name in archive.namelist()
                      if name.rsplit("/", 1)[-1] == plan_name
                  ]
                  if len(names) != 1:
                      raise SystemExit(
                          "V1/V3 merge prior gap plan file identity "
                          f"is ambiguous: run={cursor}"
                      )
                  plan = json.loads(archive.read(names[0]))

              if int(plan.get("partial_run_id", 0)) != partial_run_id:
                  raise SystemExit(
                      "V1/V3 merge prior gap partial source changed"
                  )
              if int(plan.get("snapshot_head", -1)) != expected_head:
                  raise SystemExit(
                      "V1/V3 merge prior gap snapshot head changed"
                  )
              if int(plan.get("first_v1_launch", -1)) != expected_start:
                  raise SystemExit(
                      "V1/V3 merge prior gap start block changed"
                  )

              from hlp.data.ranges import validate_gap_plan_jobs

              try:
                  planned = validate_gap_plan_jobs(
                      plan,
                      expected_start=expected_start,
                      expected_end=expected_head,
                  )
              except ValueError as exc:
                  raise SystemExit(
                      "V1/V3 merge prior gap plan structure changed: "
                      f"{exc}"
                  ) from exc

              selected = gap_rows(rows, cursor)
              for gap_id, _ in selected:
                  if gap_id not in planned:
                      raise SystemExit(
                          "V1/V3 merge prior gap artifact is not bound "
                          f"by its plan: run={cursor} gap={gap_id}"
                      )
              ignored_gap_ids = [
                  gap_id
                  for gap_id, _ in selected
                  if gap_id not in successful_gap_ids
              ]
              selected = [
                  item
                  for item in selected
                  if item[0] in successful_gap_ids
              ]
              prior_ignored_non_success += len(ignored_gap_ids)
              target = Path("prior-gaps") / str(cursor)
              extracted = extract_rows(
                  selected,
                  target,
                  cursor,
                  planned,
              )
              prior_total += len(selected)
              print(json.dumps({
                  "run_id": cursor,
                  "artifact_pages": pages,
                  "gap_artifacts": len(selected),
                  "ignored_non_success_artifacts": len(
                      ignored_gap_ids
                  ),
                  "extracted_files": extracted,
              }, sort_keys=True))

              parent = plan.get("prior_gap_run_id")
              cursor = (
                  int(parent)
                  if parent not in {None, "", 0}
                  else 0
              )

          current_rows, current_pages = artifact_rows(current_run_id)
          current_plan_rows = [
              row
              for row in current_rows
              if str(row.get("name") or "") == plan_artifact
          ]
          try:
              current_plan_row = select_equivalent_artifact_retry(
                  current_plan_rows,
                  label=(
                      "V1/V3 merge current gap plan artifact "
                      f"run={current_run_id}"
                  ),
              )
          except ValueError as exc:
              raise SystemExit(
                  "V1/V3 merge current plan retry artifacts are not "
                  "equivalent: "
                  f"run={current_run_id}: {exc}"
              ) from exc
          current_plan_payload = artifact_zip(current_plan_row)
          with zipfile.ZipFile(
              io.BytesIO(current_plan_payload)
          ) as archive:
              current_plan_names = [
                  name
                  for name in archive.namelist()
                  if name.rsplit("/", 1)[-1] == plan_name
              ]
              if len(current_plan_names) != 1:
                  raise SystemExit(
                      "V1/V3 merge current gap plan file identity "
                      f"is ambiguous: run={current_run_id}"
                  )
              current_plan_bytes = archive.read(
                  current_plan_names[0]
              )
              current_plan = json.loads(current_plan_bytes)
          if int(
              current_plan.get("partial_run_id", 0)
          ) != partial_run_id:
              raise SystemExit(
                  "V1/V3 merge current gap partial source changed"
              )
          if int(
              current_plan.get("snapshot_head", -1)
          ) != expected_head:
              raise SystemExit(
                  "V1/V3 merge current gap snapshot head changed"
              )
          if int(
              current_plan.get("first_v1_launch", -1)
          ) != expected_start:
              raise SystemExit(
                  "V1/V3 merge current gap start block changed"
              )
          current_parent = current_plan.get("prior_gap_run_id")
          current_parent_id = (
              int(current_parent)
              if current_parent not in {None, "", 0}
              else 0
          )
          if current_parent_id != prior_run_id:
              raise SystemExit(
                  "V1/V3 merge current gap prior lineage changed"
              )
          from hlp.data.ranges import validate_gap_plan_jobs

          try:
              current_planned = validate_gap_plan_jobs(
                  current_plan,
                  expected_start=expected_start,
                  expected_end=expected_head,
              )
          except ValueError as exc:
              raise SystemExit(
                  "V1/V3 merge current gap plan structure changed: "
                  f"{exc}"
              ) from exc

          current_selected = gap_rows(
              current_rows,
              current_run_id,
          )
          current_gap_ids = {
              gap_id for gap_id, _ in current_selected
          }
          if current_gap_ids != set(current_planned):
              raise SystemExit(
                  "current V1/V3 gap artifact IDs do not match "
                  "plan: "
                  f"observed={sorted(current_gap_ids)} "
                  f"expected={sorted(current_planned)}"
              )
          if len(current_selected) != current_gap_count:
              raise SystemExit(
                  "current V1/V3 gap artifact count does not match "
                  f"plan: observed={len(current_selected)} "
                  f"expected={current_gap_count}"
              )
          current_extracted = extract_rows(
              current_selected,
              Path("gaps"),
              current_run_id,
              current_planned,
          )
          Path("plan").mkdir(parents=True, exist_ok=True)
          (Path("plan") / plan_name).write_bytes(current_plan_bytes)
          print(json.dumps({
              "prior_gap_generations": prior_generations,
              "prior_gap_artifacts": prior_total,
              "prior_ignored_non_success_artifacts": (
                  prior_ignored_non_success
              ),
              "current_run_id": current_run_id,
              "current_artifact_pages": current_pages,
              "current_gap_artifacts": len(current_selected),
              "current_extracted_files": current_extracted,
              "current_gap_count": current_gap_count,
          }, sort_keys=True))
          PY
      - id: download_registry
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 registry download before retry
        if: ${{ steps.download_registry.outcome == 'failure' }}
        run: rm -rf registry
      - id: retry_download_registry
        name: Retry frozen V1 registry artifact download
        if: ${{ steps.download_registry.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial V1 registry download before final retry
        if: ${{ steps.retry_download_registry.outcome == 'failure' }}
        run: rm -rf registry
      - name: Final frozen V1 registry artifact download retry
        if: ${{ steps.retry_download_registry.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-full-registry-recovered
          path: registry
          run-id: ${{ inputs.source_registry_run_id }}
          github-token: ${{ github.token }}
      - name: Merge recovered V1 V3 event tape
        run: |
          mkdir -p artifacts
          cp plan/v1-v3-gap-plan.json artifacts/
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.data.ranges import select_contiguous_cover
          from hlp.data.reconstruct import event_order
          from hlp.data.sharded_tape import (
              canonical_jsonl_bytes,
              write_virtual_jsonl_manifest,
          )

          START = int(os.environ["FIRST_V1_LAUNCH"])
          HEAD = int(os.environ["SNAPSHOT_HEAD"])

          registry = [
              json.loads(line)
              for line in Path(
                  "registry/pons-full-launch-registry.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          v1 = [row for row in registry if row.get("version") == "v1"]
          launch_by_pool = {
              row["pool"].lower(): int(row["block_number"])
              for row in v1
          }
          assert len(launch_by_pool) == len(v1), (
              len(launch_by_pool), len(v1)
          )

          files = (
              list(Path("partial").glob("v1-v3-events-shard-*.jsonl"))
              + list(Path("prior-gaps").rglob("v1-v3-events-gap-*.jsonl"))
              + list(Path("gaps").glob("v1-v3-events-gap-*.jsonl"))
          )
          if not files:
              raise SystemExit("no V1 V3 artifacts available for final merge")

          candidates = []
          for path in files:
              manifest = json.loads(
                  path.with_suffix(path.suffix + ".manifest.json").read_text()
              )
              prov = manifest["provenance"]
              candidates.append((
                  int(prov["from_block"]),
                  int(prov["to_block"]),
                  path,
                  manifest,
              ))
          selected_indexes = select_contiguous_cover(
              START,
              HEAD,
              [(lo, hi) for lo, hi, _, _ in candidates],
          )
          entries = [candidates[index] for index in selected_indexes]
          candidate_source_files = len(candidates)
          dropped_overlapping_source_files = (
              candidate_source_files - len(entries)
          )

          previous_hi = None
          expected_records = 0
          manifests = []
          for lo, hi, path, manifest in entries:
              if previous_hi is None:
                  assert lo == START, (lo, START, path.name)
              else:
                  assert lo == previous_hi + 1, (
                      previous_hi, lo, path.name
                  )
              previous_hi = hi
              expected_records += int(manifest["records"])
              manifests.append({
                  "source": path.parent.name,
                  "file": path.name,
                  "sha256": manifest["sha256"],
                  "records": int(manifest["records"]),
                  "from_block": lo,
                  "to_block": hi,
              })
          assert previous_hi == HEAD, (previous_hi, HEAD)

          initialized = set()
          matched = set()
          counts = {
              "records": 0,
              "v3_initialize": 0,
              "v3_swap": 0,
          }

          def rows():
              prior = None
              for _, _, path, manifest in entries:
                  assert manifest.get("path") == path.name, (
                      path.name,
                      manifest.get("path"),
                  )
                  local = 0
                  local_digest = hashlib.sha256()
                  with path.open("rb") as handle:
                      for raw in handle:
                          local_digest.update(raw)
                          if not raw.strip():
                              continue
                          row = json.loads(raw)
                          order = event_order(row)
                          if prior is not None:
                              assert prior < order, (prior, order, path.name)
                          prior = order
                          pool = row["pool"].lower()
                          assert pool in launch_by_pool, pool
                          assert int(row["block_number"]) >= launch_by_pool[pool]
                          kind = row["event_type"]
                          assert kind in {"v3_initialize", "v3_swap"}, kind
                          if kind == "v3_initialize":
                              initialized.add(pool)
                          matched.add(pool)
                          counts[kind] += 1
                          counts["records"] += 1
                          local += 1
                          yield row
                  assert local == int(manifest["records"]), (
                      path.name, local, manifest["records"]
                  )
                  assert local_digest.hexdigest() == manifest["sha256"], (
                      path.name,
                      local_digest.hexdigest(),
                      manifest["sha256"],
                  )

          digest = hashlib.sha256()
          for row in rows():
              digest.update(canonical_jsonl_bytes(row))
          snapshot = write_virtual_jsonl_manifest(
              manifest_path=Path(
                  "artifacts/pons-v1-v3-full.jsonl.manifest.json"
              ),
              path_name="pons-v1-v3-full.jsonl",
              records=counts["records"],
              sha256=digest.hexdigest(),
              provenance={
                  "source": "manifest_gap_aware_v1_v3_recovery",
                  "chain_id": 4663,
                  "snapshot_head_block": HEAD,
