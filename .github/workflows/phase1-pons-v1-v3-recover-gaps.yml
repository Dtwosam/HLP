name: phase1-pons-v1-v3-recover-gaps

on:
  workflow_dispatch:
    inputs:
      source_registry_run_id:
        description: "Run containing phase1-pons-full-registry-recovered"
        required: true
        default: "33911022718"
        type: string
      partial_run_id:
        description: "Interrupted phase1-pons-v1-v3-full run with successful shard artifacts"
        required: true
        type: string
      prior_gap_run_id:
        description: "Optional earlier V1 V3 gap-recovery run whose successful gaps must be reused"
        required: false
        default: ""
        type: string
      expected_prior_reusable_gap_count:
        description: "Optional launcher-pinned reusable prior-gap artifact count"
        required: false
        default: ""
        type: string
      expected_prior_terminal_snapshot_sha256:
        description: "Optional launcher-pinned prior terminal snapshot digest"
        required: false
        default: ""
        type: string
      max_gap_blocks:
        description: "Maximum blocks per retry job"
        required: true
        default: "50000"
        type: string
  workflow_call:
    inputs:
      source_registry_run_id:
        required: true
        type: string
      partial_run_id:
        required: true
        type: string
      prior_gap_run_id:
        required: false
        default: ""
        type: string
      expected_prior_reusable_gap_count:
        required: false
        default: ""
        type: string
      expected_prior_terminal_snapshot_sha256:
        required: false
        default: ""
        type: string
      max_gap_blocks:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-v1-v3-recover-gaps-${{ github.ref }}
  cancel-in-progress: false

env:
  FIRST_V1_LAUNCH: '8621658'
  SNAPSHOT_HEAD: '54486035'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix_1: ${{ steps.plan.outputs.matrix_1 }}
      matrix_2: ${{ steps.plan.outputs.matrix_2 }}
      matrix_3: ${{ steps.plan.outputs.matrix_3 }}
      matrix_4: ${{ steps.plan.outputs.matrix_4 }}
      gap_count: ${{ steps.plan.outputs.gap_count }}
      gap_count_1: ${{ steps.plan.outputs.gap_count_1 }}
      gap_count_2: ${{ steps.plan.outputs.gap_count_2 }}
      gap_count_3: ${{ steps.plan.outputs.gap_count_3 }}
      gap_count_4: ${{ steps.plan.outputs.gap_count_4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Verify frozen V1 registry input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ inputs.source_registry_run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import urllib.request
          import zipfile

          from hlp.data.github_actions import (
              fetch_github_actions_artifact_zip,
          )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          run_id = int(os.environ["UPSTREAM_RUN_ID"])
          expected_run_id = 33_911_022_718
          expected_path = ".github/workflows/phase1-pons-v1-registry-recovery.yml"
          expected_sha = "6506e15224b83b12cfd85b607d3fdb55a0d3b026"
          artifact_name = "phase1-pons-full-registry-recovered"
          manifest_name = "pons-full-launch-registry.jsonl.manifest.json"

          if run_id != expected_run_id:
              raise SystemExit(
                  "V1 registry run ID changed: "
                  f"observed={run_id} expected={expected_run_id}"
              )

          from hlp.data.github_actions import (
              fetch_github_actions_json,
          )

          def request(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=60,
              )

          run = request(f"/repos/{repo}/actions/runs/{run_id}")
          if run.get("status") != "completed" or (
              run.get("conclusion") != "success"
          ):
              raise SystemExit(
                  "V1 registry run is not successful"
              )
          if str(run.get("path") or "").split("@", 1)[0] != expected_path:
              raise SystemExit(
                  "V1 registry workflow path changed"
              )
          if run.get("head_branch") != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "V1 registry branch changed"
              )
          if str(run.get("head_sha") or "") != expected_sha:
              raise SystemExit(
                  "V1 registry launch commit changed"
              )

          matches = []
          page = 1
          while True:
              payload = request(
                  f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                  f"?per_page=100&page={page}"
              )
              rows = list(payload.get("artifacts") or [])
              matches.extend(
                  row
                  for row in rows
                  if not row.get("expired")
                  and str(row.get("name") or "") == artifact_name
              )
              if len(rows) < 100:
                  break
              page += 1
              if page > 20:
                  raise SystemExit(
                      "V1 registry artifact pagination exceeded 2000"
                  )
          if len(matches) != 1:
              raise SystemExit(
                  "V1 registry artifact identity is ambiguous"
              )

          payload = fetch_github_actions_artifact_zip(
              api
              + f"/repos/{repo}/actions/artifacts/"
              + f"{int(matches[0]['id'])}/zip",
              token,
          )
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              names = [
                  name
                  for name in archive.namelist()
                  if name.rsplit("/", 1)[-1] == manifest_name
              ]
              if len(names) != 1:
                  raise SystemExit(
                      "V1 registry manifest identity is ambiguous"
                  )
              manifest = json.loads(archive.read(names[0]))
              data_names = [
                  name
                  for name in archive.namelist()
                  if name.rsplit("/", 1)[-1] == "pons-full-launch-registry.jsonl"
              ]
              if len(data_names) != 1:
                  raise SystemExit(
                      "V1 registry data identity is ambiguous"
                  )
              actual_digest = hashlib.sha256()
              actual_records = 0
              with archive.open(data_names[0]) as handle:
                  for raw in handle:
                      actual_digest.update(raw)
                      if raw.strip():
                          actual_records += 1

          provenance = manifest.get("provenance") or {}
          checks = {
              "path": manifest.get("path") == "pons-full-launch-registry.jsonl",
              "records": int(manifest.get("records", -1)) == 494_639,
              "sha256": str(manifest.get("sha256") or "") == (
                  "c75b93b5b8ace0caad3376b5e79c6dcdb9ba675fce9085f6db7458f3694d30ed"
              ),
              "chain_id": int(provenance.get("chain_id", -1)) == 4663,
              "snapshot_head": int(
                  provenance.get("snapshot_head_block", -1)
              ) == 54_486_035,
              "source": str(provenance.get("source") or "") == (
                  "merged_raw_rpc_registry_shards_same_head_recovery"
              ),
              "v1_recovery_run_id": int(
                  provenance.get("v1_recovery_run_id", 0)
              ) == 33_911_022_718,
          }
          checks["actual_sha256"] = (
              actual_digest.hexdigest() == str(manifest.get("sha256") or "")
          )
          checks["actual_records"] = (
              actual_records == int(manifest.get("records", -1))
          )
          failed = sorted(
              key for key, passed in checks.items() if not passed
          )
          if failed:
              raise SystemExit(
                  "V1 registry manifest changed: "
                  + ", ".join(failed)
              )
          print(json.dumps({
              "run_id": run_id,
              "artifact": artifact_name,
              "manifest": manifest_name,
              "records": int(manifest["records"]),
              "sha256": manifest["sha256"],
              "actual_records": actual_records,
              "actual_sha256": actual_digest.hexdigest(),
              "verification": "pass",
          }, sort_keys=True))
          PY
      - name: Refuse frozen-parent recovery while source is active
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARTIAL_RUN_ID: ${{ inputs.partial_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          partial_run_id = int(os.environ["PARTIAL_RUN_ID"])
          if partial_run_id != 33_982_556_591:
              raise SystemExit(0)

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          from hlp.data.github_actions import (
              fetch_github_actions_json,
          )

          run = fetch_github_actions_json(
              api + f"/repos/{repo}/actions/runs/{partial_run_id}",
              token,
              timeout=30,
          )
          if run.get("status") != "completed":
              raise SystemExit(
                  "frozen parent recovery is blocked while source is active"
              )
          if str(run.get("path") or "").split("@", 1)[0] != (
              ".github/workflows/"
              "phase1-pons-full-eligibility-acquisition-one-shot.yml"
          ):
              raise SystemExit(
                  "frozen parent recovery source workflow path changed"
              )
          if run.get("head_branch") != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "frozen parent recovery source branch changed"
              )
          if str(run.get("head_sha") or "") != (
              "c53b3a63156976a5873752c332fa7578011249b0"
          ):
              raise SystemExit(
                  "frozen parent recovery source launch commit changed"
              )
          PY
      - name: Verify recursive prior recovery lineage
        if: ${{ inputs.prior_gap_run_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARTIAL_RUN_ID: ${{ inputs.partial_run_id }}
          PRIOR_GAP_RUN_ID: ${{ inputs.prior_gap_run_id }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import urllib.request
          import zipfile

          from hlp.data.github_actions import (
              fetch_github_actions_artifact_zip,
              select_equivalent_artifact_retry,
          )

          partial_run_id = int(os.environ["PARTIAL_RUN_ID"])
          prior_run_id = int(os.environ["PRIOR_GAP_RUN_ID"])
          if partial_run_id <= 0 or prior_run_id <= 0:
              raise SystemExit(
                  "recovery lineage run IDs must be positive"
              )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          artifact_name = "phase1-pons-v1-v3-gap-plan"
          plan_name = "v1-v3-gap-plan.json"
          allowed_paths = {
              ".github/workflows/phase1-pons-v1-v3-recover-gaps.yml",
              ".github/workflows/phase1-pons-live-venue-rescue-one-shot.yml",
              ".github/workflows/"
              "phase1-pons-full-eligibility-acquisition-one-shot.yml"
          }

          from hlp.data.github_actions import (
              fetch_github_actions_json,
          )

          def request(path, *, decode_json=True):
              payload = fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=30,
              )
              if not decode_json:
                  raise SystemExit(
                      "raw metadata reads are not supported here"
                  )
              return payload

          def plan_for(run_id):
              run = request(f"/repos/{repo}/actions/runs/{run_id}")
              if run.get("status") != "completed":
                  raise SystemExit(
                      "prior recovery lineage run is not terminal: "
                      f"{run_id}"
                  )
              path = str(run.get("path") or "").split("@", 1)[0]
              if path not in allowed_paths:
                  raise SystemExit(
                      "prior recovery lineage workflow path is not allowed: "
                      f"{path}"
                  )
              if run.get("head_branch") != "phase1/data-acquisition-spike":
                  raise SystemExit(
                      "prior recovery lineage branch changed: "
                      f"{run_id}"
                  )

              matches = []
              page = 1
              while True:
                  payload = request(
                      f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                      f"?per_page=100&page={page}"
                  )
                  rows = list(payload.get("artifacts") or [])
                  matches.extend(
                      row
                      for row in rows
                      if not row.get("expired")
                      and str(row.get("name")) == artifact_name
                  )
                  if len(rows) < 100:
                      break
                  page += 1
                  if page > 20:
                      raise SystemExit(
                          "prior recovery artifact pagination exceeded 2000"
                      )
              try:
                  plan_artifact_row = select_equivalent_artifact_retry(
                      matches,
                      label=(
                          "prior recovery plan artifact "
                          f"run={run_id}"
                      ),
                  )
              except ValueError as exc:
                  raise SystemExit(
                      "prior recovery plan retry artifacts are not "
                      "equivalent: "
                      f"run={run_id}: {exc}"
                  ) from exc

              payload = fetch_github_actions_artifact_zip(
                  api
                  + f"/repos/{repo}/actions/artifacts/"
                  + f"{int(plan_artifact_row['id'])}/zip",
                  token,
              )
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  names = [
                      name
                      for name in archive.namelist()
                      if name.rsplit("/", 1)[-1] == plan_name
                  ]
                  if len(names) != 1:
                      raise SystemExit(
                          "prior recovery plan identity is ambiguous: "
                          f"run={run_id}"
                      )
                  plan = json.loads(archive.read(names[0]))

              if "partial_run_id" not in plan or "prior_gap_run_id" not in plan:
                  raise SystemExit(
                      "prior recovery plan lacks bound lineage metadata: "
                      f"run={run_id}"
                  )
              if int(plan["partial_run_id"]) != partial_run_id:
                  raise SystemExit(
                      "prior recovery partial run does not match current "
                      f"partial source: run={run_id}"
                  )
              if int(plan.get("snapshot_head", -1)) != 54_486_035:
                  raise SystemExit(
                      "prior recovery plan snapshot head changed"
                  )
              if int(plan.get("first_v1_launch", -1)) != 8_621_658:
                  raise SystemExit(
                      "prior V1/V3 recovery plan start block changed"
                  )
              return plan

          seen = set()
          depth = 0
          cursor = prior_run_id
          while cursor:
              if cursor in seen:
                  raise SystemExit(
                      "prior recovery lineage contains a cycle"
                  )
              seen.add(cursor)
              depth += 1
              if depth > 20:
                  raise SystemExit(
                      "prior recovery lineage exceeds 20 generations"
                  )
              plan = plan_for(cursor)
              parent = plan.get("prior_gap_run_id")
              cursor = int(parent) if parent not in {None, "", 0} else 0

          print(json.dumps({
              "partial_run_id": partial_run_id,
              "prior_gap_run_id": prior_run_id,
              "verified_generations": depth,
              "lineage": "pass",
          }, sort_keys=True))
          PY
      - name: Discover original V1/V3 shard coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARTIAL_RUN_ID: ${{ inputs.partial_run_id }}
        run: |
          mkdir -p source-metadata
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          from hlp.data.ranges import indexed_shard_bounds

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          run_id = int(os.environ["PARTIAL_RUN_ID"])
          start = int(os.environ["FIRST_V1_LAUNCH"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          shard_count = 240
          name_pattern = re.compile(r"^phase1-pons-v1-v3-(\d+)$")

          from hlp.data.github_actions import (
              fetch_github_actions_json,
          )

          def request(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=60,
              )

          selected = []
          page = 1
          while True:
              payload = request(
                  f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                  f"?per_page=100&page={page}"
              )
              rows = list(payload.get("artifacts") or [])
              for row in rows:
                  match = name_pattern.fullmatch(str(row.get("name") or ""))
                  if not match or row.get("expired"):
                      continue
                  index = int(match.group(1))
                  lo, hi = indexed_shard_bounds(
                      start,
                      head,
                      index,
                      shard_count,
                  )
                  selected.append({
                      "artifact_id": int(row["id"]),
                      "artifact_name": str(row["name"]),
                      "shard_index": index,
                      "from_block": lo,
                      "to_block": hi,
                  })
              if len(rows) < 100:
                  break
              page += 1
              if page > 20:
                  raise SystemExit(
                      "V1/V3 source artifact pagination exceeded 2000"
                  )

          selected.sort(key=lambda row: row["shard_index"])
          indexes = [row["shard_index"] for row in selected]
          if not selected:
              raise SystemExit(
                  "V1/V3 source has no original shard artifacts"
              )
          if len(indexes) != len(set(indexes)):
              raise SystemExit(
                  "V1/V3 source contains duplicate shard artifact indexes"
              )

          Path(
              "source-metadata/v1-v3-original-shards.json"
          ).write_text(
              json.dumps(selected, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "source_run_id": run_id,
              "source_artifact_pages": page,
              "original_shard_artifacts": len(selected),
              "first_shard_index": indexes[0],
              "last_shard_index": indexes[-1],
              "planning_source_bytes_downloaded": 0,
          }, sort_keys=True))
          PY
      - name: Discover reusable prior V1/V3 gap coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARTIAL_RUN_ID: ${{ inputs.partial_run_id }}
          PRIOR_GAP_RUN_ID: ${{ inputs.prior_gap_run_id }}
          EXPECTED_PRIOR_REUSABLE_GAP_COUNT: ${{ inputs.expected_prior_reusable_gap_count }}
          EXPECTED_PRIOR_TERMINAL_SNAPSHOT_SHA256: ${{ inputs.expected_prior_terminal_snapshot_sha256 }}
        run: |
          mkdir -p source-metadata
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.request
          import zipfile
          from pathlib import Path

          from hlp.data.github_actions import (
              build_rescue_terminal_binding,
              fetch_github_actions_artifact_zip,
              rescue_terminal_binding_sha256,
              select_equivalent_artifact_retry,
          )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          partial_run_id = int(os.environ["PARTIAL_RUN_ID"])
          cursor = int(os.environ["PRIOR_GAP_RUN_ID"] or 0)
          immediate_prior_id = cursor
          expected_reusable_text = os.environ[
              "EXPECTED_PRIOR_REUSABLE_GAP_COUNT"
          ].strip()
          expected_snapshot_sha256 = os.environ[
              "EXPECTED_PRIOR_TERMINAL_SNAPSHOT_SHA256"
          ].strip()
          expected_reusable_count = None
          if expected_reusable_text:
              expected_reusable_count = int(expected_reusable_text)
              if expected_reusable_count < 0:
                  raise SystemExit(
                      "V1/V3 expected reusable prior-gap count "
                      "must be non-negative"
                  )
          if bool(expected_reusable_text) != bool(
              expected_snapshot_sha256
          ):
              raise SystemExit(
                  "V1/V3 launcher prior binding inputs must be supplied "
                  "together"
              )
          if expected_snapshot_sha256 and (
              len(expected_snapshot_sha256) != 64
              or any(
                  char not in "0123456789abcdef"
                  for char in expected_snapshot_sha256
              )
          ):
              raise SystemExit(
                  "V1/V3 expected prior terminal snapshot SHA-256 "
                  "is invalid"
              )
          if expected_snapshot_sha256 and immediate_prior_id <= 0:
              raise SystemExit(
                  "V1/V3 launcher prior binding requires prior gap run"
              )
          plan_artifact = "phase1-pons-v1-v3-gap-plan"
          plan_name = "v1-v3-gap-plan.json"
          gap_pattern = re.compile(r"^phase1-pons-v1-v3-gap-(\d+)$")
          expected_start = 8_621_658
          expected_head = 54_486_035

          from hlp.data.github_actions import (
              fetch_github_actions_json,
          )

          def request(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=60,
              )

          def artifact_rows(run_id):
              output = []
              page = 1
              while True:
                  payload = request(
                      f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                      f"?per_page=100&page={page}"
                  )
                  rows = list(payload.get("artifacts") or [])
                  output.extend(
                      row for row in rows if not row.get("expired")
                  )
                  if len(rows) < 100:
                      break
                  page += 1
                  if page > 20:
                      raise SystemExit(
                          "prior gap coverage artifact pagination "
                          "exceeded 2000"
                      )
              return output

          def successful_repair_gap_ids(run_id):
              pattern = re.compile(
                  r"(?:^| / )recover_[1-4] \((\d{3}),"
              )
              successful = set()
              page = 1
              while True:
                  payload = request(
                      f"/repos/{repo}/actions/runs/{run_id}/jobs"
                      f"?per_page=100&page={page}"
                  )
                  rows = list(payload.get("jobs") or [])
                  for row in rows:
                      match = pattern.search(str(row.get("name") or ""))
                      if (
                          match is not None
                          and str(row.get("conclusion") or "") == "success"
                      ):
                          successful.add(match.group(1))
                  if len(rows) < 100:
                      break
                  page += 1
                  if page > 10:
                      raise SystemExit(
                          "V1/V3 prior gap job pagination "
                          "exceeded 1000"
                      )
              return successful

          coverage = []
          ignored_non_success_artifacts = 0
          seen_runs = set()
          depth = 0
          while cursor:
              if cursor in seen_runs:
                  raise SystemExit(
                      "prior gap coverage lineage contains a cycle"
                  )
              seen_runs.add(cursor)
              depth += 1
              if depth > 20:
                  raise SystemExit(
                      "prior gap coverage lineage exceeds 20 generations"
                  )

              rows = artifact_rows(cursor)
              successful_gap_ids = successful_repair_gap_ids(cursor)
              plan_rows = [
                  row
                  for row in rows
                  if str(row.get("name") or "") == plan_artifact
              ]
              try:
                  plan_row = select_equivalent_artifact_retry(
                      plan_rows,
                      label=(
                          "prior gap coverage plan artifact "
                          f"run={cursor}"
                      ),
                  )
              except ValueError as exc:
                  raise SystemExit(
                      "prior gap coverage plan retry artifacts are not "
                      "equivalent: "
                      f"run={cursor}: {exc}"
                  ) from exc

              payload = fetch_github_actions_artifact_zip(
                  api
                  + f"/repos/{repo}/actions/artifacts/"
                  + f"{int(plan_row['id'])}/zip",
                  token,
              )
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  names = [
                      name
                      for name in archive.namelist()
                      if name.rsplit("/", 1)[-1] == plan_name
                  ]
                  if len(names) != 1:
                      raise SystemExit(
                          "prior gap coverage plan file identity "
                          f"is ambiguous: run={cursor}"
                      )
                  plan = json.loads(archive.read(names[0]))

              if int(plan.get("partial_run_id", 0)) != partial_run_id:
                  raise SystemExit(
                      "prior gap coverage partial source changed"
                  )
              if int(plan.get("snapshot_head", -1)) != expected_head:
                  raise SystemExit(
                      "prior gap coverage snapshot head changed"
                  )
              if int(plan.get("first_v1_launch", -1)) != expected_start:
                  raise SystemExit(
                      "prior gap coverage start block changed"
                  )

              from hlp.data.ranges import validate_gap_plan_jobs

              try:
                  planned = validate_gap_plan_jobs(
                      plan,
                      expected_start=expected_start,
                      expected_end=expected_head,
                  )
              except ValueError as exc:
                  raise SystemExit(
                      "prior gap coverage plan structure changed: "
                      f"{exc}"
                  ) from exc

              observed_groups = {}
              for row in rows:
                  match = gap_pattern.fullmatch(
                      str(row.get("name") or "")
                  )
                  if not match:
                      continue
                  gap_id = match.group(1)
                  observed_groups.setdefault(gap_id, []).append(row)

              observed = {}
              collapsed_retry_artifacts = 0
              for gap_id, candidates in observed_groups.items():
                  try:
                      observed[gap_id] = select_equivalent_artifact_retry(
                          candidates,
                          label=(
                              "prior V1/V3 gap artifact "
                              f"run={cursor} gap={gap_id}"
                          ),
                      )
                  except ValueError as exc:
                      raise SystemExit(
                          "prior gap coverage duplicate retry artifacts "
                          "are not equivalent: "
                          f"run={cursor} gap={gap_id}: {exc}"
                      ) from exc
                  collapsed_retry_artifacts += len(candidates) - 1

              reusable_gap_ids = []
              for gap_id, row in observed.items():
                  if gap_id not in planned:
                      raise SystemExit(
                          "prior gap artifact is not bound by its plan: "
                          f"run={cursor} gap={gap_id}"
                      )
                  if gap_id not in successful_gap_ids:
                      ignored_non_success_artifacts += 1
                      continue
                  bounds = planned[gap_id]
                  reusable_gap_ids.append(gap_id)
                  coverage.append({
                      "run_id": cursor,
                      "artifact_id": int(row["id"]),
                      "artifact_name": str(row["name"]),
                      "gap_id": gap_id,
                      "from_block": bounds[0],
                      "to_block": bounds[1],
                  })

              if cursor == immediate_prior_id:
                  if expected_reusable_count is not None and (
                      len(reusable_gap_ids) != expected_reusable_count
                  ):
                      raise SystemExit(
                          "V1/V3 launcher/planner reusable prior-gap "
                          "count changed"
                      )
                  if expected_snapshot_sha256:
                      prior_run = request(
                          f"/repos/{repo}/actions/runs/{cursor}"
                      )
                      artifact_names = {
                          str(row.get("name") or "")
                          for row in rows
                      }
                      terminal_binding = build_rescue_terminal_binding(
                          run_id=cursor,
                          status=prior_run.get("status"),
                          conclusion=prior_run.get("conclusion"),
                          head_sha=prior_run.get("head_sha"),
                          display_title=prior_run.get("display_title"),
                          run_attempt=prior_run.get("run_attempt"),
                          reusable_gap_ids=reusable_gap_ids,
                          missing_success_artifacts=(
                              successful_gap_ids - set(observed)
                          ),
                          non_success_gap_artifacts=(
                              set(observed) - successful_gap_ids
                          ),
                          plan_artifact_present=(
                              plan_artifact in artifact_names
                          ),
                          canonical_artifact_present=(
                              "phase1-pons-v1-v3-full" in artifact_names
                          ),
                      )
                      observed_snapshot_sha256 = (
                          rescue_terminal_binding_sha256(
                              terminal_binding
                          )
                      )
                      if observed_snapshot_sha256 != (
                          expected_snapshot_sha256
                      ):
                          raise SystemExit(
                              "V1/V3 launcher/child prior terminal "
                              "snapshot digest changed"
                          )

              parent = plan.get("prior_gap_run_id")
              cursor = (
                  int(parent)
                  if parent not in {None, "", 0}
                  else 0
              )

          Path("source-metadata/v1-v3-prior-gap-coverage.json").write_text(
              json.dumps(coverage, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "prior_gap_generations": depth,
              "reusable_prior_gap_artifacts": len(coverage),
              "ignored_non_success_artifacts": (
                  ignored_non_success_artifacts
              ),
              "planning_prior_gap_jsonl_bytes_downloaded": 0,
          }, sort_keys=True))
          PY
      - id: plan
        name: Derive only missing V1 V3 ranges
        env:
          MAX_GAP_BLOCKS: ${{ inputs.max_gap_blocks }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.data.ranges import (
              coalesce_covered_ranges,
              plan_missing_subranges,
              validate_gap_plan_jobs,
          )

          start = int(os.environ["FIRST_V1_LAUNCH"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          max_blocks = int(os.environ["MAX_GAP_BLOCKS"])
          if not 1 <= max_blocks <= 100_000:
              raise SystemExit(
                  "max_gap_blocks must be between 1 and 100000"
              )

          source_rows = json.loads(
              Path(
                  "source-metadata/v1-v3-original-shards.json"
              ).read_text()
          )
          prior_gap_rows = json.loads(
              Path("source-metadata/v1-v3-prior-gap-coverage.json").read_text()
          )
          if not source_rows and not prior_gap_rows:
              raise SystemExit(
                  "recovery sources have no successful V1 V3 artifacts"
              )

          covered = []
          sources = []
          for row in source_rows:
              lo = int(row["from_block"])
              hi = int(row["to_block"])
              covered.append((lo, hi))
              sources.append({
                  "source": "partial-run-artifact-metadata",
                  "artifact": row["artifact_name"],
                  "artifact_id": int(row["artifact_id"]),
                  "shard_index": int(row["shard_index"]),
                  "from_block": lo,
                  "to_block": hi,
              })
          for row in prior_gap_rows:
              lo = int(row["from_block"])
              hi = int(row["to_block"])
              covered.append((lo, hi))
              sources.append({
                  "source": "prior-gap-artifact-metadata",
                  "run_id": int(row["run_id"]),
                  "artifact": row["artifact_name"],
                  "artifact_id": int(row["artifact_id"]),
                  "gap_id": row["gap_id"],
                  "from_block": lo,
                  "to_block": hi,
              })

          covered = coalesce_covered_ranges(
              start,
              head,
              covered,
          )
          gaps = plan_missing_subranges(
              start,
              head,
              covered,
              max_blocks=max_blocks,
          )
          if len(gaps) > 960:
              raise SystemExit(
                  "V1 V3 gap plan exceeds four serialized 240-job waves"
              )
          include = [
              {
                  "id": f"{index:03d}",
                  "from_block": lo,
                  "to_block": hi,
              }
              for index, (lo, hi) in enumerate(gaps)
          ]
          wave_1 = include[:240]
          wave_2 = include[240:480]
          wave_3 = include[480:720]
          wave_4 = include[720:]
          report = {
              "first_v1_launch": start,
              "snapshot_head": head,
              "partial_run_id": int("${{ inputs.partial_run_id }}"),
              "prior_gap_run_id": (
                  int("${{ inputs.prior_gap_run_id }}")
                  if "${{ inputs.prior_gap_run_id }}"
                  else None
              ),
              "max_gap_blocks": max_blocks,
              "successful_sources": sources,
              "gap_jobs": include,
              "gap_job_count": len(include),
              "gap_wave_job_counts": [
                  len(wave_1),
                  len(wave_2),
                  len(wave_3),
                  len(wave_4),
              ],
              "gap_blocks": sum(
                  row["to_block"] - row["from_block"] + 1
                  for row in include
              ),
          }
          try:
              validate_gap_plan_jobs(
                  report,
                  expected_start=start,
                  expected_end=head,
              )
          except ValueError as exc:
              raise SystemExit(
                  "V1/V3 generated gap plan is invalid: "
                  f"{exc}"
              ) from exc
          Path("artifacts/v1-v3-gap-plan.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "matrix_1="
                  + json.dumps({"include": wave_1}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(
                  "matrix_2="
                  + json.dumps({"include": wave_2}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(
                  "matrix_3="
                  + json.dumps({"include": wave_3}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(
                  "matrix_4="
                  + json.dumps({"include": wave_4}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"gap_count={len(include)}\n")
              handle.write(f"gap_count_1={len(wave_1)}\n")
              handle.write(f"gap_count_2={len(wave_2)}\n")
              handle.write(f"gap_count_3={len(wave_3)}\n")
              handle.write(f"gap_count_4={len(wave_4)}\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - id: upload_plan
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v1-v3-gap-plan
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_plan
        name: Retry V1/V3 gap-plan artifact upload
