name: phase2-dump-diagnostics-completion

on:
  workflow_dispatch:
    inputs:
      launch_run_id:
        description: Exact successful phase2-dump-diagnostics-launch workflow_dispatch run ID
        required: true
        type: string
      expected_launch_artifact_digest:
        description: Exact diagnostics launch artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-dump-diagnostics-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      LAUNCH_RUN_ID: ${{ inputs.launch_run_id }}
      EXPECTED_LAUNCH_DIGEST: ${{ inputs.expected_launch_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: complete
        name: Verify structural diagnostics and publish freeze evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess,time
          from pathlib import Path
          from hlp.data.phase2_dump_candidate_dispatch import (
              validate_phase2_dump_diagnostics_launch_receipt,
              validate_phase2_dump_diagnostics_completion_receipt,
          )
          from hlp.data.phase2_dump_research import (
              PHASE2_DUMP_CANDIDATE_DIAGNOSTICS_HANDOFF_VERSION,
              build_phase2_dump_candidate_diagnostics_handoff,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl
          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(path): return json.loads(subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",f"/repos/{repo}/{path}"]))
          def identity(row,workflow,run_id):
              if row.get("path")!=f".github/workflows/{workflow}" or row.get("event")!="workflow_dispatch" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head: raise SystemExit(f"run {run_id} identity drift")
          def wait(run_id,workflow):
              deadline=time.monotonic()+2700
              while True:
                  row=api(f"actions/runs/{run_id}"); identity(row,workflow,run_id)
                  if row.get("status")=="completed":
                      if row.get("conclusion")!="success": raise SystemExit(f"run {run_id} failed: {row.get('conclusion')}")
                      return
                  if time.monotonic()>=deadline: raise SystemExit(f"run {run_id} timed out")
                  time.sleep(10)
          def artifact(run_id,name):
              rows=api(f"actions/runs/{run_id}/artifacts?name={name}").get("artifacts",[])
              rows=[x for x in rows if x.get("name")==name and not x.get("expired")]
              if len(rows)!=1: raise SystemExit(f"{name} artifact cardinality drift")
              return rows[0]
          def download(run_id,name,dest):
              root=Path(dest)
              if root.exists(): shutil.rmtree(root)
              root.mkdir(parents=True)
              subprocess.check_call(["gh","run","download",str(run_id),"--repo",repo,"--name",name,"--dir",str(root)])
              return root
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          launch_run=int(os.environ["LAUNCH_RUN_ID"]); lr=api(f"actions/runs/{launch_run}")
          identity(lr,"phase2-dump-diagnostics-launch.yml",launch_run)
          if lr.get("status")!="completed" or lr.get("conclusion")!="success": raise SystemExit("diagnostics launch is not successful")
          lname="phase2-dump-diagnostics-launch"; la=artifact(launch_run,lname)
          actual_launch=str(la.get("digest") or "").lower()
          if actual_launch!=os.environ["EXPECTED_LAUNCH_DIGEST"].lower(): raise SystemExit("diagnostics launch digest drift")
          lroot=download(launch_run,lname,"upstream/launch")
          launch=validate_phase2_dump_diagnostics_launch_receipt(json.loads((lroot/"phase2-dump-diagnostics-launch-receipt.json").read_text()))
          target=launch["diagnostics_run_id"]; wait(target,"phase2-dump-candidate-diagnostics.yml")
          name="phase2-dump-candidate-diagnostics"; art=artifact(target,name)
          root=download(target,name,"upstream/diagnostics")
          summary_path=root/"phase2-dump-candidate-diagnostics-summary.json"
          manifest_path=root/"phase2-dump-candidate-diagnostics.jsonl.manifest.json"
          data_path=root/"phase2-dump-candidate-diagnostics.jsonl"
          handoff_path=root/"phase2-dump-candidate-diagnostics-handoff.json"
          summary=json.loads(summary_path.read_text()); manifest=json.loads(manifest_path.read_text()); handoff=json.loads(handoff_path.read_text())
          summary_sha=sha(summary_path); handoff_sha=sha(handoff_path)
          if handoff.get("version")!=PHASE2_DUMP_CANDIDATE_DIAGNOSTICS_HANDOFF_VERSION: raise SystemExit("diagnostics handoff version drift")
          rebuilt=build_phase2_dump_candidate_diagnostics_handoff(summary,diagnostics_sha256=str(manifest.get("sha256") or ""),diagnostics_summary_sha256=summary_sha,candidate_research_handoff_sha256=launch["candidate_research_handoff_sha256"])
          if rebuilt!=handoff: raise SystemExit("diagnostics handoff semantic drift")
          candidate_ids=sorted({str(row["candidate_id"]) for row in iter_validated_jsonl(data_path,manifest_path)})
          if len(candidate_ids)!=int(handoff["candidates"]): raise SystemExit("diagnostics candidate ID set drift")
          receipt={
              "version":"phase2-dump-diagnostics-completion-receipt-v1",
              "diagnostics_completion_control_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "diagnostics_launch_run_id":launch_run,
              "diagnostics_launch_artifact_digest":actual_launch,
              "candidate_research_run_id":launch["candidate_research_run_id"],
              "candidate_research_artifact_digest":launch["candidate_research_artifact_digest"],
              "candidate_research_handoff_sha256":launch["candidate_research_handoff_sha256"],
              "diagnostics_run_id":target,
              "diagnostics_artifact_digest":str(art.get("digest") or "").lower(),
              "diagnostics_sha256":handoff["diagnostics_sha256"],
              "diagnostics_summary_sha256":handoff["diagnostics_summary_sha256"],
              "diagnostics_handoff_sha256":handoff_sha,
              "execution_branch":branch,
              "execution_head_sha":head,
              "canonical_ledger_commit_sha":launch["canonical_ledger_commit_sha"],
              "candidate_specs_sha256":handoff["candidate_specs_sha256"],
              "candidate_count":int(handoff["candidates"]),
              "candidate_ids":candidate_ids,
              "detector_freeze_base_inputs":{
                  "candidate_research_run_id":str(launch["candidate_research_run_id"]),
                  "expected_candidate_artifact_digest":launch["candidate_research_artifact_digest"],
                  "expected_candidate_handoff_sha256":launch["candidate_research_handoff_sha256"],
                  "diagnostics_run_id":str(target),
                  "expected_diagnostics_artifact_digest":str(art.get("digest") or "").lower(),
                  "expected_diagnostics_handoff_sha256":handoff_sha,
              },
              "target_run_completed":True,
              "target_run_successful":True,
              "uses_outcome_labels":False,
              "candidate_selected":False,
              "detector_freeze_ready":False,
              "phase2_dump_detector_frozen":False,
              "outcome_labels_computed":False,
              "workflow_dispatch_performed":False,
          }
          receipt=validate_phase2_dump_diagnostics_completion_receipt(receipt)
          Path("artifacts/phase2-dump-diagnostics-completion-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as h:
              h.write("candidate_ids_json="+json.dumps(candidate_ids,separators=(",",":"))+"\n")
          PY
      - name: Upload diagnostics completion receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dump-diagnostics-completion
          path: artifacts/phase2-dump-diagnostics-completion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish detector-freeze boundary
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_IDS_JSON: ${{ steps.complete.outputs.candidate_ids_json }}
        run: |
          {
            echo "## Phase-2 candidate diagnostics completion"
            echo "- completion_run_id: ${GITHUB_RUN_ID}"
            echo "- completion_artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- candidate_ids: ${CANDIDATE_IDS_JSON}"
            echo "- selected_candidate_id_required: true"
            echo "- candidate_selected: false"
            echo "- detector_freeze_ready: false"
            echo "- phase2_dump_detector_frozen: false"
          } >> "${GITHUB_STEP_SUMMARY}"
