name: phase2-pools-trade-lbp-registry-backfill

on:
  workflow_dispatch:
    inputs:
      launcher_run_id:
        description: Successful phase2-pools-trade-launcher-backfill run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase2-pools-trade-lbp-registry-backfill-${{ github.ref }}
  cancel-in-progress: false

env:
  REQUIRED_START_BLOCK: '6222785'
  SHARED_LAUNCHER_START_BLOCK: '3338007'
  SNAPSHOT_HEAD: '54486035'
  SHARD_COUNT: '256'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.build.outputs.shards }}
    steps:
      - id: build
        run: |
          python - <<'PY'
          import json
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "shards="
                  + json.dumps(list(range(int(os.environ["SHARD_COUNT"]))))
                  + "\n"
              )
          PY

  shard:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.matrix.outputs.shards) }}
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: bounds
        name: Compute LBP initializer shard bounds
        run: |
          python - <<'PY'
          import os
          start = int(os.environ["REQUIRED_START_BLOCK"])
          end = int(os.environ["SNAPSHOT_HEAD"])
          index = int(os.environ["SHARD_INDEX"])
          count = int(os.environ["SHARD_COUNT"])
          span = end - start + 1
          lo = start + span * index // count
          hi = start + span * (index + 1) // count - 1
          if hi < lo:
              raise SystemExit(
                  f"empty pools.trade LBP shard {index}: {lo}..{hi}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"lo={lo}\n")
              handle.write(f"hi={hi}\n")
          PY
      - name: Acquire LBP initializers and initializer-block state
        env:
          FROM_BLOCK: ${{ steps.bounds.outputs.lo }}
          TO_BLOCK: ${{ steps.bounds.outputs.hi }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then
            CHUNK=50000
          else
            CHUNK=200
          fi
          printf -v SHARD "%03d" "$SHARD_INDEX"
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-pools-trade-lbp-initializer-tape \
            --from-block "$FROM_BLOCK" \
            --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" \
            --min-chunk-size 25 \
            --out "artifacts/pools-trade-lbp-initializers-${SHARD}.jsonl" \
            --state-out "artifacts/pools-trade-lbp-state-${SHARD}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-pools-trade-lbp-initializer-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LAUNCHER_RUN_ID: ${{ inputs.launcher_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase2-pools-trade-lbp-initializer-*
          path: inputs/lbp
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: phase2-pools-trade-launcher-merged
          path: inputs/launcher
          github-token: ${{ github.token }}
          run-id: ${{ inputs.launcher_run_id }}

      - name: Validate and merge full LBP initializer population
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.data.sharded_tape import (
              iter_sharded_jsonl,
              validate_shard_block_coverage,
              write_virtual_jsonl_manifest,
          )
          from hlp.data.snapshot import write_jsonl_snapshot
          from hlp.protocols.pools_trade_lbp import (
              INITIALIZER_CREATED_TOPIC,
              POOLS_TRADE_LBP_STRATEGY,
          )

          root = Path("inputs/lbp")
          start = int(os.environ["REQUIRED_START_BLOCK"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          count = int(os.environ["SHARD_COUNT"])
          init_files = sorted(
              root.glob("pools-trade-lbp-initializers-*.jsonl")
          )
          state_files = sorted(
              root.glob("pools-trade-lbp-state-*.jsonl")
          )
          if len(init_files) != count or len(state_files) != count:
              raise SystemExit(
                  "pools.trade LBP shard population changed: "
                  f"initializers={len(init_files)} "
                  f"states={len(state_files)} expected={count}"
              )

          init_digest = hashlib.sha256()
          state_digest = hashlib.sha256()
          init_rows = []
          state_rows = []
          shards = []
          for init_path in init_files:
              suffix = init_path.stem.rsplit("-", 1)[-1]
              state_path = root / f"pools-trade-lbp-state-{suffix}.jsonl"
              init_manifest = json.loads(
                  init_path.with_suffix(
                      init_path.suffix + ".manifest.json"
                  ).read_text()
              )
              state_manifest = json.loads(
                  state_path.with_suffix(
                      state_path.suffix + ".manifest.json"
                  ).read_text()
              )
              prov = init_manifest.get("provenance") or {}
              state_prov = state_manifest.get("provenance") or {}
              if prov.get("source") != "pools_trade_lbp_initializer_events":
                  raise SystemExit(
                      f"{init_path.name}: LBP event source drift"
                  )
              if prov.get("strategy") != POOLS_TRADE_LBP_STRATEGY.lower():
                  raise SystemExit(
                      f"{init_path.name}: LBP strategy drift"
                  )
              if prov.get("event_topic0") != INITIALIZER_CREATED_TOPIC:
                  raise SystemExit(
                      f"{init_path.name}: LBP topic drift"
                  )
              if state_prov.get("source") != (
                  "pools_trade_lbp_initializer_block_erc20_state"
              ):
                  raise SystemExit(
                      f"{state_path.name}: LBP state source drift"
                  )
              if (
                  int(state_prov["from_block"]) != int(prov["from_block"])
                  or int(state_prov["to_block"]) != int(prov["to_block"])
              ):
                  raise SystemExit(
                      f"{state_path.name}: LBP state range drift"
                  )

              init_blob = init_path.read_bytes()
              state_blob = state_path.read_bytes()
              init_sha = hashlib.sha256(init_blob).hexdigest()
              state_sha = hashlib.sha256(state_blob).hexdigest()
              if init_sha != init_manifest["sha256"]:
                  raise SystemExit(
                      f"{init_path.name}: LBP initializer SHA drift"
                  )
              if state_sha != state_manifest["sha256"]:
                  raise SystemExit(
                      f"{state_path.name}: LBP state SHA drift"
                  )
              local_init = [
                  json.loads(line)
                  for line in init_blob.decode().splitlines()
                  if line.strip()
              ]
              local_state = [
                  json.loads(line)
                  for line in state_blob.decode().splitlines()
                  if line.strip()
              ]
              if len(local_init) != int(init_manifest["records"]):
                  raise SystemExit(
                      f"{init_path.name}: LBP initializer count drift"
                  )
              if len(local_state) != int(state_manifest["records"]):
                  raise SystemExit(
                      f"{state_path.name}: LBP state count drift"
                  )
              if len(local_state) != len(local_init):
                  raise SystemExit(
                      f"{suffix}: LBP initializer/state count drift"
                  )

              init_digest.update(init_blob)
              state_digest.update(state_blob)
              init_rows.extend(local_init)
              state_rows.extend(local_state)
              shards.append({
                  "file": init_path.name,
                  "records": int(init_manifest["records"]),
                  "sha256": init_sha,
                  "from_block": int(prov["from_block"]),
                  "to_block": int(prov["to_block"]),
              })

          shards = validate_shard_block_coverage(
              shards,
              start_block=start,
              end_block=head,
          )
          tokens = [str(row["token"]).lower() for row in init_rows]
          initializers = [
              str(row["initializer"]).lower()
              for row in init_rows
          ]
          if len(tokens) != len(set(tokens)):
              raise SystemExit(
                  "pools.trade LBP initializer tape repeats token"
              )
          if len(initializers) != len(set(initializers)):
              raise SystemExit(
                  "pools.trade LBP initializer tape repeats initializer"
              )

          state_by_token = {}
          for row in state_rows:
              token = str(row["token"]).lower()
              if token in state_by_token:
                  raise SystemExit(
                      f"duplicate pools.trade LBP state: {token}"
                  )
              state_by_token[token] = row
          if set(state_by_token) != set(tokens):
              raise SystemExit(
                  "pools.trade LBP state/token population drift"
              )
          for row in init_rows:
              token = str(row["token"]).lower()
              state = state_by_token[token]
              if int(state["state_block"]) != int(row["block_number"]):
                  raise SystemExit(
                      f"pools.trade LBP state block drift: {token}"
                  )
              if int(state["supply_raw"]) <= 0:
                  raise SystemExit(
                      f"pools.trade LBP state supply invalid: {token}"
                  )

          virtual = write_virtual_jsonl_manifest(
              manifest_path=Path(
                  "artifacts/"
                  "pools-trade-lbp-initializers-sharded.manifest.json"
              ),
              path_name="pools-trade-lbp-initializers.jsonl",
              records=len(init_rows),
              sha256=init_digest.hexdigest(),
              provenance={
                  "storage_mode": "sharded_artifacts",
                  "source": "phase2_pools_trade_lbp_initializers",
                  "chain_id": 4663,
                  "from_block": start,
                  "to_block": head,
                  "strategy": POOLS_TRADE_LBP_STRATEGY.lower(),
                  "shards": shards,
              },
          )
          merged_init = write_jsonl_snapshot(
              init_rows,
              output=Path(
                  "artifacts/pools-trade-lbp-initializers.jsonl"
              ),
              provenance={
                  "source": "merged_pools_trade_lbp_initializers",
                  "chain_id": 4663,
                  "required_start_block": start,
                  "snapshot_head_block": head,
                  "sharded_sha256": virtual["sha256"],
              },
          )
          if merged_init["sha256"] != virtual["sha256"]:
              raise SystemExit(
                  "pools.trade LBP merged initializer bytes changed"
              )

          merged_state = write_jsonl_snapshot(
              state_rows,
              output=Path("artifacts/pools-trade-lbp-state.jsonl"),
              provenance={
                  "source": "merged_pools_trade_lbp_initializer_state",
                  "chain_id": 4663,
                  "initializers_sha256": merged_init["sha256"],
                  "state_semantics": (
                      "ERC20 decimals/totalSupply at exact "
                      "InitializerCreated block"
                  ),
              },
          )
          if merged_state["sha256"] != state_digest.hexdigest():
              raise SystemExit(
                  "pools.trade LBP merged state bytes changed"
              )
          PY

      - name: Validate shared launcher identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path(
                  "inputs/launcher/pools-trade-launcher-summary.json"
              ).read_text()
          )
          if summary["version"] != (
              "phase2-pools-trade-launcher-backfill-v1"
          ):
              raise SystemExit("pools.trade launcher version drift")
          if int(summary["required_start_block"]) != int(
              os.environ["SHARED_LAUNCHER_START_BLOCK"]
          ):
              raise SystemExit("pools.trade launcher start drift")
          if int(summary["snapshot_head_block"]) != int(
              os.environ["SNAPSHOT_HEAD"]
          ):
              raise SystemExit("pools.trade launcher snapshot drift")
          if summary["continuous"] is not True or summary["missing_ranges"]:
              raise SystemExit(
                  "pools.trade launcher coverage is incomplete"
              )
          for kind in ("created", "distributed"):
              path = Path(
                  f"inputs/launcher/pools-trade-{kind}.jsonl"
              )
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != summary[f"{kind}_sha256"]:
                  raise SystemExit(
                      f"pools.trade launcher {kind} SHA drift"
                  )
          PY

      - name: Build state-backed LBP registry
        run: |
          hlp pools-trade-lbp-registry \
            --created inputs/launcher/pools-trade-created.jsonl \
            --distributed inputs/launcher/pools-trade-distributed.jsonl \
            --initializers artifacts/pools-trade-lbp-initializers.jsonl \
            --states artifacts/pools-trade-lbp-state.jsonl \
            --out artifacts/pools-trade-lbp-registry.jsonl

      - name: Freeze LBP registry handoff
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          registry_path = Path(
              "artifacts/pools-trade-lbp-registry.jsonl"
          )
          registry_manifest = json.loads(
              registry_path.with_suffix(
                  registry_path.suffix + ".manifest.json"
              ).read_text()
          )
          init_manifest = json.loads(
              Path(
                  "artifacts/"
                  "pools-trade-lbp-initializers.jsonl.manifest.json"
              ).read_text()
          )
          state_manifest = json.loads(
              Path(
                  "artifacts/"
                  "pools-trade-lbp-state.jsonl.manifest.json"
              ).read_text()
          )
          launcher_summary = json.loads(
              Path(
                  "inputs/launcher/pools-trade-launcher-summary.json"
              ).read_text()
          )
          registry = [
              json.loads(line)
              for line in registry_path.read_text().splitlines()
              if line.strip()
          ]
          initializers = [
              json.loads(line)
              for line in Path(
                  "artifacts/pools-trade-lbp-initializers.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          if len(registry) != len(initializers):
              raise SystemExit(
                  "pools.trade LBP registry/initializer population drift"
              )
          tokens = [row["token"].lower() for row in registry]
          auctions = [row["initializer"].lower() for row in registry]
          pools = [row["pool_id"].lower() for row in registry]
          if len(tokens) != len(set(tokens)):
              raise SystemExit(
                  "pools.trade LBP registry repeats token"
              )
          if len(auctions) != len(set(auctions)):
              raise SystemExit(
                  "pools.trade LBP registry repeats initializer"
              )
          if len(pools) != len(set(pools)):
              raise SystemExit(
                  "pools.trade LBP registry repeats derived PoolId"
              )
          start = int(os.environ["REQUIRED_START_BLOCK"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          for row in registry:
              if int(row["initializer_block"]) < start:
                  raise SystemExit(
                      "pools.trade LBP initializer before required start"
                  )
              if int(row["initializer_block"]) > head:
                  raise SystemExit(
                      "pools.trade LBP initializer after snapshot"
                  )
              if int(row["migration_block"]) <= int(
                  row["initializer_block"]
              ):
                  raise SystemExit(
                      "pools.trade LBP migration block is not future"
                  )
              if int(row["state_block"]) != int(
                  row["initializer_block"]
              ):
                  raise SystemExit(
                      "pools.trade LBP supply state block drift"
                  )
              if int(row["distribution_amount_raw"]) > int(
                  row["supply_raw"]
              ):
                  raise SystemExit(
                      "pools.trade LBP distribution exceeds supply"
                  )

          summary = {
              "version": "phase2-pools-trade-lbp-registry-v1",
              "source_id": "pools_trade_lbp",
              "required_start_block": start,
              "snapshot_head_block": head,
              "continuous_initializer_scan": True,
              "missing_ranges": [],
              "shards": int(os.environ["SHARD_COUNT"]),
              "launcher_run_id": int(os.environ["LAUNCHER_RUN_ID"]),
              "created_sha256": launcher_summary["created_sha256"],
              "distributed_sha256": launcher_summary[
                  "distributed_sha256"
              ],
              "initializers_sha256": init_manifest["sha256"],
              "initializer_state_sha256": state_manifest["sha256"],
              "registry_sha256": registry_manifest["sha256"],
              "tokens_discovered": len(registry),
              "initializers": len(auctions),
              "derived_pool_ids": len(pools),
              "quote_tokens": sorted({
                  row["quote_token"].lower() for row in registry
              }),
              "supply_seed_semantics": (
                  "initializer-block-end totalSupply; "
                  "TokenDistributed amount retained separately"
              ),
              "source_coverage_complete": False,
          }
          Path(
              "artifacts/pools-trade-lbp-registry-summary.json"
          ).write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: phase2-pools-trade-lbp-registry
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
