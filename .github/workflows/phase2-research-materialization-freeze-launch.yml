name: phase2-research-materialization-freeze-launch

on:
  workflow_dispatch:
    inputs:
      completion_run_id:
        description: Exact successful phase2-research-materialization-wave-completion workflow_dispatch run ID
        required: true
        type: string
      expected_completion_artifact_digest:
        description: Exact materialization-wave completion artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: phase2-research-materialization-freeze-launch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      COMPLETION_RUN_ID: ${{ inputs.completion_run_id }}
      EXPECTED_COMPLETION_DIGEST: ${{ inputs.expected_completion_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: launch
        name: Dispatch research materialization freeze
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import base64,json,os,shutil,subprocess
          from pathlib import Path
          from hlp.data.phase2_dispatch_readiness import workflow_dispatch_interface_sha256
          from hlp.data.phase2_research_materialization_dispatch import (
              validate_phase2_research_materialization_wave_completion_receipt,
              validate_phase2_research_materialization_freeze_launch_receipt,
          )
          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(args,payload=None):
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",*args],input=(json.dumps(payload,sort_keys=True,separators=(",",":")).encode() if payload is not None else None))
              return json.loads(raw) if raw.strip() else None
          def run(run_id,workflow):
              row=api([f"/repos/{repo}/actions/runs/{run_id}"])
              if row.get("path")!=f".github/workflows/{workflow}" or row.get("event")!="workflow_dispatch" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head:
                  raise SystemExit(f"run {run_id} identity drift")
              return row
          def artifact(run_id,name):
              rows=api([f"/repos/{repo}/actions/runs/{run_id}/artifacts?name={name}"]).get("artifacts",[])
              rows=[x for x in rows if x.get("name")==name and not x.get("expired")]
              if len(rows)!=1: raise SystemExit(f"{name} artifact cardinality drift")
              return rows[0]
          completion_run=int(os.environ["COMPLETION_RUN_ID"])
          row=run(completion_run,"phase2-research-materialization-wave-completion.yml")
          if row.get("status")!="completed" or row.get("conclusion")!="success": raise SystemExit("materialization completion is not successful")
          name="phase2-research-materialization-wave-completion"; art=artifact(completion_run,name)
          actual=str(art.get("digest") or "").lower()
          if actual!=os.environ["EXPECTED_COMPLETION_DIGEST"].lower(): raise SystemExit("materialization completion digest drift")
          root=Path("upstream/completion")
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          subprocess.check_call(["gh","run","download",str(completion_run),"--repo",repo,"--name",name,"--dir",str(root)])
          completion=validate_phase2_research_materialization_wave_completion_receipt(json.loads((root/"phase2-research-materialization-wave-completion-receipt.json").read_text()))
          workflow="phase2-research-materialization-freeze.yml"
          metadata=api([f"/repos/{repo}"]); default_branch=str(metadata.get("default_branch") or "")
          local=workflow_dispatch_interface_sha256(Path(".github/workflows",workflow).read_text())
          payload=api([f"/repos/{repo}/contents/.github/workflows/{workflow}?ref={default_branch}"])
          remote=workflow_dispatch_interface_sha256(base64.b64decode(str(payload.get("content") or "").replace("\n","")).decode())
          if local!=remote: raise SystemExit("default-branch materialization-freeze interface drift")
          response=api(["--method","POST",f"/repos/{repo}/actions/workflows/{workflow}/dispatches","--input","-"],{"ref":branch,"inputs":completion["materialization_freeze_inputs"]})
          target=int((response or {}).get("workflow_run_id",0))
          if target<=0: raise SystemExit("materialization-freeze dispatch lacks run ID")
          run(target,workflow)
          receipt={
              "version":"phase2-research-materialization-freeze-launch-receipt-v1",
              "materialization_freeze_control_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "materialization_completion_run_id":completion_run,
              "materialization_completion_artifact_digest":actual,
              "materialization_freeze_run_id":target,
              "execution_branch":branch,
              "execution_head_sha":head,
              "canonical_ledger_commit_sha":completion["canonical_ledger_commit_sha"],
              "rehydration_plan_run_id":completion["rehydration_plan_run_id"],
              "rehydration_plan_artifact_digest":completion["rehydration_plan_artifact_digest"],
              "rehydration_plan_sha256":completion["rehydration_plan_sha256"],
              "universe_run_id":completion["universe_run_id"],
              "universe_artifact_digest":completion["universe_artifact_digest"],
              "universe_handoff_sha256":completion["universe_handoff_sha256"],
              "target_runs_created":1,
              "target_run_waited_for_completion":False,
              "workflow_dispatch_performed":True,
          }
          receipt=validate_phase2_research_materialization_freeze_launch_receipt(receipt)
          Path("artifacts/phase2-research-materialization-freeze-launch-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as h: h.write(f"target_run_id={target}\n")
          PY
      - name: Upload materialization-freeze launch receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-materialization-freeze-launch
          path: artifacts/phase2-research-materialization-freeze-launch-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish materialization-freeze launch summary
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          TARGET_RUN_ID: ${{ steps.launch.outputs.target_run_id }}
        run: |
          {
            echo "## Phase-2 research materialization freeze launch"
            echo "- launch_run_id: ${GITHUB_RUN_ID}"
            echo "- launch_artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- materialization_freeze_run_id: ${TARGET_RUN_ID}"
            echo "- target_runs_created: 1"
          } >> "${GITHUB_STEP_SUMMARY}"
