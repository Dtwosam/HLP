name: phase3-feature-store

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Exact phase3-feature-staging run ID
        required: true
        type: string
      expected_staging_artifact_digest:
        description: Exact phase3-feature-staging artifact digest (sha256:...)
        required: true
        type: string
      expected_staging_handoff_sha256:
        description: Exact SHA-256 of phase3-feature-staging-handoff.json
        required: true
        type: string
      coverage_run_id:
        description: Exact phase3-feature-coverage run ID
        required: true
        type: string
      expected_coverage_artifact_digest:
        description: Exact phase3-feature-coverage artifact digest (sha256:...)
        required: true
        type: string
      expected_coverage_handoff_sha256:
        description: Exact SHA-256 of phase3-feature-coverage-handoff.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-feature-store-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_RUN_ID: ${{ inputs.staging_run_id }}
  EXPECTED_STAGING_ARTIFACT_DIGEST: ${{ inputs.expected_staging_artifact_digest }}
  EXPECTED_STAGING_HANDOFF_SHA256: ${{ inputs.expected_staging_handoff_sha256 }}
  COVERAGE_RUN_ID: ${{ inputs.coverage_run_id }}
  EXPECTED_COVERAGE_ARTIFACT_DIGEST: ${{ inputs.expected_coverage_artifact_digest }}
  EXPECTED_COVERAGE_HANDOFF_SHA256: ${{ inputs.expected_coverage_handoff_sha256 }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: finalize
        name: Validate and materialize final Phase-3 feature store
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_feature_coverage import (
              build_phase3_feature_coverage_handoff,
          )
          from hlp.data.phase3_feature_registry import (
              build_phase3_feature_registry,
              validate_phase3_feature_registry,
          )
          from hlp.data.phase3_feature_staging import (
              build_phase3_feature_staging_handoff,
          )
          from hlp.data.phase3_feature_store import (
              build_phase3_feature_store_handoff,
              materialize_phase3_feature_store,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repo,
                  "--name",
                  name,
                  "--dir",
                  str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          staging_root = Path("inputs/staging")
          coverage_root = Path("inputs/coverage")
          download_named(
              int(os.environ["STAGING_RUN_ID"]),
              "phase3-feature-staging",
              staging_root,
              "Phase-3 feature staging",
              os.environ["EXPECTED_STAGING_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["COVERAGE_RUN_ID"]),
              "phase3-feature-coverage",
              coverage_root,
              "Phase-3 feature coverage",
              os.environ["EXPECTED_COVERAGE_ARTIFACT_DIGEST"],
          )

          staging_path = find_unique(
              staging_root,
              "phase3-feature-staging.jsonl",
          )
          staging_manifest_path = find_unique(
              staging_root,
              "phase3-feature-staging.jsonl.manifest.json",
          )
          staging_manifest = json.loads(
              staging_manifest_path.read_text()
          )
          staging_summary_path = find_unique(
              staging_root,
              "phase3-feature-staging-summary.json",
          )
          staging_summary = json.loads(
              staging_summary_path.read_text()
          )
          staging_summary_sha = sha256_path(staging_summary_path)
          staging_handoff_path = find_unique(
              staging_root,
              "phase3-feature-staging-handoff.json",
          )
          staging_handoff_sha = sha256_path(staging_handoff_path)
          if staging_handoff_sha != os.environ[
              "EXPECTED_STAGING_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit(
                  "Phase-3 feature-staging handoff SHA drift"
              )
          staging_handoff = json.loads(
              staging_handoff_path.read_text()
          )
          rebuilt_staging = build_phase3_feature_staging_handoff(
              staging_summary,
              staging_summary_sha256=staging_summary_sha,
              feature_coverage_handoff_sha256=staging_summary[
                  "feature_coverage_handoff_sha256"
              ],
          )
          if rebuilt_staging != staging_handoff:
              raise SystemExit(
                  "Phase-3 feature-staging handoff content drift"
              )
          if staging_manifest.get("sha256") != staging_handoff[
              "feature_rows_sha256"
          ]:
              raise SystemExit(
                  "Phase-3 feature-staging manifest SHA drift"
              )
          if int(staging_manifest.get("records", -1)) != int(
              staging_handoff["feature_subjects"]
          ):
              raise SystemExit(
                  "Phase-3 feature-staging row count drift"
              )

          coverage_path = find_unique(
              coverage_root,
              "phase3-feature-coverage.jsonl",
          )
          coverage_manifest_path = find_unique(
              coverage_root,
              "phase3-feature-coverage.jsonl.manifest.json",
          )
          coverage_manifest = json.loads(
              coverage_manifest_path.read_text()
          )
          coverage_summary_path = find_unique(
              coverage_root,
              "phase3-feature-coverage-summary.json",
          )
          coverage_summary = json.loads(
              coverage_summary_path.read_text()
          )
          coverage_summary_sha = sha256_path(
              coverage_summary_path
          )
          coverage_handoff_path = find_unique(
              coverage_root,
              "phase3-feature-coverage-handoff.json",
          )
          coverage_handoff_sha = sha256_path(
              coverage_handoff_path
          )
          if coverage_handoff_sha != os.environ[
              "EXPECTED_COVERAGE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit(
                  "Phase-3 feature-coverage handoff SHA drift"
              )
          coverage_handoff = json.loads(
              coverage_handoff_path.read_text()
          )
          rebuilt_coverage = build_phase3_feature_coverage_handoff(
              coverage_summary,
              coverage_summary_sha256=coverage_summary_sha,
              feature_entry_handoff_sha256=coverage_summary[
                  "feature_entry_handoff_sha256"
              ],
          )
          if rebuilt_coverage != coverage_handoff:
              raise SystemExit(
                  "Phase-3 feature-coverage handoff content drift"
              )
          if coverage_manifest.get("sha256") != coverage_handoff[
              "coverage_rows_sha256"
          ]:
              raise SystemExit(
                  "Phase-3 feature-coverage manifest SHA drift"
              )
          if int(coverage_manifest.get("records", -1)) != int(
              coverage_handoff["feature_subjects"]
          ):
              raise SystemExit(
                  "Phase-3 feature-coverage row count drift"
              )

          if staging_handoff[
              "feature_coverage_handoff_sha256"
          ] != coverage_handoff_sha:
              raise SystemExit(
                  "Phase-3 staging/coverage handoff linkage drift"
              )
          if staging_handoff["coverage_rows_sha256"] != (
              coverage_handoff["coverage_rows_sha256"]
          ):
              raise SystemExit(
                  "Phase-3 staging/coverage rows linkage drift"
              )

          registry = build_phase3_feature_registry()
          registry_report = validate_phase3_feature_registry(registry)
          registry_sha = registry_report["registry_sha256"]
          if staging_handoff["feature_registry_sha256"] != registry_sha:
              raise SystemExit(
                  "Phase-3 feature-store staging registry drift"
              )
          if coverage_handoff["feature_registry_sha256"] != registry_sha:
              raise SystemExit(
                  "Phase-3 feature-store coverage registry drift"
              )
          if sorted(staging_handoff["included_families"]) != (
              registry_report["families"]
          ):
              raise SystemExit(
                  "Phase-3 feature-store staging lacks registry families"
              )
          if sorted(coverage_handoff["required_families"]) != (
              registry_report["families"]
          ):
              raise SystemExit(
                  "Phase-3 feature-store coverage lacks registry families"
              )
          if int(staging_handoff["features_per_subject"]) != int(
              registry_report["features"]
          ):
              raise SystemExit(
                  "Phase-3 feature-store feature count drift"
              )

          Path("artifacts/phase3-feature-registry.json").write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n"
          )
          Path(
              "artifacts/phase3-feature-registry-report.json"
          ).write_text(
              json.dumps(
                  registry_report,
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )

          output = Path(
              "artifacts/phase3-feature-store.jsonl"
          )
          manifest, summary = materialize_phase3_feature_store(
              iter_validated_jsonl(
                  staging_path,
                  staging_manifest_path,
              ),
              staging_handoff=staging_handoff,
              coverage_handoff=coverage_handoff,
              feature_coverage_handoff_sha256=coverage_handoff_sha,
              feature_registry=registry,
              output=output,
          )
          summary.update({
              "staging_run_id": int(os.environ["STAGING_RUN_ID"]),
              "staging_handoff_sha256": staging_handoff_sha,
              "coverage_run_id": int(os.environ["COVERAGE_RUN_ID"]),
              "feature_coverage_handoff_sha256": coverage_handoff_sha,
          })
          summary_path = Path(
              "artifacts/phase3-feature-store-summary.json"
          )
          summary_text = (
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_path.write_text(summary_text)
          summary_sha = hashlib.sha256(
              summary_text.encode()
          ).hexdigest()

          handoff = build_phase3_feature_store_handoff(
              summary,
              feature_store_summary_sha256=summary_sha,
              staging_handoff_sha256=staging_handoff_sha,
              feature_coverage_handoff_sha256=coverage_handoff_sha,
          )
          handoff_path = Path(
              "artifacts/phase3-feature-store-handoff.json"
          )
          handoff_text = (
              json.dumps(handoff, indent=2, sort_keys=True) + "\n"
          )
          handoff_path.write_text(handoff_text)
          handoff_sha = hashlib.sha256(
              handoff_text.encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"feature_rows_sha256={manifest['sha256']}\n"
              )
              handle.write(
                  f"registry_sha256={registry_report['registry_sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(f"handoff_sha256={handoff_sha}\n")
              handle.write(
                  f"feature_subjects={summary['feature_subjects']}\n"
              )
              handle.write(
                  f"features_per_subject={summary['features_per_subject']}\n"
              )
          print(json.dumps({
              "checkpoint_name": summary["checkpoint_name"],
              "feature_rows_sha256": manifest["sha256"],
              "feature_registry_sha256": registry_report[
                  "registry_sha256"
              ],
              "feature_store_summary_sha256": summary_sha,
              "feature_store_handoff_sha256": handoff_sha,
              "feature_subjects": summary["feature_subjects"],
              "features_per_subject": summary["features_per_subject"],
              "all_registered_families_included": True,
              "all_registered_features_included": True,
              "matched_subject_coverage_equal": True,
              "outcome_rows_consumed": False,
              "outcome_fields_exposed": False,
              "future_state_allowed": False,
              "feature_store_ready": True,
              "final_checkpoint_claimed": True,
          }, sort_keys=True))
          PY

      - name: Upload final Phase-3 feature store
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-feature-store
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact final feature-store handoff
        id: handoff_upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-feature-store-handoff
          path: |
            artifacts/phase3-feature-store.jsonl.manifest.json
            artifacts/phase3-feature-store-summary.json
            artifacts/phase3-feature-store-handoff.json
            artifacts/phase3-feature-registry-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish final Phase-3 checkpoint identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_DIGEST: ${{ steps.handoff_upload.outputs.artifact-digest }}
          FEATURE_ROWS_SHA256: ${{ steps.finalize.outputs.feature_rows_sha256 }}
          REGISTRY_SHA256: ${{ steps.finalize.outputs.registry_sha256 }}
          SUMMARY_SHA256: ${{ steps.finalize.outputs.summary_sha256 }}
          HANDOFF_SHA256: ${{ steps.finalize.outputs.handoff_sha256 }}
          SUBJECTS: ${{ steps.finalize.outputs.feature_subjects }}
          FEATURES: ${{ steps.finalize.outputs.features_per_subject }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${HANDOFF_ARTIFACT_DIGEST}"
          {
            echo "## Final Phase-3 feature store"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase3-feature-store"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- handoff_artifact_name: phase3-feature-store-handoff"
            echo "- handoff_artifact_digest: ${HANDOFF_ARTIFACT_DIGEST}"
            echo "- checkpoint_name: hlp-v1-phase3-feature-store"
            echo "- feature_rows_sha256: ${FEATURE_ROWS_SHA256}"
            echo "- feature_registry_sha256: ${REGISTRY_SHA256}"
            echo "- summary_sha256: ${SUMMARY_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- feature_subjects: ${SUBJECTS}"
            echo "- features_per_subject: ${FEATURES}"
            echo "- all_registered_families_included: true"
            echo "- all_registered_features_included: true"
            echo "- matched_subject_coverage_equal: true"
            echo "- missingness_recorded: true"
            echo "- data_quality_recorded: true"
            echo "- outcome_rows_consumed: false"
            echo "- outcome_fields_exposed: false"
            echo "- future_state_allowed: false"
            echo "- feature_store_ready: true"
            echo "- final_checkpoint_claimed: true"
          } >> "${GITHUB_STEP_SUMMARY}"
