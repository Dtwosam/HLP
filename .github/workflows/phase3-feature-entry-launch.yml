name: phase3-feature-entry-launch

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Exact successful phase3-feature-entry-plan run ID
        required: true
        type: string
      expected_plan_artifact_digest:
        description: Exact Phase-3 entry plan artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: launch
        name: Dispatch leakage-safe Phase-3 feature entry
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import base64,json,os,shutil,subprocess
          from pathlib import Path
          from hlp.data.phase2_dispatch_readiness import workflow_dispatch_interface_sha256
          from hlp.data.phase3_feature_entry_dispatch import validate_phase3_feature_entry_plan,validate_phase3_feature_entry_launch_receipt
          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]; head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(args,payload=None):
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",*args],input=(json.dumps(payload,sort_keys=True,separators=(",",":")).encode() if payload is not None else None)); return json.loads(raw) if raw.strip() else None
          run_id=int(os.environ["PLAN_RUN_ID"]); row=api([f"/repos/{repo}/actions/runs/{run_id}"])
          if row.get("path")!=".github/workflows/phase3-feature-entry-plan.yml" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head or row.get("status")!="completed" or row.get("conclusion")!="success": raise SystemExit("Phase-3 entry plan identity/status drift")
          rows=api([f"/repos/{repo}/actions/runs/{run_id}/artifacts?name=phase3-feature-entry-plan"]).get("artifacts",[]); rows=[x for x in rows if x.get("name")=="phase3-feature-entry-plan" and not x.get("expired")]
          if len(rows)!=1: raise SystemExit("Phase-3 entry plan artifact cardinality drift")
          actual=str(rows[0].get("digest") or "").lower()
          if actual!=os.environ["EXPECTED_PLAN_DIGEST"].lower(): raise SystemExit("Phase-3 entry plan digest drift")
          root=Path("upstream/plan")
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          subprocess.check_call(["gh","run","download",str(run_id),"--repo",repo,"--name","phase3-feature-entry-plan","--dir",str(root)])
          plan=validate_phase3_feature_entry_plan(json.loads((root/"phase3-feature-entry-plan.json").read_text()))
          workflow="phase3-feature-entry.yml"; meta=api([f"/repos/{repo}"]); default=str(meta.get("default_branch") or "")
          local=workflow_dispatch_interface_sha256(Path(".github/workflows",workflow).read_text()); payload=api([f"/repos/{repo}/contents/.github/workflows/{workflow}?ref={default}"]); remote=workflow_dispatch_interface_sha256(base64.b64decode(str(payload.get("content") or "").replace("\n","")).decode())
          if local!=remote: raise SystemExit("default-branch Phase-3 entry interface drift")
          response=api(["--method","POST",f"/repos/{repo}/actions/workflows/{workflow}/dispatches","--input","-"],{"ref":branch,"inputs":plan["inputs"]})
          target=int((response or {}).get("workflow_run_id",0))
          if target<=0: raise SystemExit("Phase-3 entry dispatch lacks run ID")
          receipt={"version":"phase3-feature-entry-launch-receipt-v1","feature_entry_control_run_id":int(os.environ["GITHUB_RUN_ID"]),"feature_entry_plan_run_id":run_id,"feature_entry_plan_artifact_digest":actual,"feature_entry_run_id":target,"execution_branch":branch,"execution_head_sha":head,"canonical_ledger_commit_sha":plan["canonical_ledger_commit_sha"],"universe_run_id":plan["universe_run_id"],"universe_artifact_digest":plan["universe_artifact_digest"],"universe_handoff_sha256":plan["universe_handoff_sha256"],"price_path_run_id":plan["price_path_run_id"],"price_path_artifact_digest":plan["price_path_artifact_digest"],"price_path_handoff_sha256":plan["price_path_handoff_sha256"],"target_runs_created":1,"target_run_waited_for_completion":False,"outcome_rows_consumed":False,"phase3_feature_entry_ready":False,"workflow_dispatch_performed":True}
          receipt=validate_phase3_feature_entry_launch_receipt(receipt)
          Path("artifacts/phase3-feature-entry-launch-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as h: h.write(f"target_run_id={target}\n")
          PY
      - name: Upload Phase-3 entry launch receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-feature-entry-launch
          path: artifacts/phase3-feature-entry-launch-receipt.json
          if-no-files-found: error
          retention-days: 90
