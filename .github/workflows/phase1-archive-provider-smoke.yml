name: phase1-archive-provider-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hoodexplorer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Probe hoodexplorer archive/index API
        run: hlp --timeout 10 --attempts 1 hood-smoke
