name: phase1-pons-v2-curve-recover-range

on:
  workflow_dispatch:
    inputs:
      v2_registry_run_id:
        description: "Run containing phase1-pons-v2-full-registry"
        required: true
        default: "33912235341"
        type: string
      from_block:
        description: "Inclusive first missing curve block"
        required: true
        type: string
      to_block:
        description: "Inclusive last missing curve block"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-v2-curve-recover-range-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: '4'
      RANGE_FROM: ${{ inputs.from_block }}
      RANGE_TO: ${{ inputs.to_block }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-full-registry
          path: registry
          run-id: ${{ inputs.v2_registry_run_id }}
          github-token: ${{ github.token }}
      - id: bounds
        name: Compute exact subshard bounds
        run: |
          python - <<'PY'
          import os

          start = int(os.environ["RANGE_FROM"])
          end = int(os.environ["RANGE_TO"])
          if start <= 0 or end < start:
              raise SystemExit(f"invalid recovery range: {start}..{end}")

          i = int(os.environ["SHARD_INDEX"])
          n = int(os.environ["SHARD_COUNT"])
          span = end - start + 1
          if span > 200_000:
              raise SystemExit(
                  "recovery range exceeds 200000-block ceiling; "
                  "use manifest gap recovery"
              )
          lo = start + (span * i) // n
          hi = start + (span * (i + 1)) // n - 1
          if hi < lo:
              raise SystemExit(
                  f"range too small for {n} subshards: {start}..{end}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"lo={lo}\nhi={hi}\n")
          print({"shard": i, "from_block": lo, "to_block": hi})
          PY
      - name: Acquire exact missing V2 curve subrange
        env:
          FROM_BLOCK: ${{ steps.bounds.outputs.lo }}
          TO_BLOCK: ${{ steps.bounds.outputs.hi }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          printf -v SHARD "%02d" "$SHARD_INDEX"
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v2-curve-tape \
            --registry registry/pons-v2-full-registry.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --global-topic-scan \
            --out "artifacts/v2-curve-range-${SHARD}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v2-curve-range-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error

  merge:
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RANGE_FROM: ${{ inputs.from_block }}
      RANGE_TO: ${{ inputs.to_block }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-v2-curve-range-*
          path: downloads
          merge-multiple: true
      - name: Merge exact recovery range
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.data.reconstruct import event_order
          from hlp.data.snapshot import write_jsonl_snapshot

          start = int(os.environ["RANGE_FROM"])
          end = int(os.environ["RANGE_TO"])
          files = sorted(
              Path("downloads").glob("v2-curve-range-*.jsonl")
          )
          assert len(files) == 4, [path.name for path in files]

          entries = []
          for path in files:
              manifest = json.loads(
                  path.with_suffix(path.suffix + ".manifest.json").read_text()
              )
              prov = manifest["provenance"]
              entries.append((
                  int(prov["from_block"]),
                  int(prov["to_block"]),
                  path,
                  manifest,
              ))
          entries.sort(key=lambda item: item[0])

          previous_hi = None
          expected_records = 0
          manifests = []
          for lo, hi, path, manifest in entries:
              if previous_hi is None:
                  assert lo == start, (lo, start)
              else:
                  assert lo == previous_hi + 1, (previous_hi, lo)
              previous_hi = hi
              expected_records += int(manifest["records"])
              manifests.append({
                  "file": path.name,
                  "sha256": manifest["sha256"],
                  "records": int(manifest["records"]),
                  "from_block": lo,
                  "to_block": hi,
              })
          assert previous_hi == end, (previous_hi, end)

          stats = {
              "records": 0,
              "curve_buy": 0,
              "curve_sell": 0,
              "curve_buyback": 0,
          }

          def rows():
              prior = None
              for _, _, path, manifest in entries:
                  local = 0
                  with path.open() as handle:
                      for line in handle:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          order = event_order(row)
                          if prior is not None:
                              assert prior < order, (prior, order, path.name)
                          prior = order
                          kind = row["event_type"]
                          assert kind in stats, kind
                          stats[kind] += 1
                          stats["records"] += 1
                          local += 1
                          yield row
                  assert local == int(manifest["records"]), (
                      path.name, local, manifest["records"]
                  )

          snapshot = write_jsonl_snapshot(
              rows(),
              output=Path("artifacts/pons-v2-curve-recovered-range.jsonl"),
              provenance={
                  "source": "four_way_exact_curve_range_recovery",
                  "chain_id": 4663,
                  "from_block": start,
                  "to_block": end,
                  "shards": manifests,
              },
          )
          assert stats["records"] == expected_records
          report = {
              "from_block": start,
              "to_block": end,
              **stats,
              "sha256": snapshot["sha256"],
          }
          Path(
              "artifacts/pons-v2-curve-recovered-range-summary.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v2-curve-recovered-range
          path: artifacts/
          if-no-files-found: error
