name: phase1-pons-acceptance-gate

on:
  workflow_dispatch:
    inputs:
      eligible_universe_run_id:
        description: "Successful phase1-pons-eligible-universe-freeze run"
        required: true
        type: string
      representative_validation_run_id:
        description: "Successful phase1-pons-representative-validation run"
        required: true
        type: string
      viability_projection_run_id:
        description: "Successful phase1-pons-acquisition-viability-projection run"
        required: true
        type: string
  workflow_call:
    inputs:
      eligible_universe_run_id:
        required: true
        type: string
      representative_validation_run_id:
        required: true
        type: string
      viability_projection_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-acceptance-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Verify acceptance caller and evidence provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ELIGIBLE_RUN_ID: ${{ inputs.eligible_universe_run_id }}
          REPRESENTATIVE_RUN_ID: ${{ inputs.representative_validation_run_id }}
          VIABILITY_RUN_ID: ${{ inputs.viability_projection_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          eligible_run_id = int(os.environ["ELIGIBLE_RUN_ID"])
          representative_run_id = int(os.environ["REPRESENTATIVE_RUN_ID"])
          viability_run_id = int(os.environ["VIABILITY_RUN_ID"])
          current_run_id = int(os.environ["CURRENT_RUN_ID"])

          if eligible_run_id <= 0:
              raise SystemExit(
                  "acceptance evidence run ID must be positive"
              )
          if representative_run_id != eligible_run_id:
              raise SystemExit(
                  "acceptance eligible and representative artifacts must "
                  "come from the same evidence handoff"
              )
          if viability_run_id != current_run_id:
              raise SystemExit(
                  "acceptance viability projection must come from the "
                  "current final-acceptance run"
              )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def get(path):
              request = urllib.request.Request(
                  api + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def artifacts(run_id):
              names = set()
              page = 1
              while True:
                  payload = get(
                      f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                      f"?per_page=100&page={page}"
                  )
                  rows = list(payload.get("artifacts") or [])
                  names.update(
                      str(row.get("name"))
                      for row in rows
                      if not row.get("expired")
                  )
                  if len(rows) < 100:
                      break
                  page += 1
                  if page > 10:
                      raise SystemExit(
                          "acceptance artifact pagination exceeded 1000: "
                          f"run={run_id}"
                      )
              return names

          current = get(
              f"/repos/{repo}/actions/runs/{current_run_id}"
          )
          current_path = str(
              current.get("path") or ""
          ).split("@", 1)[0]
          allowed_callers = {
              ".github/workflows/"
              "phase1-pons-viability-ledger-finalize-one-shot.yml",
              ".github/workflows/"
              "phase1-pons-final-acceptance-chain.yml",
          }
          if current_path not in allowed_callers:
              raise SystemExit(
                  "acceptance gate direct caller is not allowed: "
                  f"{current_path}"
              )
          if current.get("head_branch") != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "acceptance caller branch changed"
              )

          evidence = get(
              f"/repos/{repo}/actions/runs/{eligible_run_id}"
          )
          if (
              evidence.get("status") != "completed"
              or evidence.get("conclusion") != "success"
          ):
              raise SystemExit(
                  "acceptance evidence run is not successful"
              )
          evidence_path = str(
              evidence.get("path") or ""
          ).split("@", 1)[0]
          allowed_evidence_paths = {
              ".github/workflows/"
              "phase1-pons-post-eligibility-evidence-one-shot.yml",
              ".github/workflows/"
              "phase1-pons-recovered-completion-one-shot.yml",
          }
          if evidence_path not in allowed_evidence_paths:
              raise SystemExit(
                  "acceptance evidence workflow path is not allowed: "
                  f"{evidence_path}"
              )
          if evidence.get("head_branch") != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "acceptance evidence branch changed"
              )
          evidence_head_sha = str(evidence.get("head_sha") or "")
          if len(evidence_head_sha) != 40:
              raise SystemExit(
                  "acceptance evidence head SHA is invalid"
              )
          comparison = get(
              f"/repos/{repo}/compare/{evidence_head_sha}..."
              f"{os.environ['GITHUB_SHA']}"
          )
          if comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit(
                  "acceptance evidence is not an ancestor of caller HEAD"
              )

          required = {
              "phase1-pons-post-eligibility-evidence-ready",
              "phase1-pons-eligible-universe",
              "phase1-pons-representative-validation",
          }
          missing = sorted(required - artifacts(eligible_run_id))
          if missing:
              raise SystemExit(
                  f"acceptance evidence artifacts missing: {missing}"
              )
          if (
              "phase1-pons-acquisition-viability-projection"
              not in artifacts(current_run_id)
          ):
              raise SystemExit(
                  "acceptance current run is missing viability projection"
              )

          print(json.dumps({
              "caller_run_id": current_run_id,
              "caller_workflow_path": current_path,
              "evidence_run_id": eligible_run_id,
              "viability_projection_run_id": viability_run_id,
              "preflight": "pass",
          }, sort_keys=True))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-eligible-universe
          path: eligible
          run-id: ${{ inputs.eligible_universe_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-validation
          path: representative
          run-id: ${{ inputs.representative_validation_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-acquisition-viability-projection
          path: viability
          run-id: ${{ inputs.viability_projection_run_id }}
          github-token: ${{ github.token }}
      - name: Build fail-closed Phase 1 acceptance report
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          from hlp.data.phase1_acceptance import (
              REQUIRED_PHASE1_ACQUISITION_ROUTES,
              build_phase1_acceptance_report,
          )

          eligible_summary = json.loads(
              Path(
                  "eligible/pons-eligible-universe-summary.json"
              ).read_text()
          )
          eligible_manifest = json.loads(
              Path(
                  "eligible/"
                  "pons-eligible-100k-universe.jsonl.manifest.json"
              ).read_text()
          )
          representative_summary = json.loads(
              Path(
                  "representative/"
                  "pons-representative-validation-summary.json"
              ).read_text()
          )
          representative_manifest = json.loads(
              Path(
                  "representative/"
                  "pons-representative-validation.jsonl.manifest.json"
              ).read_text()
          )
          viability_projection = json.loads(
              Path(
                  "viability/"
                  "phase1-acquisition-viability-projection.json"
              ).read_text()
          )

          report = build_phase1_acceptance_report(
              eligible_summary,
              eligible_manifest,
              representative_summary,
              representative_manifest,
              viability_projection,
          )
          report.update(
              {
                  "eligible_universe_run_id": int(
                      "${{ inputs.eligible_universe_run_id }}"
                  ),
                  "representative_validation_run_id": int(
                      "${{ inputs.representative_validation_run_id }}"
                  ),
                  "viability_projection_run_id": int(
                      "${{ inputs.viability_projection_run_id }}"
                  ),
              }
          )

          if report["phase1_acceptance_status"] != "pass":
              raise SystemExit("Phase 1 acceptance report did not PASS")
          if report["required_acquisition_routes"] != list(
              REQUIRED_PHASE1_ACQUISITION_ROUTES
          ):
              raise SystemExit(
                  "Phase 1 acceptance route contract changed"
              )

          Path("artifacts/phase1-acceptance-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-acceptance-gate
          path: artifacts/
          if-no-files-found: error
