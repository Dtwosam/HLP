name: phase1-pons-v4-quote-fallback-salvage-one-shot

on:
  workflow_dispatch:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/phase1-pons-v4-salvage.json

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-v4-quote-fallback-salvage-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  salvage:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'launch V4 salvage generation ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: config
        name: Validate guarded V4 salvage config
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(
              Path('.github/phase1-pons-v4-salvage.json').read_text()
          )
          generation = int(config['generation'])
          partial_run_id = int(config['partial_run_id'])
          if generation <= 0:
              raise SystemExit('salvage generation must be positive')
          if partial_run_id <= 0:
              raise SystemExit('partial_run_id must be positive')
          expected = f'launch V4 salvage generation {generation}'
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              message = os.environ.get('LAUNCH_MESSAGE', '')
              if message != expected:
                  raise SystemExit(
                      f'guarded launch message mismatch: {message!r} != {expected!r}'
                  )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'generation={generation}\n')
              output.write(f'partial_run_id={partial_run_id}\n')
          PY
        env:
          LAUNCH_MESSAGE: ${{ github.event.head_commit.message }}
      - name: Download all paginated original V4 shards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m hlp.github_artifacts download-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ steps.config.outputs.partial_run_id }}" \
            --name-regex '^phase1-pons-v4-quote-fallback-[0-9]+$' \
            --out partial
      - name: Download all paginated V4 recovery gaps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m hlp.github_artifacts download-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ steps.config.outputs.partial_run_id }}" \
            --name-regex '^phase1-pons-v4-quote-fallback-gap-[0-9]{3}$' \
            --out gaps \
            --allow-empty
      - name: Download frozen V4 route selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m hlp.github_artifacts download-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ steps.config.outputs.partial_run_id }}" \
            --name-regex '^phase1-pons-v4-quote-routes-selected$' \
            --out routes
      - name: Salvage complete overlap-safe V4 quote tape
        run: |
          python -m hlp.v4_salvage \
            --routes routes/pons-v4-quote-routes.jsonl \
            --source-dir partial \
            --source-dir gaps \
            --partial-run-id "${{ steps.config.outputs.partial_run_id }}" \
            --out-dir artifacts
      - name: Convert salvaged V4 routes to generic quote USD tape
        run: |
          hlp pons-v4-quote-usd-tape \
            --routes artifacts/pons-v4-quote-routes.jsonl \
            --v4-events artifacts/pons-v4-quote-fallback-events-full.jsonl \
            --state-out artifacts/pons-v4-quote-fallback-initial.jsonl \
            --out artifacts/pons-v4-quote-fallback-updates.jsonl
      - id: upload_full
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v4-quote-fallback-full
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_full
        name: Retry salvaged V4 quote fallback artifact upload
        if: ${{ steps.upload_full.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v4-quote-fallback-full
          path: artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Final salvaged V4 quote fallback artifact upload retry
        if: ${{ steps.retry_upload_full.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v4-quote-fallback-full
          path: artifacts/
          if-no-files-found: error
          overwrite: true
