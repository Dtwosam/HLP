name: phase1-pons-residual-quote-deployment-probe-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-pons-residual-quote-deployment-probe-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: phase1-pons-residual-quote-deployment-probe-one-shot
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Prove residual quote deployment boundaries
        run: |
          mkdir -p artifacts
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            deployment-block \
            0x84cab63bc87912e71ad199ff14a0ba45de68fef8 \
            --archive --high 52263525 \
            > artifacts/skhy-deployment.json
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            deployment-block \
            0x41f4267525a8aff329540ef24fd83d9044758b33 \
            --archive --high 52956726 \
            > artifacts/fig-deployment.json
          python - <<'PY'
          import json
          from pathlib import Path

          rows = {
              "SKHY": json.loads(Path("artifacts/skhy-deployment.json").read_text()),
              "FIG": json.loads(Path("artifacts/fig-deployment.json").read_text()),
          }
          report = {
              symbol: {
                  "address": row["address"],
                  "first_code_block": row["first_code_block"],
                  "timestamp": row["timestamp"],
                  "code_bytes": row["code_bytes"],
              }
              for symbol, row in rows.items()
          }
          Path("artifacts/residual-deployment-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-residual-quote-deployment-probe
          path: artifacts/
          if-no-files-found: error
