name: phase2-research-materialization-freeze

on:
  workflow_dispatch:
    inputs:
      rehydration_plan_run_id:
        description: Exact phase2-research-rehydration-plan run ID
        required: true
        type: string
      expected_plan_artifact_digest:
        description: Exact rehydration-plan artifact digest (sha256:...)
        required: true
        type: string
      expected_plan_sha256:
        description: Exact SHA-256 of phase2-research-rehydration-plan.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact frozen-universe artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      component_runs_json:
        description: JSON object mapping all 12 research component IDs to exact materializer run IDs
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-research-materialization-freeze-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAN_RUN_ID: ${{ inputs.rehydration_plan_run_id }}
  EXPECTED_PLAN_ARTIFACT_DIGEST: ${{ inputs.expected_plan_artifact_digest }}
  EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  COMPONENT_RUNS_JSON: ${{ inputs.component_runs_json }}

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: freeze
        name: Freeze exact research materialization bundle
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase2_research_materialization_bundle import (
              build_phase2_research_materialization_bundle,
              build_phase2_research_materialization_handoff,
          )
          from hlp.data.phase2_research_paths import (
              DIRECT_RESEARCH_COMPONENT_ID,
          )
          from hlp.data.phase2_research_rehydration import (
              build_phase2_research_rehydration_plan,
              build_phase2_research_rehydration_seed,
          )
          from hlp.data.phase2_sources import (
              build_phase2_source_inventory,
          )

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def selected_named(run_id, name, label, expected_digest=None):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if expected_digest is not None and actual != str(
                  expected_digest
              ).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              return dict(selected)

          def download_named(run_id, name, destination, label, expected_digest=None):
              selected = selected_named(
                  run_id,
                  name,
                  label,
                  expected_digest=expected_digest,
              )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repo,
                  "--name",
                  name,
                  "--dir",
                  str(destination),
              ])
              return selected

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          plan_root = Path("inputs/plan")
          universe_root = Path("inputs/universe")
          download_named(
              int(os.environ["PLAN_RUN_ID"]),
              "phase2-research-rehydration-plan",
              plan_root,
              "rehydration plan",
              os.environ["EXPECTED_PLAN_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "frozen universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )

          plan_path = find_unique(
              plan_root,
              "phase2-research-rehydration-plan.json",
          )
          plan_sha = sha256_path(plan_path)
          if plan_sha != os.environ[
              "EXPECTED_PLAN_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("rehydration plan SHA drift")
          plan = json.loads(plan_path.read_text())
          seed = json.loads(
              find_unique(
                  plan_root,
                  "phase2-research-rehydration-seed.json",
              ).read_text()
          )
          if build_phase2_research_rehydration_plan(
              seed,
              plan["launchpad_bindings"],
              plan["direct_binding"],
          ) != plan:
              raise SystemExit("rehydration plan content drift")

          handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          if sha256_path(handoff_path) != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("frozen-universe handoff SHA drift")
          universe_handoff = json.loads(handoff_path.read_text())
          universe_summary = json.loads(
              find_unique(
                  universe_root,
                  "phase2-universe-summary.json",
              ).read_text()
          )
          universe_provenance = json.loads(
              find_unique(
                  universe_root,
                  "phase2-universe-provenance.json",
              ).read_text()
          )
          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_sha = sha256_path(universe_path)
          if universe_sha != plan["eligible_universe_sha256"]:
              raise SystemExit(
                  "materialization-freeze universe SHA disagrees with plan"
              )
          if build_phase2_research_rehydration_seed(
              universe_summary,
              universe_provenance,
              universe_handoff,
              source_inventory=build_phase2_source_inventory(),
              universe_sha256=universe_sha,
          ) != seed:
              raise SystemExit(
                  "materialization-freeze seed disagrees with plan"
              )

          expected_components = set(plan["launchpad_bindings"])
          expected_components.add(DIRECT_RESEARCH_COMPONENT_ID)
          try:
              run_map = json.loads(os.environ["COMPONENT_RUNS_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"component_runs_json is not valid JSON: {exc}"
              ) from exc
          if not isinstance(run_map, dict):
              raise SystemExit(
                  "component_runs_json must be a JSON object"
              )
          if set(run_map) != expected_components:
              raise SystemExit(
                  "component run map set changed: "
                  f"missing={sorted(expected_components - set(run_map))} "
                  f"extra={sorted(set(run_map) - expected_components)}"
              )

          component_reports = {}
          component_handoffs = {}
          component_manifest_proofs = {}
          for component_id in sorted(expected_components):
              run_id = int(run_map[component_id])
              if run_id <= 0:
                  raise SystemExit(
                      f"{component_id}: materializer run id is invalid"
                  )
              artifact_name = (
                  f"phase2-research-handoff-{component_id}"
              )
              root = Path("inputs/components") / component_id
              selected = download_named(
                  run_id,
                  artifact_name,
                  root,
                  f"{component_id} research handoff",
              )
              report_path = find_unique(
                  root,
                  "phase2-research-component-report.json",
              )
              report = json.loads(report_path.read_text())
              report_sha = sha256_path(report_path)
              manifest_paths = sorted(
                  path
                  for path in root.rglob("*.manifest.json")
                  if path.is_file()
              )
              if not manifest_paths:
                  raise SystemExit(
                      f"{component_id}: handoff has no output manifests"
                  )
              proofs = []
              for path in manifest_paths:
                  manifest = json.loads(path.read_text())
                  proofs.append({
                      "path": str(manifest.get("path") or ""),
                      "records": int(manifest.get("records", -1)),
                      "sha256": manifest.get("sha256"),
                      "provenance": manifest.get("provenance") or {},
                  })
              component_reports[component_id] = report
              component_handoffs[component_id] = {
                  "run_id": run_id,
                  "artifact_name": artifact_name,
                  "artifact_digest": str(
                      selected.get("digest") or ""
                  ).lower(),
                  "report_sha256": report_sha,
              }
              component_manifest_proofs[component_id] = proofs

          bundle = build_phase2_research_materialization_bundle(
              plan,
              rehydration_plan_sha256=plan_sha,
              component_reports=component_reports,
              component_handoffs=component_handoffs,
              component_manifest_proofs=component_manifest_proofs,
          )
          bundle_path = Path(
              "artifacts/phase2-research-materialization-bundle.json"
          )
          bundle_text = (
              json.dumps(bundle, indent=2, sort_keys=True) + "\n"
          )
          bundle_path.write_text(bundle_text)
          bundle_sha = hashlib.sha256(
              bundle_text.encode()
          ).hexdigest()

          final_handoff = build_phase2_research_materialization_handoff(
              bundle,
              bundle_sha256=bundle_sha,
          )
          handoff_out = Path(
              "artifacts/phase2-research-materialization-handoff.json"
          )
          handoff_text = (
              json.dumps(final_handoff, indent=2, sort_keys=True)
              + "\n"
          )
          handoff_out.write_text(handoff_text)
          handoff_sha = hashlib.sha256(
              handoff_text.encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"bundle_sha256={bundle_sha}\n")
              handle.write(f"handoff_sha256={handoff_sha}\n")
              handle.write(
                  f"component_count={bundle['component_count']}\n"
              )
              handle.write(
                  f"materialized_records={bundle['materialized_records']}\n"
              )
          print(json.dumps({
              "bundle_sha256": bundle_sha,
              "handoff_sha256": handoff_sha,
              "component_count": bundle["component_count"],
              "source_count": bundle["source_count"],
              "research_price_paths_materialized": True,
              "phase2_dump_detector_frozen": False,
              "outcome_labels_computed": False,
          }, sort_keys=True))
          PY

      - name: Upload materialization freeze
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-materialization-freeze
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish materialization-freeze identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          BUNDLE_SHA256: ${{ steps.freeze.outputs.bundle_sha256 }}
          HANDOFF_SHA256: ${{ steps.freeze.outputs.handoff_sha256 }}
          COMPONENT_COUNT: ${{ steps.freeze.outputs.component_count }}
          MATERIALIZED_RECORDS: ${{ steps.freeze.outputs.materialized_records }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${BUNDLE_SHA256}"
          test -n "${HANDOFF_SHA256}"
          {
            echo "## Phase-2 research materialization freeze"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase2-research-materialization-freeze"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- bundle_sha256: ${BUNDLE_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- component_count: ${COMPONENT_COUNT}"
            echo "- materialized_records: ${MATERIALIZED_RECORDS}"
            echo "- research_price_paths_materialized: true"
            echo "- phase2_dump_detector_frozen: false"
            echo "- outcome_labels_computed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
