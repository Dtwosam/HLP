name: phase3-feature-entry

on:
  workflow_dispatch:
    inputs:
      phase2_dataset_run_id:
        description: Exact phase2-universe-outcome-dataset run ID
        required: true
        type: string
      expected_phase2_handoff_artifact_digest:
        description: Exact Phase-2 checkpoint handoff artifact digest (sha256:...)
        required: true
        type: string
      expected_phase2_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-outcome-dataset-handoff.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact frozen-universe artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      detector_freeze_run_id:
        description: Exact phase2-dump-detector-freeze run ID
        required: true
        type: string
      expected_detector_artifact_digest:
        description: Exact detector-freeze artifact digest (sha256:...)
        required: true
        type: string
      expected_detector_handoff_sha256:
        description: Exact SHA-256 of phase2-dump-detector-freeze-handoff.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-feature-entry-${{ github.ref }}
  cancel-in-progress: false

env:
  PHASE2_DATASET_RUN_ID: ${{ inputs.phase2_dataset_run_id }}
  EXPECTED_PHASE2_HANDOFF_ARTIFACT_DIGEST: ${{ inputs.expected_phase2_handoff_artifact_digest }}
  EXPECTED_PHASE2_HANDOFF_SHA256: ${{ inputs.expected_phase2_handoff_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  DETECTOR_RUN_ID: ${{ inputs.detector_freeze_run_id }}
  EXPECTED_DETECTOR_ARTIFACT_DIGEST: ${{ inputs.expected_detector_artifact_digest }}
  EXPECTED_DETECTOR_HANDOFF_SHA256: ${{ inputs.expected_detector_handoff_sha256 }}

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: entry
        name: Freeze leakage-safe Phase-3 feature subjects
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase2_dataset import (
              build_phase2_dataset_handoff,
          )
          from hlp.data.phase2_dump_research import (
              build_phase2_dump_detector_freeze_handoff,
          )
          from hlp.data.phase3_feature_entry import (
              build_phase3_feature_entry_handoff,
              materialize_phase3_feature_subjects,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repo,
                  "--name",
                  name,
                  "--dir",
                  str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          checkpoint_root = Path("inputs/checkpoint")
          universe_root = Path("inputs/universe")
          detector_root = Path("inputs/detector")

          download_named(
              int(os.environ["PHASE2_DATASET_RUN_ID"]),
              "phase2-universe-outcome-dataset-handoff",
              checkpoint_root,
              "Phase-2 dataset checkpoint handoff",
              os.environ["EXPECTED_PHASE2_HANDOFF_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "frozen Phase-2 universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["DETECTOR_RUN_ID"]),
              "phase2-dump-detector-freeze",
              detector_root,
              "frozen Phase-2 detector",
              os.environ["EXPECTED_DETECTOR_ARTIFACT_DIGEST"],
          )

          checkpoint_summary_path = find_unique(
              checkpoint_root,
              "phase2-universe-outcome-dataset-summary.json",
          )
          checkpoint_summary = json.loads(
              checkpoint_summary_path.read_text()
          )
          checkpoint_summary_sha = sha256_path(
              checkpoint_summary_path
          )
          checkpoint_handoff_path = find_unique(
              checkpoint_root,
              "phase2-universe-outcome-dataset-handoff.json",
          )
          checkpoint_handoff_sha = sha256_path(
              checkpoint_handoff_path
          )
          if checkpoint_handoff_sha != os.environ[
              "EXPECTED_PHASE2_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 dataset checkpoint handoff SHA drift")
          checkpoint_handoff = json.loads(
              checkpoint_handoff_path.read_text()
          )
          rebuilt_checkpoint = build_phase2_dataset_handoff(
              checkpoint_summary,
              dataset_summary_sha256=checkpoint_summary_sha,
              universe_handoff_sha256=checkpoint_summary[
                  "universe_handoff_sha256"
              ],
              outcome_handoff_sha256=checkpoint_summary[
                  "outcome_handoff_sha256"
              ],
          )
          if rebuilt_checkpoint != checkpoint_handoff:
              raise SystemExit(
                  "Phase-2 dataset checkpoint handoff content drift"
              )
          if checkpoint_handoff.get("phase2_dataset_ready") is not True:
              raise SystemExit("Phase-2 dataset checkpoint is not ready")
          if checkpoint_handoff.get("phase3_features_attached") is not False:
              raise SystemExit(
                  "Phase-2 checkpoint already contains Phase-3 features"
              )

          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_manifest_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl.manifest.json",
          )
          universe_manifest = json.loads(
              universe_manifest_path.read_text()
          )
          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          universe_handoff_sha = sha256_path(universe_handoff_path)
          if universe_handoff_sha != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 universe handoff SHA drift")
          universe_handoff = json.loads(
              universe_handoff_path.read_text()
          )
          if checkpoint_handoff["universe_handoff_sha256"] != (
              universe_handoff_sha
          ):
              raise SystemExit(
                  "Phase-3 entry checkpoint/universe handoff linkage drift"
              )
          if universe_manifest.get("sha256") != checkpoint_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit(
                  "Phase-3 entry checkpoint/universe SHA drift"
              )
          if sha256_path(universe_path) != universe_manifest.get("sha256"):
              raise SystemExit("Phase-3 entry universe file SHA drift")
          if universe_handoff.get("phase2_universe_frozen") is not True:
              raise SystemExit("Phase-3 entry universe is not frozen")

          detector_rows_path = find_unique(
              detector_root,
              "phase2-dump-detector-events.jsonl",
          )
          detector_manifest_path = find_unique(
              detector_root,
              "phase2-dump-detector-events.jsonl.manifest.json",
          )
          detector_manifest = json.loads(
              detector_manifest_path.read_text()
          )
          detector_summary_path = find_unique(
              detector_root,
              "phase2-dump-detector-freeze-summary.json",
          )
          detector_summary = json.loads(
              detector_summary_path.read_text()
          )
          detector_summary_sha = sha256_path(detector_summary_path)
          detector_handoff_path = find_unique(
              detector_root,
              "phase2-dump-detector-freeze-handoff.json",
          )
          detector_handoff_sha = sha256_path(detector_handoff_path)
          if detector_handoff_sha != os.environ[
              "EXPECTED_DETECTOR_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 detector handoff SHA drift")
          detector_handoff = json.loads(detector_handoff_path.read_text())
          rebuilt_detector = build_phase2_dump_detector_freeze_handoff(
              detector_summary,
              freeze_summary_sha256=detector_summary_sha,
              candidate_research_handoff_sha256=detector_summary[
                  "candidate_research_handoff_sha256"
              ],
              candidate_diagnostics_handoff_sha256=detector_summary[
                  "candidate_diagnostics_handoff_sha256"
              ],
          )
          if rebuilt_detector != detector_handoff:
              raise SystemExit(
                  "Phase-2 detector handoff content drift"
              )
          if detector_manifest.get("sha256") != detector_handoff[
              "detector_rows_sha256"
          ]:
              raise SystemExit("Phase-3 entry detector rows SHA drift")
          if int(detector_manifest.get("records", -1)) != int(
              detector_handoff["detector_rows"]
          ):
              raise SystemExit("Phase-3 entry detector row count drift")
          if detector_handoff.get(
              "outcome_labels_computed"
          ) is not False:
              raise SystemExit(
                  "Phase-3 entry detector contains outcome labels"
              )

          if checkpoint_handoff[
              "eligible_universe_sha256"
          ] != detector_handoff["universe_sha256"]:
              raise SystemExit(
                  "Phase-3 entry checkpoint/detector universe drift"
              )
          if checkpoint_handoff[
              "normalized_price_path_sha256"
          ] != detector_handoff["normalized_price_path_sha256"]:
              raise SystemExit(
                  "Phase-3 entry checkpoint/detector price-path drift"
              )
          if int(checkpoint_handoff["confirmed_dump_tokens"]) != int(
              detector_handoff["confirmed_tokens"]
          ):
              raise SystemExit(
                  "Phase-3 entry checkpoint/detector confirmed count drift"
              )

          output = Path("artifacts/phase3-feature-subjects.jsonl")
          manifest, summary = materialize_phase3_feature_subjects(
              iter_validated_jsonl(
                  universe_path,
                  universe_manifest_path,
              ),
              iter_validated_jsonl(
                  detector_rows_path,
                  detector_manifest_path,
              ),
              phase2_dataset_handoff=checkpoint_handoff,
              detector_handoff=detector_handoff,
              output=output,
          )
          summary.update({
              "phase2_dataset_run_id": int(
                  os.environ["PHASE2_DATASET_RUN_ID"]
              ),
              "phase2_dataset_handoff_sha256": checkpoint_handoff_sha,
              "universe_run_id": int(os.environ["UNIVERSE_RUN_ID"]),
              "universe_handoff_sha256": universe_handoff_sha,
              "detector_freeze_run_id": int(
                  os.environ["DETECTOR_RUN_ID"]
              ),
              "detector_freeze_handoff_sha256": detector_handoff_sha,
          })
          summary_path = Path(
              "artifacts/phase3-feature-entry-summary.json"
          )
          summary_text = (
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_path.write_text(summary_text)
          summary_sha = hashlib.sha256(
              summary_text.encode()
          ).hexdigest()

          handoff = build_phase3_feature_entry_handoff(
              summary,
              entry_summary_sha256=summary_sha,
              phase2_dataset_handoff_sha256=checkpoint_handoff_sha,
              detector_freeze_handoff_sha256=detector_handoff_sha,
          )
          handoff_path = Path(
              "artifacts/phase3-feature-entry-handoff.json"
          )
          handoff_text = (
              json.dumps(handoff, indent=2, sort_keys=True) + "\n"
          )
          handoff_path.write_text(handoff_text)
          handoff_sha = hashlib.sha256(
              handoff_text.encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"feature_subjects_sha256={manifest['sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(f"handoff_sha256={handoff_sha}\n")
              handle.write(
                  f"feature_subjects={summary['feature_subjects']}\n"
              )
          print(json.dumps({
              "feature_subjects_sha256": manifest["sha256"],
              "entry_summary_sha256": summary_sha,
              "entry_handoff_sha256": handoff_sha,
              "feature_subjects": summary["feature_subjects"],
              "snapshot_kind": summary["snapshot_kind"],
              "outcome_rows_consumed": False,
              "outcome_fields_exposed": False,
              "future_state_allowed": False,
              "phase3_feature_values_computed": False,
              "phase3_feature_entry_ready": True,
          }, sort_keys=True))
          PY

      - name: Upload Phase-3 feature entry
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-feature-entry
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact Phase-3 entry handoff
        id: handoff_upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-feature-entry-handoff
          path: |
            artifacts/phase3-feature-subjects.jsonl.manifest.json
            artifacts/phase3-feature-entry-summary.json
            artifacts/phase3-feature-entry-handoff.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish Phase-3 entry identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_DIGEST: ${{ steps.handoff_upload.outputs.artifact-digest }}
          SUBJECTS_SHA256: ${{ steps.entry.outputs.feature_subjects_sha256 }}
          SUMMARY_SHA256: ${{ steps.entry.outputs.summary_sha256 }}
          HANDOFF_SHA256: ${{ steps.entry.outputs.handoff_sha256 }}
          SUBJECTS: ${{ steps.entry.outputs.feature_subjects }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${HANDOFF_ARTIFACT_DIGEST}"
          {
            echo "## Phase-3 feature entry"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase3-feature-entry"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- handoff_artifact_name: phase3-feature-entry-handoff"
            echo "- handoff_artifact_digest: ${HANDOFF_ARTIFACT_DIGEST}"
            echo "- feature_subjects_sha256: ${SUBJECTS_SHA256}"
            echo "- summary_sha256: ${SUMMARY_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- feature_subjects: ${SUBJECTS}"
            echo "- snapshot_kind: first_major_dump_confirmation"
            echo "- outcome_rows_consumed: false"
            echo "- outcome_fields_exposed: false"
            echo "- future_state_allowed: false"
            echo "- phase3_feature_values_computed: false"
            echo "- phase3_feature_entry_ready: true"
          } >> "${GITHUB_STEP_SUMMARY}"
