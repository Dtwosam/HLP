name: phase2-research-price-path-completion

on:
  workflow_dispatch:
    inputs:
      launch_run_id:
        description: Exact successful phase2-research-price-path-launch workflow_dispatch run ID
        required: true
        type: string
      expected_launch_artifact_digest:
        description: Exact price-path launch artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-research-price-path-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
      LAUNCH_RUN_ID: ${{ inputs.launch_run_id }}
      EXPECTED_LAUNCH_DIGEST: ${{ inputs.expected_launch_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: complete
        name: Verify canonical price path and publish dump-geometry inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess,time
          from pathlib import Path
          from hlp.data.phase2_research_paths import (
              PHASE2_RESEARCH_PRICE_PATH_HANDOFF_VERSION,
              build_phase2_research_price_path_handoff,
          )
          from hlp.data.phase2_research_price_path_dispatch import (
              PRICE_PATH_WORKFLOW,
              validate_phase2_research_price_path_launch_receipt,
              validate_phase2_research_price_path_completion_receipt,
          )

          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(path): return json.loads(subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",f"/repos/{repo}/{path}"]))
          def identity(row,workflow,run_id):
              if row.get("path")!=f".github/workflows/{workflow}" or row.get("event")!="workflow_dispatch" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head:
                  raise SystemExit(f"run {run_id} identity drift")
          def wait(run_id,workflow):
              deadline=time.monotonic()+11400
              while True:
                  row=api(f"actions/runs/{run_id}"); identity(row,workflow,run_id)
                  if row.get("status")=="completed":
                      if row.get("conclusion")!="success": raise SystemExit(f"price-path run {run_id} failed: {row.get('conclusion')}")
                      return
                  if time.monotonic()>=deadline: raise SystemExit(f"price-path run {run_id} timed out")
                  time.sleep(15)
          def artifact(run_id,name):
              rows=api(f"actions/runs/{run_id}/artifacts?name={name}").get("artifacts",[])
              rows=[x for x in rows if x.get("name")==name and not x.get("expired")]
              if len(rows)!=1: raise SystemExit(f"{name} artifact cardinality drift")
              return rows[0]
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          launch_run=int(os.environ["LAUNCH_RUN_ID"])
          lr=api(f"actions/runs/{launch_run}"); identity(lr,"phase2-research-price-path-launch.yml",launch_run)
          if lr.get("status")!="completed" or lr.get("conclusion")!="success": raise SystemExit("price-path launch is not successful")
          lname="phase2-research-price-path-launch"; la=artifact(launch_run,lname)
          actual_launch=str(la.get("digest") or "").lower()
          if actual_launch!=os.environ["EXPECTED_LAUNCH_DIGEST"].lower(): raise SystemExit("price-path launch digest drift")
          lroot=Path("upstream/launch")
          if lroot.exists(): shutil.rmtree(lroot)
          lroot.mkdir(parents=True)
          subprocess.check_call(["gh","run","download",str(launch_run),"--repo",repo,"--name",lname,"--dir",str(lroot)])
          launch=validate_phase2_research_price_path_launch_receipt(json.loads((lroot/"phase2-research-price-path-launch-receipt.json").read_text()))
          target=launch["price_path_run_id"]; wait(target,PRICE_PATH_WORKFLOW)

          name="phase2-research-price-path"; art=artifact(target,name)
          root=Path("upstream/price-path")
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          subprocess.check_call(["gh","run","download",str(target),"--repo",repo,"--name",name,"--dir",str(root)])
          report_path=root/"phase2-research-price-path-report.json"
          handoff_path=root/"phase2-research-price-path-handoff.json"
          manifest_path=root/"phase2-research-price-path.jsonl.manifest.json"
          if not(report_path.is_file() and handoff_path.is_file() and manifest_path.is_file()):
              raise SystemExit("price-path artifact lacks canonical checkpoint files")
          report=json.loads(report_path.read_text()); handoff=json.loads(handoff_path.read_text()); manifest=json.loads(manifest_path.read_text())
          if handoff.get("version")!=PHASE2_RESEARCH_PRICE_PATH_HANDOFF_VERSION: raise SystemExit("price-path handoff version drift")
          report_sha=sha(report_path)
          rebuilt=build_phase2_research_price_path_handoff(
              report,
              report_sha256=report_sha,
              materialization_bundle_sha256=launch["materialization_bundle_sha256"],
              materialization_handoff_sha256=launch["materialization_handoff_sha256"],
          )
          if rebuilt!=handoff: raise SystemExit("price-path handoff content drift")
          path_sha=str(manifest.get("sha256") or "").lower()
          if path_sha!=handoff["normalized_price_path_sha256"]: raise SystemExit("price-path manifest SHA drift")
          if int(manifest.get("records",-1))!=int(handoff["price_points"]): raise SystemExit("price-path manifest record drift")
          if handoff["universe_sha256"]!=report["universe_sha256"]: raise SystemExit("price-path universe SHA drift")

          receipt={
              "version":"phase2-research-price-path-completion-receipt-v1",
              "price_path_completion_control_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "price_path_launch_run_id":launch_run,
              "price_path_launch_artifact_digest":actual_launch,
              "price_path_run_id":target,
              "price_path_artifact_digest":str(art.get("digest") or "").lower(),
              "price_path_handoff_sha256":sha(handoff_path),
              "normalized_price_path_sha256":path_sha,
              "price_path_report_sha256":report_sha,
              "execution_branch":branch,
              "execution_head_sha":head,
              "canonical_ledger_commit_sha":launch["canonical_ledger_commit_sha"],
              "universe_run_id":launch["universe_run_id"],
              "universe_artifact_digest":launch["universe_artifact_digest"],
              "universe_handoff_sha256":launch["universe_handoff_sha256"],
              "snapshot_head_block":int(handoff["snapshot_head_block"]),
              "eligible_tokens":int(handoff["eligible_tokens"]),
              "price_points":int(handoff["price_points"]),
              "geometry_inputs":{
                  "price_path_run_id":str(target),
                  "expected_price_path_artifact_digest":str(art.get("digest") or "").lower(),
                  "expected_price_path_handoff_sha256":sha(handoff_path),
                  "universe_run_id":str(launch["universe_run_id"]),
                  "expected_universe_artifact_digest":launch["universe_artifact_digest"],
                  "expected_universe_handoff_sha256":launch["universe_handoff_sha256"],
              },
              "target_run_completed":True,
              "target_run_successful":True,
              "research_price_path_ready":True,
              "dump_threshold_frozen":False,
              "phase2_dump_detector_frozen":False,
              "outcome_labels_computed":False,
              "workflow_dispatch_performed":False,
          }
          receipt=validate_phase2_research_price_path_completion_receipt(receipt)
          Path("artifacts/phase2-research-price-path-completion-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as h:
              for k,v in receipt["geometry_inputs"].items(): h.write(f"{k}={v}\n")
          PY
      - name: Upload price-path completion receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-price-path-completion
          path: artifacts/phase2-research-price-path-completion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish dump-geometry inputs
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PRICE_PATH_RUN: ${{ steps.complete.outputs.price_path_run_id }}
          PRICE_PATH_DIGEST: ${{ steps.complete.outputs.expected_price_path_artifact_digest }}
          PRICE_PATH_HANDOFF_SHA: ${{ steps.complete.outputs.expected_price_path_handoff_sha256 }}
          UNIVERSE_RUN: ${{ steps.complete.outputs.universe_run_id }}
          UNIVERSE_DIGEST: ${{ steps.complete.outputs.expected_universe_artifact_digest }}
          UNIVERSE_HANDOFF_SHA: ${{ steps.complete.outputs.expected_universe_handoff_sha256 }}
        run: |
          {
            echo "## Phase-2 canonical research price-path checkpoint"
            echo "- completion_run_id: ${GITHUB_RUN_ID}"
            echo "- completion_artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- price_path_run_id: ${PRICE_PATH_RUN}"
            echo "- expected_price_path_artifact_digest: ${PRICE_PATH_DIGEST}"
            echo "- expected_price_path_handoff_sha256: ${PRICE_PATH_HANDOFF_SHA}"
            echo "- universe_run_id: ${UNIVERSE_RUN}"
            echo "- expected_universe_artifact_digest: ${UNIVERSE_DIGEST}"
            echo "- expected_universe_handoff_sha256: ${UNIVERSE_HANDOFF_SHA}"
            echo "- research_price_path_ready: true"
          } >> "${GITHUB_STEP_SUMMARY}"
