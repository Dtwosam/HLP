name: phase2-research-price-path-completion

on:
  workflow_dispatch:
    inputs:
      launch_run_id:
        description: Exact successful phase2-research-price-path-launch workflow_dispatch run ID
        required: true
        type: string
      expected_launch_artifact_digest:
        description: Exact price-path launch artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-research-price-path-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
      LAUNCH_RUN_ID: ${{ inputs.launch_run_id }}
      EXPECTED_LAUNCH_DIGEST: ${{ inputs.expected_launch_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: complete
        name: Verify canonical price path and publish dump-geometry inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import time
          from pathlib import Path

          from hlp.data.phase2_research_paths import (
              PHASE2_RESEARCH_PRICE_PATH_HANDOFF_VERSION,
              build_phase2_research_price_path_handoff,
          )
          from hlp.data.phase2_research_price_path_dispatch import (
              validate_phase2_research_price_path_launch_receipt,
              validate_phase2_research_price_path_completion_receipt,
          )

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip().lower()

          def api(path):
              return json.loads(
                  subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      f"/repos/{repo}/{path}",
                  ])
              )

          def identity(row, workflow, run_id):
              if (
                  row.get("path") != f".github/workflows/{workflow}"
                  or row.get("event") != "workflow_dispatch"
                  or row.get("head_branch") != branch
                  or str(row.get("head_sha") or "").lower() != head
              ):
                  raise SystemExit(f"run {run_id} identity drift")

          def wait(run_id, workflow):
              deadline = time.monotonic() + 11400
              while True:
                  row = api(f"actions/runs/{run_id}")
                  identity(row, workflow, run_id)
                  if row.get("status") == "completed":
                      if row.get("conclusion") != "success":
                          raise SystemExit(
                              f"run {run_id} failed: "
                              f"{row.get('conclusion')}"
                          )
                      return
                  if time.monotonic() >= deadline:
                      raise SystemExit(f"run {run_id} timed out")
                  time.sleep(15)

          def artifact(run_id, name):
              rows = api(
                  f"actions/runs/{run_id}/artifacts?name={name}"
              ).get("artifacts", [])
              rows = [
                  row for row in rows
                  if row.get("name") == name and not row.get("expired")
              ]
              if len(rows) != 1:
                  raise SystemExit(f"{name} artifact cardinality drift")
              return rows[0]

          def download(run_id, name, destination):
              root = Path(destination)
              if root.exists():
                  shutil.rmtree(root)
              root.mkdir(parents=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(root),
              ])
              return root

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          launch_run = int(os.environ["LAUNCH_RUN_ID"])
          launch_row = api(f"actions/runs/{launch_run}")
          identity(
              launch_row,
              "phase2-research-price-path-launch.yml",
              launch_run,
          )
          if (
              launch_row.get("status") != "completed"
              or launch_row.get("conclusion") != "success"
          ):
              raise SystemExit("price-path launch is not successful")
          launch_name = "phase2-research-price-path-launch"
          launch_art = artifact(launch_run, launch_name)
          actual_launch = str(launch_art.get("digest") or "").lower()
          if actual_launch != os.environ["EXPECTED_LAUNCH_DIGEST"].lower():
              raise SystemExit("price-path launch digest drift")
          launch_root = download(
              launch_run,
              launch_name,
              "upstream/launch",
          )
          launch = validate_phase2_research_price_path_launch_receipt(
              json.loads(
                  (
                      launch_root
                      / "phase2-research-price-path-launch-receipt.json"
                  ).read_text()
              )
          )
          if launch["execution_head_sha"] != head:
              raise SystemExit("price-path launch receipt HEAD drift")

          target = launch["price_path_run_id"]
          wait(target, "phase2-research-price-path.yml")
          full_name = "phase2-research-price-path"
          handoff_name = "phase2-research-price-path-handoff"
          full_art = artifact(target, full_name)
          handoff_art = artifact(target, handoff_name)
          root = download(
              target,
              full_name,
              "upstream/price-path",
          )
          handoff_root = download(
              target,
              handoff_name,
              "upstream/price-path-handoff",
          )
          report_path = root / "phase2-research-price-path-report.json"
          manifest_path = (
              root / "phase2-research-price-path.jsonl.manifest.json"
          )
          handoff_path = (
              handoff_root / "phase2-research-price-path-handoff.json"
          )
          if not (
              report_path.is_file()
              and manifest_path.is_file()
              and handoff_path.is_file()
          ):
              raise SystemExit("price-path artifact lacks checkpoint files")
          report = json.loads(report_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          handoff = json.loads(handoff_path.read_text())
          report_sha = sha(report_path)
          handoff_sha = sha(handoff_path)
          if handoff.get("version") != (
              PHASE2_RESEARCH_PRICE_PATH_HANDOFF_VERSION
          ):
              raise SystemExit("price-path handoff version drift")
          rebuilt = build_phase2_research_price_path_handoff(
              report,
              report_sha256=report_sha,
              materialization_bundle_sha256=launch[
                  "materialization_bundle_sha256"
              ],
              materialization_handoff_sha256=launch[
                  "materialization_handoff_sha256"
              ],
          )
          if rebuilt != handoff:
              raise SystemExit("price-path handoff semantic drift")
          if str(manifest.get("sha256") or "").lower() != handoff[
              "normalized_price_path_sha256"
          ]:
              raise SystemExit("price-path manifest SHA drift")
          if handoff["materialization_bundle_sha256"] != launch[
              "materialization_bundle_sha256"
          ]:
              raise SystemExit("price-path materialization bundle drift")
          if handoff["materialization_handoff_sha256"] != launch[
              "materialization_handoff_sha256"
          ]:
              raise SystemExit("price-path materialization handoff drift")

          receipt = {
              "version": "phase2-research-price-path-completion-receipt-v1",
              "price_path_completion_control_run_id": int(
                  os.environ["GITHUB_RUN_ID"]
              ),
              "price_path_launch_run_id": launch_run,
              "price_path_launch_artifact_digest": actual_launch,
              "price_path_run_id": target,
              "price_path_artifact_digest": str(
                  full_art.get("digest") or ""
              ).lower(),
              "price_path_handoff_artifact_digest": str(
                  handoff_art.get("digest") or ""
              ).lower(),
              "price_path_sha256": handoff[
                  "normalized_price_path_sha256"
              ],
              "price_path_report_sha256": handoff[
                  "price_path_report_sha256"
              ],
              "price_path_handoff_sha256": handoff_sha,
              "execution_branch": branch,
              "execution_head_sha": head,
              "canonical_ledger_commit_sha": launch[
                  "canonical_ledger_commit_sha"
              ],
              "materialization_freeze_run_id": launch[
                  "materialization_freeze_run_id"
              ],
              "materialization_freeze_artifact_digest": launch[
                  "materialization_freeze_artifact_digest"
              ],
              "materialization_bundle_sha256": launch[
                  "materialization_bundle_sha256"
              ],
              "materialization_handoff_sha256": launch[
                  "materialization_handoff_sha256"
              ],
              "universe_run_id": launch["universe_run_id"],
              "universe_artifact_digest": launch[
                  "universe_artifact_digest"
              ],
              "universe_handoff_sha256": launch[
                  "universe_handoff_sha256"
              ],
              "snapshot_head_block": int(
                  handoff["snapshot_head_block"]
              ),
              "eligible_tokens": int(handoff["eligible_tokens"]),
              "price_points": int(handoff["price_points"]),
              "components": int(handoff["components"]),
              "geometry_inputs": {
                  "price_path_run_id": str(target),
                  "expected_price_path_artifact_digest": str(
                      full_art.get("digest") or ""
                  ).lower(),
                  "expected_price_path_handoff_sha256": handoff_sha,
                  "universe_run_id": str(launch["universe_run_id"]),
                  "expected_universe_artifact_digest": launch[
                      "universe_artifact_digest"
                  ],
                  "expected_universe_handoff_sha256": launch[
                      "universe_handoff_sha256"
                  ],
              },
              "target_run_completed": True,
              "target_run_successful": True,
              "research_price_path_ready": True,
              "dump_threshold_frozen": False,
              "phase2_dump_detector_frozen": False,
              "outcome_labels_computed": False,
              "workflow_dispatch_performed": False,
          }
          receipt = validate_phase2_research_price_path_completion_receipt(
              receipt
          )
          Path(
              "artifacts/phase2-research-price-path-completion-receipt.json"
          ).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in receipt["geometry_inputs"].items():
                  handle.write(f"{key}={value}\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload price-path completion receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-price-path-completion
          path: artifacts/phase2-research-price-path-completion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish dump-geometry dispatch inputs
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PRICE_PATH_RUN: ${{ steps.complete.outputs.price_path_run_id }}
          PRICE_PATH_DIGEST: ${{ steps.complete.outputs.expected_price_path_artifact_digest }}
          PRICE_PATH_HANDOFF: ${{ steps.complete.outputs.expected_price_path_handoff_sha256 }}
          UNIVERSE_RUN: ${{ steps.complete.outputs.universe_run_id }}
          UNIVERSE_DIGEST: ${{ steps.complete.outputs.expected_universe_artifact_digest }}
          UNIVERSE_HANDOFF: ${{ steps.complete.outputs.expected_universe_handoff_sha256 }}
        run: |
          {
            echo "## Phase-2 canonical research price path"
            echo "- completion_run_id: ${GITHUB_RUN_ID}"
            echo "- completion_artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- price_path_run_id: ${PRICE_PATH_RUN}"
            echo "- expected_price_path_artifact_digest: ${PRICE_PATH_DIGEST}"
            echo "- expected_price_path_handoff_sha256: ${PRICE_PATH_HANDOFF}"
            echo "- universe_run_id: ${UNIVERSE_RUN}"
            echo "- expected_universe_artifact_digest: ${UNIVERSE_DIGEST}"
            echo "- expected_universe_handoff_sha256: ${UNIVERSE_HANDOFF}"
            echo "- dump_threshold_frozen: false"
          } >> "${GITHUB_STEP_SUMMARY}"
