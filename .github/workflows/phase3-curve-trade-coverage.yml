name: phase3-curve-trade-coverage

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: One native curve Phase-3 source
        required: true
        type: choice
        options:
          - flap
          - trench_today
          - hood_fun_current
          - hood_fun_previous
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact frozen-universe artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      event_registry_descriptor_json:
        description: JSON with run_id, merged_artifact_name/digest, virtual_manifest_file, registry_file/sha256, shard_artifact_prefix, shard_file_prefix
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-curve-trade-coverage-${{ inputs.source_id }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ID: ${{ inputs.source_id }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  EVENT_REGISTRY_DESCRIPTOR_JSON: ${{ inputs.event_registry_descriptor_json }}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.setup.outputs.shards }}
      event_run_id: ${{ steps.setup.outputs.event_run_id }}
      shard_artifact_prefix: ${{ steps.setup.outputs.shard_artifact_prefix }}
      shard_file_prefix: ${{ steps.setup.outputs.shard_file_prefix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: setup
        name: Verify frozen curve registry and event tape
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.config import normalize_address
          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_trade_source_plan import (
              CURVE_SOURCES,
              build_phase3_trade_source_plan,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl
          from hlp.data.snapshot import write_jsonl_snapshot

          repo = os.environ["GITHUB_REPOSITORY"]
          source_id = os.environ["SOURCE_ID"]
          if source_id not in CURVE_SOURCES:
              raise SystemExit(
                  f"{source_id} is not a Phase-3 curve source"
              )
          plan = {
              row["source_id"]: row
              for row in build_phase3_trade_source_plan()
          }[source_id]
          if (
              plan["wallet_identity_kind"] != "transaction_from"
              or plan["ready_for_canonical_trade_backfill"] is not True
          ):
              raise SystemExit(
                  f"{source_id} curve trade plan drift"
              )

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              output = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  rows = json.loads(raw).get("artifacts", [])
                  output.extend(rows)
                  if len(rows) < 100:
                      return output
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected):
              matches = [
                  row for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; "
                      f"found {len(matches)}"
                  )
              return matches[0]

          universe_root = Path("inputs/universe")
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "frozen Phase-2 universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )
          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          if sha256_path(universe_handoff_path) != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("frozen universe handoff SHA drift")
          universe_handoff = json.loads(
              universe_handoff_path.read_text()
          )
          if (
              universe_handoff.get("phase2_universe_frozen") is not True
              or universe_handoff.get(
                  "phase2_universe_coverage_complete"
              ) is not True
          ):
              raise SystemExit("Phase-2 universe is not ready")
          snapshot = int(universe_handoff["snapshot_head_block"])

          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_manifest_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl.manifest.json",
          )
          universe_manifest = json.loads(
              universe_manifest_path.read_text()
          )
          if (
              sha256_path(universe_path)
              != universe_manifest["sha256"]
              or universe_manifest["sha256"]
              != universe_handoff["eligible_universe_sha256"]
          ):
              raise SystemExit("frozen universe artifact drift")

          eligible = []
          for row in iter_validated_jsonl(
              universe_path,
              universe_manifest_path,
          ):
              if source_id in {
                  str(value)
                  for value in row.get("source_ids") or []
              }:
                  eligible.append(
                      normalize_address(str(row["token"]))
                  )
          eligible = sorted(set(eligible))
          if not eligible:
              raise SystemExit(
                  f"{source_id} has no eligible frozen-universe tokens"
              )

          try:
              descriptor = json.loads(
                  os.environ["EVENT_REGISTRY_DESCRIPTOR_JSON"]
              )
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  "event_registry_descriptor_json is invalid"
              ) from exc
          if not isinstance(descriptor, dict):
              raise SystemExit(
                  "event_registry_descriptor_json must be an object"
              )
          required = (
              "run_id",
              "merged_artifact_name",
              "merged_artifact_digest",
              "virtual_manifest_file",
              "registry_file",
              "registry_sha256",
              "shard_artifact_prefix",
              "shard_file_prefix",
          )
          missing = [
              field for field in required
              if descriptor.get(field) in (None, "")
          ]
          if missing:
              raise SystemExit(
                  "event registry descriptor missing fields: "
                  + ", ".join(missing)
              )
          event_run_id = int(descriptor["run_id"])
          merged_name = str(descriptor["merged_artifact_name"])
          merged_digest = str(
              descriptor["merged_artifact_digest"]
          ).lower()
          virtual_name = str(descriptor["virtual_manifest_file"])
          registry_name = str(descriptor["registry_file"])
          registry_expected_sha = str(
              descriptor["registry_sha256"]
          ).lower().removeprefix("sha256:")
          artifact_prefix = str(descriptor["shard_artifact_prefix"])
          file_prefix = str(descriptor["shard_file_prefix"])
          if (
              event_run_id <= 0
              or not merged_digest.startswith("sha256:")
              or len(merged_digest) != 71
              or len(registry_expected_sha) != 64
              or Path(virtual_name).name != virtual_name
              or Path(registry_name).name != registry_name
              or "/" in artifact_prefix
              or "/" in file_prefix
          ):
              raise SystemExit(
                  "event registry descriptor identity is invalid"
              )
          try:
              int(merged_digest.split(":", 1)[1], 16)
              int(registry_expected_sha, 16)
          except ValueError as exc:
              raise SystemExit(
                  "event registry descriptor digest is invalid"
              ) from exc

          merged_root = Path("inputs/events")
          download_named(
              event_run_id,
              merged_name,
              merged_root,
              f"{source_id} event/registry merged evidence",
              merged_digest,
          )
          virtual_path = find_unique(
              merged_root,
              virtual_name,
          )
          registry_path = find_unique(
              merged_root,
              registry_name,
          )
          if sha256_path(registry_path) != registry_expected_sha:
              raise SystemExit(
                  f"{source_id} registry SHA drift"
              )
          virtual = json.loads(virtual_path.read_text())
          provenance = virtual.get("provenance") or {}
          shards = list(provenance.get("shards") or [])
          if (
              provenance.get("storage_mode")
              != "sharded_artifacts"
              or not shards
          ):
              raise SystemExit(
                  f"{source_id} event tape is not sharded"
              )
          virtual_end = provenance.get(
              "snapshot_head_block",
              provenance.get("to_block"),
          )
          if int(virtual_end) != snapshot:
              raise SystemExit(
                  f"{source_id} event tape/universe snapshot drift"
              )
          from_block = provenance.get(
              "required_start_block",
              provenance.get("from_block"),
          )
          if from_block is None or int(from_block) < 0:
              raise SystemExit(
                  f"{source_id} event tape start is invalid"
              )

          eligible_set = set(eligible)
          registry_rows = []
          seen = set()
          for line in registry_path.read_text().splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              token = normalize_address(
                  str(row.get("token") or "")
              )
              if token not in eligible_set:
                  continue
              if token in seen:
                  raise SystemExit(
                      f"{source_id} registry repeats eligible token: "
                      f"{token}"
                  )
              if source_id.startswith("hood_fun_"):
                  generation = (
                      "current"
                      if source_id == "hood_fun_current"
                      else "previous"
                  )
                  if str(row.get("generation") or "") != generation:
                      raise SystemExit(
                          f"{source_id} registry generation drift"
                      )
              seen.add(token)
              row["token"] = token
              registry_rows.append(row)
          if seen != eligible_set:
              raise SystemExit(
                  f"{source_id} registry/frozen universe membership drift"
              )
          registry_rows.sort(key=lambda row: row["token"])
          registry_manifest = write_jsonl_snapshot(
              registry_rows,
              output=Path(
                  "artifacts/phase3-curve-registry.jsonl"
              ),
              provenance={
                  "source_id": source_id,
                  "upstream_registry_sha256": registry_expected_sha,
                  "eligible_universe_sha256": universe_manifest[
                      "sha256"
                  ],
                  "snapshot_head_block": snapshot,
                  "exact_frozen_source_membership": True,
              },
          )
          write_jsonl_snapshot(
              [{"token": token} for token in eligible],
              output=Path(
                  "artifacts/phase3-curve-eligible-tokens.jsonl"
              ),
              provenance={
                  "source_id": source_id,
                  "eligible_universe_sha256": universe_manifest[
                      "sha256"
                  ],
                  "snapshot_head_block": snapshot,
              },
          )
          Path(
              "artifacts/phase3-curve-event-shards.manifest.json"
          ).write_bytes(virtual_path.read_bytes())

          setup = {
              "version": "phase3-curve-trade-coverage-setup-v1",
              "source_id": source_id,
              "snapshot_head_block": snapshot,
              "eligible_universe_sha256": universe_manifest["sha256"],
              "eligible_tokens": len(eligible),
              "event_run_id": event_run_id,
              "merged_artifact_name": merged_name,
              "merged_artifact_digest": merged_digest,
              "event_tape_sha256": virtual["sha256"],
              "event_from_block": int(from_block),
              "event_to_block": snapshot,
              "event_shards": len(shards),
              "shard_artifact_prefix": artifact_prefix,
              "shard_file_prefix": file_prefix,
              "upstream_registry_sha256": registry_expected_sha,
              "market_registry_sha256": registry_manifest["sha256"],
              "wallet_identity_kind": "transaction_from",
              "historical_event_scan_complete": True,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
          }
          Path(
              "artifacts/phase3-curve-trade-coverage-setup.json"
          ).write_text(
              json.dumps(setup, indent=2, sort_keys=True)
              + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "shards="
                  + json.dumps(list(range(len(shards))))
                  + "\n"
              )
              handle.write(f"event_run_id={event_run_id}\n")
              handle.write(
                  f"shard_artifact_prefix={artifact_prefix}\n"
              )
              handle.write(
                  f"shard_file_prefix={file_prefix}\n"
              )
          print(json.dumps(setup, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: phase3-curve-trade-coverage-setup-${{ inputs.source_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  shard:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    env:
      EVENT_RUN_ID: ${{ needs.setup.outputs.event_run_id }}
      SHARD_ARTIFACT_PREFIX: ${{ needs.setup.outputs.shard_artifact_prefix }}
      SHARD_FILE_PREFIX: ${{ needs.setup.outputs.shard_file_prefix }}
      SHARD_INDEX: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase3-curve-trade-coverage-setup-${{ inputs.source_id }}
          path: inputs/setup
      - name: Download exact native-event shard
        run: |
          mkdir -p inputs/raw
          gh run download "${EVENT_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name "${SHARD_ARTIFACT_PREFIX}${SHARD_INDEX}"             --dir inputs/raw
      - id: filter
        name: Validate shard and retain native trade events
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from hlp.config import normalize_address
          from hlp.data.phase3_curve_trade_coverage import (
              TRADE_EVENT_TYPES,
          )
          from hlp.data.snapshot import write_jsonl_snapshot

          source_id = os.environ["SOURCE_ID"]
          index = int(os.environ["SHARD_INDEX"])
          suffix = f"{index:03d}"
          file_prefix = os.environ["SHARD_FILE_PREFIX"]
          setup = json.loads(
              Path(
                  "inputs/setup/phase3-curve-trade-coverage-setup.json"
              ).read_text()
          )
          virtual = json.loads(
              Path(
                  "inputs/setup/phase3-curve-event-shards.manifest.json"
              ).read_text()
          )
          expected_name = f"{file_prefix}{suffix}.jsonl"
          expected = {
              row["file"]: row
              for row in (
                  virtual.get("provenance") or {}
              ).get("shards") or []
          }.get(expected_name)
          if expected is None:
              raise SystemExit(
                  f"event shard absent from virtual manifest: "
                  f"{expected_name}"
              )
          matches = sorted(
              Path("inputs/raw").rglob(expected_name)
          )
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one {expected_name}; found {len(matches)}"
              )
          raw_path = matches[0]
          manifest_path = raw_path.with_suffix(
              raw_path.suffix + ".manifest.json"
          )
          manifest = json.loads(manifest_path.read_text())
          digest = hashlib.sha256(
              raw_path.read_bytes()
          ).hexdigest()
          if (
              digest != manifest.get("sha256")
              or digest != expected["sha256"]
              or int(manifest.get("records", -1))
              != int(expected["records"])
          ):
              raise SystemExit(
                  f"native event shard identity drift: {expected_name}"
              )
          provenance = manifest.get("provenance") or {}
          lo = int(provenance["from_block"])
          hi = int(provenance["to_block"])
          if (
              lo != int(expected["from_block"])
              or hi != int(expected["to_block"])
          ):
              raise SystemExit(
                  f"native event shard range drift: {expected_name}"
              )

          eligible = {
              normalize_address(json.loads(line)["token"])
              for line in Path(
                  "inputs/setup/phase3-curve-eligible-tokens.jsonl"
              ).read_text().splitlines()
              if line.strip()
          }
          allowed = TRADE_EVENT_TYPES[source_id]
          rows = []
          for line in raw_path.read_text().splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              token = normalize_address(
                  str(row.get("token") or "")
              )
              if (
                  token in eligible
                  and str(row.get("event_type") or "")
                  in allowed
              ):
                  row["token"] = token
                  rows.append(row)
          rows.sort(key=lambda row: (
              int(row["block_number"]),
              -1 if row.get("transaction_index") is None
              else int(row["transaction_index"]),
              int(row["log_index"]),
              row["token"],
              str(row["transaction_hash"]).lower(),
          ))
          output = Path(
              f"artifacts/phase3-curve-trades-{suffix}.jsonl"
          )
          filtered = write_jsonl_snapshot(
              rows,
              output=output,
              provenance={
                  "version": "phase3-curve-trade-shard-v1",
                  "source_id": source_id,
                  "from_block": lo,
                  "to_block": hi,
                  "upstream_event_shard_sha256": digest,
                  "event_tape_sha256": setup[
                      "event_tape_sha256"
                  ],
                  "market_registry_sha256": setup[
                      "market_registry_sha256"
                  ],
                  "historical_event_scan_complete": True,
              },
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"trade_file={output}\n")
              handle.write(f"records={filtered['records']}\n")
              handle.write(f"from_block={lo}\n")
              handle.write(f"to_block={hi}\n")
          PY
      - name: Attach transaction identities
        if: ${{ steps.filter.outputs.records != '0' }}
        env:
          TRADE_FILE: ${{ steps.filter.outputs.trade_file }}
        run: |
          printf -v SHARD "%03d" "$SHARD_INDEX"
          hlp --timeout 30 --attempts 5 --min-interval 0.1             rpc-transaction-identity-enrich             --events "$TRADE_FILE"             --transactions-out "artifacts/phase3-curve-identities-$SHARD.jsonl"             --out "artifacts/phase3-curve-enriched-$SHARD.jsonl"             --label "${SOURCE_ID} native trade"
      - name: Materialize empty identity evidence
        if: ${{ steps.filter.outputs.records == '0' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from hlp.data.snapshot import write_jsonl_snapshot

          suffix = f"{int(os.environ['SHARD_INDEX']):03d}"
          source_id = os.environ["SOURCE_ID"]
          for name, source in (
              (
                  f"phase3-curve-identities-{suffix}.jsonl",
                  "empty_transaction_identity_shard",
              ),
              (
                  f"phase3-curve-enriched-{suffix}.jsonl",
                  "empty_enriched_curve_shard",
              ),
          ):
              write_jsonl_snapshot(
                  [],
                  output=Path("artifacts") / name,
                  provenance={
                      "source": source,
                      "source_id": source_id,
                      "wallet_identity_kind": "transaction_from",
                  },
              )
          PY
      - name: Publish curve shard report
        env:
          FROM_BLOCK: ${{ steps.filter.outputs.from_block }}
          TO_BLOCK: ${{ steps.filter.outputs.to_block }}
          RECORDS: ${{ steps.filter.outputs.records }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          suffix = f"{int(os.environ['SHARD_INDEX']):03d}"
          trade = Path(
              f"artifacts/phase3-curve-trades-{suffix}.jsonl"
          )
          identity = Path(
              f"artifacts/phase3-curve-identities-{suffix}.jsonl"
          )
          trade_manifest = json.loads(
              trade.with_suffix(
                  trade.suffix + ".manifest.json"
              ).read_text()
          )
          identity_manifest = json.loads(
              identity.with_suffix(
                  identity.suffix + ".manifest.json"
              ).read_text()
          )
          if hashlib.sha256(trade.read_bytes()).hexdigest() != (
              trade_manifest["sha256"]
          ):
              raise SystemExit("curve trade shard SHA drift")
          if hashlib.sha256(identity.read_bytes()).hexdigest() != (
              identity_manifest["sha256"]
          ):
              raise SystemExit("curve identity shard SHA drift")
          report = {
              "version": "phase3-curve-trade-coverage-shard-v1",
              "source_id": os.environ["SOURCE_ID"],
              "shard_index": int(os.environ["SHARD_INDEX"]),
              "from_block": int(os.environ["FROM_BLOCK"]),
              "to_block": int(os.environ["TO_BLOCK"]),
              "trade_rows": int(os.environ["RECORDS"]),
              "trade_rows_sha256": trade_manifest["sha256"],
              "wallet_identity_rows": int(
                  identity_manifest["records"]
              ),
              "wallet_identity_sha256": identity_manifest["sha256"],
              "historical_event_scan_complete": True,
              "wallet_identity_complete": True,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
          }
          Path(
              f"artifacts/phase3-curve-shard-report-{suffix}.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True)
              + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-curve-trade-coverage-${{ inputs.source_id }}-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: [setup, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase3-curve-trade-coverage-setup-${{ inputs.source_id }}
          path: inputs/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: phase3-curve-trade-coverage-${{ inputs.source_id }}-*
          path: inputs/shards
          merge-multiple: true
      - id: merge
        name: Build canonical curve source coverage
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from hlp.data.phase3_curve_trade_coverage import (
              materialize_phase3_curve_trade_coverage,
          )
          from hlp.data.sharded_tape import (
              validate_shard_block_coverage,
          )

          setup = json.loads(
              Path(
                  "inputs/setup/phase3-curve-trade-coverage-setup.json"
              ).read_text()
          )
          source_id = setup["source_id"]
          registry = [
              json.loads(line)
              for line in Path(
                  "inputs/setup/phase3-curve-registry.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          eligible = [
              json.loads(line)["token"]
              for line in Path(
                  "inputs/setup/phase3-curve-eligible-tokens.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]

          reports = sorted(
              Path("inputs/shards").glob(
                  "phase3-curve-shard-report-*.json"
              )
          )
          expected = int(setup["event_shards"])
          if len(reports) != expected:
              raise SystemExit(
                  f"curve shard report count drift: "
                  f"{len(reports)} != {expected}"
              )
          coverage = []
          events = []
          identity_by_hash = {}
          for report_path in reports:
              report = json.loads(report_path.read_text())
              suffix = report_path.stem.rsplit("-", 1)[-1]
              if (
                  report.get("source_id") != source_id
                  or report.get(
                      "historical_event_scan_complete"
                  ) is not True
                  or report.get(
                      "wallet_identity_complete"
                  ) is not True
              ):
                  raise SystemExit(
                      f"curve shard report drift: {suffix}"
                  )
              trade = Path(
                  "inputs/shards"
              ) / f"phase3-curve-trades-{suffix}.jsonl"
              identity = Path(
                  "inputs/shards"
              ) / f"phase3-curve-identities-{suffix}.jsonl"
              trade_manifest = json.loads(
                  trade.with_suffix(
                      trade.suffix + ".manifest.json"
                  ).read_text()
              )
              identity_manifest = json.loads(
                  identity.with_suffix(
                      identity.suffix + ".manifest.json"
                  ).read_text()
              )
              if hashlib.sha256(trade.read_bytes()).hexdigest() != (
                  trade_manifest["sha256"]
              ):
                  raise SystemExit(
                      f"curve trade shard SHA drift: {suffix}"
                  )
              if hashlib.sha256(identity.read_bytes()).hexdigest() != (
                  identity_manifest["sha256"]
              ):
                  raise SystemExit(
                      f"curve identity shard SHA drift: {suffix}"
                  )
              if trade_manifest["sha256"] != report[
                  "trade_rows_sha256"
              ]:
                  raise SystemExit(
                      f"curve trade/report SHA drift: {suffix}"
                  )
              if identity_manifest["sha256"] != report[
                  "wallet_identity_sha256"
              ]:
                  raise SystemExit(
                      f"curve identity/report SHA drift: {suffix}"
                  )
              coverage.append({
                  "file": trade.name,
                  "records": int(trade_manifest["records"]),
                  "sha256": trade_manifest["sha256"],
                  "from_block": int(report["from_block"]),
                  "to_block": int(report["to_block"]),
              })
              for line in trade.read_text().splitlines():
                  if line.strip():
                      events.append(json.loads(line))
              for line in identity.read_text().splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  tx_hash = str(row["transaction_hash"]).lower()
                  if tx_hash in identity_by_hash:
                      raise SystemExit(
                          f"curve transaction identity repeats: "
                          f"{tx_hash}"
                      )
                  identity_by_hash[tx_hash] = row

          validate_shard_block_coverage(
              coverage,
              start_block=int(setup["event_from_block"]),
              end_block=int(setup["event_to_block"]),
          )
          events.sort(key=lambda row: (
              int(row["block_number"]),
              -1 if row.get("transaction_index") is None
              else int(row["transaction_index"]),
              int(row["log_index"]),
              row["token"],
              str(row["transaction_hash"]).lower(),
          ))
          identities = [
              identity_by_hash[key]
              for key in sorted(identity_by_hash)
          ]
          canonical_file = (
              f"phase3-{source_id}-canonical-trades.jsonl"
          )
          coverage_file = (
              f"phase3-{source_id}-trade-coverage.jsonl"
          )
          summary = materialize_phase3_curve_trade_coverage(
              source_id=source_id,
              eligible_tokens=eligible,
              registry_rows=registry,
              event_rows=events,
              transaction_rows=identities,
              snapshot_head_block=int(
                  setup["snapshot_head_block"]
              ),
              historical_event_scan_complete=True,
              raw_output=Path(
                  f"artifacts/phase3-{source_id}-native-trades.jsonl"
              ),
              registry_output=Path(
                  f"artifacts/phase3-{source_id}-registry.jsonl"
              ),
              wallet_identity_output=Path(
                  f"artifacts/phase3-{source_id}-wallet-identities.jsonl"
              ),
              canonical_output=Path("artifacts") / canonical_file,
              coverage_output=Path("artifacts") / coverage_file,
          )
          summary.update({
              "eligible_universe_sha256": setup[
                  "eligible_universe_sha256"
              ],
              "upstream_registry_sha256": setup[
                  "upstream_registry_sha256"
              ],
              "event_tape_sha256": setup["event_tape_sha256"],
              "event_run_id": setup["event_run_id"],
              "merged_artifact_name": setup[
                  "merged_artifact_name"
              ],
              "merged_artifact_digest": setup[
                  "merged_artifact_digest"
              ],
              "canonical_file": canonical_file,
              "coverage_file": coverage_file,
          })
          summary_path = Path(
              f"artifacts/phase3-{source_id}-trade-coverage-summary.json"
          )
          summary_text = (
              json.dumps(summary, indent=2, sort_keys=True)
              + "\n"
          )
          summary_path.write_text(summary_text)
          summary_sha = hashlib.sha256(
              summary_text.encode()
          ).hexdigest()
          with open(
              Path("/dev/stdout"), "w"
          ) as handle:
              pass
          with open(
              __import__("os").environ["GITHUB_OUTPUT"], "a"
          ) as handle:
              handle.write(
                  f"canonical_sha256="
                  f"{summary['canonical_trade_rows_sha256']}\n"
              )
              handle.write(
                  f"coverage_sha256="
                  f"{summary['coverage_rows_sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(
                  f"canonical_rows="
                  f"{summary['canonical_trade_rows']}\n"
              )
              handle.write(
                  f"eligible_tokens={summary['eligible_tokens']}\n"
              )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload curve Phase-3 trade coverage
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-trade-coverage-${{ inputs.source_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Publish curve trade coverage identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CANONICAL_SHA: ${{ steps.merge.outputs.canonical_sha256 }}
          COVERAGE_SHA: ${{ steps.merge.outputs.coverage_sha256 }}
          SUMMARY_SHA: ${{ steps.merge.outputs.summary_sha256 }}
          CANONICAL_ROWS: ${{ steps.merge.outputs.canonical_rows }}
          ELIGIBLE_TOKENS: ${{ steps.merge.outputs.eligible_tokens }}
        run: |
          set -euo pipefail
          {
            echo "## Phase-3 curve trade coverage"
            echo
            echo "- source_id: ${SOURCE_ID}"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase3-trade-coverage-${SOURCE_ID}"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- canonical_file: phase3-${SOURCE_ID}-canonical-trades.jsonl"
            echo "- coverage_file: phase3-${SOURCE_ID}-trade-coverage.jsonl"
            echo "- canonical_trade_rows_sha256: ${CANONICAL_SHA}"
            echo "- coverage_rows_sha256: ${COVERAGE_SHA}"
            echo "- summary_sha256: ${SUMMARY_SHA}"
            echo "- canonical_trade_rows: ${CANONICAL_ROWS}"
            echo "- eligible_tokens: ${ELIGIBLE_TOKENS}"
            echo "- wallet_identity_kind: transaction_from"
            echo "- historical_event_scan_complete: true"
            echo "- wallet_identity_complete: true"
            echo "- canonical_trade_adapter_complete: true"
            echo "- trade_coverage_complete: true"
            echo "- outcome_rows_consumed: false"
            echo "- future_state_allowed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
