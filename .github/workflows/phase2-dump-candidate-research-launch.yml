name: phase2-dump-candidate-research-launch

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Exact successful phase2-dump-candidate-research-plan workflow_dispatch run ID
        required: true
        type: string
      expected_plan_artifact_digest:
        description: Exact candidate-research plan artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: phase2-dump-candidate-research-launch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: launch
        name: Dispatch explicit candidate comparison
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import base64,json,os,shutil,subprocess
          from pathlib import Path
          from hlp.data.phase2_dispatch_readiness import workflow_dispatch_interface_sha256
          from hlp.data.phase2_dump_candidate_dispatch import (
              CANDIDATE_RESEARCH_WORKFLOW,
              validate_phase2_dump_candidate_research_plan,
              validate_phase2_dump_candidate_launch_receipt,
          )
          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(args,payload=None):
              raw=subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",*args],input=(json.dumps(payload,sort_keys=True,separators=(",",":")).encode() if payload is not None else None))
              return json.loads(raw) if raw.strip() else None
          def identity(row,workflow,run_id):
              if row.get("path")!=f".github/workflows/{workflow}" or row.get("event")!="workflow_dispatch" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head:
                  raise SystemExit(f"run {run_id} identity drift")
          def artifact(run_id,name):
              rows=api([f"/repos/{repo}/actions/runs/{run_id}/artifacts?name={name}"]).get("artifacts",[])
              rows=[x for x in rows if x.get("name")==name and not x.get("expired")]
              if len(rows)!=1: raise SystemExit(f"{name} artifact cardinality drift")
              return rows[0]
          plan_run=int(os.environ["PLAN_RUN_ID"]); pr=api([f"/repos/{repo}/actions/runs/{plan_run}"])
          identity(pr,"phase2-dump-candidate-research-plan.yml",plan_run)
          if pr.get("status")!="completed" or pr.get("conclusion")!="success": raise SystemExit("candidate plan is not successful")
          name="phase2-dump-candidate-research-plan"; art=artifact(plan_run,name)
          actual=str(art.get("digest") or "").lower()
          if actual!=os.environ["EXPECTED_PLAN_DIGEST"].lower(): raise SystemExit("candidate plan digest drift")
          root=Path("upstream/plan")
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          subprocess.check_call(["gh","run","download",str(plan_run),"--repo",repo,"--name",name,"--dir",str(root)])
          plan=validate_phase2_dump_candidate_research_plan(json.loads((root/"phase2-dump-candidate-research-plan.json").read_text()))
          if plan["execution_head_sha"]!=head: raise SystemExit("candidate plan HEAD drift")
          metadata=api([f"/repos/{repo}"]); default_branch=str(metadata.get("default_branch") or "")
          local=workflow_dispatch_interface_sha256(Path(".github/workflows",CANDIDATE_RESEARCH_WORKFLOW).read_text())
          payload=api([f"/repos/{repo}/contents/.github/workflows/{CANDIDATE_RESEARCH_WORKFLOW}?ref={default_branch}"])
          remote=workflow_dispatch_interface_sha256(base64.b64decode(str(payload.get("content") or "").replace("\n","")).decode())
          if local!=remote: raise SystemExit("default-branch candidate-research interface drift")
          response=api(["--method","POST",f"/repos/{repo}/actions/workflows/{CANDIDATE_RESEARCH_WORKFLOW}/dispatches","--input","-"],{"ref":branch,"inputs":plan["inputs"]})
          target=int((response or {}).get("workflow_run_id",0))
          if target<=0: raise SystemExit("candidate-research dispatch lacks run ID")
          identity(api([f"/repos/{repo}/actions/runs/{target}"]),CANDIDATE_RESEARCH_WORKFLOW,target)
          receipt={
              "version":"phase2-dump-candidate-research-launch-receipt-v1",
              "candidate_control_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "candidate_plan_run_id":plan_run,
              "candidate_plan_artifact_digest":actual,
              "candidate_research_run_id":target,
              "candidate_specs_sha256":plan["candidate_specs_sha256"],
              "price_path_run_id":plan["price_path_run_id"],
              "price_path_artifact_digest":plan["price_path_artifact_digest"],
              "price_path_handoff_sha256":plan["price_path_handoff_sha256"],
              "execution_branch":branch,
              "execution_head_sha":head,
              "canonical_ledger_commit_sha":plan["canonical_ledger_commit_sha"],
              "target_runs_created":1,
              "target_run_waited_for_completion":False,
              "uses_outcome_labels":False,
              "candidate_selected":False,
              "detector_freeze_ready":False,
              "phase2_dump_detector_frozen":False,
              "outcome_labels_computed":False,
              "workflow_dispatch_performed":True,
          }
          receipt=validate_phase2_dump_candidate_launch_receipt(receipt)
          Path("artifacts/phase2-dump-candidate-research-launch-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as h: h.write(f"candidate_run_id={target}\n")
          PY
      - name: Upload candidate launch receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dump-candidate-research-launch
          path: artifacts/phase2-dump-candidate-research-launch-receipt.json
          if-no-files-found: error
          retention-days: 90
