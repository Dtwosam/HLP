name: phase1-archive-rpc-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nodeflare-public-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Diagnostic public-history probe
        run: |
          hlp \
            --rpc-url https://rpc.nodeflare.app/robinhood/public \
            --timeout 10 --attempts 1 \
            deployment-block 0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB
