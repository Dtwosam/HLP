name: phase1-pons-representative-transfers-full

on:
  workflow_dispatch:
    inputs:
      sample_run_id:
        description: "Successful phase1-pons-representative-sample-freeze run"
        required: true
        type: string
      prior_run_id:
        description: "Optional earlier representative-transfer run whose successful shards must be reused"
        required: false
        default: ""
        type: string
      max_blocks:
        description: "Maximum blocks per transfer shard"
        required: true
        default: "100000"
        type: string
  workflow_call:
    inputs:
      sample_run_id:
        required: true
        type: string
      prior_run_id:
        required: false
        default: ""
        type: string
      max_blocks:
        required: false
        default: "100000"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-representative-transfers-full-${{ github.ref }}
  cancel-in-progress: false

env:
  SNAPSHOT_HEAD: '54486035'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix_1: ${{ steps.plan.outputs.matrix_1 }}
      matrix_2: ${{ steps.plan.outputs.matrix_2 }}
      matrix_3: ${{ steps.plan.outputs.matrix_3 }}
      matrix_4: ${{ steps.plan.outputs.matrix_4 }}
      gap_count: ${{ steps.plan.outputs.gap_count }}
      gap_count_1: ${{ steps.plan.outputs.gap_count_1 }}
      gap_count_2: ${{ steps.plan.outputs.gap_count_2 }}
      gap_count_3: ${{ steps.plan.outputs.gap_count_3 }}
      gap_count_4: ${{ steps.plan.outputs.gap_count_4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_sample
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before retry
        if: ${{ steps.download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - id: retry_download_sample
        name: Retry representative sample artifact download
        if: ${{ steps.download_sample.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before final retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - name: Final representative sample artifact download retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Download every prior representative transfer shard artifact
        if: ${{ inputs.prior_run_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import urllib.request
          import zipfile
          from pathlib import Path

          from hlp.data.github_actions import (
              fetch_github_actions_artifact_zip,
          )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          run_id = int(os.environ["PRIOR_RUN_ID"])
          pattern = re.compile(
              r"^phase1-pons-representative-transfer-(\d+)$"
          )

          def get(path):
              request = urllib.request.Request(
                  api + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          selected = []
          page = 1
          while True:
              payload = get(
                  f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                  f"?per_page=100&page={page}"
              )
              rows = list(payload.get("artifacts") or [])
              for row in rows:
                  match = pattern.fullmatch(str(row.get("name") or ""))
                  if match and not row.get("expired"):
                      selected.append((int(match.group(1)), row))
              if len(rows) < 100:
                  break
              page += 1
              if page > 20:
                  raise SystemExit(
                      "representative transfer artifact pagination "
                      "exceeded 2000"
                  )

          selected.sort(key=lambda item: item[0])
          indexes = [index for index, _ in selected]
          if not selected:
              raise SystemExit(
                  "prior representative transfer run has no shard artifacts"
              )
          if len(indexes) != len(set(indexes)):
              raise SystemExit(
                  "prior representative transfer run has duplicate shard "
                  "artifact indexes"
              )

          target = Path("prior")
          target.mkdir(parents=True, exist_ok=True)
          extracted = 0
          for index, artifact in selected:
              blob = fetch_github_actions_artifact_zip(
                  api
                  + f"/repos/{repo}/actions/artifacts/"
                  + f"{int(artifact['id'])}/zip",
                  token,
              )
              with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                  for member in archive.infolist():
                      if member.is_dir():
                          continue
                      name = Path(member.filename).name
                      if not name:
                          continue
                      destination = target / name
                      if destination.exists():
                          raise SystemExit(
                              "duplicate prior representative transfer file: "
                              f"{name}"
                          )
                      destination.write_bytes(archive.read(member))
                      extracted += 1

          print(json.dumps({
              "prior_run_id": run_id,
              "artifact_pages": page,
              "shard_artifacts": len(selected),
              "first_shard_index": indexes[0],
              "last_shard_index": indexes[-1],
              "extracted_files": extracted,
          }, sort_keys=True))
          PY
      - id: plan
        name: Plan only missing representative transfer ranges
        env:
          MAX_BLOCKS: ${{ inputs.max_blocks }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.data.pons_representative_identity import (
              require_representative_sample_identity,
          )
          from hlp.data.ranges import plan_missing_subranges

          sample = [
              json.loads(line)
              for line in Path(
                  "sample/pons-representative-sample.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          if len(sample) != 10:
              raise SystemExit(
                  f"representative transfer sample must contain 10 tokens, "
                  f"got {len(sample)}"
              )
          sample_path = Path(
              "sample/pons-representative-sample.jsonl"
          )
          sample_summary = json.loads(
              Path(
                  "sample/pons-representative-sample-summary.json"
              ).read_text()
          )
          identity = require_representative_sample_identity(
              sample_path,
              sample_summary,
          )
          tokens = set(identity["tokens"])
          sample_sha256 = identity["sample_sha256"]
          token_set_sha256 = identity["token_set_sha256"]

          start = min(int(row["launch_block"]) for row in sample)
          head = int(os.environ["SNAPSHOT_HEAD"])
          max_blocks = int(os.environ["MAX_BLOCKS"])
          if not 1 <= max_blocks <= 200_000:
              raise SystemExit(
                  "max_blocks must be between 1 and 200000"
              )

          covered = []
          sources = []
          for path in sorted(
              Path("prior").glob(
                  "representative-transfers-*.jsonl.manifest.json"
              )
          ):
              manifest = json.loads(path.read_text())
              prov = manifest.get("provenance") or {}
              if int(prov.get("chain_id", -1)) != 4663:
                  raise SystemExit(
                      f"prior transfer shard chain mismatch: {path}"
                  )
              if int(prov.get("token_count", -1)) != 10:
                  raise SystemExit(
                      f"prior transfer shard token count mismatch: {path}"
                  )
              if prov.get("sample_sha256") != sample_sha256:
                  raise SystemExit(
                      "prior transfer shard sample identity mismatch: "
                      f"{path}"
                  )
              if prov.get("token_set_sha256") != token_set_sha256:
                  raise SystemExit(
                      "prior transfer shard token-set identity mismatch: "
                      f"{path}"
                  )
              lo = int(prov["from_block"])
              hi = int(prov["to_block"])
              covered.append((lo, hi))
              sources.append({
                  "source": path.parent.name,
                  "manifest": path.name,
                  "from_block": lo,
                  "to_block": hi,
                  "records": int(manifest["records"]),
                  "sha256": manifest["sha256"],
              })

          gaps = plan_missing_subranges(
              start,
              head,
              covered,
              max_blocks=max_blocks,
          )
          if len(gaps) > 960:
              raise SystemExit(
                  "representative transfer plan exceeds four serialized "
                  "240-job waves"
              )
          include = [
              {
                  "id": f"{index:03d}",
                  "from_block": lo,
                  "to_block": hi,
              }
              for index, (lo, hi) in enumerate(gaps)
          ]
          wave_1 = include[:240]
          wave_2 = include[240:480]
          wave_3 = include[480:720]
          wave_4 = include[720:]

          report = {
              "sample_run_id": int("${{ inputs.sample_run_id }}"),
              "prior_run_id": (
                  int("${{ inputs.prior_run_id }}")
                  if "${{ inputs.prior_run_id }}"
                  else None
              ),
              "snapshot_head_block": head,
              "sample_tokens": sorted(tokens),
              "sample_sha256": sample_sha256,
              "token_set_sha256": token_set_sha256,
              "sample_start_block": start,
              "max_blocks": max_blocks,
              "reused_sources": sources,
              "gap_jobs": include,
              "gap_job_count": len(include),
              "gap_wave_job_counts": [
                  len(wave_1),
                  len(wave_2),
                  len(wave_3),
                  len(wave_4),
              ],
              "gap_blocks": sum(
                  row["to_block"] - row["from_block"] + 1
                  for row in include
              ),
          }
          Path(
              "artifacts/pons-representative-transfer-plan.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for index, wave in enumerate(
                  (wave_1, wave_2, wave_3, wave_4),
                  start=1,
              ):
                  handle.write(
                      f"matrix_{index}="
                      + json.dumps(
                          {"include": wave},
                          separators=(",", ":"),
                      )
                      + "\n"
                  )
                  handle.write(
                      f"gap_count_{index}={len(wave)}\n"
                  )
              handle.write(f"gap_count={len(include)}\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - id: upload_plan
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-plan
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_plan
        name: Retry representative transfer plan artifact upload
        if: ${{ steps.upload_plan.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-plan
          path: artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Final representative transfer plan artifact upload retry
        if: ${{ steps.retry_upload_plan.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-plan
          path: artifacts/
          if-no-files-found: error
          overwrite: true

  acquire_1:
    needs: plan
    if: ${{ needs.plan.outputs.gap_count_1 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_1) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_sample
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before retry
        if: ${{ steps.download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - id: retry_download_sample
        name: Retry representative sample artifact download
        if: ${{ steps.download_sample.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before final retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - name: Final representative sample artifact download retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact representative transfer interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          RANGE_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-pons-transfer-tape \
            --tokens sample/pons-representative-sample.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --out "artifacts/representative-transfers-${RANGE_ID}.jsonl"
      - id: upload_shard
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_shard
        name: Retry representative transfer shard artifact upload
        if: ${{ steps.upload_shard.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Final representative transfer shard artifact upload retry
        if: ${{ steps.retry_upload_shard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true

  acquire_2:
    needs: [plan, acquire_1]
    if: ${{ always() && needs.plan.result == 'success' && (needs.acquire_1.result == 'success' || needs.acquire_1.result == 'failure' || needs.acquire_1.result == 'skipped') && needs.plan.outputs.gap_count_2 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_2) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_sample
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before retry
        if: ${{ steps.download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - id: retry_download_sample
        name: Retry representative sample artifact download
        if: ${{ steps.download_sample.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before final retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - name: Final representative sample artifact download retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact representative transfer interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          RANGE_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-pons-transfer-tape \
            --tokens sample/pons-representative-sample.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --out "artifacts/representative-transfers-${RANGE_ID}.jsonl"
      - id: upload_shard
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_shard
        name: Retry representative transfer shard artifact upload
        if: ${{ steps.upload_shard.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Final representative transfer shard artifact upload retry
        if: ${{ steps.retry_upload_shard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true

  acquire_3:
    needs: [plan, acquire_2]
    if: ${{ always() && needs.plan.result == 'success' && (needs.acquire_2.result == 'success' || needs.acquire_2.result == 'failure' || needs.acquire_2.result == 'skipped') && needs.plan.outputs.gap_count_3 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_3) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_sample
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before retry
        if: ${{ steps.download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - id: retry_download_sample
        name: Retry representative sample artifact download
        if: ${{ steps.download_sample.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before final retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - name: Final representative sample artifact download retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact representative transfer interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          RANGE_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-pons-transfer-tape \
            --tokens sample/pons-representative-sample.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --out "artifacts/representative-transfers-${RANGE_ID}.jsonl"
      - id: upload_shard
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_shard
        name: Retry representative transfer shard artifact upload
        if: ${{ steps.upload_shard.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Final representative transfer shard artifact upload retry
        if: ${{ steps.retry_upload_shard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true

  acquire_4:
    needs: [plan, acquire_3]
    if: ${{ always() && needs.plan.result == 'success' && (needs.acquire_3.result == 'success' || needs.acquire_3.result == 'failure' || needs.acquire_3.result == 'skipped') && needs.plan.outputs.gap_count_4 != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_4) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_sample
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before retry
        if: ${{ steps.download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - id: retry_download_sample
        name: Retry representative sample artifact download
        if: ${{ steps.download_sample.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before final retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - name: Final representative sample artifact download retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact representative transfer interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          RANGE_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-pons-transfer-tape \
            --tokens sample/pons-representative-sample.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --out "artifacts/representative-transfers-${RANGE_ID}.jsonl"
      - id: upload_shard
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_shard
        name: Retry representative transfer shard artifact upload
        if: ${{ steps.upload_shard.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Final representative transfer shard artifact upload retry
        if: ${{ steps.retry_upload_shard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfer-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true

  merge:
    needs: [plan, acquire_1, acquire_2, acquire_3, acquire_4]
    if: ${{ always() && needs.plan.result == 'success' && (needs.acquire_1.result == 'success' || needs.acquire_1.result == 'skipped') && (needs.acquire_2.result == 'success' || needs.acquire_2.result == 'skipped') && (needs.acquire_3.result == 'success' || needs.acquire_3.result == 'skipped') && (needs.acquire_4.result == 'success' || needs.acquire_4.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - id: download_sample
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before retry
        if: ${{ steps.download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - id: retry_download_sample
        name: Retry representative sample artifact download
        if: ${{ steps.download_sample.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Clean partial representative sample download before final retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        run: rm -rf sample
      - name: Final representative sample artifact download retry
        if: ${{ steps.retry_download_sample.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-sample
          path: sample
          run-id: ${{ inputs.sample_run_id }}
          github-token: ${{ github.token }}
      - name: Download every representative transfer shard artifact for merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          INCLUDE_CURRENT: ${{ needs.plan.outputs.gap_count != '0' }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import urllib.request
          import zipfile
          from pathlib import Path

          from hlp.data.github_actions import (
              fetch_github_actions_artifact_zip,
          )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pattern = re.compile(
              r"^phase1-pons-representative-transfer-(\d+)$"
          )

          def get(path):
              request = urllib.request.Request(
                  api + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def download(run_id, target_name, label):
              selected = []
              page = 1
              while True:
                  payload = get(
                      f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                      f"?per_page=100&page={page}"
                  )
                  rows = list(payload.get("artifacts") or [])
                  for row in rows:
                      match = pattern.fullmatch(
                          str(row.get("name") or "")
                      )
                      if match and not row.get("expired"):
                          selected.append(
                              (int(match.group(1)), row)
                          )
                  if len(rows) < 100:
                      break
                  page += 1
                  if page > 20:
                      raise SystemExit(
                          "representative transfer artifact pagination "
                          f"exceeded 2000: {label}"
                      )

              selected.sort(key=lambda item: item[0])
              indexes = [index for index, _ in selected]
              if not selected:
                  raise SystemExit(
                      f"{label} representative transfer run has no "
                      "shard artifacts"
                  )
              if len(indexes) != len(set(indexes)):
                  raise SystemExit(
                      f"{label} representative transfer run has duplicate "
                      "shard artifact indexes"
                  )

              target = Path(target_name)
              target.mkdir(parents=True, exist_ok=True)
              extracted = 0
              for index, artifact in selected:
                  blob = fetch_github_actions_artifact_zip(
                      api
                      + f"/repos/{repo}/actions/artifacts/"
                      + f"{int(artifact['id'])}/zip",
                      token,
                  )
                  with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                      for member in archive.infolist():
                          if member.is_dir():
                              continue
                          name = Path(member.filename).name
                          if not name:
                              continue
                          destination = target / name
                          if destination.exists():
                              raise SystemExit(
                                  "duplicate representative transfer file "
                                  f"for {label}: {name}"
                              )
                          destination.write_bytes(
                              archive.read(member)
                          )
                          extracted += 1
              return {
                  "label": label,
                  "run_id": run_id,
                  "artifact_pages": page,
                  "shard_artifacts": len(selected),
                  "first_shard_index": indexes[0],
                  "last_shard_index": indexes[-1],
                  "extracted_files": extracted,
              }

          reports = []
          prior_text = os.environ.get("PRIOR_RUN_ID", "").strip()
          if prior_text:
              reports.append(
                  download(int(prior_text), "prior", "prior")
              )

          if os.environ["INCLUDE_CURRENT"].lower() == "true":
              reports.append(
                  download(
                      int(os.environ["CURRENT_RUN_ID"]),
                      "current",
                      "current",
                  )
              )

          if not reports:
              raise SystemExit(
                  "representative transfer merge has no shard source"
              )
          print(json.dumps(reports, sort_keys=True))
          PY
      - id: download_plan
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-transfer-plan
          path: plan
      - name: Clean partial representative transfer plan download before retry
        if: ${{ steps.download_plan.outcome == 'failure' }}
        run: rm -rf plan
      - id: retry_download_plan
        name: Retry representative transfer plan artifact download
        if: ${{ steps.download_plan.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-transfer-plan
          path: plan
      - name: Clean partial representative transfer plan download before final retry
        if: ${{ steps.retry_download_plan.outcome == 'failure' }}
        run: rm -rf plan
      - name: Final representative transfer plan artifact download retry
        if: ${{ steps.retry_download_plan.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-transfer-plan
          path: plan
      - name: Merge complete representative transfer tape
        run: |
          mkdir -p artifacts
          cp sample/pons-representative-sample.jsonl artifacts/
          cp sample/pons-representative-sample.jsonl.manifest.json artifacts/
          cp plan/pons-representative-transfer-plan.json artifacts/
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.data.pons_holders import ZERO_ADDRESS
          from hlp.data.reconstruct import event_order
          from hlp.data.snapshot import write_jsonl_snapshot

          HEAD = int(os.environ["SNAPSHOT_HEAD"])
          sample = [
              json.loads(line)
              for line in Path(
                  "sample/pons-representative-sample.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          launch_by_token = {
              row["token"].lower(): int(row["launch_block"])
              for row in sample
          }
          if len(launch_by_token) != 10:
              raise SystemExit(
                  "representative transfer merge requires exactly 10 "
                  "unique sample tokens"
              )
          sample_path = Path(
              "sample/pons-representative-sample.jsonl"
          )
          sample_sha256 = hashlib.sha256(
              sample_path.read_bytes()
          ).hexdigest()
          token_set_sha256 = hashlib.sha256(
              ("\n".join(sorted(launch_by_token)) + "\n").encode()
          ).hexdigest()
          START = min(launch_by_token.values())

          files = (
              list(
                  Path("prior").glob(
                      "representative-transfers-*.jsonl"
                  )
              )
              + list(
                  Path("current").glob(
                      "representative-transfers-*.jsonl"
                  )
              )
          )
          if not files:
              raise SystemExit(
                  "no representative transfer shards available for merge"
              )

          entries = []
          for path in files:
              manifest = json.loads(
                  path.with_suffix(
                      path.suffix + ".manifest.json"
                  ).read_text()
              )
              prov = manifest.get("provenance") or {}
              if int(prov.get("chain_id", -1)) != 4663:
                  raise SystemExit(
                      f"representative transfer shard chain mismatch: {path}"
                  )
              if int(prov.get("token_count", -1)) != 10:
                  raise SystemExit(
                      f"representative transfer shard token mismatch: {path}"
                  )
              if prov.get("sample_sha256") != sample_sha256:
                  raise SystemExit(
                      "representative transfer shard sample identity "
                      f"mismatch: {path}"
                  )
              if prov.get("token_set_sha256") != token_set_sha256:
                  raise SystemExit(
                      "representative transfer shard token-set identity "
                      f"mismatch: {path}"
                  )
              entries.append((
                  int(prov["from_block"]),
                  int(prov["to_block"]),
                  path,
                  manifest,
              ))
          entries.sort(key=lambda item: item[0])

          previous_hi = None
          expected_records = 0
          manifests = []
          for lo, hi, path, manifest in entries:
              if previous_hi is None:
                  assert lo == START, (lo, START, path.name)
              else:
                  assert lo == previous_hi + 1, (
                      previous_hi, lo, path.name
                  )
              previous_hi = hi
              expected_records += int(manifest["records"])
              manifests.append({
                  "source": path.parent.name,
                  "file": path.name,
                  "sha256": manifest["sha256"],
                  "records": int(manifest["records"]),
                  "from_block": lo,
                  "to_block": hi,
              })
          assert previous_hi == HEAD, (previous_hi, HEAD)

          first_by_token = {}
          state = {"records": 0, "prior_order": None}

          def rows():
              for _, _, path, manifest in entries:
                  local = 0
                  with path.open() as handle:
                      for line in handle:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          token = row["token"].lower()
                          if token not in launch_by_token:
                              raise AssertionError(
                                  f"unexpected representative token {token}"
                              )
                          order = event_order(row)
                          prior = state["prior_order"]
                          if prior is not None:
                              assert prior < order, (
                                  prior, order, path.name
                              )
                          state["prior_order"] = order
                          first_by_token.setdefault(token, row)
                          state["records"] += 1
                          local += 1
                          yield row
                  assert local == int(manifest["records"]), (
                      path.name, local, manifest["records"]
                  )

          snapshot = write_jsonl_snapshot(
              rows(),
              output=Path(
                  "artifacts/pons-representative-transfers-full.jsonl"
              ),
              provenance={
                  "source": "manifest_gap_aware_representative_transfers",
                  "chain_id": 4663,
                  "snapshot_head_block": HEAD,
                  "sample_run_id": int("${{ inputs.sample_run_id }}"),
                  "sample_sha256": sample_sha256,
                  "token_set_sha256": token_set_sha256,
                  "prior_run_id": (
                      int("${{ inputs.prior_run_id }}")
                      if "${{ inputs.prior_run_id }}"
                      else None
                  ),
                  "sample_tokens": sorted(launch_by_token),
                  "shards": manifests,
              },
          )
          assert state["records"] == expected_records

          missing = sorted(set(launch_by_token) - set(first_by_token))
          if missing:
              raise SystemExit(
                  "sample token has no Transfer history: "
                  f"{missing}"
              )
          bad_first = []
          for token, row in first_by_token.items():
              if row["from_address"].lower() != ZERO_ADDRESS:
                  bad_first.append({
                      "token": token,
                      "reason": "first transfer is not a mint",
                      "first_transfer": row,
                  })
              elif int(row["block_number"]) > launch_by_token[token]:
                  bad_first.append({
                      "token": token,
                      "reason": "first mint occurs after Pons launch block",
                      "launch_block": launch_by_token[token],
                      "first_transfer": row,
                  })
          if bad_first:
              raise SystemExit(
                  "representative transfer history is incomplete at launch: "
                  + json.dumps(bad_first[:10], sort_keys=True)
              )

          report = {
              "snapshot_head_block": HEAD,
              "sample_tokens": len(launch_by_token),
              "sample_sha256": sample_sha256,
              "token_set_sha256": token_set_sha256,
              "records": state["records"],
              "source_files": len(entries),
              "transfer_tape_sha256": snapshot["sha256"],
              "first_transfer_mint_tokens": len(first_by_token),
          }
          Path(
              "artifacts/pons-representative-transfers-summary.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Replay exact representative holder histories
        run: |
          hlp pons-holder-state \
            --transfers artifacts/pons-representative-transfers-full.jsonl \
            --out artifacts/pons-representative-holder-states.jsonl \
            --summary-out artifacts/pons-representative-holder-summary.jsonl
      - name: Validate final holder coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              json.loads(line)
              for line in Path(
                  "artifacts/pons-representative-holder-summary.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          if len(rows) != 10:
              raise SystemExit(
                  "representative holder replay must cover exactly 10 tokens: "
                  f"got {len(rows)}"
              )
          if any(int(row["transfers"]) <= 0 for row in rows):
              raise SystemExit(
                  "representative holder replay contains a token with no "
                  "transfer history"
              )
          report = {
              "tokens": len(rows),
              "transfers": sum(int(row["transfers"]) for row in rows),
              "final_holders": sum(
                  int(row["holder_count"]) for row in rows
              ),
              "total_accounted_supply_raw": sum(
                  int(row["accounted_supply_raw"]) for row in rows
              ),
          }
          Path(
              "artifacts/pons-representative-holder-validation.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - id: upload_full
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfers-full
          path: artifacts/
          if-no-files-found: error
      - id: retry_upload_full
        name: Retry representative transfer full artifact upload
        if: ${{ steps.upload_full.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfers-full
          path: artifacts/
          if-no-files-found: error
          overwrite: true
      - name: Final representative transfer full artifact upload retry
        if: ${{ steps.retry_upload_full.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-representative-transfers-full
          path: artifacts/
          if-no-files-found: error
          overwrite: true
