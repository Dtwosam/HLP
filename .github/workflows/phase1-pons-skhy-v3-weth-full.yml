name: phase1-pons-skhy-v3-weth-full

on:
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: "Successful phase1-pons-skhy-v3-weth-segmented run with route_resolved"
        required: true
        type: string
      anchor_run_id:
        description: "Successful canonical phase1-pons-weth-usdg-anchor-full run"
        required: true
        type: string
  workflow_call:
    inputs:
      discovery_run_id:
        required: true
        type: string
      anchor_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-skhy-v3-weth-full-${{ github.ref }}
  cancel-in-progress: false

env:
  SNAPSHOT_HEAD: '54486035'
  SKHY_TOKEN: '0x84cab63bc87912e71ad199ff14a0ba45de68fef8'
  WETH: '0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73'
  SKHY_WETH_POOL: '0x13f78b235d19141f572986afcaab66ce7744b4ef'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      activation_block: ${{ steps.route.outputs.activation_block }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-skhy-v3-weth-segmented
          path: discovery
          run-id: ${{ inputs.discovery_run_id }}
          github-token: ${{ github.token }}
      - id: route
        name: Freeze resolved SKHY/WETH route
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path(
                  "discovery/pons-skhy-v3-weth-segmented-summary.json"
              ).read_text()
          )
          if summary.get("completion_status") != "route_resolved":
              raise SystemExit(
                  "SKHY/WETH full tape requires a resolved segmented route"
              )
          if int(summary.get("snapshot_head_block", -1)) != int(
              os.environ["SNAPSHOT_HEAD"]
          ):
              raise SystemExit("SKHY/WETH discovery snapshot changed")
          if summary["quote_token"].lower() != os.environ["SKHY_TOKEN"]:
              raise SystemExit("SKHY/WETH discovery token changed")
          if summary["pool"].lower() != os.environ["SKHY_WETH_POOL"]:
              raise SystemExit("SKHY/WETH discovery pool changed")
          if int(summary.get("source_route_audit_run_id", -1)) <= 0:
              raise SystemExit("SKHY/WETH discovery has no route-audit provenance")

          rows = [
              json.loads(line)
              for line in Path(
                  "discovery/pons-skhy-v3-weth-continuation.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          if len(rows) != 1 or not rows[0].get("delayed_route_ready"):
              raise SystemExit(
                  "SKHY/WETH discovery must contain one ready route row"
              )
          route = rows[0].get("route")
          if not route:
              raise SystemExit("SKHY/WETH discovery ready row has no route")
          if route["quote_token"].lower() != os.environ["SKHY_TOKEN"]:
              raise SystemExit("SKHY/WETH resolved route token changed")
          if route["pool"].lower() != os.environ["SKHY_WETH_POOL"]:
              raise SystemExit("SKHY/WETH resolved route pool changed")
          if route["anchor_token"].lower() != os.environ["WETH"].lower():
              raise SystemExit("SKHY/WETH resolved route anchor changed")
          if route["route_type"] != "uniswap_v3_direct_weth_delayed":
              raise SystemExit("SKHY/WETH resolved route type changed")
          activation = int(route["activation_block"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          if not 1 <= activation <= head:
              raise SystemExit(
                  f"invalid SKHY/WETH activation block: {activation}"
              )

          Path("artifacts/pons-skhy-v3-weth-route.jsonl").write_text(
              json.dumps(route, sort_keys=True) + "\n"
          )
          Path("artifacts/pons-skhy-v3-weth-route-summary.json").write_text(
              json.dumps(
                  {
                      "snapshot_head_block": head,
                      "activation_block": activation,
                      "quote_token": route["quote_token"].lower(),
                      "pool": route["pool"].lower(),
                      "anchor_token": route["anchor_token"].lower(),
                      "route_type": route["route_type"],
                      "discovery_run_id": int("${{ inputs.discovery_run_id }}"),
                      "route_audit_run_id": int(
                          summary["source_route_audit_run_id"]
                      ),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"activation_block={activation}\n")
          print(json.dumps(route, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-skhy-v3-weth-route
          path: artifacts/
          if-no-files-found: error

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
      ACTIVATION_BLOCK: ${{ needs.plan.outputs.activation_block }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-skhy-v3-weth-route
          path: route
      - id: bounds
        name: Compute exact SKHY/WETH full-tape shard
        run: |
          python - <<'PY'
          import os

          start = int(os.environ["ACTIVATION_BLOCK"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          i = int(os.environ["SHARD_INDEX"])
          n = int(os.environ["SHARD_COUNT"])
          span = head - start + 1
          if span < n:
              raise SystemExit(
                  f"SKHY/WETH active span too small for {n} shards: {span}"
              )
          lo = start + (span * i) // n
          hi = start + (span * (i + 1)) // n - 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"lo={lo}\nhi={hi}\n")
          print({"shard": i, "from_block": lo, "to_block": hi})
          PY
      - name: Acquire exact SKHY/WETH active route events
        env:
          FROM_BLOCK: ${{ steps.bounds.outputs.lo }}
          TO_BLOCK: ${{ steps.bounds.outputs.hi }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          printf -v SHARD "%02d" "$SHARD_INDEX"
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v3-quote-route-tape \
            --routes route/pons-skhy-v3-weth-route.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --out "artifacts/skhy-v3-weth-events-${SHARD}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-skhy-v3-weth-full-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error

  merge:
    needs:
      - plan
      - shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIVATION_BLOCK: ${{ needs.plan.outputs.activation_block }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-skhy-v3-weth-full-*
          path: shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-skhy-v3-weth-route
          path: route
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-weth-usdg-anchor-full
          path: anchor
          run-id: ${{ inputs.anchor_run_id }}
          github-token: ${{ github.token }}
      - name: Merge exact SKHY/WETH route tape
        run: |
          mkdir -p artifacts
          cp route/pons-skhy-v3-weth-route.jsonl artifacts/
          cp route/pons-skhy-v3-weth-route-summary.json artifacts/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.data.reconstruct import event_order
          from hlp.data.snapshot import write_jsonl_snapshot

          start = int(os.environ["ACTIVATION_BLOCK"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          files = sorted(Path("shards").glob("skhy-v3-weth-events-*.jsonl"))
          if len(files) != 8:
              raise SystemExit(
                  f"expected 8 SKHY/WETH shards, got {len(files)}"
              )

          entries = []
          for path in files:
              manifest = json.loads(
                  path.with_suffix(path.suffix + ".manifest.json").read_text()
              )
              prov = manifest["provenance"]
              entries.append(
                  (
                      int(prov["from_block"]),
                      int(prov["to_block"]),
                      path,
                      manifest,
                  )
              )
          entries.sort(key=lambda item: item[0])

          previous_hi = None
          expected_records = 0
          manifests = []
          for lo, hi, path, manifest in entries:
              if previous_hi is None:
                  if lo != start:
                      raise SystemExit(
                          f"SKHY/WETH tape starts at {lo}, expected {start}"
                      )
              elif lo != previous_hi + 1:
                  raise SystemExit(
                      f"SKHY/WETH shard gap/overlap: {previous_hi} -> {lo}"
                  )
              previous_hi = hi
              expected_records += int(manifest["records"])
              manifests.append(
                  {
                      "file": path.name,
                      "sha256": manifest["sha256"],
                      "records": int(manifest["records"]),
                      "from_block": lo,
                      "to_block": hi,
                  }
              )
          if previous_hi != head:
              raise SystemExit(
                  f"SKHY/WETH tape ends at {previous_hi}, expected {head}"
              )

          state = {"records": 0, "swaps": 0, "prior": None}

          def rows():
              for _, _, path, manifest in entries:
                  local = 0
                  with path.open() as handle:
                      for line in handle:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          order = event_order(row)
                          prior = state["prior"]
                          if prior is not None and order <= prior:
                              raise ValueError(
                                  f"SKHY/WETH tape is not strict: {prior} -> {order}"
                              )
                          state["prior"] = order
                          if row.get("event_type") != "v3_swap":
                              raise ValueError(
                                  "SKHY/WETH delayed tape contains non-swap "
                                  f"event: {row.get('event_type')}"
                              )
                          if row["pool"].lower() != os.environ["SKHY_WETH_POOL"]:
                              raise ValueError(
                                  "SKHY/WETH tape contains wrong pool"
                              )
                          state["records"] += 1
                          state["swaps"] += 1
                          local += 1
                          yield row
                  if local != int(manifest["records"]):
                      raise ValueError(
                          f"SKHY/WETH shard record mismatch for {path.name}"
                      )

          snapshot = write_jsonl_snapshot(
              rows(),
              output=Path(
                  "artifacts/pons-skhy-v3-weth-events-full.jsonl"
              ),
              provenance={
                  "source": "merged_skhy_v3_weth_active_route_shards",
                  "chain_id": 4663,
                  "snapshot_head_block": head,
                  "activation_block": start,
                  "discovery_run_id": int(
                      "${{ inputs.discovery_run_id }}"
                  ),
                  "anchor_run_id": int("${{ inputs.anchor_run_id }}"),
                  "shards": manifests,
              },
          )
          if state["records"] != expected_records:
              raise SystemExit("SKHY/WETH merged record count changed")
          if state["swaps"] <= 0:
              raise SystemExit("SKHY/WETH full tape has no swaps")
          report = {
              "snapshot_head_block": head,
              "activation_block": start,
              "records": state["records"],
              "v3_swaps": state["swaps"],
              "event_tape_sha256": snapshot["sha256"],
              "discovery_run_id": int("${{ inputs.discovery_run_id }}"),
              "anchor_run_id": int("${{ inputs.anchor_run_id }}"),
          }
          Path(
              "artifacts/pons-skhy-v3-weth-events-summary.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Compose SKHY/WETH swaps with causal WETH/USD anchor
        run: |
          hlp pons-v3-quote-usd-tape \
            --routes artifacts/pons-skhy-v3-weth-route.jsonl \
            --v3-events artifacts/pons-skhy-v3-weth-events-full.jsonl \
            --anchor-initial anchor/pons-weth-usdg-anchor-initial.json \
            --anchor-events anchor/pons-weth-usdg-anchor-full.jsonl \
            --state-out artifacts/pons-skhy-v3-weth-quote-initial.jsonl \
            --out artifacts/pons-skhy-v3-weth-quote-updates.jsonl
      - name: Verify delayed route emits updates and no premature state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          states = [
              json.loads(line)
              for line in Path(
                  "artifacts/pons-skhy-v3-weth-quote-initial.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          updates = [
              json.loads(line)
              for line in Path(
                  "artifacts/pons-skhy-v3-weth-quote-updates.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          if states:
              raise SystemExit(
                  "delayed SKHY/WETH route must not create pre-activation state"
              )
          if not updates:
              raise SystemExit("SKHY/WETH route produced no USD updates")
          if any(
              row.get("pricing_source")
              != "uniswap_v3_direct_weth_delayed"
              for row in updates
          ):
              raise SystemExit("SKHY/WETH USD source type changed")
          if any(float(row["usd_price"]) <= 0 for row in updates):
              raise SystemExit("SKHY/WETH USD update is not positive")
          print(json.dumps({
              "usd_updates": len(updates),
              "first_update_block": int(updates[0]["block_number"]),
              "last_update_block": int(updates[-1]["block_number"]),
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-skhy-v3-weth-full
          path: artifacts/
          if-no-files-found: error
