name: phase1-pons-skhy-v3-weth-segmented

on:
  workflow_dispatch:
    inputs:
      route_audit_run_id:
        description: "Frozen unpriced V3 route-audit run"
        required: true
        default: "33921477647"
        type: string
      route_audit_artifact_name:
        description: "Artifact containing the frozen V3 route audit"
        required: true
        default: "phase1-pons-unpriced-v3-route-audit"
        type: string
      route_audit_filename:
        description: "Frozen V3 route-audit JSONL filename"
        required: true
        default: "pons-unpriced-v3-route-audit.jsonl"
        type: string
  workflow_call:
    inputs:
      route_audit_run_id:
        required: true
        type: string
      route_audit_artifact_name:
        required: true
        type: string
      route_audit_filename:
        required: true
        type: string
    outputs:
      completion_status:
        description: "route_resolved or searched_to_snapshot_head"
        value: ${{ jobs.finalize.outputs.completion_status }}
      route_ready:
        description: "Whether SKHY/WETH resolved"
        value: ${{ jobs.finalize.outputs.route_ready }}
      search_to_block:
        description: "Inclusive final searched block"
        value: ${{ jobs.finalize.outputs.search_to_block }}

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-skhy-v3-weth-segmented-${{ github.ref }}
  cancel-in-progress: false

jobs:
  segment_0:
    uses: ./.github/workflows/phase1-pons-skhy-v3-weth-continuation.yml
    with:
      route_audit_run_id: ${{ inputs.route_audit_run_id }}
      route_audit_artifact_name: ${{ inputs.route_audit_artifact_name }}
      route_audit_filename: ${{ inputs.route_audit_filename }}
      from_block: ""
      forward_blocks: "100000"
      output_artifact_name: phase1-pons-skhy-v3-weth-segment-0
    secrets: inherit

  segment_1:
    needs: segment_0
    if: ${{ needs.segment_0.outputs.continue_needed == 'true' }}
    uses: ./.github/workflows/phase1-pons-skhy-v3-weth-continuation.yml
    with:
      route_audit_run_id: ${{ inputs.route_audit_run_id }}
      route_audit_artifact_name: ${{ inputs.route_audit_artifact_name }}
      route_audit_filename: ${{ inputs.route_audit_filename }}
      from_block: ${{ needs.segment_0.outputs.next_from_block }}
      forward_blocks: "100000"
      output_artifact_name: phase1-pons-skhy-v3-weth-segment-1
