      route_ready: ${{ steps.freeze.outputs.route_ready }}
      search_to_block: ${{ steps.freeze.outputs.search_to_block }}
    env:
      SNAPSHOT_HEAD: '54486035'
      SKHY_TOKEN: '0x84cab63bc87912e71ad199ff14a0ba45de68fef8'
      SKHY_WETH_POOL: '0x13f78b235d19141f572986afcaab66ce7744b4ef'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-skhy-v3-weth-segment-*
          path: segments
      - id: freeze
        name: Freeze completed SKHY/WETH continuation
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          summaries = list(
              Path("segments").glob(
                  "phase1-pons-skhy-v3-weth-segment-*/"
                  "pons-skhy-v3-weth-continuation-summary.json"
              )
          )
          if not summaries:
              raise SystemExit(
                  "segmented SKHY/WETH continuation produced no segment artifact"
              )

          def segment_index(path):
              match = re.search(
                  r"phase1-pons-skhy-v3-weth-segment-(\d+)",
                  str(path),
              )
              if not match:
                  raise SystemExit(
                      f"cannot parse SKHY/WETH segment index: {path}"
                  )
              return int(match.group(1))

          latest_summary_path = max(summaries, key=segment_index)
          latest_index = segment_index(latest_summary_path)
          report = json.loads(latest_summary_path.read_text())

          if report["quote_token"].lower() != os.environ["SKHY_TOKEN"]:
              raise SystemExit("final SKHY/WETH token changed")
          if report["pool"].lower() != os.environ["SKHY_WETH_POOL"]:
              raise SystemExit("final SKHY/WETH pool changed")

          head = int(os.environ["SNAPSHOT_HEAD"])
          search_to = int(report["searched_to_block"])
          ready = bool(report["route_ready"])
          remaining = max(0, head - search_to)
          if not ready and search_to != head:
              raise SystemExit(
                  "segmented SKHY/WETH continuation ended before snapshot "
                  f"head: search_to={search_to} remaining={remaining}"
              )

          source_dir = latest_summary_path.parent
          for name in (
              "pons-skhy-v3-weth-continuation.jsonl",
              "pons-skhy-v3-weth-continuation.jsonl.manifest.json",
          ):
              source = source_dir / name
              if not source.exists():
                  raise SystemExit(
                      f"final SKHY/WETH segment is missing {name}"
                  )
              shutil.copy2(source, Path("artifacts") / name)

          final = {
              **report,
              "snapshot_head_block": head,
              "remaining_unsearched_blocks": remaining,
              "continuation_segments_completed": latest_index + 1,
              "max_blocks_per_segment": 100000,
              "source_route_audit_run_id": int(
                  "${{ inputs.route_audit_run_id }}"
              ),
              "completion_status": (
                  "route_resolved" if ready else "searched_to_snapshot_head"
              ),
          }
          Path(
              "artifacts/pons-skhy-v3-weth-segmented-summary.json"
          ).write_text(
              json.dumps(final, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"completion_status={final['completion_status']}\n"
              )
              handle.write(
                  f"route_ready={'true' if ready else 'false'}\n"
              )
              handle.write(f"search_to_block={search_to}\n")
          print(json.dumps(final, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-skhy-v3-weth-segmented
          path: artifacts/
          if-no-files-found: error
