name: phase3-canonical-transfer-tape

on:
  workflow_dispatch:
    inputs:
      feature_entry_run_id:
        description: Exact phase3-feature-entry run ID
        required: true
        type: string
      expected_feature_entry_artifact_digest:
        description: Exact phase3-feature-entry artifact digest (sha256:...)
        required: true
        type: string
      expected_feature_entry_handoff_sha256:
        description: Exact SHA-256 of phase3-feature-entry-handoff.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact frozen-universe artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      max_tokens_per_batch:
        description: ERC-20 addresses per transfer-log batch (1-50)
        required: true
        default: "50"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-canonical-transfer-tape-${{ github.ref }}
  cancel-in-progress: false

env:
  FEATURE_ENTRY_RUN_ID: ${{ inputs.feature_entry_run_id }}
  EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST: ${{ inputs.expected_feature_entry_artifact_digest }}
  EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256: ${{ inputs.expected_feature_entry_handoff_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  MAX_TOKENS_PER_BATCH: ${{ inputs.max_tokens_per_batch }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      batch_count: ${{ steps.plan.outputs.batch_count }}
      deployment_rows_sha256: ${{ steps.plan.outputs.deployment_rows_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: plan
        name: Verify universe and discover token deployment boundaries
        run: |
          mkdir -p inputs artifacts/batches
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.config import SOLIDRPC_PUBLIC_RPC_URL
          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_feature_entry import (
              build_phase3_feature_entry_handoff,
          )
          from hlp.data.phase3_transfer_acquisition import (
              discover_phase3_token_deployments,
              plan_phase3_transfer_batches,
          )
          from hlp.data.rpc import RpcClient
          from hlp.data.sharded_tape import iter_validated_jsonl
          from hlp.data.snapshot import write_jsonl_snapshot

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          entry_root = Path("inputs/entry")
          universe_root = Path("inputs/universe")
          download_named(
              int(os.environ["FEATURE_ENTRY_RUN_ID"]),
              "phase3-feature-entry",
              entry_root,
              "Phase-3 feature entry",
              os.environ["EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "frozen Phase-2 universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )

          entry_summary_path = find_unique(
              entry_root,
              "phase3-feature-entry-summary.json",
          )
          entry_summary = json.loads(entry_summary_path.read_text())
          entry_summary_sha = sha256_path(entry_summary_path)
          entry_handoff_path = find_unique(
              entry_root,
              "phase3-feature-entry-handoff.json",
          )
          entry_handoff_sha = sha256_path(entry_handoff_path)
          if entry_handoff_sha != os.environ[
              "EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-3 feature-entry handoff SHA drift")
          entry_handoff = json.loads(entry_handoff_path.read_text())
          rebuilt_entry = build_phase3_feature_entry_handoff(
              entry_summary,
              entry_summary_sha256=entry_summary_sha,
              phase2_dataset_handoff_sha256=entry_summary[
                  "phase2_dataset_handoff_sha256"
              ],
              detector_freeze_handoff_sha256=entry_summary[
                  "detector_freeze_handoff_sha256"
              ],
          )
          if rebuilt_entry != entry_handoff:
              raise SystemExit(
                  "Phase-3 feature-entry handoff content drift"
              )

          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_manifest_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl.manifest.json",
          )
          universe_manifest = json.loads(
              universe_manifest_path.read_text()
          )
          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          universe_handoff_sha = sha256_path(universe_handoff_path)
          if universe_handoff_sha != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 universe handoff SHA drift")
          universe_handoff = json.loads(
              universe_handoff_path.read_text()
          )
          if universe_handoff.get("version") != (
              "phase2-universe-freeze-handoff-v1"
          ):
              raise SystemExit("Phase-2 universe handoff version drift")
          if universe_handoff.get("phase2_universe_frozen") is not True:
              raise SystemExit("Phase-2 universe is not frozen")
          if universe_handoff.get(
              "phase2_universe_coverage_complete"
          ) is not True:
              raise SystemExit("Phase-2 universe coverage is incomplete")
          if universe_manifest.get("sha256") != universe_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit("Phase-2 universe manifest SHA drift")
          if sha256_path(universe_path) != universe_manifest["sha256"]:
              raise SystemExit("Phase-2 universe file SHA drift")
          if int(universe_manifest.get("records", -1)) != int(
              universe_handoff["eligible_tokens"]
          ):
              raise SystemExit("Phase-2 universe token count drift")
          if entry_handoff["eligible_universe_sha256"] != (
              universe_handoff["eligible_universe_sha256"]
          ):
              raise SystemExit(
                  "Phase-3 transfer entry/universe SHA linkage drift"
              )
          if int(entry_handoff["universe_tokens"]) != int(
              universe_handoff["eligible_tokens"]
          ):
              raise SystemExit(
                  "Phase-3 transfer entry/universe count drift"
              )
          snapshot = int(entry_handoff["snapshot_head_block"])
          if int(universe_handoff["snapshot_head_block"]) != snapshot:
              raise SystemExit(
                  "Phase-3 transfer entry/universe snapshot drift"
              )

          universe_rows = list(
              iter_validated_jsonl(
                  universe_path,
                  universe_manifest_path,
              )
          )
          tokens = [str(row["token"]) for row in universe_rows]
          max_tokens = int(os.environ["MAX_TOKENS_PER_BATCH"])
          if max_tokens < 1 or max_tokens > 50:
              raise SystemExit(
                  "max_tokens_per_batch must be between 1 and 50"
              )

          rpc = RpcClient(
              SOLIDRPC_PUBLIC_RPC_URL,
              timeout=30,
              attempts=5,
              min_interval_seconds=0.05,
              route_label="solidrpc_keyless_public",
          )
          rpc.assert_robinhood()
          deployments = discover_phase3_token_deployments(
              rpc,
              tokens,
              snapshot_head_block=snapshot,
          )
          deployment_manifest = write_jsonl_snapshot(
              deployments,
              output=Path(
                  "artifacts/phase3-token-deployments.jsonl"
              ),
              provenance={
                  "source": "archive_eth_getCode_binary_search",
                  "chain_id": 4663,
                  "snapshot_head_block": snapshot,
                  "eligible_universe_sha256": universe_manifest[
                      "sha256"
                  ],
                  "deployment_boundary_method": (
                      "monotonic_code_presence_binary_search"
                  ),
                  "rpc_route": rpc.route_label,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )
          batches = plan_phase3_transfer_batches(
              deployments,
              snapshot_head_block=snapshot,
              max_tokens_per_batch=max_tokens,
          )
          if len(batches) > 240:
              raise SystemExit(
                  "Phase-3 transfer plan exceeds 240 acquisition jobs; "
                  "increase max_tokens_per_batch or split the frozen universe"
              )
          for batch in batches:
              Path(
                  f"artifacts/batches/batch-{batch['batch_id']}.json"
              ).write_text(
                  json.dumps(batch, indent=2, sort_keys=True) + "\n"
              )

          report = {
              "version": "phase3-transfer-acquisition-plan-v1",
              "snapshot_head_block": snapshot,
              "eligible_universe_sha256": universe_manifest["sha256"],
              "universe_tokens": len(tokens),
              "deployment_rows_sha256": deployment_manifest["sha256"],
              "deployment_rows": deployment_manifest["records"],
              "deployment_boundaries_verified": True,
              "batch_count": len(batches),
              "max_tokens_per_batch": max_tokens,
              "requires_authenticated_archive_logs": True,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
          }
          Path(
              "artifacts/phase3-transfer-plan-summary.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          matrix = {
              "include": [
                  {"id": row["batch_id"]}
                  for row in batches
              ]
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "matrix="
                  + json.dumps(matrix, separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"batch_count={len(batches)}\n")
              handle.write(
                  f"deployment_rows_sha256={deployment_manifest['sha256']}\n"
              )
          print(json.dumps({
              **report,
              "deployment_rpc_requests": rpc.requests_made,
          }, sort_keys=True))
          PY

      - name: Upload transfer acquisition plan
        uses: actions/upload-artifact@v4
        with:
          name: phase3-transfer-plan
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  acquire:
    needs: plan
    if: ${{ needs.plan.outputs.batch_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Download frozen transfer plan
        uses: actions/download-artifact@v4
        with:
          name: phase3-transfer-plan
          path: plan
      - name: Acquire deployment-bounded ERC-20 transfers
        env:
          BATCH_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.config import SOLIDRPC_AUTH_RPC_URL
          from hlp.data.phase3_transfer_tape import (
              adapt_erc20_transfers_to_phase3,
          )
          from hlp.data.pons_holders import fetch_erc20_transfer_rows
          from hlp.data.rpc import RpcClient
          from hlp.data.snapshot import write_jsonl_snapshot

          key = os.environ.get("ROBINHOOD_ARCHIVE_RPC_API_KEY")
          if not key:
              raise SystemExit(
                  "full Phase-3 transfer backfill requires "
                  "ROBINHOOD_ARCHIVE_RPC_API_KEY; the keyless route is "
                  "verified at a 200-block filtered-log cap and is not an "
                  "acceptable full-universe execution path"
              )
          batch_id = os.environ["BATCH_ID"]
          batch_path = Path(
              f"plan/batches/batch-{batch_id}.json"
          )
          batch = json.loads(batch_path.read_text())
          if batch.get("version") != "phase3-transfer-batch-plan-v1":
              raise SystemExit("Phase-3 transfer batch plan version drift")
          if batch.get("deployment_boundary_verified") is not True:
              raise SystemExit(
                  "Phase-3 transfer batch lacks verified deployments"
              )
          tokens = list(batch["tokens"])
          if len(tokens) != int(batch["token_count"]):
              raise SystemExit("Phase-3 transfer batch token count drift")

          rpc = RpcClient(
              SOLIDRPC_AUTH_RPC_URL,
              timeout=30,
              attempts=5,
              min_interval_seconds=0.1,
              extra_headers={"X-API-Key": key},
              route_label="solidrpc_authenticated_free",
          )
          rpc.assert_robinhood()
          decoded = list(
              fetch_erc20_transfer_rows(
                  rpc,
                  tokens,
                  from_block=int(batch["from_block"]),
                  to_block=int(batch["to_block"]),
                  chunk_size=50_000,
                  min_chunk_size=25,
              )
          )
          rows = adapt_erc20_transfers_to_phase3(decoded)
          unexpected = {
              row["token"] for row in rows
          } - set(tokens)
          if unexpected:
              raise SystemExit(
                  f"transfer batch returned unexpected tokens: "
                  f"{sorted(unexpected)}"
              )

          output = Path(
              f"artifacts/phase3-transfers-{batch_id}.jsonl"
          )
          manifest = write_jsonl_snapshot(
              rows,
              output=output,
              provenance={
                  "version": "phase3-transfer-acquisition-batch-v1",
                  "chain_id": 4663,
                  "batch_id": batch_id,
                  "tokens": tokens,
                  "token_count": len(tokens),
                  "first_code_blocks": batch["first_code_blocks"],
                  "from_block": int(batch["from_block"]),
                  "to_block": int(batch["to_block"]),
                  "deployment_boundary_verified": True,
                  "rpc_route": rpc.route_label,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )
          summary = {
              "version": "phase3-transfer-acquisition-batch-v1",
              "batch_id": batch_id,
              "tokens": len(tokens),
              "tokens_with_transfers": len({
                  row["token"] for row in rows
              }),
              "transfer_rows": manifest["records"],
              "transfer_rows_sha256": manifest["sha256"],
              "from_block": int(batch["from_block"]),
              "to_block": int(batch["to_block"]),
              "deployment_boundary_verified": True,
              "rpc_route": rpc.route_label,
              "rpc_requests": rpc.requests_made,
              "response_bytes_received": rpc.response_bytes_received,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
          }
          Path(
              f"artifacts/phase3-transfers-{batch_id}-summary.json"
          ).write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload transfer batch
        uses: actions/upload-artifact@v4
        with:
          name: phase3-transfer-batch-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: [plan, acquire]
    if: ${{ always() && needs.plan.result == 'success' && needs.acquire.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Download frozen transfer plan
        uses: actions/download-artifact@v4
        with:
          name: phase3-transfer-plan
          path: plan
      - name: Download every transfer batch
        uses: actions/download-artifact@v4
        with:
          pattern: phase3-transfer-batch-*
          path: batches
          merge-multiple: true
      - id: merge
        name: Build canonical transfer tape and coverage handoff
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_feature_entry import (
              build_phase3_feature_entry_handoff,
          )
          from hlp.data.phase3_transfer_tape import (
              build_phase3_canonical_transfer_handoff,
              build_phase3_transfer_token_coverage,
              materialize_phase3_canonical_transfer_tape,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl
          from hlp.data.snapshot import write_jsonl_snapshot

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              selected = select_equivalent_artifact_retry(
                  matches,
                  label=label,
              )
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          entry_root = Path("inputs/entry")
          universe_root = Path("inputs/universe")
          download_named(
              int(os.environ["FEATURE_ENTRY_RUN_ID"]),
              "phase3-feature-entry",
              entry_root,
              "Phase-3 feature entry",
              os.environ["EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "frozen Phase-2 universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )

          entry_summary_path = find_unique(
              entry_root,
              "phase3-feature-entry-summary.json",
          )
          entry_summary = json.loads(entry_summary_path.read_text())
          entry_handoff_path = find_unique(
              entry_root,
              "phase3-feature-entry-handoff.json",
          )
          entry_handoff_sha = sha256_path(entry_handoff_path)
          if entry_handoff_sha != os.environ[
              "EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-3 feature-entry handoff SHA drift")
          entry_handoff = json.loads(entry_handoff_path.read_text())
          rebuilt_entry = build_phase3_feature_entry_handoff(
              entry_summary,
              entry_summary_sha256=sha256_path(entry_summary_path),
              phase2_dataset_handoff_sha256=entry_summary[
                  "phase2_dataset_handoff_sha256"
              ],
              detector_freeze_handoff_sha256=entry_summary[
                  "detector_freeze_handoff_sha256"
              ],
          )
          if rebuilt_entry != entry_handoff:
              raise SystemExit(
                  "Phase-3 feature-entry handoff content drift"
              )

          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_manifest_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl.manifest.json",
          )
          universe_manifest = json.loads(
              universe_manifest_path.read_text()
          )
          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          universe_handoff_sha = sha256_path(universe_handoff_path)
          if universe_handoff_sha != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 universe handoff SHA drift")
          universe_handoff = json.loads(
              universe_handoff_path.read_text()
          )
          if universe_manifest.get("sha256") != entry_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit(
                  "Phase-3 transfer merge universe/entry SHA drift"
              )
          if universe_manifest.get("sha256") != universe_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit(
                  "Phase-3 transfer merge universe handoff drift"
              )
          universe_rows = list(
              iter_validated_jsonl(
                  universe_path,
                  universe_manifest_path,
              )
          )

          deployment_path = Path(
              "plan/phase3-token-deployments.jsonl"
          )
          deployment_manifest_path = Path(
              "plan/phase3-token-deployments.jsonl.manifest.json"
          )
          deployments = list(
              iter_validated_jsonl(
                  deployment_path,
                  deployment_manifest_path,
              )
          )
          deployment_by_token = {
              row["token"]: row
              for row in deployments
          }
          if len(deployment_by_token) != len(universe_rows):
              raise SystemExit(
                  "Phase-3 deployment/universe token count drift"
              )

          batch_paths = sorted(
              Path("plan/batches").glob("batch-*.json")
          )
          transfer_files = sorted(
              Path("batches").glob("phase3-transfers-*.jsonl")
          )
          if len(batch_paths) != len(transfer_files):
              raise SystemExit(
                  "Phase-3 transfer batch artifact count drift"
              )

          token_rows = {
              row["token"]: []
              for row in universe_rows
          }
          token_batch = {}
          batch_manifests = {}
          for batch_path in batch_paths:
              batch = json.loads(batch_path.read_text())
              batch_id = str(batch["batch_id"])
              data_path = Path(
                  f"batches/phase3-transfers-{batch_id}.jsonl"
              )
              manifest_path = Path(
                  f"batches/phase3-transfers-{batch_id}.jsonl.manifest.json"
              )
              if not data_path.is_file() or not manifest_path.is_file():
                  raise SystemExit(
                      f"missing Phase-3 transfer batch files: {batch_id}"
                  )
              manifest = json.loads(manifest_path.read_text())
              prov = manifest.get("provenance") or {}
              if str(prov.get("batch_id") or "") != batch_id:
                  raise SystemExit(
                      f"Phase-3 transfer batch provenance drift: {batch_id}"
                  )
              if int(prov.get("from_block", -1)) != int(
                  batch["from_block"]
              ):
                  raise SystemExit(
                      f"Phase-3 transfer batch start drift: {batch_id}"
                  )
              if int(prov.get("to_block", -1)) != int(
                  batch["to_block"]
              ):
                  raise SystemExit(
                      f"Phase-3 transfer batch end drift: {batch_id}"
                  )
              if prov.get("deployment_boundary_verified") is not True:
                  raise SystemExit(
                      f"Phase-3 transfer batch deployment proof lost: "
                      f"{batch_id}"
                  )
              batch_manifests[batch_id] = manifest
              for token in batch["tokens"]:
                  if token in token_batch:
                      raise SystemExit(
                          f"Phase-3 transfer token repeats batches: {token}"
                      )
                  token_batch[token] = batch
              for row in iter_validated_jsonl(
                  data_path,
                  manifest_path,
              ):
                  token = row["token"]
                  if token not in set(batch["tokens"]):
                      raise SystemExit(
                          f"Phase-3 transfer batch has foreign token: "
                          f"{batch_id} {token}"
                      )
                  token_rows[token].append(row)

          if set(token_batch) != set(token_rows):
              raise SystemExit(
                  "Phase-3 transfer batches do not cover exact universe"
              )

          coverage_rows = []
          for token in sorted(token_rows):
              deployment = deployment_by_token[token]
              batch = token_batch[token]
              manifest = batch_manifests[str(batch["batch_id"])]
              coverage_rows.append(
                  build_phase3_transfer_token_coverage(
                      token,
                      token_rows[token],
                      snapshot_head_block=int(
                          entry_handoff["snapshot_head_block"]
                      ),
                      search_from_block=int(batch["from_block"]),
                      first_code_block=int(
                          deployment["first_code_block"]
                      ),
                      deployment_boundary_verified=bool(
                          deployment[
                              "deployment_boundary_verified"
                          ]
                      ),
                      raw_transfer_tape_sha256=manifest["sha256"],
                      historical_event_scan_complete=True,
                  )
              )

          coverage_manifest = write_jsonl_snapshot(
              coverage_rows,
              output=Path(
                  "artifacts/phase3-transfer-token-coverage.jsonl"
              ),
              provenance={
                  "version": "phase3-transfer-token-coverage-v1",
                  "snapshot_head_block": int(
                      entry_handoff["snapshot_head_block"]
                  ),
                  "eligible_universe_sha256": entry_handoff[
                      "eligible_universe_sha256"
                  ],
                  "deployment_rows_sha256": json.loads(
                      deployment_manifest_path.read_text()
                  )["sha256"],
                  "all_deployment_boundaries_verified": True,
                  "all_historical_event_scans_complete": True,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )

          output = Path(
              "artifacts/phase3-canonical-transfers.jsonl"
          )
          manifest, summary = (
              materialize_phase3_canonical_transfer_tape(
                  universe_rows,
                  token_rows,
                  coverage_rows,
                  feature_entry_handoff=entry_handoff,
                  output=output,
              )
          )
          summary.update({
              "feature_entry_run_id": int(
                  os.environ["FEATURE_ENTRY_RUN_ID"]
              ),
              "feature_entry_handoff_sha256": entry_handoff_sha,
              "universe_run_id": int(
                  os.environ["UNIVERSE_RUN_ID"]
              ),
              "universe_handoff_sha256": universe_handoff_sha,
              "deployment_rows_sha256": json.loads(
                  deployment_manifest_path.read_text()
              )["sha256"],
              "token_coverage_rows_sha256": coverage_manifest[
                  "sha256"
              ],
              "authenticated_archive_logs_required": True,
          })
          summary_path = Path(
              "artifacts/phase3-canonical-transfer-summary.json"
          )
          summary_text = (
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_path.write_text(summary_text)
          summary_sha = hashlib.sha256(
              summary_text.encode()
          ).hexdigest()

          handoff = build_phase3_canonical_transfer_handoff(
              summary,
              tape_summary_sha256=summary_sha,
              feature_entry_handoff_sha256=entry_handoff_sha,
          )
          handoff_path = Path(
              "artifacts/phase3-canonical-transfer-handoff.json"
          )
          handoff_text = (
              json.dumps(handoff, indent=2, sort_keys=True) + "\n"
          )
          handoff_path.write_text(handoff_text)
          handoff_sha = hashlib.sha256(
              handoff_text.encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"transfer_rows_sha256={manifest['sha256']}\n"
              )
              handle.write(
                  f"coverage_rows_sha256={coverage_manifest['sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(f"handoff_sha256={handoff_sha}\n")
              handle.write(
                  f"transfer_rows={summary['transfer_rows']}\n"
              )
          print(json.dumps({
              "canonical_transfer_rows_sha256": manifest["sha256"],
              "token_coverage_rows_sha256": coverage_manifest["sha256"],
              "summary_sha256": summary_sha,
              "handoff_sha256": handoff_sha,
              "transfer_rows": summary["transfer_rows"],
              "universe_tokens": summary["universe_tokens"],
              "initial_mint_coverage_complete": True,
              "transfer_coverage_complete": True,
              "outcome_rows_consumed": False,
              "phase3_canonical_transfer_tape_ready": True,
          }, sort_keys=True))
          PY

      - name: Upload canonical Phase-3 transfer tape
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-canonical-transfer-tape
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact canonical-transfer handoff
        id: handoff_upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-canonical-transfer-tape-handoff
          path: |
            artifacts/phase3-canonical-transfers.jsonl.manifest.json
            artifacts/phase3-transfer-token-coverage.jsonl.manifest.json
            artifacts/phase3-canonical-transfer-summary.json
            artifacts/phase3-canonical-transfer-handoff.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish canonical-transfer identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_DIGEST: ${{ steps.handoff_upload.outputs.artifact-digest }}
          TRANSFER_ROWS_SHA256: ${{ steps.merge.outputs.transfer_rows_sha256 }}
          COVERAGE_ROWS_SHA256: ${{ steps.merge.outputs.coverage_rows_sha256 }}
          SUMMARY_SHA256: ${{ steps.merge.outputs.summary_sha256 }}
          HANDOFF_SHA256: ${{ steps.merge.outputs.handoff_sha256 }}
          TRANSFER_ROWS: ${{ steps.merge.outputs.transfer_rows }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${HANDOFF_ARTIFACT_DIGEST}"
          {
            echo "## Phase-3 canonical transfer tape"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase3-canonical-transfer-tape"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- handoff_artifact_name: phase3-canonical-transfer-tape-handoff"
            echo "- handoff_artifact_digest: ${HANDOFF_ARTIFACT_DIGEST}"
            echo "- canonical_transfer_rows_sha256: ${TRANSFER_ROWS_SHA256}"
            echo "- token_coverage_rows_sha256: ${COVERAGE_ROWS_SHA256}"
            echo "- summary_sha256: ${SUMMARY_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- transfer_rows: ${TRANSFER_ROWS}"
            echo "- deployment_boundaries_verified: true"
            echo "- initial_mint_coverage_complete: true"
            echo "- transfer_coverage_complete: true"
            echo "- outcome_rows_consumed: false"
            echo "- phase3_canonical_transfer_tape_ready: true"
          } >> "${GITHUB_STEP_SUMMARY}"
