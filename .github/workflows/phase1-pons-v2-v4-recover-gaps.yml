name: phase1-pons-v2-v4-recover-gaps

on:
  workflow_dispatch:
    inputs:
      transition_run_id:
        description: "Run containing phase1-pons-v2-transition-full"
        required: true
        type: string
      partial_run_id:
        description: "Interrupted phase1-pons-v2-v4-full run with successful shard artifacts"
        required: true
        type: string
      prior_gap_run_id:
        description: "Optional earlier V4 gap-recovery run whose successful gaps must be reused"
        required: false
        default: ""
        type: string
      max_gap_blocks:
        description: "Maximum blocks per retry job"
        required: true
        default: "150000"
        type: string
  workflow_call:
    inputs:
      transition_run_id:
        description: "Run containing phase1-pons-v2-transition-full"
        required: true
        type: string
      partial_run_id:
        description: "Interrupted phase1-pons-v2-v4-full run with successful shard artifacts"
        required: true
        type: string
      prior_gap_run_id:
        description: "Optional earlier V4 gap-recovery run whose successful gaps must be reused"
        required: false
        default: ""
        type: string
      max_gap_blocks:
        description: "Maximum blocks per retry job"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-v2-v4-recover-gaps-${{ github.ref }}
  cancel-in-progress: false

env:
  GENERATION_START: '26841846'
  SNAPSHOT_HEAD: '54486035'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      gap_count: ${{ steps.plan.outputs.gap_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-v2-v4-*
          path: partial
          merge-multiple: true
          run-id: ${{ inputs.partial_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prior_gap_run_id != '' }}
        with:
          pattern: phase1-pons-v2-v4-gap-*
          path: prior-gaps
          merge-multiple: true
          run-id: ${{ inputs.prior_gap_run_id }}
          github-token: ${{ github.token }}
      - id: plan
        name: Derive only missing V4 ranges
        env:
          MAX_GAP_BLOCKS: ${{ inputs.max_gap_blocks }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.data.ranges import plan_missing_subranges

          start = int(os.environ["GENERATION_START"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          max_blocks = int(os.environ["MAX_GAP_BLOCKS"])
          if not 1 <= max_blocks <= 150_000:
              raise SystemExit(
                  "max_gap_blocks must be between 1 and 150000"
              )

          manifests = (
              sorted(
                  Path("partial").glob(
                      "v4-events-shard-*.jsonl.manifest.json"
                  )
              )
              + sorted(
                  Path("prior-gaps").glob(
                      "v4-events-gap-*.jsonl.manifest.json"
                  )
              )
          )
          if not manifests:
              raise SystemExit(
                  "recovery sources have no successful V4 artifacts"
              )

          covered = []
          sources = []
          for path in manifests:
              manifest = json.loads(path.read_text())
              prov = manifest["provenance"]
              lo = int(prov["from_block"])
              hi = int(prov["to_block"])
              covered.append((lo, hi))
              sources.append({
                  "source": path.parent.name,
                  "manifest": path.name,
                  "from_block": lo,
                  "to_block": hi,
                  "records": int(manifest["records"]),
                  "sha256": manifest["sha256"],
              })

          gaps = plan_missing_subranges(
              start,
              head,
              covered,
              max_blocks=max_blocks,
          )
          if len(gaps) > 240:
              raise SystemExit(
                  "V4 gap plan exceeds 240 matrix jobs; recover a bounded "
                  "range first, then rerun manifest gap recovery"
              )
          include = [
              {
                  "id": f"{index:03d}",
                  "from_block": lo,
                  "to_block": hi,
              }
              for index, (lo, hi) in enumerate(gaps)
          ]
          report = {
              "generation_start": start,
              "snapshot_head": head,
              "max_gap_blocks": max_blocks,
              "successful_sources": sources,
              "gap_jobs": include,
              "gap_job_count": len(include),
              "gap_blocks": sum(
                  row["to_block"] - row["from_block"] + 1
                  for row in include
              ),
          }
          Path("artifacts/v4-gap-plan.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "matrix="
                  + json.dumps({"include": include}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"gap_count={len(include)}\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v2-v4-gap-plan
          path: artifacts/
          if-no-files-found: error

  recover:
    needs: plan
    if: ${{ needs.plan.outputs.gap_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-transition-full
          path: transition
          run-id: ${{ inputs.transition_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire exact missing V4 interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          GAP_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v2-v4-tape \
            --registrations transition/pons-v2-registrations-full.jsonl \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --global-pool-scan \
            --out "artifacts/v4-events-gap-${GAP_ID}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v2-v4-gap-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error

  merge:
    needs: [plan, recover]
    if: ${{ always() && needs.plan.result == 'success' && (needs.recover.result == 'success' || needs.recover.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-v2-v4-*
          path: partial
          merge-multiple: true
          run-id: ${{ inputs.partial_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prior_gap_run_id != '' }}
        with:
          pattern: phase1-pons-v2-v4-gap-*
          path: prior-gaps
          merge-multiple: true
          run-id: ${{ inputs.prior_gap_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.gap_count != '0' }}
        with:
          pattern: phase1-pons-v2-v4-gap-*
          path: gaps
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-v4-gap-plan
          path: plan
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v2-transition-full
          path: transition
          run-id: ${{ inputs.transition_run_id }}
          github-token: ${{ github.token }}
      - name: Merge recovered V4 event tape
        run: |
          mkdir -p artifacts
          cp plan/v4-gap-plan.json artifacts/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.data.reconstruct import event_order
          from hlp.data.snapshot import write_jsonl_snapshot

          START = int(os.environ["GENERATION_START"])
          HEAD = int(os.environ["SNAPSHOT_HEAD"])
          files = (
              list(Path("partial").glob("v4-events-shard-*.jsonl"))
              + list(Path("prior-gaps").glob("v4-events-gap-*.jsonl"))
              + list(Path("gaps").glob("v4-events-gap-*.jsonl"))
          )
          if not files:
              raise SystemExit("no V4 artifacts available for final merge")

          entries = []
          for path in files:
              manifest = json.loads(
                  path.with_suffix(path.suffix + ".manifest.json").read_text()
              )
              prov = manifest["provenance"]
              entries.append((
                  int(prov["from_block"]),
                  int(prov["to_block"]),
                  path,
                  manifest,
              ))
          entries.sort(key=lambda item: item[0])

          previous_hi = None
          manifests = []
          expected_records = 0
          for lo, hi, path, manifest in entries:
              if previous_hi is None:
                  assert lo == START, (lo, START, path.name)
              else:
                  assert lo == previous_hi + 1, (
                      previous_hi, lo, path.name
                  )
              previous_hi = hi
              expected_records += int(manifest["records"])
              manifests.append({
                  "source": path.parent.name,
                  "file": path.name,
                  "sha256": manifest["sha256"],
                  "records": int(manifest["records"]),
                  "from_block": lo,
                  "to_block": hi,
              })
          assert previous_hi == HEAD, (previous_hi, HEAD)

          registrations = [
              json.loads(line)
              for line in Path(
                  "transition/pons-v2-registrations-full.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          registered_ids = {
              row["pool_id"].lower() for row in registrations
          }

          counts = {
              "records": 0,
              "v4_initialize": 0,
              "v4_swap": 0,
          }
          initialized_ids = set()
          matched_ids = set()

          def rows():
              prior_order = None
              for _, _, path, manifest in entries:
                  local = 0
                  with path.open() as handle:
                      for line in handle:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          order = event_order(row)
                          if prior_order is not None:
                              assert prior_order < order, (
                                  prior_order, order, path.name
                              )
                          prior_order = order
                          pool_id = row["pool_id"].lower()
                          assert pool_id in registered_ids, pool_id
                          matched_ids.add(pool_id)
                          event_type = row["event_type"]
                          assert event_type in {
                              "v4_initialize",
                              "v4_swap",
                          }, event_type
                          counts[event_type] += 1
                          if event_type == "v4_initialize":
                              initialized_ids.add(pool_id)
                          counts["records"] += 1
                          local += 1
                          yield row
                  assert local == int(manifest["records"]), (
                      path.name, local, manifest["records"]
                  )

          snapshot = write_jsonl_snapshot(
              rows(),
              output=Path("artifacts/pons-v2-v4-full.jsonl"),
              provenance={
                  "source": "manifest_gap_aware_v4_recovery",
                  "chain_id": 4663,
                  "snapshot_head_block": HEAD,
                  "transition_run_id": int(
                      "${{ inputs.transition_run_id }}"
                  ),
                  "partial_run_id": int("${{ inputs.partial_run_id }}"),
                  "prior_gap_run_id": (
                      int("${{ inputs.prior_gap_run_id }}")
                      if "${{ inputs.prior_gap_run_id }}"
                      else None
                  ),
                  "filter_semantics": (
                      "PoolManager Initialize/Swap global topic scan followed "
                      "by frozen Pons V2 registration membership"
                  ),
                  "shards": manifests,
              },
          )
          assert counts["records"] == expected_records
          missing_initializes = sorted(
              registered_ids - initialized_ids
          )
          assert not missing_initializes, (
              "registered Pons V2 pools missing V4 Initialize",
              missing_initializes[:20],
              len(missing_initializes),
          )
          summary = {
              "snapshot_head_block": HEAD,
              "registered_pool_ids": len(registered_ids),
              "matched_pool_ids": len(matched_ids),
              "v4_initializes": counts["v4_initialize"],
              "v4_swaps": counts["v4_swap"],
              "records": counts["records"],
              "missing_initialize_pool_ids": 0,
              "tape_sha256": snapshot["sha256"],
              "source_files": len(entries),
          }
          Path("artifacts/pons-v2-v4-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-v2-v4-full
          path: artifacts/
          if-no-files-found: error
