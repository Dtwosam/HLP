name: phase1-workflow-run-probe-watcher

on:
  workflow_run:
    workflows:
      - phase1-workflow-run-probe-source
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  watch:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'phase1/data-acquisition-spike' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "watched ${{ github.event.workflow_run.id }}"
