name: phase1-dispatch-permission-probe-launcher
# probe-generation: 1

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/workflows/phase1-dispatch-permission-probe-launcher.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, 'launch dispatch permission probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch inert target and prove separate run creation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          ref = os.environ["GITHUB_REF_NAME"]
          sequence_id = f"probe-{os.environ['GITHUB_RUN_ID']}"
          workflow = "phase1-dispatch-permission-probe-target.yml"

          def request(method, path, payload=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          request(
              "POST",
              f"/repos/{repo}/actions/workflows/"
              f"{urllib.parse.quote(workflow)}/dispatches",
              {"ref": ref, "inputs": {"sequence_id": sequence_id}},
          )

          title = f"phase1 dispatch probe sequence={sequence_id}"
          child = None
          for _ in range(24):
              payload = request(
                  "GET",
                  f"/repos/{repo}/actions/workflows/"
                  f"{urllib.parse.quote(workflow)}/runs"
                  f"?branch={urllib.parse.quote(ref)}"
                  "&event=workflow_dispatch&per_page=20",
              )
              matches = [
                  row
                  for row in payload.get("workflow_runs", [])
                  if row.get("display_title") == title
              ]
              if matches:
                  child = matches[0]
                  break
              time.sleep(5)
          if child is None:
              raise SystemExit("dispatch probe did not create child workflow run")

          child_id = int(child["id"])
          for _ in range(24):
              child = request(
                  "GET",
                  f"/repos/{repo}/actions/runs/{child_id}",
              )
              if child.get("status") == "completed":
                  break
              time.sleep(5)
          if child.get("conclusion") != "success":
              raise SystemExit(
                  "dispatched probe child did not succeed: "
                  f"run={child_id} conclusion={child.get('conclusion')}"
              )
          if child_id == int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("dispatch probe child reused parent run ID")
          print(json.dumps({
              "parent_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "child_run_id": child_id,
              "distinct_run_id": True,
              "conclusion": child.get("conclusion"),
          }, sort_keys=True))
          PY
