name: phase2-dump-candidate-research-plan

on:
  workflow_dispatch:
    inputs:
      geometry_completion_run_id:
        description: Exact successful phase2-dump-geometry-completion workflow_dispatch run ID
        required: true
        type: string
      expected_completion_artifact_digest:
        description: Exact dump-geometry completion artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-dump-candidate-research-plan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      COMPLETION_RUN_ID: ${{ inputs.geometry_completion_run_id }}
      EXPECTED_COMPLETION_DIGEST: ${{ inputs.expected_completion_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: plan
        name: Freeze explicit outcome-blind research grid
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          from hlp.data.phase2_dump_candidate_dispatch import (
              build_phase2_dump_candidate_research_plan,
              validate_phase2_dump_candidate_research_plan,
          )
          from hlp.data.phase2_dump_geometry_dispatch import (
              validate_phase2_dump_geometry_completion_receipt,
          )
          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(path): return json.loads(subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",f"/repos/{repo}/{path}"]))
          def identity(row,workflow,run_id):
              if row.get("path")!=f".github/workflows/{workflow}" or row.get("event")!="workflow_dispatch" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head:
                  raise SystemExit(f"run {run_id} identity drift")
          def artifact(run_id,name):
              rows=api(f"actions/runs/{run_id}/artifacts?name={name}").get("artifacts",[])
              rows=[x for x in rows if x.get("name")==name and not x.get("expired")]
              if len(rows)!=1: raise SystemExit(f"{name} artifact cardinality drift")
              return rows[0]
          rid=int(os.environ["COMPLETION_RUN_ID"]); row=api(f"actions/runs/{rid}")
          identity(row,"phase2-dump-geometry-completion.yml",rid)
          if row.get("status")!="completed" or row.get("conclusion")!="success": raise SystemExit("geometry completion is not successful")
          name="phase2-dump-geometry-completion"; art=artifact(rid,name)
          actual=str(art.get("digest") or "").lower()
          if actual!=os.environ["EXPECTED_COMPLETION_DIGEST"].lower(): raise SystemExit("geometry completion digest drift")
          root=Path("upstream/geometry-completion")
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          subprocess.check_call(["gh","run","download",str(rid),"--repo",repo,"--name",name,"--dir",str(root)])
          geometry=validate_phase2_dump_geometry_completion_receipt(json.loads((root/"phase2-dump-geometry-completion-receipt.json").read_text()))
          plan=build_phase2_dump_candidate_research_plan(geometry)
          plan["geometry_completion_artifact_digest"]=actual
          plan=validate_phase2_dump_candidate_research_plan(plan)
          Path("artifacts/phase2-dump-candidate-research-plan.json").write_text(json.dumps(plan,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as h:
              h.write(f"candidate_specs_sha256={plan['candidate_specs_sha256']}\n")
              h.write(f"candidate_count={plan['candidate_count']}\n")
          PY
      - name: Upload candidate-research plan
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dump-candidate-research-plan
          path: artifacts/phase2-dump-candidate-research-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish candidate grid
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SPECS_SHA: ${{ steps.plan.outputs.candidate_specs_sha256 }}
          COUNT: ${{ steps.plan.outputs.candidate_count }}
        run: |
          {
            echo "## Phase-2 outcome-blind candidate grid"
            echo "- plan_run_id: ${GITHUB_RUN_ID}"
            echo "- plan_artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- candidate_specs_sha256: ${SPECS_SHA}"
            echo "- candidates: ${COUNT}"
            echo "- grid: drawdown 30/40/50% x rebound 15/25/35%"
            echo "- candidate_selected: false"
            echo "- outcome_labels_computed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
