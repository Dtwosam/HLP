name: phase1-pons-anchor-cancelled-gap-repair-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/workflows/phase1-pons-anchor-cancelled-gap-repair-one-shot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-anchor-cancelled-gap-repair-one-shot
  cancel-in-progress: false

jobs:
  repair_018:
    uses: ./.github/workflows/phase1-pons-weth-usdg-anchor-recover-range.yml
    with:
      from_block: "52169619"
      to_block: "52319618"
      artifact_suffix: "gap-018-repair"
    secrets: inherit

  repair_025:
    needs: repair_018
    if: ${{ needs.repair_018.result == 'success' }}
    uses: ./.github/workflows/phase1-pons-weth-usdg-anchor-recover-range.yml
    with:
      from_block: "53219619"
      to_block: "53369618"
      artifact_suffix: "gap-025-repair"
    secrets: inherit
