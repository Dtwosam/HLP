name: phase1-pons-eligible-universe-promote

on:
  workflow_dispatch:
    inputs:
      source_eligibility_run_id:
        description: "Completed full eligibility parent containing V1/V2 lifecycle artifacts"
        required: true
        type: string
  workflow_call:
    inputs:
      source_eligibility_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-eligible-universe-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    uses: ./.github/workflows/phase1-pons-eligible-universe-freeze.yml
    with:
      v1_eligibility_run_id: ${{ inputs.source_eligibility_run_id }}
      v2_eligibility_run_id: ${{ inputs.source_eligibility_run_id }}
    secrets: inherit
