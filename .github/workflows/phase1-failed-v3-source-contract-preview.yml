name: phase1-failed-v3-source-contract-preview

on:
  push:
    branches:
      - phase1/repaired-pricing-source-contract-fix
    paths:
      - .github/scripts/patch_failed_v3_source_contract.py
      - .github/workflows/phase1-failed-v3-source-contract-preview.yml

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply failed V3 source contract patch
        run: python .github/scripts/patch_failed_v3_source_contract.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Stage exact tested repaired pricing workflow blob
        run: |
          mkdir -p .github/repaired-pricing-stage
          cp .github/workflows/phase1-pons-repaired-pricing-promote.yml \
            .github/repaired-pricing-stage/promote.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/repaired-pricing-stage/promote.txt
          git diff --cached --check
          git commit -m "ci: stage tested failed V3 source contract blob"
          git push origin HEAD:phase1/repaired-pricing-source-contract-fix
