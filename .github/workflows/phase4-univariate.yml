name: phase4-univariate

on:
  workflow_dispatch:
    inputs:
      discovery_entry_handoff_json:
        description: JSON with run_id, artifact_digest, handoff_sha256 for phase4-discovery-entry
        required: true
        type: string
      base_rate_handoff_json:
        description: JSON with run_id, artifact_digest, handoff_sha256 for phase4-base-rate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase4-univariate-${{ github.ref }}
  cancel-in-progress: false

env:
  DISCOVERY_ENTRY_HANDOFF_JSON: ${{ inputs.discovery_entry_handoff_json }}
  BASE_RATE_HANDOFF_JSON: ${{ inputs.base_rate_handoff_json }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: univariate
        name: Compare winners and failures feature by feature
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_feature_registry import (
              validate_phase3_feature_registry,
          )
          from hlp.data.phase4_base_rate import (
              build_phase4_base_rate_handoff,
          )
          from hlp.data.phase4_discovery_entry import (
              build_phase4_discovery_entry_handoff,
          )
          from hlp.data.phase4_univariate import (
              build_phase4_univariate_handoff,
              build_phase4_univariate_report,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def descriptor(env_name, label):
              try:
                  value = json.loads(os.environ[env_name])
              except (KeyError, json.JSONDecodeError) as exc:
                  raise SystemExit(
                      f"{label} descriptor is invalid JSON"
                  ) from exc
              if not isinstance(value, dict):
                  raise SystemExit(
                      f"{label} descriptor must be an object"
                  )
              try:
                  run_id = int(value["run_id"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"{label} run_id is invalid"
                  ) from exc
              digest = str(value.get("artifact_digest") or "").lower()
              handoff_sha = str(
                  value.get("handoff_sha256") or ""
              ).lower().removeprefix("sha256:")
              if not digest.startswith("sha256:") or len(digest) != 71:
                  raise SystemExit(
                      f"{label} artifact_digest is invalid"
                  )
              if len(handoff_sha) != 64:
                  raise SystemExit(
                      f"{label} handoff_sha256 is invalid"
                  )
              try:
                  int(digest.split(":", 1)[1], 16)
                  int(handoff_sha, 16)
              except ValueError as exc:
                  raise SystemExit(
                      f"{label} digest/SHA is not hexadecimal"
                  ) from exc
              return run_id, digest, handoff_sha

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(
              run_id,
              name,
              destination,
              label,
              expected_digest,
          ):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != expected_digest:
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repo,
                  "--name",
                  name,
                  "--dir",
                  str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; "
                      f"found {len(matches)}"
                  )
              return matches[0]

          (
              discovery_run,
              discovery_digest,
              discovery_expected_sha,
          ) = descriptor(
              "DISCOVERY_ENTRY_HANDOFF_JSON",
              "Phase-4 discovery entry",
          )
          (
              base_rate_run,
              base_rate_digest,
              base_rate_expected_sha,
          ) = descriptor(
              "BASE_RATE_HANDOFF_JSON",
              "Phase-4 base rate",
          )

          discovery_root = Path("inputs/discovery-entry")
          base_rate_root = Path("inputs/base-rate")
          download_named(
              discovery_run,
              "phase4-discovery-entry",
              discovery_root,
              "Phase-4 discovery entry",
              discovery_digest,
          )
          download_named(
              base_rate_run,
              "phase4-base-rate",
              base_rate_root,
              "Phase-4 base rate",
              base_rate_digest,
          )

          rows_path = find_unique(
              discovery_root,
              "phase4-discovery-entry.jsonl",
          )
          manifest_path = find_unique(
              discovery_root,
              "phase4-discovery-entry.jsonl.manifest.json",
          )
          manifest = json.loads(manifest_path.read_text())
          summary_path = find_unique(
              discovery_root,
              "phase4-discovery-entry-summary.json",
          )
          summary = json.loads(summary_path.read_text())
          summary_sha = sha256_path(summary_path)
          discovery_handoff_path = find_unique(
              discovery_root,
              "phase4-discovery-entry-handoff.json",
          )
          discovery_handoff_sha = sha256_path(
              discovery_handoff_path
          )
          if discovery_handoff_sha != discovery_expected_sha:
              raise SystemExit(
                  "Phase-4 discovery-entry handoff SHA drift"
              )
          discovery_handoff = json.loads(
              discovery_handoff_path.read_text()
          )
          rebuilt_discovery = build_phase4_discovery_entry_handoff(
              summary,
              discovery_summary_sha256=summary_sha,
              phase2_dataset_handoff_sha256=summary[
                  "phase2_dataset_handoff_sha256"
              ],
              feature_store_handoff_sha256=summary[
                  "feature_store_handoff_sha256"
              ],
              feature_coverage_handoff_sha256=summary[
                  "feature_coverage_handoff_sha256"
              ],
              feature_entry_handoff_sha256=summary[
                  "feature_entry_handoff_sha256"
              ],
          )
          if rebuilt_discovery != discovery_handoff:
              raise SystemExit(
                  "Phase-4 discovery-entry handoff content drift"
              )
          if manifest.get("sha256") != discovery_handoff[
              "discovery_rows_sha256"
          ]:
              raise SystemExit(
                  "Phase-4 discovery-entry manifest SHA drift"
              )
          if int(manifest.get("records", -1)) != int(
              discovery_handoff["discovery_subjects"]
          ):
              raise SystemExit(
                  "Phase-4 discovery-entry subject count drift"
              )

          registry_path = find_unique(
              discovery_root,
              "phase4-feature-registry.json",
          )
          registry_file_sha = sha256_path(registry_path)
          if registry_file_sha != discovery_handoff[
              "feature_registry_file_sha256"
          ]:
              raise SystemExit(
                  "Phase-4 feature-registry file SHA drift"
              )
          registry = json.loads(registry_path.read_text())
          if not isinstance(registry, list):
              raise SystemExit(
                  "Phase-4 feature registry is not a JSON list"
              )
          registry_report = validate_phase3_feature_registry(
              registry
          )
          if registry_report["registry_sha256"] != discovery_handoff[
              "feature_registry_sha256"
          ]:
              raise SystemExit(
                  "Phase-4 feature-registry definition drift"
              )

          base_report_path = find_unique(
              base_rate_root,
              "phase4-base-rate-report.json",
          )
          base_report = json.loads(base_report_path.read_text())
          base_report_sha = sha256_path(base_report_path)
          base_handoff_path = find_unique(
              base_rate_root,
              "phase4-base-rate-handoff.json",
          )
          base_handoff_sha = sha256_path(base_handoff_path)
          if base_handoff_sha != base_rate_expected_sha:
              raise SystemExit(
                  "Phase-4 base-rate handoff SHA drift"
              )
          base_handoff = json.loads(base_handoff_path.read_text())
          rebuilt_base = build_phase4_base_rate_handoff(
              base_report,
              report_sha256=base_report_sha,
              discovery_entry_handoff_sha256=base_report[
                  "discovery_entry_handoff_sha256"
              ],
          )
          if rebuilt_base != base_handoff:
              raise SystemExit(
                  "Phase-4 base-rate handoff content drift"
              )
          if base_handoff[
              "discovery_entry_handoff_sha256"
          ] != discovery_handoff_sha:
              raise SystemExit(
                  "Phase-4 base-rate/discovery-entry linkage drift"
              )

          report = build_phase4_univariate_report(
              iter_validated_jsonl(
                  rows_path,
                  manifest_path,
              ),
              registry,
              discovery_entry_handoff=discovery_handoff,
              base_rate_handoff=base_handoff,
          )
          report.update({
              "discovery_entry_run_id": discovery_run,
              "base_rate_run_id": base_rate_run,
              "discovery_entry_handoff_sha256": (
                  discovery_handoff_sha
              ),
              "base_rate_handoff_sha256": base_handoff_sha,
              "feature_registry_file_sha256": registry_file_sha,
          })
          report_path = Path(
              "artifacts/phase4-univariate-report.json"
          )
          report_text = json.dumps(
              report,
              indent=2,
              sort_keys=True,
          ) + "\n"
          report_path.write_text(report_text)
          report_sha = hashlib.sha256(
              report_text.encode()
          ).hexdigest()

          output_handoff = build_phase4_univariate_handoff(
              report,
              report_sha256=report_sha,
              discovery_entry_handoff_sha256=discovery_handoff_sha,
              base_rate_handoff_sha256=base_handoff_sha,
              feature_registry_file_sha256=registry_file_sha,
          )
          output_handoff_path = Path(
              "artifacts/phase4-univariate-handoff.json"
          )
          output_handoff_text = json.dumps(
              output_handoff,
              indent=2,
              sort_keys=True,
          ) + "\n"
          output_handoff_path.write_text(output_handoff_text)
          output_handoff_sha = hashlib.sha256(
              output_handoff_text.encode()
          ).hexdigest()

          shutil.copyfile(
              registry_path,
              Path("artifacts/phase4-feature-registry.json"),
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"report_sha256={report_sha}\n")
              handle.write(
                  f"handoff_sha256={output_handoff_sha}\n"
              )
              handle.write(
                  f"features={report['features_tested']}\n"
              )
              handle.write(
                  f"families={report['families_tested']}\n"
              )
              handle.write(
                  f"winners={report['winner_tokens']}\n"
              )
              handle.write(
                  f"failures={report['failure_tokens']}\n"
              )
          print(json.dumps({
              "features_tested": report["features_tested"],
              "families_tested": report["families_tested"],
              "winner_tokens": report["winner_tokens"],
              "failure_tokens": report["failure_tokens"],
              "univariate_relationships_tested": True,
              "candidate_features_ranked": False,
              "signal_promoted": False,
              "unseen_slice_validation_complete": False,
              "multiple_testing_control_applied": False,
              "phase4_discovery_checkpoint_claimed": False,
          }, sort_keys=True))
          PY

      - name: Upload Phase-4 univariate diagnostics
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase4-univariate
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish Phase-4 univariate identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          REPORT_SHA256: ${{ steps.univariate.outputs.report_sha256 }}
          HANDOFF_SHA256: ${{ steps.univariate.outputs.handoff_sha256 }}
          FEATURES: ${{ steps.univariate.outputs.features }}
          FAMILIES: ${{ steps.univariate.outputs.families }}
          WINNERS: ${{ steps.univariate.outputs.winners }}
          FAILURES: ${{ steps.univariate.outputs.failures }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          {
            echo "## Phase-4 univariate diagnostics"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase4-univariate"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- report_sha256: ${REPORT_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- features_tested: ${FEATURES}"
            echo "- families_tested: ${FAMILIES}"
            echo "- winner_tokens: ${WINNERS}"
            echo "- failure_tokens: ${FAILURES}"
            echo "- univariate_relationships_tested: true"
            echo "- candidate_features_ranked: false"
            echo "- signal_promoted: false"
            echo "- unseen_slice_validation_complete: false"
            echo "- multiple_testing_control_applied: false"
            echo "- phase4_discovery_checkpoint_claimed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
