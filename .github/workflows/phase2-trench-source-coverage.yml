  merge:
    needs: [setup, price-v3, price-v4]
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      (needs.price-v3.result == 'success' || needs.price-v3.result == 'skipped') &&
      (needs.price-v4.result == 'success' || needs.price-v4.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGISTRY_RUN_ID: ${{ inputs.registry_run_id }}
      CURVE_RUN_ID: ${{ inputs.curve_run_id }}
      CURVE_ARTIFACT_DIGEST: ${{ inputs.expected_curve_artifact_digest }}
      CURVE_REPORT_SHA256: ${{ inputs.expected_curve_report_sha256 }}
      HANDOFF_RUN_ID: ${{ inputs.handoff_run_id }}
      HANDOFF_ARTIFACT_DIGEST: ${{ inputs.expected_handoff_artifact_digest }}
      HANDOFF_REPORT_SHA256: ${{ inputs.expected_handoff_report_sha256 }}
      DIRECT_REGISTRY_RUN_ID: ${{ inputs.direct_registry_run_id }}
      V3_INITIALIZE_RUN_ID: ${{ inputs.v3_initialize_run_id }}
      V4_INITIALIZE_RUN_ID: ${{ inputs.v4_initialize_run_id }}
      V3_SWAP_RUN_ID: ${{ inputs.v3_swap_run_id }}
      V4_SWAP_RUN_ID: ${{ inputs.v4_swap_run_id }}
      SUPPLY_DELTA_RUN_ID: ${{ inputs.supply_delta_run_id }}
      QUOTE_RUN_ID: ${{ inputs.quote_run_id }}
      HAS_V3: ${{ needs.setup.outputs.has_v3 }}
      HAS_V4: ${{ needs.setup.outputs.has_v4 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase2-trench-source-coverage-setup
          path: inputs/setup
      - uses: actions/download-artifact@v4
        if: env.HAS_V3 == 'true'
        with:
          pattern: phase2-trench-v3-price-*
          path: inputs/v3
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: env.HAS_V4 == 'true'
        with:
          pattern: phase2-trench-v4-price-*
          path: inputs/v4
          merge-multiple: true

      - id: merge
        name: Validate and merge complete trench.today lifecycle
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from hlp.data.phase2_coverage import (
              apply_phase2_source_coverage_report,
          )
          from hlp.data.phase2_sources import build_phase2_source_inventory
          from hlp.data.sharded_tape import write_virtual_jsonl_manifest
          from hlp.data.snapshot import write_jsonl_snapshot
          from hlp.data.trench_coverage import (
              merge_trench_lifecycle_market_cap_summaries,
              summarize_trench_post_limit_market_caps,
              validate_trench_curve_coverage_report,
              validate_trench_source_coverage_report,
          )

          def read_jsonl(path):
              return [
                  json.loads(line)
                  for line in Path(path).read_text().splitlines()
                  if line.strip()
              ]

          setup = Path("inputs/setup")
          registry = read_jsonl(setup / "trench-registry.jsonl")
          registry_summary = json.loads(
              (setup / "trench-registry-summary.json").read_text()
          )
          curve_raw = (
              setup / "trench-curve-coverage-report.json"
          ).read_bytes()
          curve_report_sha = hashlib.sha256(curve_raw).hexdigest()
          curve = validate_trench_curve_coverage_report(
              json.loads(curve_raw),
              required_start_block=int(
                  os.environ["REQUIRED_START_BLOCK"]
              ),
              snapshot_head_block=int(os.environ["SNAPSHOT_HEAD"]),
          )
          if curve_report_sha != os.environ[
              "CURVE_REPORT_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("trench curve report SHA drift at merge")

          handoff_raw = (
              setup / "trench-limit-handoff-freeze.json"
          ).read_bytes()
          handoff_report_sha = hashlib.sha256(
              handoff_raw
          ).hexdigest()
          if handoff_report_sha != os.environ[
              "HANDOFF_REPORT_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("trench handoff report SHA drift at merge")
          handoff_report = json.loads(handoff_raw)
          handoffs = read_jsonl(
              setup / "trench-limit-market-handoffs.jsonl"
          )
          curve_summary = read_jsonl(
              setup / "trench-curve-summary.jsonl"
          )

          point_files = []
          expected_count = int(os.environ["SHARD_COUNT"])
          for version, enabled in (
              ("v3", os.environ["HAS_V3"] == "true"),
              ("v4", os.environ["HAS_V4"] == "true"),
          ):
              root = Path(f"inputs/{version}")
              files = sorted(
                  root.glob(f"trench-{version}-points-*.jsonl")
              ) if enabled else []
              reports = sorted(
                  root.glob(f"trench-{version}-report-*.json")
              ) if enabled else []
              if enabled and (
                  len(files) != expected_count
                  or len(reports) != expected_count
              ):
                  raise SystemExit(
                      f"trench {version.upper()} price shard count drift: "
                      f"points={len(files)} reports={len(reports)}"
                  )
              if not enabled and (files or reports):
                  raise SystemExit(
                      f"unexpected trench {version.upper()} price artifacts"
                  )
              point_files.extend((version, path) for path in files)

          aggregate = hashlib.sha256()
          total_post_points = 0
          total_post_priced = 0
          shard_rows = []

          def post_points():
              nonlocal total_post_points, total_post_priced
              for version, path in point_files:
                  suffix = path.stem.rsplit("-", 1)[-1]
                  report_path = path.parent / (
                      f"trench-{version}-report-{suffix}.json"
                  )
                  report = json.loads(report_path.read_text())
                  manifest = json.loads(
                      path.with_suffix(
                          path.suffix + ".manifest.json"
                      ).read_text()
                  )
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  if digest != manifest["sha256"]:
                      raise SystemExit(
                          f"trench {version} point SHA drift: {suffix}"
                      )
                  if digest != report["points_sha256"]:
                      raise SystemExit(
                          f"trench {version} report point SHA drift: {suffix}"
                      )
                  if report["market_selection_rule_frozen"] is not True:
                      raise SystemExit(
                          f"trench {version} handoff rule unfrozen: {suffix}"
                      )
                  if report["source_coverage_complete"] is not False:
                      raise SystemExit(
                          f"trench {version} shard closed coverage: {suffix}"
                      )
                  records = int(manifest["records"])
                  if int(report["market_cap_points"]) != records:
                      raise SystemExit(
                          f"trench {version} point count drift: {suffix}"
                      )
                  if int(report["priced_points"]) != records:
                      raise SystemExit(
                          f"trench {version} shard unpriced: {suffix}"
                      )
                  shard_rows.append({
                      "file": path.name,
                      "family": version,
                      "records": records,
                      "sha256": digest,
                      "from_block": int(report["from_block"]),
                      "to_block": int(report["to_block"]),
                  })
                  with path.open("rb") as handle:
                      for raw in handle:
                          aggregate.update(raw)
                          if not raw.strip():
                              continue
                          row = json.loads(raw)
                          total_post_points += 1
                          if row["market_cap_proxy_usd"] is not None:
                              total_post_priced += 1
                          yield row

          post_summary = summarize_trench_post_limit_market_caps(
              post_points(),
              handoffs,
          )
          if total_post_priced != total_post_points:
              raise SystemExit(
                  "trench merged post-limit history has unpriced points"
              )
          lifecycle_summary = (
              merge_trench_lifecycle_market_cap_summaries(
                  registry,
                  curve_summary,
                  post_summary,
              )
          )

          post_manifest = write_virtual_jsonl_manifest(
              manifest_path=Path(
                  "artifacts/trench-post-limit-points.manifest.json"
              ),
              path_name="trench-post-limit-points.jsonl",
              records=total_post_points,
              sha256=aggregate.hexdigest(),
              provenance={
                  "storage_mode": "sharded_artifacts",
                  "composition_order": "v3_then_v4_each_by_shard_index",
                  "source": "phase2_trench_selected_post_limit_points",
                  "chain_id": 4663,
                  "handoff_rule_version": (
                      "trench-limit-same-transaction-after-v1"
                  ),
                  "shards": shard_rows,
              },
          )
          final_summary_manifest = write_jsonl_snapshot(
              lifecycle_summary,
              output=Path(
                  "artifacts/trench-lifecycle-summary.jsonl"
              ),
              provenance={
                  "source": "phase2_trench_complete_lifecycle_summary",
                  "chain_id": 4663,
                  "curve_points_sha256": curve[
                      "curve_points_sha256"
                  ],
                  "post_limit_points_sha256": post_manifest["sha256"],
                  "handoff_manifest_sha256": handoff_report[
                      "handoff_manifest_sha256"
                  ],
                  "eligibility_threshold_usd": "100000",
              },
          )

          curve_points = int(curve["curve_price_points"])
          total_points = curve_points + total_post_points
          if len(curve_summary) != len(registry):
              raise SystemExit(
                  "trench full coverage lacks curve points for every launch"
              )
          if len(lifecycle_summary) != len(registry):
              raise SystemExit(
                  "trench lifecycle summary population drift"
              )
          if len(post_summary) != int(
              registry_summary["limit_reach_tokens"]
          ):
              raise SystemExit(
                  "trench post-limit population does not match LimitReach"
              )

          supply_summary = json.loads(
              (setup / "trench-supply-deltas-summary.json").read_text()
          )
          quote_summary = json.loads(
              (setup / "direct-quote-summary.json").read_text()
          )
          replay_summary = json.loads(
              (
                  setup
                  / "trench-handoff-market-registry-summary.json"
              ).read_text()
          )
          provenance_payload = {
              "version": "phase2-trench-source-provenance-v1",
              "chain_id": 4663,
              "snapshot_head_block": int(
                  os.environ["SNAPSHOT_HEAD"]
              ),
              "registry_run_id": int(os.environ["REGISTRY_RUN_ID"]),
              "curve_run_id": int(os.environ["CURVE_RUN_ID"]),
              "curve_artifact_digest": os.environ[
                  "CURVE_ARTIFACT_DIGEST"
              ].lower(),
              "curve_report_sha256": curve_report_sha,
              "handoff_run_id": int(os.environ["HANDOFF_RUN_ID"]),
              "handoff_artifact_digest": os.environ[
                  "HANDOFF_ARTIFACT_DIGEST"
              ].lower(),
              "handoff_report_sha256": handoff_report_sha,
              "direct_registry_run_id": int(
                  os.environ["DIRECT_REGISTRY_RUN_ID"]
              ),
              "v3_initialize_run_id": int(
                  os.environ["V3_INITIALIZE_RUN_ID"]
              ),
              "v4_initialize_run_id": int(
                  os.environ["V4_INITIALIZE_RUN_ID"]
              ),
              "v3_swap_run_id": int(os.environ["V3_SWAP_RUN_ID"]),
              "v4_swap_run_id": int(os.environ["V4_SWAP_RUN_ID"]),
              "supply_delta_run_id": int(
                  os.environ["SUPPLY_DELTA_RUN_ID"]
              ),
              "quote_run_id": int(os.environ["QUOTE_RUN_ID"]),
              "registry_sha256": registry_summary["registry_sha256"],
              "curve_points_sha256": curve["curve_points_sha256"],
              "handoff_manifest_sha256": handoff_report[
                  "handoff_manifest_sha256"
              ],
              "v3_replay_registry_sha256": replay_summary[
                  "v3_registry_sha256"
              ],
              "v4_replay_registry_sha256": replay_summary[
                  "v4_registry_sha256"
              ],
              "filtered_supply_sha256": supply_summary[
                  "filtered_supply_sha256"
              ],
              "quote_feed_specs_sha256": quote_summary[
                  "feed_specs_sha256"
              ],
              "post_limit_points_sha256": post_manifest["sha256"],
              "final_summary_sha256": final_summary_manifest["sha256"],
          }
          provenance_bytes = (
              json.dumps(
                  provenance_payload,
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n"
          ).encode()
          provenance_sha = hashlib.sha256(
              provenance_bytes
          ).hexdigest()
          Path(
              "artifacts/trench-source-provenance.json"
          ).write_bytes(provenance_bytes)

          report = {
              "version": "phase2-trench-source-coverage-v1",
              "source_id": "trench_today",
              "source_readiness": "adapter_ready",
              "coverage_status": "complete",
              "required_start_block": int(
                  os.environ["REQUIRED_START_BLOCK"]
              ),
              "first_block": int(
                  os.environ["REQUIRED_START_BLOCK"]
              ),
              "last_block": int(os.environ["SNAPSHOT_HEAD"]),
              "continuous": True,
              "missing_ranges": [],
              "tokens_discovered": len(registry),
              "curve_tokens_with_points": len(curve_summary),
              "limit_reach_tokens": int(
                  registry_summary["limit_reach_tokens"]
              ),
              "post_limit_tokens_with_points": len(post_summary),
              "lifecycle_tokens_with_points": len(lifecycle_summary),
              "curve_price_points": curve_points,
              "post_limit_price_points": total_post_points,
              "price_points": total_points,
              "priced_points": total_points,
              "observed_volume_usd": None,
              "handoff_rule_version": handoff_report[
                  "handoff_rule_version"
              ],
              "handoff_rule_frozen": True,
              "provenance_sha256": provenance_sha,
              "event_tape_sha256": registry_summary[
                  "event_tape_sha256"
              ],
              "registry_sha256": registry_summary["registry_sha256"],
              "curve_report_sha256": curve_report_sha,
              "curve_points_sha256": curve["curve_points_sha256"],
              "handoff_report_sha256": handoff_report_sha,
              "handoff_manifest_sha256": handoff_report[
                  "handoff_manifest_sha256"
              ],
              "post_limit_points_sha256": post_manifest["sha256"],
              "final_summary_sha256": final_summary_manifest["sha256"],
              "blocking_reason": None,
              "snapshot_head_block": int(
                  os.environ["SNAPSHOT_HEAD"]
              ),
          }
          validated = validate_trench_source_coverage_report(
              report,
              required_start_block=int(
                  os.environ["REQUIRED_START_BLOCK"]
              ),
              snapshot_head_block=int(os.environ["SNAPSHOT_HEAD"]),
          )
          ledger = json.loads(
              Path(".github/phase2-source-coverage.json").read_text()
          )
          proposed, phase2_validation = (
              apply_phase2_source_coverage_report(
                  ledger,
                  build_phase2_source_inventory(),
                  validated,
              )
          )
          if "trench_today" not in phase2_validation[
              "complete_source_ids"
          ]:
              raise SystemExit(
                  "trench.today did not validate as complete"
              )
          if phase2_validation["phase2_universe_coverage_complete"]:
              raise SystemExit(
                  "trench.today alone must not close Phase 2 coverage"
              )

          report_text = (
              json.dumps(validated, indent=2, sort_keys=True) + "\n"
          )
          report_sha = hashlib.sha256(
              report_text.encode("utf-8")
          ).hexdigest()
          Path(
              "artifacts/trench-source-coverage-report.json"
          ).write_text(report_text)
          Path(
              "artifacts/trench-source-coverage-validation.json"
          ).write_text(
              json.dumps(
                  phase2_validation,
                  indent=2,
                  sort_keys=True,
              ) + "\n"
          )
          Path(
              "artifacts/trench-source-coverage.proposed.json"
          ).write_text(
              json.dumps(proposed, indent=2) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"report_sha256={report_sha}\n")
          print(json.dumps({
              "coverage_report": validated,
              "coverage_report_sha256": report_sha,
              "phase2_validation": phase2_validation,
          }, sort_keys=True))
          PY

      - name: Upload complete trench.today coverage evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-trench-source-coverage
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish coverage-promotion inputs
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          REPORT_SHA256: ${{ steps.merge.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_DIGEST"
          test -n "$REPORT_SHA256"
          {
            echo "## trench.today source coverage promotion"
            echo
            echo "- coverage_run_id: ${GITHUB_RUN_ID}"
            echo "- coverage_artifact_name: phase2-trench-source-coverage"
            echo "- expected_artifact_digest: $ARTIFACT_DIGEST"
            echo "- coverage_report_path: trench-source-coverage-report.json"
            echo "- expected_report_sha256: $REPORT_SHA256"
            echo "- expected_source_id: trench_today"
          } >> "$GITHUB_STEP_SUMMARY"
