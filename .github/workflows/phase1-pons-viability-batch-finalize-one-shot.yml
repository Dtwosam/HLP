name: phase1-pons-viability-batch-finalize-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/phase1-pons-viability-finalize.json

permissions:
  contents: read
  actions: read

jobs:
  inputs:
    if: ${{ contains(github.event.head_commit.message, 'launch Phase 1 final acceptance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      batch_head_sha: ${{ steps.read.outputs.batch_head_sha }}
      evidence_run_id: ${{ steps.read.outputs.evidence_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read frozen finalizer inputs
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(
              Path(".github/phase1-pons-viability-finalize.json").read_text()
          )
          generation = int(config.get("generation", 0))
          batch_head_sha = str(config.get("batch_head_sha") or "").lower()
          evidence_run_id = int(config.get("evidence_run_id", 0))
          if generation <= 0:
              raise SystemExit("finalizer generation is not armed")
          if len(batch_head_sha) != 40 or any(
              c not in "0123456789abcdef" for c in batch_head_sha
          ):
              raise SystemExit("finalizer batch SHA must be 40 hex chars")
          if evidence_run_id <= 0:
              raise SystemExit("finalizer evidence run ID must be positive")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"batch_head_sha={batch_head_sha}\n")
              output.write(f"evidence_run_id={evidence_run_id}\n")
          print(json.dumps({
              "generation": generation,
              "batch_head_sha": batch_head_sha,
              "evidence_run_id": evidence_run_id,
          }, sort_keys=True))
          PY

  finalize:
    needs: inputs
    if: ${{ needs.inputs.result == 'success' }}
    uses: ./.github/workflows/phase1-pons-viability-batch-finalize.yml
    with:
      batch_head_sha: ${{ needs.inputs.outputs.batch_head_sha }}
      evidence_run_id: ${{ needs.inputs.outputs.evidence_run_id }}
    secrets: inherit
