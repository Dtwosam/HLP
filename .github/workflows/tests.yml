name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests

  residual-v4-discovery:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase1/v4-causal-history-fix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: RIVN
            token: '0xb1bf26c1d20ff267a4f93550d1e0d06ac40a114b'
            first_use: '36002595'
          - symbol: FIG
            token: '0x41f4267525a8aff329540ef24fd83d9044758b33'
            first_use: '52956726'
          - symbol: BULL
            token: '0xcef9027c7d6985b85f0ba431125073529a947a68'
            first_use: '54419647'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Exhaust direct USDG V4 Initialize history
        env:
          SYMBOL: ${{ matrix.symbol }}
          TOKEN: ${{ matrix.token }}
          FIRST_USE: ${{ matrix.first_use }}
        run: |
          python - <<'PY'
          import json
          import os

          from hlp.config import (
              DEFAULT_RPC_URL,
              ROBINHOOD_USDG,
              SOLIDRPC_PUBLIC_RPC_URL,
              UNISWAP_V4_POOL_MANAGER,
          )
          from hlp.data.quote_v4_causal_history import (
              validate_v4_usdg_causal_state_witness,
          )
          from hlp.data.quote_v4_routes import _address_topic, _record_dict
          from hlp.data.rpc import RpcClient
          from hlp.protocols.uniswap import (
              V4_INITIALIZE_TOPIC,
              decode_v4_pool_initialized,
          )

          deployment = 9_070
          symbol = os.environ["SYMBOL"]
          token = os.environ["TOKEN"].lower()
          first_use = int(os.environ["FIRST_USE"])
          target = first_use - 1
          usdg = ROBINHOOD_USDG.lower()
          manager = UNISWAP_V4_POOL_MANAGER.lower()
          currency0, currency1 = sorted(
              (token, usdg), key=lambda value: int(value, 16)
          )
          topics = [
              V4_INITIALIZE_TOPIC,
              None,
              _address_topic(currency0),
              _address_topic(currency1),
          ]

          history_rpc = RpcClient(
              DEFAULT_RPC_URL,
              timeout=30,
              attempts=5,
              min_interval_seconds=0.02,
              route_label=f"official_{symbol.lower()}_v4_initialize_exhaustion",
          )
          state_rpc = RpcClient(
              SOLIDRPC_PUBLIC_RPC_URL,
              timeout=30,
              attempts=5,
              min_interval_seconds=0.6,
              route_label=f"solidrpc_public_{symbol.lower()}_v4_causal_state",
          )
          raw_logs = list(
              history_rpc.iter_logs_chunked(
                  deployment,
                  target,
                  address=manager,
                  topics=topics,
                  chunk_size=100_000,
                  min_chunk_size=1_000,
              )
          )
          source = {
              "quote_token": token,
              "symbol": symbol,
              "quote_decimals": 18,
              "first_launch_block": first_use,
              "launches": 0,
              "versions": {},
          }
          candidates = []
          causal = []
          for raw in raw_logs:
              event = decode_v4_pool_initialized(raw)
              if {event.currency0.lower(), event.currency1.lower()} != {token, usdg}:
                  raise SystemExit(f"{symbol} Initialize currency mismatch")
              candidate = {
                  "pool_id": event.pool_id.lower(),
                  "currency0": event.currency0.lower(),
                  "currency1": event.currency1.lower(),
                  "fee": int(event.fee),
                  "tick_spacing": int(event.tick_spacing),
                  "hooks": event.hooks.lower(),
                  "initialize_block": int(event.block_number),
              }
              state = None
              error = None
              try:
                  state = validate_v4_usdg_causal_state_witness(
                      state_rpc,
                      source,
                      **candidate,
                      pool_manager=manager,
                  )
                  causal.append(state)
              except Exception as exc:
                  error = f"{type(exc).__name__}: {exc}"
              candidates.append({
                  **candidate,
                  "initialize": _record_dict(event),
                  "causal_state": state,
                  "causal_state_error": error,
              })

          result = {
              "symbol": symbol,
              "quote_token": token,
              "from_block": deployment,
              "to_block": target,
              "coverage_complete": True,
              "segment_blocks_max": 100_000,
              "initialize_events": len(candidates),
              "causal_point_states": len(causal),
              "candidates": candidates,
              "history_rpc_requests": history_rpc.requests_made,
              "state_rpc_requests": state_rpc.requests_made,
          }
          print("RESIDUAL_V4_DISCOVERY=" + json.dumps(result, sort_keys=True))
          PY
