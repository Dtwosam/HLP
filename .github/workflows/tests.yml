name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests

  focused-eligible-universe:
    uses: ./.github/workflows/phase1-pons-eligible-universe-freeze.yml
    with:
      v1_eligibility_run_id: "34480161440"
      v2_eligibility_run_id: "34900105493"
