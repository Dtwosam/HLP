name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build exact promoted-oracle liveness test patch
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/oracle-handoff
          python - <<'PY'
          from pathlib import Path

          source = Path('tests/test_workflow_liveness.py')
          lines = source.read_text().splitlines(keepends=True)
          matches = []
          for index, line in enumerate(lines):
              if (
                  line.strip() == '"33_974_681_334",'
                  and index > 0
                  and lines[index - 1].strip() == 'for run_id in ('
              ):
                  matches.append(index)
          assert len(matches) == 1, matches
          index = matches[0]
          lines[index] = lines[index].replace(
              '33_974_681_334',
              '34_765_335_793',
          )
          target = Path('/tmp/oracle-handoff/test_workflow_liveness.py')
          target.write_text(''.join(lines))
          PY
      - name: Upload exact promoted-oracle liveness test patch
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oracle-liveness-test-patch
          path: /tmp/oracle-handoff/test_workflow_liveness.py
          if-no-files-found: error
