name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests

  cancel-stale-pricing:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase1/v4-causal-history-fix' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete pricing evidence runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          api = os.environ['GITHUB_API_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          for run_id in (34885390164, 34891199864):
              request = urllib.request.Request(
                  f'{api}/repos/{repo}/actions/runs/{run_id}/cancel',
                  data=b'',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 202:
                          raise SystemExit(
                              f'cancel run {run_id} returned {response.status}'
                          )
              except urllib.error.HTTPError as exc:
                  if exc.code != 409:
                      raise
              print(f'cancel requested for stale run {run_id}')
          PY

  corrected-pricing-evidence:
    needs: cancel-stale-pricing
    if: ${{ needs.cancel-stale-pricing.result == 'success' }}
    uses: ./.github/workflows/phase1-pons-pricing-eligibility-chain.yml
    with:
      oracle_run_id: '34765335793'
      v1_v3_run_id: '34228430753'
      v2_v4_run_id: '34471480180'
      v3_fallback_run_id: '34480161440'
      v4_fallback_run_id: ''
      anchor_run_id: '33972109927'
      route_audit_run_id: '33921477647'
      delayed_probe_run_id: '33923160281'
      residual_v4_probe_run_id: '33926428274'
      source_registry_run_id: '33911022718'
      quote_audit_run_id: '33923299711'
      v2_registry_run_id: '33912235341'
      curve_run_id: '33936232604'
      transition_run_id: '33912452330'
    secrets: inherit
