name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  patch-stale-v2-contract-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/v4-causal-history-fix
      - name: Align V2 fallback liveness contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_workflow_liveness.py")
          content = path.read_text()
          replacements = {
              "    assert '\"v3_routes\": 26' in content": "    assert '\"v3_routes\": 25' in content",
              "    assert '\"v4_routes\": 4' in content": "    assert '\"v4_routes\": 5' in content",
          }
          for old, new in replacements.items():
              count = content.count(old)
              if count == 1:
                  content = content.replace(old, new, 1)
              elif count == 0 and new in content:
                  pass
              else:
                  raise SystemExit(f"unexpected assertion count for {old!r}: {count}")
          causal = "    assert '\"v4_causal_initial_assets\": 5' in content"
          anchor = "    assert '\"v4_routes\": 5' in content\n"
          if causal not in content:
              if content.count(anchor) != 1:
                  raise SystemExit("V4 route assertion anchor changed")
              content = content.replace(anchor, anchor + causal + "\n", 1)
          path.write_text(content)
          PY
          if git diff --quiet -- tests/test_workflow_liveness.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_workflow_liveness.py
          git commit -m "test: align V2 fallback liveness contract"
          git push origin HEAD:phase1/v4-causal-history-fix

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests
