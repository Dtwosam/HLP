name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build exact promoted-oracle liveness test patch
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/oracle-handoff
          python - <<'PY'
          from pathlib import Path

          source = Path('tests/test_workflow_liveness.py')
          text = source.read_text()
          old = '''    for run_id in (
              "33_974_681_334",
              "33_920_762_592",
          '''
          new = '''    for run_id in (
              "34_765_335_793",
              "33_920_762_592",
          '''
          assert old in text
          target = Path('/tmp/oracle-handoff/test_workflow_liveness.py')
          target.write_text(text.replace(old, new, 1))
          PY
      - name: Upload exact promoted-oracle liveness test patch
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oracle-liveness-test-patch
          path: /tmp/oracle-handoff/test_workflow_liveness.py
          if-no-files-found: error
