name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests

  force-cancel-stale-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel obsolete pricing evidence runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for RUN_ID in 34885390164 34891199864; do
            code=$(curl -sS -o response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel")
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then
              cat response.json
              exit 1
            fi
            echo "force-cancel ${RUN_ID}: HTTP ${code}"
          done
