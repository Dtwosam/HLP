name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests

  residual-v4-provider-probe:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase1/v4-causal-history-fix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Probe historical filtered-log range support
        run: |
          python - <<'PY'
          import json

          from hlp.config import (
              DEFAULT_RPC_URL,
              NODEFLARE_PUBLIC_RPC_URL,
              ROBINHOOD_USDG,
              SOLIDRPC_PUBLIC_RPC_URL,
              UNISWAP_V4_POOL_MANAGER,
          )
          from hlp.data.quote_v4_routes import _address_topic
          from hlp.data.rpc import RpcClient
          from hlp.protocols.uniswap import V4_INITIALIZE_TOPIC

          token = "0xb1bf26c1d20ff267a4f93550d1e0d06ac40a114b"
          currency0, currency1 = sorted(
              (token, ROBINHOOD_USDG.lower()), key=lambda value: int(value, 16)
          )
          topics = [
              V4_INITIALIZE_TOPIC,
              None,
              _address_topic(currency0),
              _address_topic(currency1),
          ]
          providers = {
              "official": DEFAULT_RPC_URL,
              "nodeflare": NODEFLARE_PUBLIC_RPC_URL,
              "solidrpc": SOLIDRPC_PUBLIC_RPC_URL,
          }
          results = {}
          for label, url in providers.items():
              rpc = RpcClient(
                  url,
                  timeout=30,
                  attempts=2,
                  min_interval_seconds=0.1,
                  route_label=f"residual_v4_provider_probe_{label}",
              )
              row = {}
              for span in (100_000, 1_000_000):
                  start = 9_070
                  end = start + span - 1
                  try:
                      logs = rpc.get_logs(
                          start,
                          end,
                          address=UNISWAP_V4_POOL_MANAGER,
                          topics=topics,
                      )
                      row[str(span)] = {
                          "ok": True,
                          "records": len(logs),
                      }
                  except Exception as exc:
                      row[str(span)] = {
                          "ok": False,
                          "error": f"{type(exc).__name__}: {exc}",
                      }
              row["requests"] = rpc.requests_made
              results[label] = row
              print("PROVIDER_PROBE=" + json.dumps({label: row}, sort_keys=True))
          print("PROVIDER_PROBE_ALL=" + json.dumps(results, sort_keys=True))
          if not any(row["100000"]["ok"] for row in results.values()):
              raise SystemExit("no approved provider supports 100k filtered log ranges")
          PY
