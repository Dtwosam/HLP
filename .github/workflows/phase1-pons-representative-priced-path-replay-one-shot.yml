name: phase1-pons-representative-priced-path-replay-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/phase1-pons-representative-priced-path-replay.json

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-representative-priced-path-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ startsWith(github.event.head_commit.message, 'launch representative priced-path replay generation ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sample_run_id: ${{ steps.validate.outputs.sample_run_id }}
      market_path_run_id: ${{ steps.validate.outputs.market_path_run_id }}
      quote_audit_run_id: ${{ steps.validate.outputs.quote_audit_run_id }}
      quote_audit_artifact_name: ${{ steps.validate.outputs.quote_audit_artifact_name }}
      anchor_run_id: ${{ steps.validate.outputs.anchor_run_id }}
      oracle_run_id: ${{ steps.validate.outputs.oracle_run_id }}
      fallback_run_id: ${{ steps.validate.outputs.fallback_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: validate
        name: Validate artifact-only priced replay launch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAUNCH_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          from hlp.data.github_actions import (
              fetch_github_actions_json,
              find_github_actions_run_artifact,
          )

          config_path = (
              ".github/"
              "phase1-pons-representative-priced-path-replay.json"
          )
          config = json.loads(Path(config_path).read_text())
          expected_keys = {
              "generation",
              "sample_run_id",
              "market_path_run_id",
              "quote_audit_run_id",
              "quote_audit_artifact_name",
              "anchor_run_id",
              "oracle_run_id",
              "fallback_run_id",
          }
          if set(config) != expected_keys:
              raise SystemExit(
                  "representative priced-path replay config schema changed: "
                  f"{sorted(config)}"
              )
          if os.environ["BRANCH"] != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "representative priced-path replay branch changed"
              )

          raw_message = str(os.environ["LAUNCH_MESSAGE"])
          message = raw_message.splitlines()[0]
          if raw_message != message:
              raise SystemExit(
                  "representative priced-path replay message must be one line"
              )
          launch = re.fullmatch(
              r"launch representative priced-path replay generation (\d+)",
              message,
          )
          if launch is None:
              raise SystemExit(
                  "representative priced-path replay requires exact generation"
              )
          requested_generation = int(launch.group(1))

          before_sha = str(os.environ["BEFORE_SHA"] or "")
          current_sha = str(os.environ["CURRENT_SHA"] or "")
          if not re.fullmatch(r"[0-9a-f]{40}", before_sha):
              raise SystemExit("priced-path replay before SHA is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", current_sha):
              raise SystemExit("priced-path replay current SHA is invalid")

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def get(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=30,
              )

          commit = get(f"/repos/{repo}/commits/{current_sha}")
          parents = list(commit.get("parents") or [])
          if (
              len(parents) != 1
              or str(parents[0].get("sha") or "") != before_sha
          ):
              raise SystemExit(
                  "priced-path replay launch must be a direct single-parent "
                  "commit"
              )
          files = list(commit.get("files") or [])
          if (
              len(files) != 1
              or str(files[0].get("filename") or "") != config_path
              or str(files[0].get("status") or "") != "modified"
          ):
              raise SystemExit(
                  "priced-path replay launch must modify exactly its config"
              )

          encoded_path = urllib.parse.quote(config_path, safe="/")
          encoded_ref = urllib.parse.quote(before_sha, safe="")
          prior_payload = get(
              f"/repos/{repo}/contents/{encoded_path}?ref={encoded_ref}"
          )
          if prior_payload.get("encoding") != "base64":
              raise SystemExit(
                  "priced-path replay prior config encoding changed"
              )
          prior = json.loads(
              base64.b64decode(prior_payload.get("content") or "")
          )
          if set(prior) != expected_keys:
              raise SystemExit(
                  "priced-path replay prior config schema changed"
              )

          generation = int(config["generation"])
          prior_generation = int(prior["generation"])
          if generation <= 0:
              raise SystemExit("priced-path replay config is not armed")
          if requested_generation != generation:
              raise SystemExit(
                  "priced-path replay launch/config generation mismatch"
              )
          if generation != prior_generation + 1:
              raise SystemExit(
                  "priced-path replay generation must increment by one"
              )

          frozen_keys = expected_keys - {"generation"}
          changed_inputs = sorted(
              key
              for key in frozen_keys
              if config[key] != prior[key]
          )
          if changed_inputs:
              raise SystemExit(
                  "priced-path replay frozen inputs changed at launch: "
                  + ", ".join(changed_inputs)
              )

          expected = {
              "sample_run_id": 35_518_892_463,
              "market_path_run_id": 35_522_831_005,
              "quote_audit_run_id": 33_923_299_711,
              "quote_audit_artifact_name": (
                  "phase1-pons-full-quote-audit-current"
              ),
              "anchor_run_id": 33_972_109_927,
              "oracle_run_id": 34_765_335_793,
              "fallback_run_id": 35_518_892_463,
          }
          if config != {"generation": generation, **expected}:
              raise SystemExit(
                  "priced-path replay frozen inputs changed"
              )

          required_artifacts = [
              (expected["sample_run_id"], "phase1-pons-representative-sample"),
              (
                  expected["market_path_run_id"],
                  "phase1-pons-representative-market-paths",
              ),
              (
                  expected["quote_audit_run_id"],
                  expected["quote_audit_artifact_name"],
              ),
              (
                  expected["anchor_run_id"],
                  "phase1-pons-weth-usdg-anchor-full",
              ),
              (
                  expected["oracle_run_id"],
                  "phase1-pons-stock-oracle-full",
              ),
              (
                  expected["fallback_run_id"],
                  "phase1-pons-quote-fallback-full",
              ),
          ]
          artifacts = []
          for run_id, artifact_name in required_artifacts:
              artifact = find_github_actions_run_artifact(
                  (
                      f"{api}/repos/{repo}/actions/runs/"
                      f"{run_id}/artifacts"
                  ),
                  token,
                  artifact_name=artifact_name,
              )
              artifacts.append({
                  "run_id": run_id,
                  "name": artifact_name,
                  "artifact_id": int(artifact["id"]),
              })

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in expected.items():
                  output.write(f"{key}={value}\n")

          print(json.dumps({
              "generation": generation,
              "replay": "artifact_only",
              "artifacts": artifacts,
              **expected,
          }, sort_keys=True))
          PY

  replay:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    uses: ./.github/workflows/phase1-pons-representative-priced-paths.yml
    with:
      sample_run_id: ${{ needs.preflight.outputs.sample_run_id }}
      market_path_run_id: ${{ needs.preflight.outputs.market_path_run_id }}
      quote_audit_run_id: ${{ needs.preflight.outputs.quote_audit_run_id }}
      quote_audit_artifact_name: ${{ needs.preflight.outputs.quote_audit_artifact_name }}
      anchor_run_id: ${{ needs.preflight.outputs.anchor_run_id }}
      oracle_run_id: ${{ needs.preflight.outputs.oracle_run_id }}
      fallback_run_id: ${{ needs.preflight.outputs.fallback_run_id }}
