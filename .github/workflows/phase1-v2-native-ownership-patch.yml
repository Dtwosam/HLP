name: phase1-v2-native-ownership-patch
# trigger-generation: 3

on:
  push:
    branches:
      - phase1/cbbtc-oracle-promotion
    paths:
      - .github/workflows/phase1-v2-native-ownership-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/cbbtc-oracle-promotion
      - name: Patch V2 quote ownership audit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/phase1-pons-v2-lifecycle-eligibility.yml')
          text = path.read_text()
          constants = '''          WETH = "0x0bd7d308f8e1639fab988df18a8011f41eacad73"\n          USDG = "0x5fc5360d0400a0fd4f2af552add042d716f1d168"'''
          replacement = constants + '''\n          ZERO_ADDRESS = "0x0000000000000000000000000000000000000000"'''
          if replacement not in text:
              if constants not in text:
                  raise SystemExit('WETH/USDG constant block not found')
              text = text.replace(constants, replacement, 1)
          old = 'covered = oracle_tokens | fallback_tokens | {WETH, USDG}'
          new = 'covered = oracle_tokens | fallback_tokens | {WETH, USDG, ZERO_ADDRESS}'
          if new not in text:
              if old not in text:
                  raise SystemExit('covered ownership expression not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          grep -n -A4 -B4 'covered = oracle_tokens' .github/workflows/phase1-pons-v2-lifecycle-eligibility.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase1-pons-v2-lifecycle-eligibility.yml
          git commit -m "account native ETH as anchor-owned quote"
          git push origin HEAD:phase1/cbbtc-oracle-promotion
