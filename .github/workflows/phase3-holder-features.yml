name: phase3-holder-features

on:
  workflow_dispatch:
    inputs:
      feature_entry_run_id:
        description: Exact phase3-feature-entry run ID
        required: true
        type: string
      expected_feature_entry_artifact_digest:
        description: Exact phase3-feature-entry artifact digest (sha256:...)
        required: true
        type: string
      expected_feature_entry_handoff_sha256:
        description: Exact SHA-256 of phase3-feature-entry-handoff.json
        required: true
        type: string
      canonical_transfer_run_id:
        description: Exact phase3-canonical-transfer-tape run ID
        required: true
        type: string
      expected_canonical_transfer_artifact_digest:
        description: Exact canonical transfer-tape artifact digest (sha256:...)
        required: true
        type: string
      expected_canonical_transfer_handoff_sha256:
        description: Exact SHA-256 of phase3-canonical-transfer-handoff.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-holder-features-${{ github.ref }}
  cancel-in-progress: false

env:
  FEATURE_ENTRY_RUN_ID: ${{ inputs.feature_entry_run_id }}
  EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST: ${{ inputs.expected_feature_entry_artifact_digest }}
  EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256: ${{ inputs.expected_feature_entry_handoff_sha256 }}
  CANONICAL_TRANSFER_RUN_ID: ${{ inputs.canonical_transfer_run_id }}
  EXPECTED_CANONICAL_TRANSFER_ARTIFACT_DIGEST: ${{ inputs.expected_canonical_transfer_artifact_digest }}
  EXPECTED_CANONICAL_TRANSFER_HANDOFF_SHA256: ${{ inputs.expected_canonical_transfer_handoff_sha256 }}

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: features
        name: Materialize causal holder/concentration features
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_feature_entry import (
              build_phase3_feature_entry_handoff,
          )
          from hlp.data.phase3_feature_registry import (
              build_phase3_feature_registry,
              validate_phase3_feature_registry,
          )
          from hlp.data.phase3_holder_features import (
              build_phase3_holder_feature_handoff,
              materialize_phase3_holder_features,
          )
          from hlp.data.phase3_transfer_tape import (
              build_phase3_canonical_transfer_handoff,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          entry_root = Path("inputs/entry")
          transfer_root = Path("inputs/transfers")
          download_named(
              int(os.environ["FEATURE_ENTRY_RUN_ID"]),
              "phase3-feature-entry",
              entry_root,
              "Phase-3 feature entry",
              os.environ["EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["CANONICAL_TRANSFER_RUN_ID"]),
              "phase3-canonical-transfer-tape",
              transfer_root,
              "Phase-3 canonical transfer tape",
              os.environ[
                  "EXPECTED_CANONICAL_TRANSFER_ARTIFACT_DIGEST"
              ],
          )

          subjects_path = find_unique(
              entry_root,
              "phase3-feature-subjects.jsonl",
          )
          subjects_manifest_path = find_unique(
              entry_root,
              "phase3-feature-subjects.jsonl.manifest.json",
          )
          subjects_manifest = json.loads(
              subjects_manifest_path.read_text()
          )
          entry_summary_path = find_unique(
              entry_root,
              "phase3-feature-entry-summary.json",
          )
          entry_summary = json.loads(entry_summary_path.read_text())
          entry_summary_sha = sha256_path(entry_summary_path)
          entry_handoff_path = find_unique(
              entry_root,
              "phase3-feature-entry-handoff.json",
          )
          entry_handoff_sha = sha256_path(entry_handoff_path)
          if entry_handoff_sha != os.environ[
              "EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-3 feature-entry handoff SHA drift")
          entry_handoff = json.loads(entry_handoff_path.read_text())
          rebuilt_entry = build_phase3_feature_entry_handoff(
              entry_summary,
              entry_summary_sha256=entry_summary_sha,
              phase2_dataset_handoff_sha256=entry_summary[
                  "phase2_dataset_handoff_sha256"
              ],
              detector_freeze_handoff_sha256=entry_summary[
                  "detector_freeze_handoff_sha256"
              ],
          )
          if rebuilt_entry != entry_handoff:
              raise SystemExit(
                  "Phase-3 feature-entry handoff content drift"
              )
          if subjects_manifest.get("sha256") != entry_handoff[
              "feature_subjects_sha256"
          ]:
              raise SystemExit("Phase-3 feature-subject manifest SHA drift")

          transfer_path = find_unique(
              transfer_root,
              "phase3-canonical-transfers.jsonl",
          )
          transfer_manifest_path = find_unique(
              transfer_root,
              "phase3-canonical-transfers.jsonl.manifest.json",
          )
          transfer_manifest = json.loads(
              transfer_manifest_path.read_text()
          )
          transfer_summary_path = find_unique(
              transfer_root,
              "phase3-canonical-transfer-summary.json",
          )
          transfer_summary = json.loads(
              transfer_summary_path.read_text()
          )
          transfer_summary_sha = sha256_path(transfer_summary_path)
          transfer_handoff_path = find_unique(
              transfer_root,
              "phase3-canonical-transfer-handoff.json",
          )
          transfer_handoff_sha = sha256_path(transfer_handoff_path)
          if transfer_handoff_sha != os.environ[
              "EXPECTED_CANONICAL_TRANSFER_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit(
                  "Phase-3 canonical-transfer handoff SHA drift"
              )
          transfer_handoff = json.loads(
              transfer_handoff_path.read_text()
          )
          rebuilt_transfer = build_phase3_canonical_transfer_handoff(
              transfer_summary,
              tape_summary_sha256=transfer_summary_sha,
              feature_entry_handoff_sha256=transfer_summary[
                  "feature_entry_handoff_sha256"
              ],
          )
          if rebuilt_transfer != transfer_handoff:
              raise SystemExit(
                  "Phase-3 canonical-transfer handoff content drift"
              )
          if transfer_manifest.get("sha256") != transfer_handoff[
              "canonical_transfer_rows_sha256"
          ]:
              raise SystemExit(
                  "Phase-3 canonical-transfer manifest SHA drift"
              )
          if int(transfer_manifest.get("records", -1)) != int(
              transfer_handoff["transfer_rows"]
          ):
              raise SystemExit(
                  "Phase-3 canonical-transfer row count drift"
              )
          if transfer_handoff["feature_entry_handoff_sha256"] != (
              entry_handoff_sha
          ):
              raise SystemExit(
                  "Phase-3 canonical-transfer/entry linkage drift"
              )
          if transfer_handoff.get(
              "transfer_coverage_complete"
          ) is not True:
              raise SystemExit(
                  "Phase-3 canonical transfer coverage incomplete"
              )
          if transfer_handoff.get(
              "initial_mint_coverage_complete"
          ) is not True:
              raise SystemExit(
                  "Phase-3 canonical transfer initial-mint coverage incomplete"
              )

          registry = build_phase3_feature_registry()
          registry_report = validate_phase3_feature_registry(registry)
          Path("artifacts/phase3-feature-registry.json").write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n"
          )
          Path(
              "artifacts/phase3-feature-registry-report.json"
          ).write_text(
              json.dumps(
                  registry_report,
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )

          output = Path(
              "artifacts/phase3-holder-features.jsonl"
          )
          manifest, summary = materialize_phase3_holder_features(
              iter_validated_jsonl(
                  subjects_path,
                  subjects_manifest_path,
              ),
              iter_validated_jsonl(
                  transfer_path,
                  transfer_manifest_path,
              ),
              entry_handoff=entry_handoff,
              transfer_handoff=transfer_handoff,
              feature_registry=registry,
              output=output,
          )
          summary.update({
              "feature_entry_run_id": int(
                  os.environ["FEATURE_ENTRY_RUN_ID"]
              ),
              "feature_entry_handoff_sha256": entry_handoff_sha,
              "canonical_transfer_run_id": int(
                  os.environ["CANONICAL_TRANSFER_RUN_ID"]
              ),
              "canonical_transfer_handoff_sha256": (
                  transfer_handoff_sha
              ),
          })
          summary_path = Path(
              "artifacts/phase3-holder-features-summary.json"
          )
          summary_text = (
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_path.write_text(summary_text)
          summary_sha = hashlib.sha256(
              summary_text.encode()
          ).hexdigest()

          handoff = build_phase3_holder_feature_handoff(
              summary,
              feature_summary_sha256=summary_sha,
              feature_entry_handoff_sha256=entry_handoff_sha,
              canonical_transfer_handoff_sha256=transfer_handoff_sha,
          )
          handoff_path = Path(
              "artifacts/phase3-holder-features-handoff.json"
          )
          handoff_text = (
              json.dumps(handoff, indent=2, sort_keys=True) + "\n"
          )
          handoff_path.write_text(handoff_text)
          handoff_sha = hashlib.sha256(
              handoff_text.encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"feature_rows_sha256={manifest['sha256']}\n"
              )
              handle.write(
                  f"registry_sha256={registry_report['registry_sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(f"handoff_sha256={handoff_sha}\n")
              handle.write(
                  f"feature_subjects={summary['feature_subjects']}\n"
              )
          print(json.dumps({
              "feature_rows_sha256": manifest["sha256"],
              "feature_registry_sha256": registry_report[
                  "registry_sha256"
              ],
              "feature_summary_sha256": summary_sha,
              "feature_handoff_sha256": handoff_sha,
              "feature_subjects": summary["feature_subjects"],
              "features_per_subject": summary["features_per_subject"],
              "transfer_coverage_complete": True,
              "initial_mint_coverage_complete": True,
              "future_transfer_rows_used": False,
              "outcome_rows_consumed": False,
              "phase3_holder_features_ready": True,
          }, sort_keys=True))
          PY

      - name: Upload Phase-3 holder features
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-holder-features
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact holder-feature handoff
        id: handoff_upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-holder-features-handoff
          path: |
            artifacts/phase3-holder-features.jsonl.manifest.json
            artifacts/phase3-holder-features-summary.json
            artifacts/phase3-holder-features-handoff.json
            artifacts/phase3-feature-registry-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish holder-feature identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_DIGEST: ${{ steps.handoff_upload.outputs.artifact-digest }}
          FEATURE_ROWS_SHA256: ${{ steps.features.outputs.feature_rows_sha256 }}
          REGISTRY_SHA256: ${{ steps.features.outputs.registry_sha256 }}
          SUMMARY_SHA256: ${{ steps.features.outputs.summary_sha256 }}
          HANDOFF_SHA256: ${{ steps.features.outputs.handoff_sha256 }}
          SUBJECTS: ${{ steps.features.outputs.feature_subjects }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${HANDOFF_ARTIFACT_DIGEST}"
          {
            echo "## Phase-3 holder/concentration features"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase3-holder-features"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- handoff_artifact_name: phase3-holder-features-handoff"
            echo "- handoff_artifact_digest: ${HANDOFF_ARTIFACT_DIGEST}"
            echo "- feature_rows_sha256: ${FEATURE_ROWS_SHA256}"
            echo "- feature_registry_sha256: ${REGISTRY_SHA256}"
            echo "- summary_sha256: ${SUMMARY_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- feature_subjects: ${SUBJECTS}"
            echo "- features_per_subject: 8"
            echo "- transfer_coverage_complete: true"
            echo "- initial_mint_coverage_complete: true"
            echo "- future_transfer_rows_used: false"
            echo "- outcome_rows_consumed: false"
            echo "- phase3_holder_features_ready: true"
          } >> "${GITHUB_STEP_SUMMARY}"
