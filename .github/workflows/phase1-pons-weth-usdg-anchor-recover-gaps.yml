name: phase1-pons-weth-usdg-anchor-recover-gaps

on:
  workflow_dispatch:
    inputs:
      preserved_run_id:
        description: "Original run containing successful anchor prefix shards"
        required: true
        default: "33912536839"
        type: string
      partial_recovery_run_id:
        description: "Finished partial anchor tail-recovery run"
        required: true
        default: "33925648293"
        type: string
      prior_gap_run_id:
        description: "Optional earlier anchor gap-recovery run whose successful gap artifacts must be reused"
        required: false
        default: ""
        type: string
      prior_gap_run_id_2:
        description: "Optional second earlier gap-recovery run to reuse after another interrupted retry"
        required: false
        default: ""
        type: string
      max_gap_blocks:
        description: "Maximum blocks per retry job"
        required: true
        default: "50000"
        type: string
  workflow_call:
    inputs:
      preserved_run_id:
        description: "Original run containing successful anchor prefix shards"
        required: true
        type: string
      partial_recovery_run_id:
        description: "Finished partial anchor tail-recovery run"
        required: true
        type: string
      prior_gap_run_id:
        description: "Optional earlier anchor gap-recovery run whose successful gap artifacts must be reused"
        required: false
        default: ""
        type: string
      prior_gap_run_id_2:
        description: "Optional second earlier gap-recovery run to reuse after another interrupted retry"
        required: false
        default: ""
        type: string
      max_gap_blocks:
        description: "Maximum blocks per retry job"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-weth-usdg-anchor-recover-gaps-${{ github.ref }}
  cancel-in-progress: false

env:
  FIRST_PONS_LAUNCH: '8621658'
  TAIL_START: '48752988'
  SNAPSHOT_HEAD: '54486035'
  WETH: '0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73'
  USDG: '0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168'
  ANCHOR_POOL: '0x52e65b17fb6e5ba00ed806f37afcd2daa50271ca'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      gap_count: ${{ steps.plan.outputs.gap_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-anchor-recovery-*
          path: partial
          merge-multiple: true
          run-id: ${{ inputs.partial_recovery_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prior_gap_run_id != '' }}
        with:
          pattern: phase1-pons-anchor-gap-*
          path: prior-gaps
          merge-multiple: true
          run-id: ${{ inputs.prior_gap_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prior_gap_run_id_2 != '' }}
        with:
          pattern: phase1-pons-anchor-gap-*
          path: prior-gaps-2
          merge-multiple: true
          run-id: ${{ inputs.prior_gap_run_id_2 }}
          github-token: ${{ github.token }}
      - id: plan
        name: Derive only missing anchor tail ranges
        env:
          MAX_GAP_BLOCKS: ${{ inputs.max_gap_blocks }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.data.ranges import plan_missing_subranges

          tail_start = int(os.environ["TAIL_START"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          max_blocks = int(os.environ["MAX_GAP_BLOCKS"])
          if not 1 <= max_blocks <= 50_000:
              raise SystemExit(
                  "max_gap_blocks must be between 1 and 50000"
              )

          manifests = (
              sorted(
                  Path("partial").glob(
                      "anchor-recovery-*.jsonl.manifest.json"
                  )
              )
              + sorted(
                  Path("prior-gaps").glob(
                      "anchor-gap-*.jsonl.manifest.json"
                  )
              )
              + sorted(
                  Path("prior-gaps-2").glob(
                      "anchor-gap-*.jsonl.manifest.json"
                  )
              )
          )
          if not manifests:
              raise SystemExit(
                  "recovery sources have no successful anchor artifacts"
              )

          covered = []
          sources = []
          for path in manifests:
              manifest = json.loads(path.read_text())
              prov = manifest["provenance"]
              lo = int(prov["from_block"])
              hi = int(prov["to_block"])
              covered.append((lo, hi))
              sources.append({
                  "source": path.parent.name,
                  "manifest": path.name,
                  "from_block": lo,
                  "to_block": hi,
                  "records": int(manifest["records"]),
                  "sha256": manifest["sha256"],
              })

          gaps = plan_missing_subranges(
              tail_start,
              head,
              covered,
              max_blocks=max_blocks,
          )
          if len(gaps) > 240:
              raise SystemExit(
                  "anchor gap plan exceeds 240 matrix jobs; recover a "
                  "bounded range first, then rerun manifest gap recovery"
              )
          include = [
              {
                  "id": f"{index:03d}",
                  "from_block": lo,
                  "to_block": hi,
              }
              for index, (lo, hi) in enumerate(gaps)
          ]
          matrix = {"include": include}
          report = {
              "tail_start": tail_start,
              "snapshot_head": head,
              "max_gap_blocks": max_blocks,
              "successful_partial_artifacts": sources,
              "gap_jobs": include,
              "gap_job_count": len(include),
              "gap_blocks": sum(
                  row["to_block"] - row["from_block"] + 1
                  for row in include
              ),
          }
          Path("artifacts/anchor-gap-plan.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  "matrix="
                  + json.dumps(matrix, separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"gap_count={len(include)}\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-anchor-gap-plan
          path: artifacts/
          if-no-files-found: error

  recover:
    needs: plan
    if: ${{ needs.plan.outputs.gap_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Acquire exact missing anchor interval
        env:
          FROM_BLOCK: ${{ matrix.from_block }}
          TO_BLOCK: ${{ matrix.to_block }}
          GAP_ID: ${{ matrix.id }}
        run: |
          mkdir -p artifacts
          if [ -n "$ROBINHOOD_ARCHIVE_RPC_API_KEY" ]; then CHUNK=50000; else CHUNK=2000; fi
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-v1-price-path \
            --token "$WETH" --quote-token "$USDG" --pool "$ANCHOR_POOL" \
            --from-block "$FROM_BLOCK" --to-block "$TO_BLOCK" \
            --chunk-size "$CHUNK" --min-chunk-size 25 \
            --out "artifacts/anchor-gap-${GAP_ID}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-anchor-gap-${{ matrix.id }}
          path: artifacts/
          if-no-files-found: error

  merge:
    needs: [plan, recover]
    if: ${{ always() && needs.plan.result == 'success' && (needs.recover.result == 'success' || needs.recover.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-anchor-*
          path: preserved
          merge-multiple: true
          run-id: ${{ inputs.preserved_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase1-pons-anchor-recovery-*
          path: partial
          merge-multiple: true
          run-id: ${{ inputs.partial_recovery_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prior_gap_run_id != '' }}
        with:
          pattern: phase1-pons-anchor-gap-*
          path: prior-gaps
          merge-multiple: true
          run-id: ${{ inputs.prior_gap_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prior_gap_run_id_2 != '' }}
        with:
          pattern: phase1-pons-anchor-gap-*
          path: prior-gaps-2
          merge-multiple: true
          run-id: ${{ inputs.prior_gap_run_id_2 }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.gap_count != '0' }}
        with:
          pattern: phase1-pons-anchor-gap-*
          path: gaps
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-anchor-gap-plan
          path: plan
      - name: Merge prefix, successful tail shards, and exact gaps
        run: |
          mkdir -p artifacts
          cp plan/anchor-gap-plan.json artifacts/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.config import SOLIDRPC_AUTH_RPC_URL, SOLIDRPC_PUBLIC_RPC_URL
          from hlp.data.reconstruct import event_order, v3_quote_price_at_block
          from hlp.data.rpc import RpcClient
          from hlp.data.snapshot import write_jsonl_snapshot

          start = int(os.environ["FIRST_PONS_LAUNCH"])
          head = int(os.environ["SNAPSHOT_HEAD"])
          files = (
              list(Path("preserved").glob("anchor-shard-*.jsonl"))
              + list(Path("partial").glob("anchor-recovery-*.jsonl"))
              + list(Path("prior-gaps").glob("anchor-gap-*.jsonl"))
              + list(Path("prior-gaps-2").glob("anchor-gap-*.jsonl"))
              + list(Path("gaps").glob("anchor-gap-*.jsonl"))
          )
          if not files:
              raise SystemExit("no anchor artifacts available for final merge")

          entries = []
          for path in files:
              manifest = json.loads(
                  path.with_suffix(path.suffix + ".manifest.json").read_text()
              )
              prov = manifest["provenance"]
              entries.append((
                  int(prov["from_block"]),
                  int(prov["to_block"]),
                  path,
                  manifest,
              ))
          entries.sort(key=lambda item: item[0])

          previous_hi = None
          expected_records = 0
          manifests = []
          for lo, hi, path, manifest in entries:
              if previous_hi is None:
                  assert lo == start, (lo, start, path.name)
              else:
                  assert lo == previous_hi + 1, (
                      previous_hi, lo, path.name
                  )
              previous_hi = hi
              expected_records += int(manifest["records"])
              manifests.append({
                  "source": path.parent.name,
                  "file": path.name,
                  "sha256": manifest["sha256"],
                  "records": int(manifest["records"]),
                  "from_block": lo,
                  "to_block": hi,
              })
          assert previous_hi == head, (previous_hi, head)

          stats = {"records": 0, "first": None, "last": None}

          def rows():
              prior = None
              for _, _, path, manifest in entries:
                  local = 0
                  with path.open() as handle:
                      for line in handle:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          order = event_order(row)
                          if prior is not None:
                              assert prior < order, (prior, order, path.name)
                          prior = order
                          if stats["first"] is None:
                              stats["first"] = row
                          stats["last"] = row
                          stats["records"] += 1
                          local += 1
                          yield row
                  assert local == int(manifest["records"]), (
                      path.name, local, manifest["records"]
                  )

          tape = write_jsonl_snapshot(
              rows(),
              output=Path("artifacts/pons-weth-usdg-anchor-full.jsonl"),
              provenance={
                  "source": "manifest_gap_aware_anchor_recovery",
                  "chain_id": 4663,
                  "snapshot_head_block": head,
                  "first_pons_launch_block": start,
                  "preserved_run_id": int(
                      "${{ inputs.preserved_run_id }}"
                  ),
                  "partial_recovery_run_id": int(
                      "${{ inputs.partial_recovery_run_id }}"
                  ),
                  "prior_gap_run_id": (
                      int("${{ inputs.prior_gap_run_id }}")
                      if "${{ inputs.prior_gap_run_id }}"
                      else None
                  ),
                  "weth": os.environ["WETH"].lower(),
                  "usdg": os.environ["USDG"].lower(),
                  "pool": os.environ["ANCHOR_POOL"].lower(),
                  "shards": manifests,
              },
          )
          assert stats["records"] == expected_records

          key = os.environ.get("ROBINHOOD_ARCHIVE_RPC_API_KEY")
          url = os.environ.get("ROBINHOOD_ARCHIVE_RPC_URL")
          if not url:
              url = SOLIDRPC_AUTH_RPC_URL if key else SOLIDRPC_PUBLIC_RPC_URL
          rpc = RpcClient(
              url,
              timeout=30,
              attempts=5,
              min_interval_seconds=0.1,
              extra_headers={"X-API-Key": key} if key else None,
          )
          rpc.assert_robinhood()
          initial = v3_quote_price_at_block(
              rpc,
              token=os.environ["WETH"],
              quote_token=os.environ["USDG"],
              pool=os.environ["ANCHOR_POOL"],
              block=start - 1,
          )
          assert initial > 0
          initial_state = {
              "block_number": start - 1,
              "weth_usd": str(initial),
              "pricing_semantics": (
                  "WETH per USDG pool spot; USDG nominal USD 1"
              ),
              "pool": os.environ["ANCHOR_POOL"].lower(),
          }
          Path(
              "artifacts/pons-weth-usdg-anchor-initial.json"
          ).write_text(
              json.dumps(initial_state, indent=2, sort_keys=True) + "\n"
          )
          report = {
              "snapshot_head_block": head,
              "state_block": start - 1,
              "initial_weth_usd": str(initial),
              "anchor_price_events": stats["records"],
              "first_event": stats["first"],
              "last_event": stats["last"],
              "tape_sha256": tape["sha256"],
              "state_rpc_requests": rpc.requests_made,
              "source_files": len(entries),
          }
          Path(
              "artifacts/pons-weth-usdg-anchor-summary.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-weth-usdg-anchor-full
          path: artifacts/
          if-no-files-found: error
