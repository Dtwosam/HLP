name: phase1-blockscout-v2-smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  blockscout-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe modern Blockscout V2 address logs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          factories = {
              "v1": "0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB",
              "v2": "0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e",
          }
          for version, address in factories.items():
              url = f"https://robinhoodchain.blockscout.com/api/v2/addresses/{address}/logs"
              req = urllib.request.Request(
                  url,
                  headers={
                      "accept": "application/json",
                      "user-agent": "HLP-Robinhood-Research/0.1",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
              payload = json.loads(raw)
              items = payload.get("items") or []
              print(json.dumps({
                  "version": version,
                  "status": 200,
                  "bytes": len(raw),
                  "items": len(items),
                  "next_page_params": payload.get("next_page_params"),
                  "sample_blocks": [row.get("block_number") for row in items[:3]],
                  "sample_topics": [(row.get("topics") or [None])[0] for row in items[:3]],
              }, sort_keys=True))
          PY
