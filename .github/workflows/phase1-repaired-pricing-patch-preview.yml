name: phase1-repaired-pricing-patch-preview

on:
  push:
    branches:
      - phase1/repaired-pricing-promotion
    paths:
      - .github/scripts/apply_repaired_pricing_promotion.py
      - .github/scripts/scope_repaired_patch_helper.py
      - .github/workflows/phase1-repaired-pricing-patch-preview.yml

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Scope temporary patch helper replacement
        run: python .github/scripts/scope_repaired_patch_helper.py
      - name: Apply bounded patch in workspace
        run: python .github/scripts/apply_repaired_pricing_promotion.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify repaired pricing workflow contract
        run: pytest -q tests/test_recovered_pricing_promotion.py tests/test_workflow_liveness.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Stage exact tested source blobs under non-workflow paths
        run: |
          mkdir -p .github/repaired-pricing-stage
          cp .github/phase1-pons-recovered-completion.json \
            .github/repaired-pricing-stage/config.json
          cp .github/workflows/phase1-pons-recovered-completion-one-shot.yml \
            .github/repaired-pricing-stage/one-shot.txt
          cp .github/workflows/phase1-pons-recovered-completion-chain.yml \
            .github/repaired-pricing-stage/chain.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/repaired-pricing-stage
          git diff --cached --check
          git commit -m "ci: stage tested repaired pricing blobs"
          git push origin HEAD:phase1/repaired-pricing-promotion
