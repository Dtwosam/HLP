name: phase1-pons-v2-curve-gap-recovery-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/workflows/phase1-pons-v2-curve-gap-recovery-one-shot.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    uses: ./.github/workflows/phase1-pons-v2-curve-recover-gaps.yml
    with:
      v2_registry_run_id: "33912235341"
      preserved_run_id: "33912593934"
      partial_recovery_run_id: "33925648297"
      max_gap_blocks: "200000"
    secrets: inherit
