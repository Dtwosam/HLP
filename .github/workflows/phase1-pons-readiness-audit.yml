name: phase1-pons-readiness-audit

on:
  workflow_dispatch:
    inputs:
      source_eligibility_run_id:
        description: "Frozen full eligibility acquisition parent"
        required: false
        default: "33982556591"
        type: string
  workflow_call:
    inputs:
      source_eligibility_run_id:
        required: false
        default: "33982556591"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-readiness-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Build Phase 1 readiness report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_eligibility_run_id }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from hlp.data.phase1_readiness import (
              VIABILITY_ROUTE_WORKFLOW_PATHS,
              build_phase1_readiness_report,
          )

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          source_run_id = int(os.environ["SOURCE_RUN_ID"])
          branch = os.environ["GITHUB_REF_NAME"]

          if source_run_id != 33_982_556_591:
              raise SystemExit(
                  "readiness audit source must remain 33982556591"
              )

          def get(path):
              request = urllib.request.Request(
                  api + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def json_file_at_ref(path, ref):
              encoded_path = urllib.parse.quote(path, safe="/")
              encoded_ref = urllib.parse.quote(ref, safe="")
              payload = get(
                  f"/repos/{repo}/contents/{encoded_path}?ref={encoded_ref}"
              )
              if payload.get("encoding") != "base64":
                  raise SystemExit(
                      f"unexpected contents encoding for {path}@{ref}"
                  )
              return json.loads(
                  base64.b64decode(payload.get("content") or "")
              )

          def artifact_names(run_id):
              names = set()
              page = 1
              while True:
                  payload = get(
                      f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                      f"?per_page=100&page={page}"
                  )
                  artifacts = list(payload.get("artifacts") or [])
                  names.update(
                      str(artifact.get("name"))
                      for artifact in artifacts
                      if not artifact.get("expired")
                  )
                  if len(artifacts) < 100:
                      break
                  page += 1
                  if page > 20:
                      raise SystemExit(
                          f"artifact pagination exceeded 2000 for run {run_id}"
                      )
              return sorted(names)

          def job_counts(run_id):
              counts = {}
              page = 1
              while True:
                  payload = get(
                      f"/repos/{repo}/actions/runs/{run_id}/jobs"
                      f"?per_page=100&page={page}"
                  )
                  jobs = list(payload.get("jobs") or [])
                  for job in jobs:
                      key = str(
                          job.get("conclusion")
                          or job.get("status")
                          or "unknown"
                      )
                      counts[key] = counts.get(key, 0) + 1
                  if len(jobs) < 100:
                      break
                  page += 1
                  if page > 10:
                      raise SystemExit(
                          f"job pagination exceeded 1000 for run {run_id}"
                      )
              return counts

          def run_payload(run_id, *, include_jobs=False):
              run = get(f"/repos/{repo}/actions/runs/{run_id}")
              payload = {
                  "id": int(run["id"]),
                  "name": run.get("name"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_branch": run.get("head_branch"),
                  "head_sha": run.get("head_sha"),
                  "path": run.get("path"),
                  "artifacts": artifact_names(run_id),
              }
              if include_jobs:
                  payload["job_counts"] = job_counts(run_id)
              return payload

          def route_run_payload(route, run_id):
              payload = run_payload(run_id)
              head_sha = str(payload.get("head_sha") or "")
              if len(head_sha) != 40:
                  raise SystemExit(
                      f"readiness viability route head SHA is invalid: {route}"
                  )
              launch_readiness = json_file_at_ref(
                  ".github/phase1-pons-viability-ready.json",
                  head_sha,
              )
              launch_ledger = json_file_at_ref(
                  ".github/phase1-pons-viability-runs.json",
                  head_sha,
              )
              payload.update(
                  {
                      "launch_readiness_generation": int(
                          launch_readiness.get("generation", 0)
                      ),
                      "launch_readiness_source_run_id": int(
                          launch_readiness.get(
                              "source_eligibility_run_id",
                              0,
                          )
                      ),
                      "launch_readiness_evidence_run_id": int(
                          launch_readiness.get("evidence_run_id", 0)
                      ),
                      "launch_ledger_generation": int(
                          launch_ledger.get("generation", 0)
                      ),
                      "launch_ledger_evidence_run_id": int(
                          launch_ledger.get("evidence_run_id", 0)
                      ),
                      "launch_route_slot": int(
                          (launch_ledger.get("routes") or {}).get(
                              route,
                              -1,
                          )
                      ),
                      "launch_ledger_routes": sorted(
                          (launch_ledger.get("routes") or {}).keys()
                      ),
                  }
              )
              return payload

          ready_config = json.loads(
              Path(".github/phase1-pons-viability-ready.json").read_text()
          )
          ledger = json.loads(
              Path(".github/phase1-pons-viability-runs.json").read_text()
          )

          configured_source = int(
              ready_config.get("source_eligibility_run_id", 0)
          )
          evidence_run_id = int(
              ready_config.get("evidence_run_id", 0)
          )
          ledger_generation = int(ledger.get("generation", 0))
          ledger_evidence_run_id = int(
              ledger.get("evidence_run_id", 0)
          )
          route_run_ids = {
              route: int((ledger.get("routes") or {}).get(route, 0))
              for route in VIABILITY_ROUTE_WORKFLOW_PATHS
          }

          source_run = run_payload(source_run_id, include_jobs=True)
          evidence_run = (
              run_payload(evidence_run_id)
              if evidence_run_id > 0
              else None
          )
          viability_runs = {
              route: (
                  route_run_payload(route, route_run_ids[route])
                  if route_run_ids[route] > 0
                  else None
              )
              for route in VIABILITY_ROUTE_WORKFLOW_PATHS
          }

          finalizer_runs = []
          if (
              evidence_run_id > 0
              and ledger_generation > 0
              and all(value > 0 for value in route_run_ids.values())
          ):
              payload = get(
                  f"/repos/{repo}/actions/runs"
                  f"?branch={urllib.parse.quote(branch)}"
                  "&per_page=100&page=1"
              )
              for run in list(payload.get("workflow_runs") or []):
                  if (
                      run.get("name")
                      != "phase1-pons-viability-ledger-finalize-one-shot"
                  ):
                      continue
                  run_id = int(run["id"])
                  finalizer_runs.append(
                      {
                          "id": run_id,
                          "name": run.get("name"),
                          "status": run.get("status"),
                          "conclusion": run.get("conclusion"),
                          "head_branch": run.get("head_branch"),
                          "head_sha": run.get("head_sha"),
                          "artifacts": (
                              artifact_names(run_id)
                              if run.get("status") == "completed"
                              else []
                          ),
                      }
                  )

          report = build_phase1_readiness_report(
              source_run=source_run,
              evidence_run=evidence_run,
              viability_runs=viability_runs,
              finalizer_runs=finalizer_runs,
              configured_source_run_id=configured_source,
              configured_evidence_run_id=evidence_run_id,
              ledger_generation=ledger_generation,
              ledger_evidence_run_id=ledger_evidence_run_id,
              ledger_route_run_ids=route_run_ids,
          )
          report.update(
              {
                  "audit_run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "audit_head_sha": os.environ["GITHUB_SHA"],
                  "audit_branch": branch,
              }
          )

          Path(
              "artifacts/phase1-readiness-report.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          completed = report.get("completed_viability_routes", [])
          pending = report.get("pending_viability_routes", [])
          with summary_path.open("a") as summary:
              summary.write("# Phase 1 readiness\n\n")
              summary.write(f"- Stage: **{report['stage']}**\n")
              summary.write(
                  f"- Next action: **{report['next_action']}**\n"
              )
              summary.write(
                  f"- Phase 1 ready: **{str(report['phase1_ready']).lower()}**\n"
              )
              summary.write(
                  f"- Completed viability routes: **{len(completed)}/9**\n"
              )
              if pending:
                  summary.write(
                      "- Pending routes: "
                      + ", ".join(pending)
                      + "\n"
                  )
              if report.get("source_job_counts"):
                  counts = report["source_job_counts"]
                  summary.write(
                      "- Source jobs: "
                      + ", ".join(
                          f"{key}={value}"
                          for key, value in sorted(counts.items())
                      )
                      + "\n"
                  )
              if report.get("source_missing_artifacts"):
                  summary.write(
                      "- Missing source artifacts: "
                      + ", ".join(report["source_missing_artifacts"])
                      + "\n"
                  )
              if report.get("invalid_viability_routes"):
                  summary.write(
                      "- Invalid viability routes: "
                      + ", ".join(
                          row["route"]
                          for row in report[
                              "invalid_viability_routes"
                          ]
                      )
                      + "\n"
                  )

          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-readiness-audit
          path: artifacts/
          if-no-files-found: error
