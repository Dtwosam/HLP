name: phase1-pons-post-eligibility-ready-replay-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/phase1-pons-post-eligibility-ready-replay.json

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-post-eligibility-ready-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ startsWith(github.event.head_commit.message, 'launch post-eligibility ready replay generation ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible_run_id: ${{ steps.validate.outputs.eligible_run_id }}
      validation_run_id: ${{ steps.validate.outputs.validation_run_id }}
      source_eligibility_run_id: ${{ steps.validate.outputs.source_eligibility_run_id }}
      v1_v3_run_id: ${{ steps.validate.outputs.v1_v3_run_id }}
      v2_v4_run_id: ${{ steps.validate.outputs.v2_v4_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: validate
        name: Validate artifact-only ready replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAUNCH_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          from hlp.data.github_actions import (
              fetch_github_actions_json,
              find_github_actions_run_artifact,
          )

          config_path = (
              ".github/phase1-pons-post-eligibility-ready-replay.json"
          )
          config = json.loads(Path(config_path).read_text())
          expected_keys = {
              "generation",
              "eligible_run_id",
              "source_eligibility_run_id",
              "v1_v3_run_id",
              "v2_v4_run_id",
              "expected_eligible_universe_sha256",
          }
          if set(config) != expected_keys:
              raise SystemExit(
                  "post-eligibility ready replay config schema changed"
              )
          if os.environ["BRANCH"] != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "post-eligibility ready replay branch changed"
              )

          raw_message = str(os.environ["LAUNCH_MESSAGE"])
          message = raw_message.splitlines()[0]
          if raw_message != message:
              raise SystemExit(
                  "post-eligibility ready replay message must be one line"
              )
          launch = re.fullmatch(
              r"launch post-eligibility ready replay generation (\d+)",
              message,
          )
          if launch is None:
              raise SystemExit(
                  "post-eligibility ready replay requires exact generation"
              )
          requested_generation = int(launch.group(1))

          before_sha = str(os.environ["BEFORE_SHA"] or "")
          current_sha = str(os.environ["CURRENT_SHA"] or "")
          if not re.fullmatch(r"[0-9a-f]{40}", before_sha):
              raise SystemExit("ready replay before SHA is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", current_sha):
              raise SystemExit("ready replay current SHA is invalid")

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def get(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=30,
              )

          commit = get(f"/repos/{repo}/commits/{current_sha}")
          parents = list(commit.get("parents") or [])
          if (
              len(parents) != 1
              or str(parents[0].get("sha") or "") != before_sha
          ):
              raise SystemExit(
                  "ready replay launch must be direct single-parent"
              )
          files = list(commit.get("files") or [])
          if (
              len(files) != 1
              or str(files[0].get("filename") or "") != config_path
              or str(files[0].get("status") or "") != "modified"
          ):
              raise SystemExit(
                  "ready replay launch must modify exactly its config"
              )

          encoded_path = urllib.parse.quote(config_path, safe="/")
          encoded_ref = urllib.parse.quote(before_sha, safe="")
          prior_payload = get(
              f"/repos/{repo}/contents/{encoded_path}?ref={encoded_ref}"
          )
          if prior_payload.get("encoding") != "base64":
              raise SystemExit("ready replay prior config encoding changed")
          prior = json.loads(
              base64.b64decode(prior_payload.get("content") or "")
          )
          if set(prior) != expected_keys:
              raise SystemExit("ready replay prior config schema changed")

          generation = int(config["generation"])
          prior_generation = int(prior["generation"])
          if generation <= 0:
              raise SystemExit("ready replay config is not armed")
          if requested_generation != generation:
              raise SystemExit(
                  "ready replay launch/config generation mismatch"
              )
          if generation != prior_generation + 1:
              raise SystemExit(
                  "ready replay generation must increment by one"
              )

          frozen_keys = expected_keys - {"generation"}
          changed = sorted(
              key
              for key in frozen_keys
              if config[key] != prior[key]
          )
          if changed:
              raise SystemExit(
                  "ready replay frozen inputs changed at launch: "
                  + ", ".join(changed)
              )

          expected = {
              "eligible_run_id": 35_518_892_463,
              "source_eligibility_run_id": 33_982_556_591,
              "v1_v3_run_id": 34_228_430_753,
              "v2_v4_run_id": 34_471_480_180,
              "expected_eligible_universe_sha256": (
                  "d5eb4ff0551eb2a0e12834b4d823dec4299d59b88eb73cef"
                  "c4aa33ad2d8b2e8d"
              ),
          }
          if config != {"generation": generation, **expected}:
              raise SystemExit("ready replay frozen inputs changed")

          find_github_actions_run_artifact(
              (
                  f"{api}/repos/{repo}/actions/runs/"
                  f"{expected['eligible_run_id']}/artifacts"
              ),
              token,
              artifact_name="phase1-pons-eligible-universe",
          )

          workflow_id = urllib.parse.quote(
              "phase1-pons-representative-validation-replay-one-shot.yml",
              safe="",
          )
          payload = get(
              f"/repos/{repo}/actions/workflows/{workflow_id}/runs"
              "?branch=phase1%2Fdata-acquisition-spike"
              "&status=success&per_page=50"
          )
          validation_run_id = None
          for run in list(payload.get("workflow_runs") or []):
              run_id = int(run["id"])
              try:
                  find_github_actions_run_artifact(
                      (
                          f"{api}/repos/{repo}/actions/runs/"
                          f"{run_id}/artifacts"
                      ),
                      token,
                      artifact_name=(
                          "phase1-pons-representative-validation"
                      ),
                  )
              except RuntimeError:
                  continue
              validation_run_id = run_id
              break
          if validation_run_id is None:
              raise SystemExit(
                  "ready replay has no successful validation replay artifact"
              )

          outputs = {
              "eligible_run_id": expected["eligible_run_id"],
              "validation_run_id": validation_run_id,
              "source_eligibility_run_id": (
                  expected["source_eligibility_run_id"]
              ),
              "v1_v3_run_id": expected["v1_v3_run_id"],
              "v2_v4_run_id": expected["v2_v4_run_id"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")

          print(json.dumps({
              "generation": generation,
              "replay": "artifact_only_post_eligibility_ready",
              **outputs,
          }, sort_keys=True))
          PY

  ready:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-eligible-universe
          path: eligible
          run-id: ${{ needs.preflight.outputs.eligible_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-representative-validation
          path: representative
          run-id: ${{ needs.preflight.outputs.validation_run_id }}
          github-token: ${{ github.token }}
      - name: Verify replayed evidence bundle and publish handoff
        env:
          ELIGIBLE_RUN_ID: ${{ needs.preflight.outputs.eligible_run_id }}
          VALIDATION_RUN_ID: ${{ needs.preflight.outputs.validation_run_id }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.source_eligibility_run_id }}
          V1_V3_RUN_ID: ${{ needs.preflight.outputs.v1_v3_run_id }}
          V2_V4_RUN_ID: ${{ needs.preflight.outputs.v2_v4_run_id }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from hlp.data.phase1_evidence import (
              validate_post_eligibility_evidence_bundle,
          )

          eligible_summary = json.loads(
              Path(
                  "eligible/pons-eligible-universe-summary.json"
              ).read_text()
          )
          eligible_manifest = json.loads(
              Path(
                  "eligible/pons-eligible-100k-universe.jsonl.manifest.json"
              ).read_text()
          )
          representative_summary = json.loads(
              Path(
                  "representative/"
                  "pons-representative-validation-summary.json"
              ).read_text()
          )
          representative_manifest = json.loads(
              Path(
                  "representative/"
                  "pons-representative-validation.jsonl.manifest.json"
              ).read_text()
          )

          expected_universe_sha = (
              "d5eb4ff0551eb2a0e12834b4d823dec4299d59b88eb73cef"
              "c4aa33ad2d8b2e8d"
          )
          if str(eligible_manifest.get("sha256") or "") != expected_universe_sha:
              raise SystemExit(
                  "ready replay eligible universe identity changed"
              )

          rep_prov = representative_manifest.get("provenance") or {}
          expected_rep = {
              "sample_run_id": 35_518_892_463,
              "v1_eligibility_run_id": 35_518_892_463,
              "v2_eligibility_run_id": 35_518_892_463,
              "v1_v3_run_id": 34_228_430_753,
              "v2_v4_run_id": 34_471_480_180,
              "transfer_run_id": 35_518_892_463,
              "market_path_run_id": 35_522_831_005,
              "priced_path_run_id": 35_523_404_472,
              "dex_crosscheck_run_id": 35_530_539_734,
              "explorer_crosscheck_run_id": 0,
              "registry_run_id": 33_911_022_718,
              "v2_curve_run_id": 33_936_232_604,
              "transition_run_id": 33_912_452_330,
              "quote_audit_run_id": 33_923_299_711,
              "anchor_run_id": 33_972_109_927,
              "oracle_run_id": 34_765_335_793,
              "fallback_run_id": 35_518_892_463,
          }
          for field, expected in expected_rep.items():
              if int(rep_prov.get(field, -1)) != expected:
                  raise SystemExit(
                      "ready replay representative provenance mismatch: "
                      f"{field}"
                  )

          validation = validate_post_eligibility_evidence_bundle(
              eligible_summary=eligible_summary,
              eligible_manifest=eligible_manifest,
              representative_summary=representative_summary,
              representative_manifest=representative_manifest,
              expected_lifecycle_run_id=int(
                  os.environ["ELIGIBLE_RUN_ID"]
              ),
              expected_v1_v3_run_id=int(
                  os.environ["V1_V3_RUN_ID"]
              ),
              expected_v2_v4_run_id=int(
                  os.environ["V2_V4_RUN_ID"]
              ),
          )
          validation_run_id = int(os.environ["VALIDATION_RUN_ID"])
          report = {
              **validation,
              "recovery_mode": True,
              "source_eligibility_run_id": int(
                  os.environ["SOURCE_RUN_ID"]
              ),
              "eligible_run_id": int(os.environ["ELIGIBLE_RUN_ID"]),
              "validation_run_id": validation_run_id,
              "evidence_run_id": validation_run_id,
              "ready_replay_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "eligible_universe_artifact": (
                  "phase1-pons-eligible-universe"
              ),
              "representative_artifact": (
                  "phase1-pons-representative-validation"
              ),
          }
          Path(
              "artifacts/phase1-post-eligibility-evidence-ready.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-post-eligibility-evidence-ready
          path: artifacts/
          if-no-files-found: error
