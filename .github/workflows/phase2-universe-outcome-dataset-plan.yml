name: phase2-universe-outcome-dataset-plan

on:
  workflow_dispatch:
    inputs:
      universe_completion_run_id:
        description: Exact successful phase2-universe-freeze-completion run ID
        required: true
        type: string
      expected_universe_completion_artifact_digest:
        description: Exact frozen-universe completion artifact digest (sha256:...)
        required: true
        type: string
      outcome_completion_run_id:
        description: Exact successful phase2-outcome-labels-completion run ID
        required: true
        type: string
      expected_outcome_completion_artifact_digest:
        description: Exact outcome-label completion artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      UNIVERSE_COMPLETION_RUN: ${{ inputs.universe_completion_run_id }}
      UNIVERSE_COMPLETION_DIGEST: ${{ inputs.expected_universe_completion_artifact_digest }}
      OUTCOME_COMPLETION_RUN: ${{ inputs.outcome_completion_run_id }}
      OUTCOME_COMPLETION_DIGEST: ${{ inputs.expected_outcome_completion_artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: plan
        name: Bind final Phase-2 checkpoint inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts upstream
          python - <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          from hlp.data.phase2_dataset_dispatch import build_phase2_dataset_dispatch_plan,validate_phase2_dataset_dispatch_plan
          from hlp.data.phase2_outcome_dispatch import validate_phase2_outcome_label_completion_receipt
          from hlp.data.phase2_universe_freeze_dispatch import validate_phase2_universe_freeze_completion_receipt
          repo=os.environ["GITHUB_REPOSITORY"]; branch=os.environ["GITHUB_REF_NAME"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip().lower()
          def api(path): return json.loads(subprocess.check_output(["gh","api","-H","Accept: application/vnd.github+json",f"/repos/{repo}/{path}"]))
          def fetch(run_id,workflow,name,digest,filename,dest,validator):
              row=api(f"actions/runs/{run_id}")
              if row.get("path")!=f".github/workflows/{workflow}" or row.get("head_branch")!=branch or str(row.get("head_sha") or "").lower()!=head or row.get("status")!="completed" or row.get("conclusion")!="success": raise SystemExit(f"{workflow} identity/status drift")
              rows=api(f"actions/runs/{run_id}/artifacts?name={name}").get("artifacts",[]); rows=[x for x in rows if x.get("name")==name and not x.get("expired")]
              if len(rows)!=1: raise SystemExit(f"{name} artifact cardinality drift")
              if str(rows[0].get("digest") or "").lower()!=digest.lower(): raise SystemExit(f"{name} artifact digest drift")
              root=Path(dest)
              if root.exists(): shutil.rmtree(root)
              root.mkdir(parents=True)
              subprocess.check_call(["gh","run","download",str(run_id),"--repo",repo,"--name",name,"--dir",str(root)])
              return validator(json.loads((root/filename).read_text()))
          universe_run=int(os.environ["UNIVERSE_COMPLETION_RUN"])
          outcome_run=int(os.environ["OUTCOME_COMPLETION_RUN"])
          universe=fetch(universe_run,"phase2-universe-freeze-completion.yml","phase2-universe-freeze-completion",os.environ["UNIVERSE_COMPLETION_DIGEST"],"phase2-universe-freeze-completion-receipt.json","upstream/universe",validate_phase2_universe_freeze_completion_receipt)
          outcome=fetch(outcome_run,"phase2-outcome-labels-completion.yml","phase2-outcome-labels-completion",os.environ["OUTCOME_COMPLETION_DIGEST"],"phase2-outcome-labels-completion-receipt.json","upstream/outcome",validate_phase2_outcome_label_completion_receipt)
          plan=validate_phase2_dataset_dispatch_plan(build_phase2_dataset_dispatch_plan(universe,outcome))
          Path("artifacts/phase2-universe-outcome-dataset-plan.json").write_text(json.dumps(plan,indent=2,sort_keys=True)+"\n")
          PY
      - name: Upload final dataset plan
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-universe-outcome-dataset-plan
          path: artifacts/phase2-universe-outcome-dataset-plan.json
          if-no-files-found: error
          retention-days: 90
