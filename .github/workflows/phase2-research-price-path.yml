name: phase2-research-price-path

on:
  workflow_dispatch:
    inputs:
      materialization_freeze_run_id:
        description: Exact phase2-research-materialization-freeze run ID
        required: true
        type: string
      expected_materialization_artifact_digest:
        description: Exact materialization-freeze artifact digest (sha256:...)
        required: true
        type: string
      expected_bundle_sha256:
        description: Exact SHA-256 of phase2-research-materialization-bundle.json
        required: true
        type: string
      expected_materialization_handoff_sha256:
        description: Exact SHA-256 of phase2-research-materialization-handoff.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact frozen-universe artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-research-price-path-${{ github.ref }}
  cancel-in-progress: false

env:
  MATERIALIZATION_RUN_ID: ${{ inputs.materialization_freeze_run_id }}
  EXPECTED_MATERIALIZATION_ARTIFACT_DIGEST: ${{ inputs.expected_materialization_artifact_digest }}
  EXPECTED_BUNDLE_SHA256: ${{ inputs.expected_bundle_sha256 }}
  EXPECTED_MATERIALIZATION_HANDOFF_SHA256: ${{ inputs.expected_materialization_handoff_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: assemble
        name: Assemble normalized canonical research path
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import heapq
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase2_research_materialization_bundle import (
              build_phase2_research_materialization_handoff,
          )
          from hlp.data.phase2_research_paths import (
              build_phase2_research_price_path_handoff,
              materialize_phase2_research_price_path,
          )
          from hlp.data.phase2_sources import (
              build_phase2_source_inventory,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def selected_named(run_id, name, label, expected_digest=None):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if expected_digest is not None and actual != str(
                  expected_digest
              ).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              return dict(selected)

          def download_named(run_id, name, destination, label, expected_digest=None):
              selected = selected_named(
                  run_id,
                  name,
                  label,
                  expected_digest=expected_digest,
              )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repo,
                  "--name",
                  name,
                  "--dir",
                  str(destination),
              ])
              return selected

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          materialization_root = Path("inputs/materialization")
          universe_root = Path("inputs/universe")
          download_named(
              int(os.environ["MATERIALIZATION_RUN_ID"]),
              "phase2-research-materialization-freeze",
              materialization_root,
              "research materialization freeze",
              os.environ["EXPECTED_MATERIALIZATION_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "frozen universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )

          bundle_path = find_unique(
              materialization_root,
              "phase2-research-materialization-bundle.json",
          )
          bundle_sha = sha256_path(bundle_path)
          if bundle_sha != os.environ[
              "EXPECTED_BUNDLE_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("research materialization bundle SHA drift")
          bundle = json.loads(bundle_path.read_text())

          materialization_handoff_path = find_unique(
              materialization_root,
              "phase2-research-materialization-handoff.json",
          )
          materialization_handoff_sha = sha256_path(
              materialization_handoff_path
          )
          if materialization_handoff_sha != os.environ[
              "EXPECTED_MATERIALIZATION_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit(
                  "research materialization handoff SHA drift"
              )
          materialization_handoff = json.loads(
              materialization_handoff_path.read_text()
          )
          if build_phase2_research_materialization_handoff(
              bundle,
              bundle_sha256=bundle_sha,
          ) != materialization_handoff:
              raise SystemExit(
                  "research materialization handoff content drift"
              )
          if bundle.get("research_price_paths_materialized") is not True:
              raise SystemExit(
                  "research materialization bundle is not ready"
              )
          if bundle.get("phase2_dump_detector_frozen") is not False:
              raise SystemExit(
                  "price-path assembly cannot consume frozen dump detector"
              )
          if bundle.get("outcome_labels_computed") is not False:
              raise SystemExit(
                  "price-path assembly cannot consume outcome labels"
              )

          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          if sha256_path(universe_handoff_path) != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("frozen-universe handoff SHA drift")
          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_sha = sha256_path(universe_path)
          if universe_sha != bundle["eligible_universe_sha256"]:
              raise SystemExit(
                  "research path universe SHA disagrees with materialization"
              )
          universe_summary = json.loads(
              find_unique(
                  universe_root,
                  "phase2-universe-summary.json",
              ).read_text()
          )
          universe_rows = [
              json.loads(line)
              for line in universe_path.read_text().splitlines()
              if line.strip()
          ]

          def row_key(row):
              block = int(row["block_number"])
              tx = (
                  -1
                  if row.get("transaction_index") is None
                  else int(row["transaction_index"])
              )
              return (
                  block,
                  tx,
                  int(row["log_index"]),
                  str(row["token"]).lower(),
              )

          component_rows = {}
          component_provenance = {}
          for component_id, component in sorted(
              bundle["components"].items()
          ):
              run_id = int(component["run_id"])
              artifact_name = (
                  f"phase2-research-materialized-{component_id}"
              )
              root = Path("inputs/components") / component_id
              download_named(
                  run_id,
                  artifact_name,
                  root,
                  f"{component_id} materialized research data",
              )

              streams = []
              for proof in component["output_manifests"]:
                  path_name = str(proof["path"])
                  data_path = find_unique(root, path_name)
                  sidecar_path = find_unique(
                      root,
                      path_name + ".manifest.json",
                  )
                  sidecar = json.loads(sidecar_path.read_text())
                  if str(sidecar.get("sha256") or "").lower() != str(
                      proof["sha256"]
                  ).lower():
                      raise SystemExit(
                          f"{component_id}: materialized output SHA drift: "
                          f"{path_name}"
                      )
                  if int(sidecar.get("records", -1)) != int(
                      proof["records"]
                  ):
                      raise SystemExit(
                          f"{component_id}: materialized output record drift: "
                          f"{path_name}"
                      )
                  if str(
                      (sidecar.get("provenance") or {}).get(
                          "source_binding_sha256"
                      )
                      or ""
                  ).lower() != str(
                      component["source_binding_sha256"]
                  ).lower():
                      raise SystemExit(
                          f"{component_id}: materialized source binding drift"
                      )
                  streams.append(
                      iter_validated_jsonl(
                          data_path,
                          sidecar_path,
                      )
                  )

              if not streams:
                  raise SystemExit(
                      f"{component_id}: no materialized research streams"
                  )
              component_rows[component_id] = heapq.merge(
                  *streams,
                  key=row_key,
              )
              component_provenance[component_id] = component[
                  "report_sha256"
              ]

          manifest, report = materialize_phase2_research_price_path(
              component_rows,
              universe_rows=universe_rows,
              universe_summary=universe_summary,
              universe_sha256=universe_sha,
              source_inventory=build_phase2_source_inventory(),
              component_provenance_sha256=component_provenance,
              output=Path(
                  "artifacts/phase2-research-price-path.jsonl"
              ),
          )
          report.update({
              "materialization_bundle_sha256": bundle_sha,
              "materialization_handoff_sha256": (
                  materialization_handoff_sha
              ),
          })
          report_path = Path(
              "artifacts/phase2-research-price-path-report.json"
          )
          report_text = (
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          report_path.write_text(report_text)
          report_sha = hashlib.sha256(
              report_text.encode()
          ).hexdigest()

          path_handoff = build_phase2_research_price_path_handoff(
              report,
              report_sha256=report_sha,
              materialization_bundle_sha256=bundle_sha,
              materialization_handoff_sha256=(
                  materialization_handoff_sha
              ),
          )
          handoff_path = Path(
              "artifacts/phase2-research-price-path-handoff.json"
          )
          handoff_text = (
              json.dumps(path_handoff, indent=2, sort_keys=True)
              + "\n"
          )
          handoff_path.write_text(handoff_text)
          handoff_sha = hashlib.sha256(
              handoff_text.encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"price_path_sha256={manifest['sha256']}\n"
              )
              handle.write(f"report_sha256={report_sha}\n")
              handle.write(f"handoff_sha256={handoff_sha}\n")
              handle.write(
                  f"price_points={manifest['records']}\n"
              )
          print(json.dumps({
              "price_path_sha256": manifest["sha256"],
              "report_sha256": report_sha,
              "handoff_sha256": handoff_sha,
              "price_points": manifest["records"],
              "eligible_tokens": report["eligible_tokens"],
              "dump_threshold_frozen": False,
              "phase2_dump_detector_frozen": False,
              "outcome_labels_computed": False,
          }, sort_keys=True))
          PY

      - name: Upload normalized research price path
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-price-path
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact research price-path handoff
        id: handoff_upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-price-path-handoff
          path: |
            artifacts/phase2-research-price-path-report.json
            artifacts/phase2-research-price-path.jsonl.manifest.json
            artifacts/phase2-research-price-path-handoff.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish normalized-path identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_DIGEST: ${{ steps.handoff_upload.outputs.artifact-digest }}
          PRICE_PATH_SHA256: ${{ steps.assemble.outputs.price_path_sha256 }}
          REPORT_SHA256: ${{ steps.assemble.outputs.report_sha256 }}
          HANDOFF_SHA256: ${{ steps.assemble.outputs.handoff_sha256 }}
          PRICE_POINTS: ${{ steps.assemble.outputs.price_points }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${HANDOFF_ARTIFACT_DIGEST}"
          {
            echo "## Phase-2 canonical research price path"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase2-research-price-path"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- handoff_artifact_name: phase2-research-price-path-handoff"
            echo "- handoff_artifact_digest: ${HANDOFF_ARTIFACT_DIGEST}"
            echo "- price_path_sha256: ${PRICE_PATH_SHA256}"
            echo "- report_sha256: ${REPORT_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- price_points: ${PRICE_POINTS}"
            echo "- research_price_path_ready: true"
            echo "- dump_threshold_frozen: false"
            echo "- phase2_dump_detector_frozen: false"
            echo "- outcome_labels_computed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
