name: phase1-pons-pricing-eligibility-chain

on:
  workflow_dispatch:
    inputs:
      oracle_run_id:
        description: "Successful canonical phase1-pons-stock-oracle-full run"
        required: true
        type: string
      v1_v3_run_id:
        description: "Successful phase1-pons-v1-v3-full run"
        required: true
        type: string
      v2_v4_run_id:
        description: "Successful phase1-pons-v2-v4-full run"
        required: true
        type: string
      v3_fallback_run_id:
        description: "Optional completed canonical V3 fallback run to resume from"
        required: false
        default: ""
        type: string
      v4_fallback_run_id:
        description: "Validated canonical V4 fallback checkpoint to resume from"
        required: false
        default: "34754839901"
        type: string
      anchor_run_id:
        description: "Canonical recovered WETH/USDG anchor run"
        required: true
        default: "33972109927"
        type: string
      route_audit_run_id:
        description: "Frozen unpriced V3 route-audit run"
        required: true
        default: "33921477647"
        type: string
      delayed_probe_run_id:
        description: "Frozen delayed direct-USDG V3 probe run"
        required: true
        default: "33923160281"
        type: string
      residual_v4_probe_run_id:
        description: "Frozen cumulative residual V4 probe run"
        required: true
        default: "33926428274"
        type: string
      source_registry_run_id:
        description: "Recovered full Pons V1 registry run"
        required: true
        default: "33911022718"
        type: string
      quote_audit_run_id:
        description: "Frozen full-Pons quote audit run"
        required: true
        default: "33923299711"
        type: string
      v2_registry_run_id:
        description: "Frozen Pons V2 registry run"
        required: true
        default: "33912235341"
        type: string
      curve_run_id:
        description: "Canonical recovered Pons V2 curve run"
        required: true
        default: "33936232604"
        type: string
      transition_run_id:
        description: "Canonical Pons V2 transition run"
        required: true
        default: "33912452330"
        type: string
  workflow_call:
    inputs:
      oracle_run_id:
        required: true
        type: string
      v1_v3_run_id:
        required: true
        type: string
      v2_v4_run_id:
        required: true
        type: string
      v3_fallback_run_id:
        required: false
        default: ""
        type: string
      v4_fallback_run_id:
        required: false
        default: "34754839901"
        type: string
      anchor_run_id:
        required: true
        type: string
      route_audit_run_id:
        required: true
        type: string
      delayed_probe_run_id:
        required: true
        type: string
      residual_v4_probe_run_id:
        required: true
        type: string
      source_registry_run_id:
        required: true
        type: string
      quote_audit_run_id:
        required: true
        type: string
      v2_registry_run_id:
        required: true
        type: string
      curve_run_id:
        required: true
        type: string
      transition_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-pricing-eligibility-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v4_checkpoint:
    if: ${{ inputs.v4_fallback_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Validate reusable V4 fallback checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V4_FALLBACK_RUN_ID: ${{ inputs.v4_fallback_run_id }}
        run: |
          python - <<'PY'
          import os

          from hlp.data.github_actions import fetch_github_actions_json

          run_id = int(os.environ["V4_FALLBACK_RUN_ID"])
          if run_id <= 0:
              raise SystemExit("V4 fallback checkpoint run ID must be positive")
          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def get(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=30,
              )

          run = get(f"/repos/{repo}/actions/runs/{run_id}")
          if (
              run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              raise SystemExit("V4 fallback checkpoint run is not successful")
          path = str(run.get("path") or "").split("@", 1)[0]
          allowed_paths = {
              ".github/workflows/"
              "phase1-pons-v4-quote-fallback-salvage-one-shot.yml",
              ".github/workflows/"
              "phase1-pons-recovered-completion-one-shot.yml",
              ".github/workflows/"
              "phase1-pons-pricing-eligibility-chain.yml",
          }
          if path not in allowed_paths:
              raise SystemExit(
                  "V4 fallback checkpoint workflow path is not allowed: "
                  f"{path}"
              )
          if run.get("head_branch") != "phase1/data-acquisition-spike":
              raise SystemExit("V4 fallback checkpoint branch changed")

          artifact_names = set()
          page = 1
          while True:
              payload = get(
                  f"/repos/{repo}/actions/runs/{run_id}/artifacts"
                  f"?per_page=100&page={page}"
              )
              rows = list(payload.get("artifacts") or [])
              artifact_names.update(
                  str(row.get("name"))
                  for row in rows
                  if not row.get("expired")
              )
              if len(rows) < 100:
                  break
              page += 1
              if page > 10:
                  raise SystemExit(
                      "V4 fallback checkpoint artifact pagination exceeded 1000"
                  )
          required = {"phase1-pons-v4-quote-fallback-full"}
          missing = sorted(required - artifact_names)
          if missing:
              raise SystemExit(
                  "V4 fallback checkpoint is missing required artifacts: "
                  f"{missing}"
              )
          print(
              f"validated V4 fallback checkpoint run={run_id} path={path}"
          )
          PY

  v1_eligibility:
    uses: ./.github/workflows/phase1-pons-v1-lifecycle-eligibility.yml
    with:
      source_registry_run_id: ${{ inputs.source_registry_run_id }}
      v1_v3_run_id: ${{ inputs.v1_v3_run_id }}
      quote_audit_run_id: ${{ inputs.quote_audit_run_id }}
      quote_audit_artifact_name: phase1-pons-full-quote-audit-current
      anchor_run_id: ${{ inputs.anchor_run_id }}
      oracle_run_id: ${{ inputs.oracle_run_id }}
    secrets: inherit

  skhy_v3:
    if: ${{ inputs.v3_fallback_run_id == '' }}
    uses: ./.github/workflows/phase1-pons-skhy-v3-weth-segmented.yml
    with:
      route_audit_run_id: ${{ inputs.route_audit_run_id }}
      route_audit_artifact_name: phase1-pons-unpriced-v3-route-audit
      route_audit_filename: pons-unpriced-v3-route-audit.jsonl
    secrets: inherit

  skhy_v4:
    needs: skhy_v3
    if: ${{ needs.skhy_v3.outputs.completion_status == 'searched_to_snapshot_head' }}
    uses: ./.github/workflows/phase1-pons-skhy-v4-known-pool-segmented.yml
    with:
      prior_probe_run_id: ${{ inputs.residual_v4_probe_run_id }}
      prior_probe_artifact_name: phase1-pons-residual-v4-forward-probe
      prior_probe_filename: pons-residual-v4-forward-probe.jsonl
    secrets: inherit

  v3_fallback:
    needs:
      - skhy_v3
      - skhy_v4
    if: ${{ always() && inputs.v3_fallback_run_id == '' && needs.skhy_v3.result == 'success' && (needs.skhy_v3.outputs.completion_status == 'route_resolved' || (needs.skhy_v4.result == 'success' && needs.skhy_v4.outputs.route_ready == 'true')) }}
    uses: ./.github/workflows/phase1-pons-v3-quote-fallback-full.yml
    with:
      route_audit_run_id: ${{ inputs.route_audit_run_id }}
      delayed_probe_run_id: ${{ inputs.delayed_probe_run_id }}
      skhy_weth_run_id: ${{ format('{0}', github.run_id) }}
      anchor_run_id: ${{ inputs.anchor_run_id }}
    secrets: inherit

  v3_fallback_recovery:
    needs: v3_fallback
    if: ${{ always() && inputs.v3_fallback_run_id == '' && (needs.v3_fallback.result == 'failure' || needs.v3_fallback.result == 'cancelled') }}
    uses: ./.github/workflows/phase1-pons-v3-quote-fallback-recover-gaps.yml
    with:
      partial_run_id: ${{ format('{0}', github.run_id) }}
      prior_gap_run_id: ""
      max_gap_blocks: "100000"
    secrets: inherit

  v4_fallback:
    needs:
      - skhy_v3
      - skhy_v4
      - v3_fallback
      - v3_fallback_recovery
    if: ${{ always() && inputs.v4_fallback_run_id == '' && (inputs.v3_fallback_run_id != '' || ((needs.v3_fallback.result == 'success' || needs.v3_fallback_recovery.result == 'success') && (needs.skhy_v4.result == 'success' || needs.skhy_v4.result == 'skipped'))) }}
    uses: ./.github/workflows/phase1-pons-v4-quote-fallback-full.yml
    with:
      probe_run_id: ${{ inputs.residual_v4_probe_run_id }}
      probe_artifact_name: phase1-pons-residual-v4-forward-probe
      probe_filename: pons-residual-v4-forward-probe.jsonl
      v3_run_id: ${{ inputs.v3_fallback_run_id != '' && inputs.v3_fallback_run_id || format('{0}', github.run_id) }}
      skhy_v4_run_id: ${{ needs.skhy_v4.result == 'success' && format('{0}', github.run_id) || '' }}
    secrets: inherit

  v4_fallback_recovery:
    needs: v4_fallback
    if: ${{ always() && inputs.v4_fallback_run_id == '' && (needs.v4_fallback.result == 'failure' || needs.v4_fallback.result == 'cancelled') }}
    uses: ./.github/workflows/phase1-pons-v4-quote-fallback-recover-gaps.yml
    with:
      partial_run_id: ${{ format('{0}', github.run_id) }}
      prior_gap_run_id: ""
      max_gap_blocks: "100000"
    secrets: inherit

  quote_fallback:
    needs:
      - v4_checkpoint
      - v3_fallback
      - v3_fallback_recovery
      - v4_fallback
      - v4_fallback_recovery
    if: ${{ always() && (inputs.v3_fallback_run_id != '' || needs.v3_fallback.result == 'success' || needs.v3_fallback_recovery.result == 'success') && ((inputs.v4_fallback_run_id != '' && needs.v4_checkpoint.result == 'success') || (inputs.v4_fallback_run_id == '' && (needs.v4_fallback.result == 'success' || needs.v4_fallback_recovery.result == 'success'))) }}
    uses: ./.github/workflows/phase1-pons-quote-fallback-full.yml
    with:
      v3_run_id: ${{ inputs.v3_fallback_run_id != '' && inputs.v3_fallback_run_id || format('{0}', github.run_id) }}
      v4_run_id: ${{ inputs.v4_fallback_run_id != '' && inputs.v4_fallback_run_id || format('{0}', github.run_id) }}
    secrets: inherit

  v2_eligibility:
    needs: quote_fallback
    if: ${{ needs.quote_fallback.result == 'success' }}
    uses: ./.github/workflows/phase1-pons-v2-lifecycle-eligibility.yml
    with:
      v2_registry_run_id: ${{ inputs.v2_registry_run_id }}
      curve_run_id: ${{ inputs.curve_run_id }}
      transition_run_id: ${{ inputs.transition_run_id }}
      v4_run_id: ${{ inputs.v2_v4_run_id }}
      anchor_run_id: ${{ inputs.anchor_run_id }}
      oracle_run_id: ${{ inputs.oracle_run_id }}
      fallback_run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit

  eligible_universe:
    needs:
      - v1_eligibility
      - v2_eligibility
    if: ${{ needs.v1_eligibility.result == 'success' && needs.v2_eligibility.result == 'success' }}
    uses: ./.github/workflows/phase1-pons-eligible-universe-freeze.yml
    with:
      v1_eligibility_run_id: ${{ format('{0}', github.run_id) }}
      v2_eligibility_run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit
