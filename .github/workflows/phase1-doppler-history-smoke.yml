name: phase1-doppler-history-smoke

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-doppler-history-smoke.yml'
      - 'src/hlp/protocols/doppler.py'
      - 'src/hlp/config.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doppler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Characterize Doppler Airlock launches against V4
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter, defaultdict

          from hlp.config import (
              DOPPLER_AIRLOCK,
              SOLIDRPC_PUBLIC_RPC_URL,
              UNISWAP_V4_POOL_MANAGER,
          )
          from hlp.data.rpc import RpcClient
          from hlp.protocols.doppler import CREATE_TOPIC, decode_doppler_launch
          from hlp.protocols.erc20 import read_erc20_static
          from hlp.protocols.uniswap import (
              V4_INITIALIZE_TOPIC,
              decode_v4_pool_initialized,
          )

          rpc = RpcClient(
              os.environ.get("ROBINHOOD_ARCHIVE_RPC_URL", SOLIDRPC_PUBLIC_RPC_URL),
              timeout=30,
              attempts=5,
              min_interval_seconds=0.6,
              extra_headers=(
                  {"X-API-Key": os.environ["ROBINHOOD_ARCHIVE_RPC_API_KEY"]}
                  if os.environ.get("ROBINHOOD_ARCHIVE_RPC_API_KEY")
                  else None
              ),
          )
          rpc.assert_robinhood()
          head = rpc.block_number()
          first = rpc.find_first_code_block(DOPPLER_AIRLOCK, low=0, high=head)
          start = first
          end = min(head, first + 199_999)

          raw = list(rpc.iter_logs_chunked(
              start, end,
              address=DOPPLER_AIRLOCK,
              topics=[CREATE_TOPIC],
              chunk_size=2000,
              min_chunk_size=25,
          ))
          launches = [decode_doppler_launch(row) for row in raw]
          assert launches, (first, start, end)

          v4_raw = list(rpc.iter_logs_chunked(
              start, end,
              address=UNISWAP_V4_POOL_MANAGER,
              topics=[V4_INITIALIZE_TOPIC],
              chunk_size=2000,
              min_chunk_size=25,
          ))
          v4 = [decode_v4_pool_initialized(row) for row in v4_raw]

          by_pair = defaultdict(list)
          by_tx = defaultdict(list)
          for row in v4:
              pair = frozenset((row.currency0, row.currency1))
              by_pair[pair].append(row)
              by_tx[row.transaction_hash].append(row)

          matches = []
          missing = []
          ambiguous = []
          for launch in launches:
              pair = frozenset((launch.asset, launch.numeraire))
              candidates = [
                  row for row in by_pair.get(pair, [])
                  if row.block_number >= launch.block_number
              ]
              same_tx = [
                  row for row in by_tx.get(launch.transaction_hash, [])
                  if frozenset((row.currency0, row.currency1)) == pair
              ]
              chosen = same_tx if same_tx else candidates
              if not chosen:
                  missing.append(launch.asset)
                  continue
              if len(chosen) > 1:
                  ambiguous.append({
                      "asset": launch.asset,
                      "candidate_pool_ids": [row.pool_id for row in chosen[:10]],
                      "same_tx": len(same_tx),
                  })
                  continue
              row = chosen[0]
              matches.append({
                  "asset": launch.asset,
                  "numeraire": launch.numeraire,
                  "initializer": launch.initializer,
                  "pool_or_hook": launch.pool_or_hook,
                  "launch_block": launch.block_number,
                  "launch_tx": launch.transaction_hash,
                  "pool_id": row.pool_id,
                  "pool_block": row.block_number,
                  "pool_tx": row.transaction_hash,
                  "same_tx": row.transaction_hash == launch.transaction_hash,
                  "fee": row.fee,
                  "tick_spacing": row.tick_spacing,
                  "hooks": row.hooks,
                  "sqrt_price_x96": row.sqrt_price_x96,
              })

          supply_samples = []
          for launch in launches[:30]:
              static = read_erc20_static(rpc, launch.asset, block=launch.block_number)
              supply_samples.append({
                  "asset": launch.asset,
                  "decimals": static.decimals,
                  "total_supply": static.total_supply,
              })

          print(json.dumps({
              "airlock_first_code_block": first,
              "from_block": start,
              "to_block": end,
              "launches": len(launches),
              "unique_assets": len({row.asset for row in launches}),
              "numeraires": dict(Counter(row.numeraire for row in launches)),
              "initializers": dict(Counter(row.initializer for row in launches)),
              "pool_or_hook_counts": dict(Counter(row.pool_or_hook for row in launches)),
              "v4_initializes": len(v4),
              "matched_launches": len(matches),
              "same_tx_matches": sum(bool(row["same_tx"]) for row in matches),
              "missing": len(missing),
              "missing_examples": missing[:20],
              "ambiguous": ambiguous[:20],
              "match_examples": matches[:20],
              "supply_samples": supply_samples,
              "supply_shapes": sorted({
                  (row["decimals"], row["total_supply"])
                  for row in supply_samples
              }),
              "requests_made": rpc.requests_made,
          }, sort_keys=True))
          PY
