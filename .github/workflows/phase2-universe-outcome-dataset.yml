name: phase2-universe-outcome-dataset

on:
  workflow_dispatch:
    inputs:
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact frozen-universe artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      outcome_run_id:
        description: Exact phase2-outcome-labels run ID
        required: true
        type: string
      expected_outcome_artifact_digest:
        description: Exact outcome-label artifact digest (sha256:...)
        required: true
        type: string
      expected_outcome_handoff_sha256:
        description: Exact SHA-256 of phase2-outcome-labels-handoff.json
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase2-universe-outcome-dataset-${{ github.ref }}
  cancel-in-progress: false

env:
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  OUTCOME_RUN_ID: ${{ inputs.outcome_run_id }}
  EXPECTED_OUTCOME_ARTIFACT_DIGEST: ${{ inputs.expected_outcome_artifact_digest }}
  EXPECTED_OUTCOME_HANDOFF_SHA256: ${{ inputs.expected_outcome_handoff_sha256 }}

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: dataset
        name: Build immutable Phase-2 universe and outcome checkpoint
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase2_dataset import (
              build_phase2_dataset_handoff,
              materialize_phase2_dataset,
          )
          from hlp.data.phase2_outcomes import (
              build_phase2_outcome_handoff,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl

          repo = os.environ["GITHUB_REPOSITORY"]

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh",
                  "run",
                  "download",
                  str(run_id),
                  "--repo",
                  repo,
                  "--name",
                  name,
                  "--dir",
                  str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          universe_root = Path("inputs/universe")
          outcome_root = Path("inputs/outcomes")
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "frozen Phase-2 universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["OUTCOME_RUN_ID"]),
              "phase2-outcome-labels",
              outcome_root,
              "Phase-2 outcome labels",
              os.environ["EXPECTED_OUTCOME_ARTIFACT_DIGEST"],
          )

          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_manifest_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl.manifest.json",
          )
          universe_manifest = json.loads(
              universe_manifest_path.read_text()
          )
          universe_summary_path = find_unique(
              universe_root,
              "phase2-universe-summary.json",
          )
          universe_summary = json.loads(
              universe_summary_path.read_text()
          )
          universe_summary_sha = sha256_path(universe_summary_path)
          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          universe_handoff_sha = sha256_path(universe_handoff_path)
          if universe_handoff_sha != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 universe handoff SHA drift")
          universe_handoff = json.loads(
              universe_handoff_path.read_text()
          )
          if universe_handoff.get("version") != (
              "phase2-universe-freeze-handoff-v1"
          ):
              raise SystemExit("Phase-2 universe handoff version drift")
          if universe_handoff.get(
              "phase2_universe_coverage_complete"
          ) is not True:
              raise SystemExit("Phase-2 universe coverage is incomplete")
          if universe_handoff.get(
              "phase2_universe_frozen"
          ) is not True:
              raise SystemExit("Phase-2 universe is not frozen")
          if universe_summary_sha != universe_handoff[
              "universe_summary_sha256"
          ]:
              raise SystemExit("Phase-2 universe summary SHA drift")
          if universe_manifest.get("sha256") != universe_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit("Phase-2 eligible-universe manifest SHA drift")
          if sha256_path(universe_path) != universe_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit("Phase-2 eligible-universe file SHA drift")
          if int(universe_manifest.get("records", -1)) != int(
              universe_handoff["eligible_tokens"]
          ):
              raise SystemExit("Phase-2 eligible-universe count drift")

          outcome_path = find_unique(
              outcome_root,
              "phase2-outcome-labels.jsonl",
          )
          outcome_manifest_path = find_unique(
              outcome_root,
              "phase2-outcome-labels.jsonl.manifest.json",
          )
          outcome_manifest = json.loads(
              outcome_manifest_path.read_text()
          )
          outcome_summary_path = find_unique(
              outcome_root,
              "phase2-outcome-labels-summary.json",
          )
          outcome_summary = json.loads(
              outcome_summary_path.read_text()
          )
          outcome_summary_sha = sha256_path(outcome_summary_path)
          outcome_handoff_path = find_unique(
              outcome_root,
              "phase2-outcome-labels-handoff.json",
          )
          outcome_handoff_sha = sha256_path(outcome_handoff_path)
          if outcome_handoff_sha != os.environ[
              "EXPECTED_OUTCOME_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 outcome handoff SHA drift")
          outcome_handoff = json.loads(
              outcome_handoff_path.read_text()
          )
          rebuilt_outcome_handoff = build_phase2_outcome_handoff(
              outcome_summary,
              outcome_summary_sha256=outcome_summary_sha,
              detector_freeze_handoff_sha256=outcome_summary[
                  "detector_freeze_handoff_sha256"
              ],
              price_path_handoff_sha256=outcome_summary[
                  "price_path_handoff_sha256"
              ],
          )
          if rebuilt_outcome_handoff != outcome_handoff:
              raise SystemExit(
                  "Phase-2 outcome handoff content drift"
              )
          if outcome_manifest.get("sha256") != outcome_handoff[
              "outcome_rows_sha256"
          ]:
              raise SystemExit("Phase-2 outcome rows manifest SHA drift")
          if int(outcome_manifest.get("records", -1)) != int(
              outcome_handoff["tokens"]
          ):
              raise SystemExit("Phase-2 outcome row count drift")

          if universe_handoff["eligible_universe_sha256"] != (
              outcome_handoff["universe_sha256"]
          ):
              raise SystemExit(
                  "Phase-2 universe/outcome lineage drift"
              )
          if int(universe_handoff["snapshot_head_block"]) != int(
              outcome_handoff["snapshot_head_block"]
          ):
              raise SystemExit(
                  "Phase-2 universe/outcome snapshot drift"
              )

          output = Path(
              "artifacts/phase2-universe-outcome-dataset.jsonl"
          )
          manifest, summary = materialize_phase2_dataset(
              iter_validated_jsonl(
                  universe_path,
                  universe_manifest_path,
              ),
              iter_validated_jsonl(
                  outcome_path,
                  outcome_manifest_path,
              ),
              universe_summary=universe_summary,
              universe_handoff=universe_handoff,
              outcome_handoff=outcome_handoff,
              output=output,
          )
          summary.update({
              "universe_run_id": int(
                  os.environ["UNIVERSE_RUN_ID"]
              ),
              "universe_handoff_sha256": universe_handoff_sha,
              "outcome_run_id": int(
                  os.environ["OUTCOME_RUN_ID"]
              ),
              "outcome_handoff_sha256": outcome_handoff_sha,
          })
          summary_path = Path(
              "artifacts/phase2-universe-outcome-dataset-summary.json"
          )
          summary_text = (
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_path.write_text(summary_text)
          summary_sha = hashlib.sha256(
              summary_text.encode()
          ).hexdigest()

          handoff = build_phase2_dataset_handoff(
              summary,
              dataset_summary_sha256=summary_sha,
              universe_handoff_sha256=universe_handoff_sha,
              outcome_handoff_sha256=outcome_handoff_sha,
          )
          handoff_path = Path(
              "artifacts/phase2-universe-outcome-dataset-handoff.json"
          )
          handoff_text = (
              json.dumps(handoff, indent=2, sort_keys=True) + "\n"
          )
          handoff_path.write_text(handoff_text)
          handoff_sha = hashlib.sha256(
              handoff_text.encode()
          ).hexdigest()

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"dataset_rows_sha256={manifest['sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(f"handoff_sha256={handoff_sha}\n")
              handle.write(f"tokens={summary['tokens']}\n")
              handle.write(
                  f"comeback_5x_tokens={summary['comeback_5x_tokens']}\n"
              )
          print(json.dumps({
              "checkpoint_name": summary["checkpoint_name"],
              "dataset_rows_sha256": manifest["sha256"],
              "dataset_summary_sha256": summary_sha,
              "dataset_handoff_sha256": handoff_sha,
              "tokens": summary["tokens"],
              "confirmed_dump_tokens": summary[
                  "confirmed_dump_tokens"
              ],
              "comeback_5x_tokens": summary["comeback_5x_tokens"],
              "phase2_dataset_ready": True,
              "phase3_features_attached": False,
          }, sort_keys=True))
          PY

      - name: Upload final Phase-2 dataset
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-universe-outcome-dataset
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload compact Phase-2 checkpoint handoff
        id: handoff_upload
        uses: actions/upload-artifact@v4
        with:
          name: phase2-universe-outcome-dataset-handoff
          path: |
            artifacts/phase2-universe-outcome-dataset.jsonl.manifest.json
            artifacts/phase2-universe-outcome-dataset-summary.json
            artifacts/phase2-universe-outcome-dataset-handoff.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish Phase-2 checkpoint identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          HANDOFF_ARTIFACT_DIGEST: ${{ steps.handoff_upload.outputs.artifact-digest }}
          DATASET_ROWS_SHA256: ${{ steps.dataset.outputs.dataset_rows_sha256 }}
          SUMMARY_SHA256: ${{ steps.dataset.outputs.summary_sha256 }}
          HANDOFF_SHA256: ${{ steps.dataset.outputs.handoff_sha256 }}
          TOKENS: ${{ steps.dataset.outputs.tokens }}
          COMEBACK_5X: ${{ steps.dataset.outputs.comeback_5x_tokens }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_DIGEST}"
          test -n "${HANDOFF_ARTIFACT_DIGEST}"
          {
            echo "## Phase-2 universe + outcome checkpoint"
            echo
            echo "- checkpoint_name: hlp-v1-phase2-universe-labels"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase2-universe-outcome-dataset"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- handoff_artifact_name: phase2-universe-outcome-dataset-handoff"
            echo "- handoff_artifact_digest: ${HANDOFF_ARTIFACT_DIGEST}"
            echo "- dataset_rows_sha256: ${DATASET_ROWS_SHA256}"
            echo "- summary_sha256: ${SUMMARY_SHA256}"
            echo "- handoff_sha256: ${HANDOFF_SHA256}"
            echo "- tokens: ${TOKENS}"
            echo "- comeback_5x_tokens: ${COMEBACK_5X}"
            echo "- phase2_dataset_ready: true"
            echo "- phase3_features_attached: false"
          } >> "${GITHUB_STEP_SUMMARY}"
