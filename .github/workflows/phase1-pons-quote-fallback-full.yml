name: phase1-pons-quote-fallback-full

on:
  workflow_dispatch:
    inputs:
      v3_run_id:
        description: "Successful canonical 25- or 26-route phase1-pons-v3-quote-fallback-full run"
        required: true
        type: string
      v4_run_id:
        description: "Successful phase1-pons-v4-quote-fallback-full run"
        required: true
        type: string
  workflow_call:
    inputs:
      v3_run_id:
        description: "Successful canonical 25- or 26-route phase1-pons-v3-quote-fallback-full run"
        required: true
        type: string
      v4_run_id:
        description: "Successful phase1-pons-v4-quote-fallback-full run"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-quote-fallback-full-${{ github.ref }}
  cancel-in-progress: false

env:
  SNAPSHOT_HEAD: '54486035'
  SKHY_TOKEN: '0x84cab63bc87912e71ad199ff14a0ba45de68fef8'

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v3-quote-fallback-full
          path: v3
          run-id: ${{ inputs.v3_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-v4-quote-fallback-full
          path: v4
          run-id: ${{ inputs.v4_run_id }}
          github-token: ${{ github.token }}
      - name: Merge disjoint fallback sources
        run: |
          mkdir -p artifacts
          hlp pons-merge-quote-usd-tapes \
            --state v3/pons-v3-quote-fallback-initial.jsonl \
            --events v3/pons-v3-quote-fallback-updates.jsonl \
            --state v4/pons-v4-quote-fallback-initial.jsonl \
            --events v4/pons-v4-quote-fallback-updates.jsonl \
            --state-out artifacts/pons-quote-fallback-initial.jsonl \
            --out artifacts/pons-quote-fallback-updates.jsonl \
            --snapshot-head "$SNAPSHOT_HEAD"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          states = [
              json.loads(line)
              for line in Path(
                  "artifacts/pons-quote-fallback-initial.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          updates = [
              json.loads(line)
              for line in Path(
                  "artifacts/pons-quote-fallback-updates.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          state_tokens = {
              row["quote_token"].lower() for row in states
          }
          update_tokens = {
              row["quote_token"].lower() for row in updates
          }
          owned_tokens = state_tokens | update_tokens

          v3_routes = [
              json.loads(line)
              for line in Path(
                  "v3/pons-v3-quote-routes.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          v4_routes = [
              json.loads(line)
              for line in Path(
                  "v4/pons-v4-quote-routes.jsonl"
              ).read_text().splitlines()
              if line.strip()
          ]
          v3_tokens = {
              row["quote_token"].lower() for row in v3_routes
          }
          v4_tokens = {
              row["quote_token"].lower() for row in v4_routes
          }
          split = (len(v3_routes), len(v4_routes))
          if split not in {(26, 4), (25, 5)}:
              raise SystemExit(
                  "generic fallback requires exact 26/4 or 25/5 V3/V4 "
                  f"ownership, got {split[0]}/{split[1]}"
              )
          if len(v3_tokens) != len(v3_routes):
              raise SystemExit(
                  "generic fallback V3 routes contain duplicate quote ownership"
              )
          if len(v4_tokens) != len(v4_routes):
              raise SystemExit(
                  "generic fallback V4 routes contain duplicate quote ownership"
              )
          overlap = sorted(v3_tokens & v4_tokens)
          if overlap:
              raise SystemExit(
                  f"V3/V4 fallback ownership overlaps: {overlap}"
              )
          if v3_tokens | v4_tokens != owned_tokens:
              raise SystemExit(
                  "route ownership and merged quote/USD ownership disagree"
              )
          skhy = os.environ["SKHY_TOKEN"].lower()
          if (skhy in v3_tokens) == (skhy in v4_tokens):
              raise SystemExit(
                  "generic fallback requires exactly one SKHY venue owner"
              )
          if split == (26, 4) and skhy not in v3_tokens:
              raise SystemExit(
                  "26/4 generic fallback requires SKHY ownership in V3"
              )
          if split == (25, 5) and skhy not in v4_tokens:
              raise SystemExit(
                  "25/5 generic fallback requires SKHY ownership in V4"
              )
          if len(state_tokens) != 25:
              raise SystemExit(
                  "merged quote fallback must have exactly 25 causal initial "
                  f"V3 states, got {len(state_tokens)}"
              )
          if len(owned_tokens) != 30:
              raise SystemExit(
                  "merged quote fallback must own exactly 30 feedless quote "
                  f"assets, got {len(owned_tokens)}"
              )
          report = {
              "snapshot_head_block": int("${{ env.SNAPSHOT_HEAD }}"),
              "initial_state_assets": len(state_tokens),
              "update_assets": len(update_tokens),
              "owned_quote_assets": len(owned_tokens),
              "v3_routes": len(v3_routes),
              "v4_routes": len(v4_routes),
              "ownership_mode": (
                  "26_v3_4_v4" if split == (26, 4)
                  else "25_v3_5_v4"
              ),
              "skhy_owner": "v3" if skhy in v3_tokens else "v4",
              "v3_v4_overlap_assets": 0,
              "updates": len(updates),
              "v3_run_id": int("${{ inputs.v3_run_id }}"),
              "v4_run_id": int("${{ inputs.v4_run_id }}"),
          }
          Path("artifacts/pons-quote-fallback-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-quote-fallback-full
          path: artifacts/
          if-no-files-found: error
