name: phase3-pons-trade-coverage

on:
  workflow_dispatch:
    inputs:
      feature_entry_run_id:
        description: Exact phase3-feature-entry run ID
        required: true
        type: string
      expected_feature_entry_artifact_digest:
        description: Exact phase3-feature-entry artifact digest (sha256:...)
        required: true
        type: string
      expected_feature_entry_handoff_sha256:
        description: Exact SHA-256 of phase3-feature-entry-handoff.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact phase2-universe-freeze artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      research_run_id:
        description: Exact phase2-research-materialize-pons run ID
        required: true
        type: string
      expected_research_artifact_digest:
        description: Exact phase2-research-materialized-* artifact digest (sha256:...)
        required: true
        type: string
      expected_research_report_sha256:
        description: Exact SHA-256 of phase2-research-component-report.json
        required: true
        type: string
      source_id:
        description: Pons source to promote into Phase-3 trade coverage
        required: true
        type: choice
        options:
          - pons_v1
          - pons_v2

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-pons-trade-coverage-${{ inputs.source_id }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FEATURE_ENTRY_RUN_ID: ${{ inputs.feature_entry_run_id }}
  EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST: ${{ inputs.expected_feature_entry_artifact_digest }}
  EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256: ${{ inputs.expected_feature_entry_handoff_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  RESEARCH_RUN_ID: ${{ inputs.research_run_id }}
  EXPECTED_RESEARCH_ARTIFACT_DIGEST: ${{ inputs.expected_research_artifact_digest }}
  EXPECTED_RESEARCH_REPORT_SHA256: ${{ inputs.expected_research_report_sha256 }}
  SOURCE_ID: ${{ inputs.source_id }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - id: coverage
        name: Promote accepted Pons replay into Phase-3 trade coverage
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import heapq
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_feature_entry import (
              build_phase3_feature_entry_handoff,
          )
          from hlp.data.phase3_trade_adapters import (
              iter_adapt_pons_trades_to_phase3,
          )
          from hlp.data.phase3_trade_tape import (
              build_phase3_trade_source_coverage,
          )
          from hlp.data.pons_trades import (
              iter_normalized_pons_trades,
          )
          from hlp.data.sharded_tape import (
              iter_validated_jsonl,
              validate_jsonl_snapshot,
          )
          from hlp.data.snapshot import write_jsonl_snapshot

          repo = os.environ["GITHUB_REPOSITORY"]
          source_id = os.environ["SOURCE_ID"]
          if source_id not in {"pons_v1", "pons_v2"}:
              raise SystemExit(
                  f"unsupported Phase-3 Pons source: {source_id}"
              )

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          entry_root = Path("inputs/entry")
          universe_root = Path("inputs/universe")
          research_root = Path("inputs/research")
          download_named(
              int(os.environ["FEATURE_ENTRY_RUN_ID"]),
              "phase3-feature-entry",
              entry_root,
              "Phase-3 feature entry",
              os.environ["EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "Phase-2 frozen universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["RESEARCH_RUN_ID"]),
              f"phase2-research-materialized-{source_id}",
              research_root,
              f"accepted {source_id} research replay",
              os.environ["EXPECTED_RESEARCH_ARTIFACT_DIGEST"],
          )

          entry_summary_path = find_unique(
              entry_root,
              "phase3-feature-entry-summary.json",
          )
          entry_summary = json.loads(entry_summary_path.read_text())
          entry_handoff_path = find_unique(
              entry_root,
              "phase3-feature-entry-handoff.json",
          )
          entry_handoff_sha = sha256_path(entry_handoff_path)
          if entry_handoff_sha != os.environ[
              "EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-3 feature-entry handoff SHA drift")
          entry_handoff = json.loads(entry_handoff_path.read_text())
          rebuilt_entry = build_phase3_feature_entry_handoff(
              entry_summary,
              entry_summary_sha256=sha256_path(entry_summary_path),
              phase2_dataset_handoff_sha256=entry_summary[
                  "phase2_dataset_handoff_sha256"
              ],
              detector_freeze_handoff_sha256=entry_summary[
                  "detector_freeze_handoff_sha256"
              ],
          )
          if rebuilt_entry != entry_handoff:
              raise SystemExit(
                  "Phase-3 feature-entry handoff content drift"
              )

          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_manifest_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl.manifest.json",
          )
          universe_manifest = json.loads(
              universe_manifest_path.read_text()
          )
          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          universe_handoff_sha = sha256_path(universe_handoff_path)
          if universe_handoff_sha != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 universe handoff SHA drift")
          universe_handoff = json.loads(
              universe_handoff_path.read_text()
          )
          if universe_handoff.get("phase2_universe_frozen") is not True:
              raise SystemExit("Phase-2 universe is not frozen")
          if universe_handoff.get(
              "phase2_universe_coverage_complete"
          ) is not True:
              raise SystemExit("Phase-2 universe coverage incomplete")
          if universe_manifest.get("sha256") != universe_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit("Phase-2 universe manifest SHA drift")
          if entry_handoff["eligible_universe_sha256"] != (
              universe_manifest["sha256"]
          ):
              raise SystemExit(
                  "Phase-3 entry/universe SHA linkage drift"
              )
          if int(entry_handoff["snapshot_head_block"]) != int(
              universe_handoff["snapshot_head_block"]
          ):
              raise SystemExit(
                  "Phase-3 entry/universe snapshot drift"
              )

          research_report_path = find_unique(
              research_root,
              "phase2-research-component-report.json",
          )
          research_report_sha = sha256_path(research_report_path)
          if research_report_sha != os.environ[
              "EXPECTED_RESEARCH_REPORT_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit(
                  f"{source_id} research report SHA drift"
              )
          report = json.loads(research_report_path.read_text())
          if report.get("version") != (
              "phase2-pons-research-materialization-v1"
          ):
              raise SystemExit(
                  f"{source_id} research report version drift"
              )
          if report.get("source_id") != source_id:
              raise SystemExit(
                  f"{source_id} research source id drift"
              )
          if report.get("component_id") != source_id:
              raise SystemExit(
                  f"{source_id} research component id drift"
              )
          if report.get("eligible_universe_sha256") != (
              universe_manifest["sha256"]
          ):
              raise SystemExit(
                  f"{source_id} research/universe SHA drift"
              )
          for flag in (
              "full_inputs_validated",
              "eligible_token_coverage_complete",
              "accepted_lifecycle_replay_equivalent",
              "research_component_ready",
          ):
              if report.get(flag) is not True:
                  raise SystemExit(
                      f"{source_id} research report lacks {flag}"
                  )
          if report.get("outcome_labels_computed") is not False:
              raise SystemExit(
                  f"{source_id} research replay consumed outcomes"
              )
          if int(report.get("canonical_market_shards", 0)) <= 0:
              raise SystemExit(
                  f"{source_id} research replay lacks canonical market shards"
              )

          universe_rows = list(
              iter_validated_jsonl(
                  universe_path,
                  universe_manifest_path,
              )
          )
          eligible_tokens = sorted({
              str(row["token"]).lower()
              for row in universe_rows
              if source_id in set(row.get("source_ids") or [])
          })
          if len(eligible_tokens) != int(report["eligible_tokens"]):
              raise SystemExit(
                  f"{source_id} research/universe token count drift: "
                  f"{len(eligible_tokens)} != {report['eligible_tokens']}"
              )
          eligible_set = set(eligible_tokens)

          def validated_file(name):
              path = find_unique(research_root, name)
              manifest_path = find_unique(
                  research_root,
                  name + ".manifest.json",
              )
              validate_jsonl_snapshot(path, manifest_path)
              return path, manifest_path, json.loads(
                  manifest_path.read_text()
              )

          point_files = []
          if source_id == "pons_v1":
              path, manifest_path, manifest = validated_file(
                  "phase2-research-pons_v1.jsonl"
              )
              if int(manifest["records"]) != int(
                  report["materialized_records"]
              ):
                  raise SystemExit(
                      "pons_v1 research record count drift"
                  )
              if manifest["sha256"] != report["materialized_sha256"]:
                  raise SystemExit(
                      "pons_v1 research SHA drift"
                  )
              point_files.append((path, manifest_path))
          else:
              total = 0
              segment_names = {
                  "curve": "phase2-research-pons_v2-curve.jsonl",
                  "graduation_seed": (
                      "phase2-research-pons_v2-graduation-seed.jsonl"
                  ),
                  "v4": "phase2-research-pons_v2-v4.jsonl",
              }
              validated = {}
              for segment, name in segment_names.items():
                  path, manifest_path, manifest = validated_file(name)
                  expected = dict(report["segments"][segment])
                  if int(manifest["records"]) != int(
                      expected["records"]
                  ):
                      raise SystemExit(
                          f"pons_v2 {segment} record count drift"
                      )
                  if manifest["sha256"] != expected["sha256"]:
                      raise SystemExit(
                          f"pons_v2 {segment} SHA drift"
                      )
                  total += int(manifest["records"])
                  validated[segment] = (path, manifest_path)
              if total != int(report["materialized_records"]):
                  raise SystemExit(
                      "pons_v2 total research record count drift"
                  )
              point_files.extend([
                  validated["curve"],
                  validated["v4"],
              ])

          def order(row):
              tx = row.get("transaction_index")
              return (
                  int(row["block_number"]),
                  -1 if tx is None else int(tx),
                  int(row["log_index"]),
                  str(row["token"]).lower(),
              )

          def trade_stream():
              streams = [
                  iter_normalized_pons_trades(
                      iter_validated_jsonl(path, manifest_path)
                  )
                  for path, manifest_path in point_files
              ]
              if len(streams) == 1:
                  yield from streams[0]
              else:
                  yield from heapq.merge(
                      *streams,
                      key=order,
                  )

          raw_digest = hashlib.sha256()
          identity_digest = hashlib.sha256()
          raw_trade_rows = 0
          previous = None
          for row in trade_stream():
              token = str(row["token"]).lower()
              if token not in eligible_set:
                  raise SystemExit(
                      f"{source_id} normalized trade outside frozen "
                      f"membership: {token}"
                  )
              key = order(row)
              if previous is not None and key <= previous:
                  raise SystemExit(
                      f"{source_id} normalized trade tape is not "
                      "strictly chronological"
                  )
              previous = key
              raw_digest.update((
                  json.dumps(
                      row,
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  + "\n"
              ).encode())
              identity = {
                  "token": token,
                  "initiator": str(row["initiator"]).lower(),
                  "transaction_hash": str(
                      row["transaction_hash"]
                  ).lower(),
                  "block_number": int(row["block_number"]),
                  "transaction_index": row.get(
                      "transaction_index"
                  ),
                  "log_index": int(row["log_index"]),
              }
              identity_digest.update((
                  json.dumps(
                      identity,
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  + "\n"
              ).encode())
              raw_trade_rows += 1

          canonical_path = Path(
              f"artifacts/phase3-{source_id}-canonical-trades.jsonl"
          )
          canonical_manifest = write_jsonl_snapshot(
              iter_adapt_pons_trades_to_phase3(trade_stream()),
              output=canonical_path,
              provenance={
                  "version": "phase3-pons-trade-coverage-v1",
                  "source_id": source_id,
                  "eligible_universe_sha256": universe_manifest["sha256"],
                  "feature_entry_handoff_sha256": entry_handoff_sha,
                  "research_run_id": int(
                      os.environ["RESEARCH_RUN_ID"]
                  ),
                  "research_artifact_digest": os.environ[
                      "EXPECTED_RESEARCH_ARTIFACT_DIGEST"
                  ].lower(),
                  "research_report_sha256": research_report_sha,
                  "normalized_trade_tape_sha256": (
                      raw_digest.hexdigest()
                  ),
                  "wallet_identity_sha256": (
                      identity_digest.hexdigest()
                  ),
                  "wallet_identity_kind": (
                      "source_normalized_initiator"
                  ),
                  "historical_event_scan_complete": True,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )
          if int(canonical_manifest["records"]) != raw_trade_rows:
              raise SystemExit(
                  f"{source_id} adapter row count drift: "
                  f"{canonical_manifest['records']} != {raw_trade_rows}"
              )

          coverage = build_phase3_trade_source_coverage(
              source_id,
              iter_validated_jsonl(
                  canonical_path,
                  canonical_path.with_suffix(
                      canonical_path.suffix + ".manifest.json"
                  ),
              ),
              eligible_tokens=eligible_tokens,
              snapshot_head_block=int(
                  entry_handoff["snapshot_head_block"]
              ),
              market_registry_sha256=report[
                  "accepted_lifecycle_sha256"
              ],
              raw_trade_tape_sha256=raw_digest.hexdigest(),
              raw_trade_rows=raw_trade_rows,
              wallet_identity_sha256=identity_digest.hexdigest(),
              wallet_identity_kind="source_normalized_initiator",
              historical_event_scan_complete=True,
              wallet_identity_complete=True,
              canonical_trade_adapter_complete=True,
          )
          if coverage["canonical_trade_rows_sha256"] != (
              canonical_manifest["sha256"]
          ):
              raise SystemExit(
                  f"{source_id} canonical trade coverage SHA drift"
              )
          coverage_path = Path(
              f"artifacts/phase3-{source_id}-trade-coverage.jsonl"
          )
          coverage_manifest = write_jsonl_snapshot(
              [coverage],
              output=coverage_path,
              provenance={
                  "version": "phase3-pons-trade-coverage-v1",
                  "source_id": source_id,
                  "eligible_universe_sha256": universe_manifest["sha256"],
                  "feature_entry_handoff_sha256": entry_handoff_sha,
                  "research_report_sha256": research_report_sha,
                  "trade_coverage_complete": True,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              },
          )
          summary = {
              "version": "phase3-pons-trade-coverage-v1",
              "source_id": source_id,
              "snapshot_head_block": int(
                  entry_handoff["snapshot_head_block"]
              ),
              "eligible_universe_sha256": universe_manifest["sha256"],
              "eligible_tokens": len(eligible_tokens),
              "research_run_id": int(
                  os.environ["RESEARCH_RUN_ID"]
              ),
              "research_artifact_digest": os.environ[
                  "EXPECTED_RESEARCH_ARTIFACT_DIGEST"
              ].lower(),
              "research_report_sha256": research_report_sha,
              "accepted_lifecycle_sha256": report[
                  "accepted_lifecycle_sha256"
              ],
              "normalized_trade_rows": raw_trade_rows,
              "normalized_trade_tape_sha256": raw_digest.hexdigest(),
              "wallet_identity_sha256": identity_digest.hexdigest(),
              "wallet_identity_kind": "source_normalized_initiator",
              "canonical_trade_rows": int(
                  canonical_manifest["records"]
              ),
              "canonical_trade_rows_sha256": (
                  canonical_manifest["sha256"]
              ),
              "source_coverage_rows_sha256": coverage_manifest["sha256"],
              "historical_event_scan_complete": True,
              "wallet_identity_complete": True,
              "canonical_trade_adapter_complete": True,
              "trade_coverage_complete": True,
              "accepted_lifecycle_replay_equivalent": True,
              "full_inputs_validated": True,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
              "phase3_pons_trade_coverage_ready": True,
          }
          summary_path = Path(
              f"artifacts/phase3-{source_id}-trade-coverage-summary.json"
          )
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          summary_sha = sha256_path(summary_path)

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(
                  f"canonical_trade_rows_sha256="
                  f"{canonical_manifest['sha256']}\n"
              )
              handle.write(
                  f"coverage_rows_sha256={coverage_manifest['sha256']}\n"
              )
              handle.write(f"summary_sha256={summary_sha}\n")
              handle.write(
                  f"eligible_tokens={len(eligible_tokens)}\n"
              )
              handle.write(
                  f"canonical_trade_rows="
                  f"{canonical_manifest['records']}\n"
              )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload Pons Phase-3 trade coverage
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ inputs.source_id }}-trade-coverage
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish Pons trade coverage identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CANONICAL_SHA: ${{ steps.coverage.outputs.canonical_trade_rows_sha256 }}
          COVERAGE_SHA: ${{ steps.coverage.outputs.coverage_rows_sha256 }}
          SUMMARY_SHA: ${{ steps.coverage.outputs.summary_sha256 }}
          TOKENS: ${{ steps.coverage.outputs.eligible_tokens }}
          ROWS: ${{ steps.coverage.outputs.canonical_trade_rows }}
        run: |
          set -euo pipefail
          {
            echo "## Phase-3 ${SOURCE_ID} trade coverage"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase3-${SOURCE_ID}-trade-coverage"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- canonical_file: phase3-${SOURCE_ID}-canonical-trades.jsonl"
            echo "- coverage_file: phase3-${SOURCE_ID}-trade-coverage.jsonl"
            echo "- canonical_trade_rows_sha256: ${CANONICAL_SHA}"
            echo "- source_coverage_rows_sha256: ${COVERAGE_SHA}"
            echo "- summary_sha256: ${SUMMARY_SHA}"
            echo "- eligible_tokens: ${TOKENS}"
            echo "- canonical_trade_rows: ${ROWS}"
            echo "- wallet_identity_kind: source_normalized_initiator"
            echo "- historical_event_scan_complete: true"
            echo "- wallet_identity_complete: true"
            echo "- canonical_trade_adapter_complete: true"
            echo "- trade_coverage_complete: true"
            echo "- outcome_rows_consumed: false"
            echo "- future_state_allowed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
