name: phase3-pons-trade-coverage

on:
  workflow_dispatch:
    inputs:
      feature_entry_run_id:
        description: Exact phase3-feature-entry run ID
        required: true
        type: string
      expected_feature_entry_artifact_digest:
        description: Exact phase3-feature-entry artifact digest (sha256:...)
        required: true
        type: string
      expected_feature_entry_handoff_sha256:
        description: Exact SHA-256 of phase3-feature-entry-handoff.json
        required: true
        type: string
      universe_run_id:
        description: Exact phase2-universe-freeze run ID
        required: true
        type: string
      expected_universe_artifact_digest:
        description: Exact phase2-universe-freeze artifact digest (sha256:...)
        required: true
        type: string
      expected_universe_handoff_sha256:
        description: Exact SHA-256 of phase2-universe-freeze-handoff.json
        required: true
        type: string
      pons_research_artifacts_json:
        description: JSON array for pons_v1 and pons_v2 with run_id, artifact_digest, report_sha256
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-pons-trade-coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  FEATURE_ENTRY_RUN_ID: ${{ inputs.feature_entry_run_id }}
  EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST: ${{ inputs.expected_feature_entry_artifact_digest }}
  EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256: ${{ inputs.expected_feature_entry_handoff_sha256 }}
  UNIVERSE_RUN_ID: ${{ inputs.universe_run_id }}
  EXPECTED_UNIVERSE_ARTIFACT_DIGEST: ${{ inputs.expected_universe_artifact_digest }}
  EXPECTED_UNIVERSE_HANDOFF_SHA256: ${{ inputs.expected_universe_handoff_sha256 }}
  PONS_RESEARCH_ARTIFACTS_JSON: ${{ inputs.pons_research_artifacts_json }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - id: coverage
        name: Build exact Pons Phase-3 wallet-trade coverage
        run: |
          mkdir -p inputs artifacts
          python - <<'PY'
          import hashlib
          import itertools
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from hlp.data.github_actions import (
              select_equivalent_artifact_retry,
          )
          from hlp.data.phase3_feature_entry import (
              build_phase3_feature_entry_handoff,
          )
          from hlp.data.phase3_trade_adapters import (
              iter_adapt_pons_trades_to_phase3,
          )
          from hlp.data.phase3_trade_tape import (
              build_phase3_trade_source_coverage,
          )
          from hlp.data.pons_trades import (
              iter_normalized_pons_trades,
          )
          from hlp.data.sharded_tape import iter_validated_jsonl
          from hlp.data.snapshot import write_jsonl_snapshot

          repo = os.environ["GITHUB_REPOSITORY"]
          source_ids = {"pons_v1", "pons_v2"}

          def sha256_path(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def list_artifacts(run_id):
              rows = []
              page = 1
              while True:
                  raw = subprocess.check_output([
                      "gh", "api",
                      "-H", "Accept: application/vnd.github+json",
                      (
                          f"/repos/{repo}/actions/runs/{run_id}/artifacts?"
                          f"per_page=100&page={page}"
                      ),
                  ])
                  batch = json.loads(raw).get("artifacts", [])
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 30:
                      raise SystemExit(
                          f"artifact pagination exceeded 3000: run={run_id}"
                      )

          def download_named(run_id, name, destination, label, expected_digest):
              matches = [
                  row
                  for row in list_artifacts(run_id)
                  if not row.get("expired")
                  and str(row.get("name") or "") == name
              ]
              try:
                  selected = select_equivalent_artifact_retry(
                      matches,
                      label=label,
                  )
              except ValueError as exc:
                  raise SystemExit(f"{label}: {exc}") from exc
              actual = str(selected.get("digest") or "").lower()
              if actual != str(expected_digest).lower():
                  raise SystemExit(
                      f"{label} artifact digest drift: "
                      f"{actual} != {expected_digest}"
                  )
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "gh", "run", "download", str(run_id),
                  "--repo", repo,
                  "--name", name,
                  "--dir", str(destination),
              ])

          def find_unique(root, name):
              matches = sorted(
                  path
                  for path in Path(root).rglob(name)
                  if path.is_file()
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one {name} under {root}; found {len(matches)}"
                  )
              return matches[0]

          try:
              descriptors = json.loads(
                  os.environ["PONS_RESEARCH_ARTIFACTS_JSON"]
              )
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  "pons_research_artifacts_json is invalid JSON"
              ) from exc
          if not isinstance(descriptors, list) or len(descriptors) != 2:
              raise SystemExit(
                  "pons_research_artifacts_json must contain two descriptors"
              )
          by_source = {}
          for raw in descriptors:
              if not isinstance(raw, dict):
                  raise SystemExit("Pons research descriptor must be object")
              source_id = str(raw.get("source_id") or "")
              if source_id not in source_ids or source_id in by_source:
                  raise SystemExit(
                      f"Pons research source invalid/repeated: {source_id}"
                  )
              try:
                  run_id = int(raw["run_id"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"{source_id}: research run_id invalid"
                  ) from exc
              digest = str(raw.get("artifact_digest") or "").lower()
              report_sha = str(
                  raw.get("report_sha256") or ""
              ).lower().removeprefix("sha256:")
              if run_id <= 0:
                  raise SystemExit(
                      f"{source_id}: research run_id must be positive"
                  )
              if not digest.startswith("sha256:") or len(digest) != 71:
                  raise SystemExit(
                      f"{source_id}: research artifact digest invalid"
                  )
              if len(report_sha) != 64:
                  raise SystemExit(
                      f"{source_id}: research report SHA invalid"
                  )
              try:
                  int(digest.split(":", 1)[1], 16)
                  int(report_sha, 16)
              except ValueError as exc:
                  raise SystemExit(
                      f"{source_id}: research SHA identity is non-hex"
                  ) from exc
              by_source[source_id] = {
                  "run_id": run_id,
                  "artifact_digest": digest,
                  "report_sha256": report_sha,
              }
          if set(by_source) != source_ids:
              raise SystemExit("Pons research source set changed")

          entry_root = Path("inputs/entry")
          universe_root = Path("inputs/universe")
          download_named(
              int(os.environ["FEATURE_ENTRY_RUN_ID"]),
              "phase3-feature-entry",
              entry_root,
              "Phase-3 feature entry",
              os.environ["EXPECTED_FEATURE_ENTRY_ARTIFACT_DIGEST"],
          )
          download_named(
              int(os.environ["UNIVERSE_RUN_ID"]),
              "phase2-universe-freeze",
              universe_root,
              "Phase-2 frozen universe",
              os.environ["EXPECTED_UNIVERSE_ARTIFACT_DIGEST"],
          )

          entry_summary_path = find_unique(
              entry_root,
              "phase3-feature-entry-summary.json",
          )
          entry_summary = json.loads(entry_summary_path.read_text())
          entry_handoff_path = find_unique(
              entry_root,
              "phase3-feature-entry-handoff.json",
          )
          entry_handoff_sha = sha256_path(entry_handoff_path)
          if entry_handoff_sha != os.environ[
              "EXPECTED_FEATURE_ENTRY_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-3 feature-entry handoff SHA drift")
          entry_handoff = json.loads(entry_handoff_path.read_text())
          rebuilt_entry = build_phase3_feature_entry_handoff(
              entry_summary,
              entry_summary_sha256=sha256_path(entry_summary_path),
              phase2_dataset_handoff_sha256=entry_summary[
                  "phase2_dataset_handoff_sha256"
              ],
              detector_freeze_handoff_sha256=entry_summary[
                  "detector_freeze_handoff_sha256"
              ],
          )
          if rebuilt_entry != entry_handoff:
              raise SystemExit(
                  "Phase-3 feature-entry handoff content drift"
              )

          universe_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl",
          )
          universe_manifest_path = find_unique(
              universe_root,
              "phase2-eligible-universe.jsonl.manifest.json",
          )
          universe_manifest = json.loads(
              universe_manifest_path.read_text()
          )
          universe_handoff_path = find_unique(
              universe_root,
              "phase2-universe-freeze-handoff.json",
          )
          universe_handoff_sha = sha256_path(universe_handoff_path)
          if universe_handoff_sha != os.environ[
              "EXPECTED_UNIVERSE_HANDOFF_SHA256"
          ].lower().removeprefix("sha256:"):
              raise SystemExit("Phase-2 universe handoff SHA drift")
          universe_handoff = json.loads(
              universe_handoff_path.read_text()
          )
          if universe_handoff.get("phase2_universe_frozen") is not True:
              raise SystemExit("Phase-2 universe is not frozen")
          if universe_handoff.get(
              "phase2_universe_coverage_complete"
          ) is not True:
              raise SystemExit("Phase-2 universe coverage incomplete")
          if universe_manifest.get("sha256") != universe_handoff[
              "eligible_universe_sha256"
          ]:
              raise SystemExit("Phase-2 universe manifest SHA drift")
          if entry_handoff["eligible_universe_sha256"] != (
              universe_manifest["sha256"]
          ):
              raise SystemExit(
                  "Phase-3 entry/universe SHA linkage drift"
              )
          if int(entry_handoff["snapshot_head_block"]) != int(
              universe_handoff["snapshot_head_block"]
          ):
              raise SystemExit(
                  "Phase-3 entry/universe snapshot drift"
              )

          universe_rows = list(
              iter_validated_jsonl(
                  universe_path,
                  universe_manifest_path,
              )
          )
          eligible_by_source = {
              source_id: sorted({
                  str(row["token"]).lower()
                  for row in universe_rows
                  if source_id in set(row.get("source_ids") or [])
              })
              for source_id in sorted(source_ids)
          }

          summaries = []
          canonical_descriptors = []
          for source_id in sorted(source_ids):
              descriptor = by_source[source_id]
              root = Path("inputs/research") / source_id
              artifact_name = (
                  f"phase2-research-materialized-{source_id}"
              )
              download_named(
                  descriptor["run_id"],
                  artifact_name,
                  root,
                  f"Phase-2 research {source_id}",
                  descriptor["artifact_digest"],
              )
              report_path = find_unique(
                  root,
                  "phase2-research-component-report.json",
              )
              if sha256_path(report_path) != descriptor[
                  "report_sha256"
              ]:
                  raise SystemExit(
                      f"{source_id}: research report SHA drift"
                  )
              report = json.loads(report_path.read_text())
              if report.get("version") != (
                  "phase2-pons-research-materialization-v1"
              ):
                  raise SystemExit(
                      f"{source_id}: research report version drift"
                  )
              if report.get("component_id") != source_id:
                  raise SystemExit(
                      f"{source_id}: research component id drift"
                  )
              if report.get("source_id") != source_id:
                  raise SystemExit(
                      f"{source_id}: research source id drift"
                  )
              if report.get("eligible_universe_sha256") != (
                  universe_manifest["sha256"]
              ):
                  raise SystemExit(
                      f"{source_id}: research universe SHA drift"
                  )
              for flag in (
                  "full_inputs_validated",
                  "eligible_token_coverage_complete",
                  "accepted_lifecycle_replay_equivalent",
                  "research_component_ready",
              ):
                  if report.get(flag) is not True:
                      raise SystemExit(
                          f"{source_id}: research report lacks {flag}"
                      )
              for flag in (
                  "dump_threshold_frozen",
                  "outcome_labels_computed",
              ):
                  if report.get(flag) is not False:
                      raise SystemExit(
                          f"{source_id}: research report violates {flag}"
                      )
              eligible_tokens = eligible_by_source[source_id]
              if int(report.get("eligible_tokens", -1)) != len(
                  eligible_tokens
              ):
                  raise SystemExit(
                      f"{source_id}: eligible token count drift"
                  )
              if not eligible_tokens:
                  raise SystemExit(
                      f"{source_id}: frozen universe has no eligible tokens"
                  )

              if source_id == "pons_v1":
                  research_names = [
                      "phase2-research-pons_v1.jsonl",
                  ]
              else:
                  research_names = [
                      "phase2-research-pons_v2-curve.jsonl",
                      "phase2-research-pons_v2-v4.jsonl",
                  ]
              research_iters = []
              research_sha_rows = []
              research_records = 0
              for name in research_names:
                  path = find_unique(root, name)
                  manifest_path = find_unique(
                      root,
                      name + ".manifest.json",
                  )
                  manifest = json.loads(manifest_path.read_text())
                  if sha256_path(path) != manifest.get("sha256"):
                      raise SystemExit(
                          f"{source_id}: {name} SHA drift"
                      )
                  records = int(manifest.get("records", -1))
                  if records < 0:
                      raise SystemExit(
                          f"{source_id}: {name} record count invalid"
                      )
                  research_records += records
                  research_sha_rows.append({
                      "file": name,
                      "records": records,
                      "sha256": manifest["sha256"],
                  })
                  research_iters.append(
                      iter_validated_jsonl(path, manifest_path)
                  )

              research_identity = (
                  json.dumps(
                      research_sha_rows,
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  + "\n"
              ).encode()
              research_sha = hashlib.sha256(
                  research_identity
              ).hexdigest()

              normalized_path = Path(
                  f"artifacts/phase3-{source_id}-normalized-trades.jsonl"
              )
              normalized_manifest = write_jsonl_snapshot(
                  iter_normalized_pons_trades(
                      itertools.chain.from_iterable(research_iters)
                  ),
                  output=normalized_path,
                  provenance={
                      "source_id": source_id,
                      "phase2_research_report_sha256": descriptor[
                          "report_sha256"
                      ],
                      "phase2_research_tapes_sha256": research_sha,
                      "eligible_universe_sha256": universe_manifest[
                          "sha256"
                      ],
                      "wallet_identity_kind": (
                          "source_normalized_initiator"
                      ),
                      "outcome_rows_consumed": False,
                      "future_state_allowed": False,
                  },
              )
              canonical_path = Path(
                  f"artifacts/phase3-{source_id}-canonical-trades.jsonl"
              )
              normalized_manifest_path = normalized_path.with_suffix(
                  normalized_path.suffix + ".manifest.json"
              )
              canonical_manifest = write_jsonl_snapshot(
                  iter_adapt_pons_trades_to_phase3(
                      iter_validated_jsonl(
                          normalized_path,
                          normalized_manifest_path,
                      )
                  ),
                  output=canonical_path,
                  provenance={
                      "source_id": source_id,
                      "normalized_trade_rows_sha256": (
                          normalized_manifest["sha256"]
                      ),
                      "eligible_universe_sha256": universe_manifest[
                          "sha256"
                      ],
                      "wallet_identity_kind": (
                          "source_normalized_initiator"
                      ),
                      "outcome_rows_consumed": False,
                      "future_state_allowed": False,
                  },
              )

              coverage = build_phase3_trade_source_coverage(
                  source_id,
                  iter_validated_jsonl(
                      canonical_path,
                      canonical_path.with_suffix(
                          canonical_path.suffix + ".manifest.json"
                      ),
                  ),
                  eligible_tokens=eligible_tokens,
                  snapshot_head_block=int(
                      entry_handoff["snapshot_head_block"]
                  ),
                  market_registry_sha256=report[
                      "source_binding_sha256"
                  ],
                  raw_trade_tape_sha256=normalized_manifest[
                      "sha256"
                  ],
                  raw_trade_rows=int(
                      normalized_manifest["records"]
                  ),
                  wallet_identity_sha256=normalized_manifest[
                      "sha256"
                  ],
                  wallet_identity_kind=(
                      "source_normalized_initiator"
                  ),
                  historical_event_scan_complete=True,
                  wallet_identity_complete=True,
                  canonical_trade_adapter_complete=True,
              )
              if coverage["canonical_trade_rows_sha256"] != (
                  canonical_manifest["sha256"]
              ):
                  raise SystemExit(
                      f"{source_id}: canonical coverage SHA drift"
                  )
              if int(coverage["canonical_trade_rows"]) != int(
                  canonical_manifest["records"]
              ):
                  raise SystemExit(
                      f"{source_id}: canonical coverage count drift"
                  )
              coverage_path = Path(
                  f"artifacts/phase3-{source_id}-trade-coverage.jsonl"
              )
              coverage_manifest = write_jsonl_snapshot(
                  [coverage],
                  output=coverage_path,
                  provenance={
                      "source_id": source_id,
                      "feature_entry_handoff_sha256": entry_handoff_sha,
                      "universe_handoff_sha256": universe_handoff_sha,
                      "phase2_research_report_sha256": descriptor[
                          "report_sha256"
                      ],
                      "trade_coverage_complete": True,
                      "outcome_rows_consumed": False,
                      "future_state_allowed": False,
                  },
              )
              summary = {
                  "version": "phase3-pons-trade-coverage-v1",
                  "source_id": source_id,
                  "snapshot_head_block": int(
                      entry_handoff["snapshot_head_block"]
                  ),
                  "eligible_universe_sha256": universe_manifest[
                      "sha256"
                  ],
                  "eligible_tokens": len(eligible_tokens),
                  "phase2_research_run_id": descriptor["run_id"],
                  "phase2_research_artifact_digest": descriptor[
                      "artifact_digest"
                  ],
                  "phase2_research_report_sha256": descriptor[
                      "report_sha256"
                  ],
                  "phase2_research_tapes_sha256": research_sha,
                  "phase2_research_records": research_records,
                  "normalized_trade_rows": normalized_manifest[
                      "records"
                  ],
                  "normalized_trade_rows_sha256": normalized_manifest[
                      "sha256"
                  ],
                  "canonical_trade_rows": canonical_manifest[
                      "records"
                  ],
                  "canonical_trade_rows_sha256": canonical_manifest[
                      "sha256"
                  ],
                  "coverage_rows_sha256": coverage_manifest[
                      "sha256"
                  ],
                  "wallet_identity_kind": coverage[
                      "wallet_identity_kind"
                  ],
                  "historical_event_scan_complete": True,
                  "wallet_identity_complete": True,
                  "canonical_trade_adapter_complete": True,
                  "trade_coverage_complete": True,
                  "outcome_rows_consumed": False,
                  "future_state_allowed": False,
              }
              summaries.append(summary)
              canonical_descriptors.append({
                  "source_id": source_id,
                  "artifact_name": "phase3-pons-trade-coverage",
                  "canonical_file": canonical_path.name,
                  "coverage_file": coverage_path.name,
              })

          Path(
              "artifacts/phase3-pons-trade-coverage-summary.json"
          ).write_text(
              json.dumps(
                  {
                      "version": "phase3-pons-trade-coverage-v1",
                      "snapshot_head_block": int(
                          entry_handoff["snapshot_head_block"]
                      ),
                      "eligible_universe_sha256": universe_manifest[
                          "sha256"
                      ],
                      "sources": summaries,
                      "canonical_trade_descriptor_templates": (
                          canonical_descriptors
                      ),
                      "complete_sources": 2,
                      "trade_coverage_complete": True,
                      "outcome_rows_consumed": False,
                      "future_state_allowed": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )
          summary_sha = sha256_path(
              Path(
                  "artifacts/phase3-pons-trade-coverage-summary.json"
              )
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"summary_sha256={summary_sha}\n")
              for summary in summaries:
                  prefix = summary["source_id"].upper()
                  handle.write(
                      f"{summary['source_id']}_canonical_sha="
                      f"{summary['canonical_trade_rows_sha256']}\n"
                  )
                  handle.write(
                      f"{summary['source_id']}_rows="
                      f"{summary['canonical_trade_rows']}\n"
                  )
          print(json.dumps({
              "sources": [row["source_id"] for row in summaries],
              "complete_sources": 2,
              "trade_coverage_complete": True,
              "summary_sha256": summary_sha,
              "outcome_rows_consumed": False,
              "future_state_allowed": False,
          }, sort_keys=True))
          PY

      - name: Upload Pons Phase-3 trade coverage
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: phase3-pons-trade-coverage
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish Pons trade coverage identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SUMMARY_SHA: ${{ steps.coverage.outputs.summary_sha256 }}
          V1_SHA: ${{ steps.coverage.outputs.pons_v1_canonical_sha }}
          V1_ROWS: ${{ steps.coverage.outputs.pons_v1_rows }}
          V2_SHA: ${{ steps.coverage.outputs.pons_v2_canonical_sha }}
          V2_ROWS: ${{ steps.coverage.outputs.pons_v2_rows }}
        run: |
          set -euo pipefail
          {
            echo "## Phase-3 Pons trade coverage"
            echo
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- artifact_name: phase3-pons-trade-coverage"
            echo "- artifact_digest: ${ARTIFACT_DIGEST}"
            echo "- summary_sha256: ${SUMMARY_SHA}"
            echo "- pons_v1_canonical_trade_rows_sha256: ${V1_SHA}"
            echo "- pons_v1_canonical_trade_rows: ${V1_ROWS}"
            echo "- pons_v2_canonical_trade_rows_sha256: ${V2_SHA}"
            echo "- pons_v2_canonical_trade_rows: ${V2_ROWS}"
            echo "- wallet_identity_kind: source_normalized_initiator"
            echo "- complete_sources: 2"
            echo "- trade_coverage_complete: true"
            echo "- outcome_rows_consumed: false"
            echo "- future_state_allowed: false"
          } >> "${GITHUB_STEP_SUMMARY}"
