name: phase1-pons-delayed-v3-route-probe-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - '.github/workflows/phase1-pons-delayed-v3-route-probe-one-shot.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-delayed-v3-route-probe-one-shot
  cancel-in-progress: true

env:
  ROUTE_AUDIT_RUN_ID: '33921477647'
  SNAPSHOT_HEAD: '54486035'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBINHOOD_ARCHIVE_RPC_API_KEY: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: phase1-pons-unpriced-v3-route-audit
          path: audit
          run-id: ${{ env.ROUTE_AUDIT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Find first later USDG swap for residual quote assets
        run: |
          mkdir -p artifacts
          hlp --timeout 30 --attempts 5 --min-interval 0.1 \
            rpc-pons-delayed-v3-usdg-routes \
            --audit audit/pons-unpriced-v3-route-audit.jsonl \
            --to-block "$SNAPSHOT_HEAD" \
            --max-forward-blocks 100000 \
            --chunk-size 2000 --min-chunk-size 25 \
            --out artifacts/pons-delayed-v3-usdg-routes.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-pons-delayed-v3-route-probe
          path: artifacts/
          if-no-files-found: error
