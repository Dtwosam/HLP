name: phase1-pons-representative-validation-replay-one-shot

on:
  push:
    branches:
      - phase1/data-acquisition-spike
    paths:
      - .github/phase1-pons-representative-validation-replay.json

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-pons-representative-validation-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ startsWith(github.event.head_commit.message, 'launch representative validation replay generation ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sample_run_id: ${{ steps.validate.outputs.sample_run_id }}
      v1_eligibility_run_id: ${{ steps.validate.outputs.v1_eligibility_run_id }}
      v2_eligibility_run_id: ${{ steps.validate.outputs.v2_eligibility_run_id }}
      v1_v3_run_id: ${{ steps.validate.outputs.v1_v3_run_id }}
      v2_v4_run_id: ${{ steps.validate.outputs.v2_v4_run_id }}
      transfer_run_id: ${{ steps.validate.outputs.transfer_run_id }}
      market_path_run_id: ${{ steps.validate.outputs.market_path_run_id }}
      priced_path_run_id: ${{ steps.validate.outputs.priced_path_run_id }}
      dex_crosscheck_run_id: ${{ steps.validate.outputs.dex_crosscheck_run_id }}
      registry_run_id: ${{ steps.validate.outputs.registry_run_id }}
      v2_curve_run_id: ${{ steps.validate.outputs.v2_curve_run_id }}
      transition_run_id: ${{ steps.validate.outputs.transition_run_id }}
      quote_audit_run_id: ${{ steps.validate.outputs.quote_audit_run_id }}
      anchor_run_id: ${{ steps.validate.outputs.anchor_run_id }}
      oracle_run_id: ${{ steps.validate.outputs.oracle_run_id }}
      fallback_run_id: ${{ steps.validate.outputs.fallback_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: validate
        name: Validate artifact-only representative validation replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAUNCH_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          from hlp.data.github_actions import (
              fetch_github_actions_json,
              find_github_actions_run_artifact,
          )

          config_path = (
              ".github/"
              "phase1-pons-representative-validation-replay.json"
          )
          config = json.loads(Path(config_path).read_text())
          expected_keys = {
              "generation",
              "sample_run_id",
              "v1_eligibility_run_id",
              "v2_eligibility_run_id",
              "v1_v3_run_id",
              "v2_v4_run_id",
              "transfer_run_id",
              "market_path_run_id",
              "priced_path_run_id",
              "dex_crosscheck_run_id",
              "registry_run_id",
              "v2_curve_run_id",
              "transition_run_id",
              "quote_audit_run_id",
              "anchor_run_id",
              "oracle_run_id",
              "fallback_run_id",
          }
          if set(config) != expected_keys:
              raise SystemExit(
                  "representative validation replay config schema changed: "
                  f"{sorted(config)}"
              )
          if os.environ["BRANCH"] != "phase1/data-acquisition-spike":
              raise SystemExit(
                  "representative validation replay branch changed"
              )

          raw_message = str(os.environ["LAUNCH_MESSAGE"])
          message = raw_message.splitlines()[0]
          if raw_message != message:
              raise SystemExit(
                  "representative validation replay message must be one line"
              )
          launch = re.fullmatch(
              r"launch representative validation replay generation (\d+)",
              message,
          )
          if launch is None:
              raise SystemExit(
                  "representative validation replay requires exact generation"
              )
          requested_generation = int(launch.group(1))

          before_sha = str(os.environ["BEFORE_SHA"] or "")
          current_sha = str(os.environ["CURRENT_SHA"] or "")
          if not re.fullmatch(r"[0-9a-f]{40}", before_sha):
              raise SystemExit("validation replay before SHA is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", current_sha):
              raise SystemExit("validation replay current SHA is invalid")

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def get(path):
              return fetch_github_actions_json(
                  api + path,
                  token,
                  timeout=30,
              )

          commit = get(f"/repos/{repo}/commits/{current_sha}")
          parents = list(commit.get("parents") or [])
          if (
              len(parents) != 1
              or str(parents[0].get("sha") or "") != before_sha
          ):
              raise SystemExit(
                  "validation replay launch must be direct single-parent"
              )
          files = list(commit.get("files") or [])
          if (
              len(files) != 1
              or str(files[0].get("filename") or "") != config_path
              or str(files[0].get("status") or "") != "modified"
          ):
              raise SystemExit(
                  "validation replay launch must modify exactly its config"
              )

          encoded_path = urllib.parse.quote(config_path, safe="/")
          encoded_ref = urllib.parse.quote(before_sha, safe="")
          prior_payload = get(
              f"/repos/{repo}/contents/{encoded_path}?ref={encoded_ref}"
          )
          if prior_payload.get("encoding") != "base64":
              raise SystemExit(
                  "validation replay prior config encoding changed"
              )
          prior = json.loads(
              base64.b64decode(prior_payload.get("content") or "")
          )
          if set(prior) != expected_keys:
              raise SystemExit(
                  "validation replay prior config schema changed"
              )

          generation = int(config["generation"])
          prior_generation = int(prior["generation"])
          if generation <= 0:
              raise SystemExit("validation replay config is not armed")
          if requested_generation != generation:
              raise SystemExit(
                  "validation replay launch/config generation mismatch"
              )
          if generation != prior_generation + 1:
              raise SystemExit(
                  "validation replay generation must increment by one"
              )

          frozen_keys = expected_keys - {"generation"}
          changed = sorted(
              key
              for key in frozen_keys
              if config[key] != prior[key]
          )
          if changed:
              raise SystemExit(
                  "validation replay frozen inputs changed at launch: "
                  + ", ".join(changed)
              )

          expected = {
              "sample_run_id": 35_518_892_463,
              "v1_eligibility_run_id": 35_518_892_463,
              "v2_eligibility_run_id": 35_518_892_463,
              "v1_v3_run_id": 34_228_430_753,
              "v2_v4_run_id": 34_471_480_180,
              "transfer_run_id": 35_518_892_463,
              "market_path_run_id": 35_522_831_005,
              "priced_path_run_id": 35_523_404_472,
              "dex_crosscheck_run_id": 35_530_539_734,
              "registry_run_id": 33_911_022_718,
              "v2_curve_run_id": 33_936_232_604,
              "transition_run_id": 33_912_452_330,
              "quote_audit_run_id": 33_923_299_711,
              "anchor_run_id": 33_972_109_927,
              "oracle_run_id": 34_765_335_793,
              "fallback_run_id": 35_518_892_463,
          }
          if config != {"generation": generation, **expected}:
              raise SystemExit(
                  "validation replay frozen inputs changed"
              )

          successful_runs = {
              expected["market_path_run_id"],
              expected["priced_path_run_id"],
              expected["dex_crosscheck_run_id"],
          }
          for run_id in sorted(successful_runs):
              run = get(f"/repos/{repo}/actions/runs/{run_id}")
              if (
                  str(run.get("status") or "") != "completed"
                  or str(run.get("conclusion") or "") != "success"
              ):
                  raise SystemExit(
                      "validation replay successful source run changed: "
                      f"{run_id}"
                  )

          required_artifacts = [
              (
                  expected["sample_run_id"],
                  "phase1-pons-representative-sample",
              ),
              (
                  expected["v1_eligibility_run_id"],
                  "phase1-pons-v1-lifecycle-eligibility",
              ),
              (
                  expected["v2_eligibility_run_id"],
                  "phase1-pons-v2-lifecycle-eligibility",
              ),
              (
                  expected["transfer_run_id"],
                  "phase1-pons-representative-transfers-full",
              ),
              (
                  expected["market_path_run_id"],
                  "phase1-pons-representative-market-paths",
              ),
              (
                  expected["priced_path_run_id"],
                  "phase1-pons-representative-priced-paths",
              ),
              (
                  expected["dex_crosscheck_run_id"],
                  "phase1-pons-representative-dex-crosscheck",
              ),
          ]
          artifacts = []
          for run_id, artifact_name in required_artifacts:
              artifact = find_github_actions_run_artifact(
                  (
                      f"{api}/repos/{repo}/actions/runs/"
                      f"{run_id}/artifacts"
                  ),
                  token,
                  artifact_name=artifact_name,
              )
              artifacts.append({
                  "run_id": run_id,
                  "name": artifact_name,
                  "artifact_id": int(artifact["id"]),
              })

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in sorted(expected.items()):
                  output.write(f"{key}={value}\n")

          print(json.dumps({
              "generation": generation,
              "replay": "artifact_only_representative_validation",
              "artifacts": artifacts,
              **expected,
          }, sort_keys=True))
          PY

  replay:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    uses: ./.github/workflows/phase1-pons-representative-validation.yml
    with:
      sample_run_id: ${{ needs.preflight.outputs.sample_run_id }}
      v1_eligibility_run_id: ${{ needs.preflight.outputs.v1_eligibility_run_id }}
      v2_eligibility_run_id: ${{ needs.preflight.outputs.v2_eligibility_run_id }}
      v1_v3_run_id: ${{ needs.preflight.outputs.v1_v3_run_id }}
      v2_v4_run_id: ${{ needs.preflight.outputs.v2_v4_run_id }}
      transfer_run_id: ${{ needs.preflight.outputs.transfer_run_id }}
      market_path_run_id: ${{ needs.preflight.outputs.market_path_run_id }}
      priced_path_run_id: ${{ needs.preflight.outputs.priced_path_run_id }}
      dex_crosscheck_run_id: ${{ needs.preflight.outputs.dex_crosscheck_run_id }}
      explorer_crosscheck_run_id: ""
      registry_run_id: ${{ needs.preflight.outputs.registry_run_id }}
      v2_curve_run_id: ${{ needs.preflight.outputs.v2_curve_run_id }}
      transition_run_id: ${{ needs.preflight.outputs.transition_run_id }}
      quote_audit_run_id: ${{ needs.preflight.outputs.quote_audit_run_id }}
      anchor_run_id: ${{ needs.preflight.outputs.anchor_run_id }}
      oracle_run_id: ${{ needs.preflight.outputs.oracle_run_id }}
      fallback_run_id: ${{ needs.preflight.outputs.fallback_run_id }}
